 pública ou deslocar-se em marcha lenta devem:","o":["Utilizar o triângulo de pré-sinalização e a luz de presença.","Utilizar as luzes de máximos.","Utilizar avisadores luminosos especiais, em que as características e condições de utilização são fixadas em regulamento.","Utilizar as luzes de médios em alternância com as luzes de presença como fixado em regulamento;"],"c":2,"img":"img/q340.jpg","e":"Veículos que trabalham parados ou devagar na via (obras, reboque, limpeza) usam avisadores luminosos especiais (luzes rotativas amarelas), definidos em regulamento."},{"id":341,"q":"A condução de um veículo implica uma estratégia por parte do seu condutor, que inclui:","o":["A definição de vários trajectos e do tempo de viagem.","A definição de uma trajectória e de uma velocidade.","A definição dos tempos de descanso durante o trajecto."],"c":1,"img":"img/q341.jpg","e":"Conduzir exige uma estratégia: decidir por onde vai passar (trajectória) e a que velocidade."},{"id":342,"q":"O significado deste sinal é:","o":["Parque de estacionamento para todos os automóveis.","Parque de estacionamento para automóveis pesados.","Parque de estacionamento para automóveis ligeiros.","Zona de paragem para automóveis ligeiros."],"c":2,"img":"img/q342.jpg","e":"O sinal de estacionamento (P) com o símbolo de um carro ligeiro indica um parque para automóveis ligeiros."},{"id":343,"q":"Se um indivíduo atingir uma TAS de 1,2 g/l às 0 horas, só por volta das:","o":["12 horas do dia seguinte é que terá eliminado completamente o álcool no seu sangue.","8 horas do dia seguinte é que terá eliminado completamente o álcool no seu sangue.","22 horas do dia seguinte é que terá eliminado completamente o álcool no seu sangue.","4 horas do dia seguinte é que terá eliminado completamente o álcool no seu sangue, se dormir bem."],"c":0,"img":"img/q343.jpg","e":"O corpo elimina cerca de 0,1 g/l de álcool por hora. Com 1,2 g/l são precisas cerca de 12 horas, por isso só ao meio-dia do dia seguinte o álcool desaparece."},{"id":344,"q":"Quando se circula numa zona com grande intensidade de vento, além de reduzir a velocidade, qual deve ser o comportamento a adoptar:","o":["Segurar o volante com especial suavidade por forma a não contrariar as oscilações do veículo.","Segurar o volante com maior firmeza.","Rodar ligeiramente o volante para o lado contrário à direcção do vento.","Acelerar para passar mais rapidamente pela zona onde o vento sopra forte."],"c":1,"img":"img/q344.jpg","e":"Com vento forte, além de abrandar, deve segurar o volante com mais firmeza para corrigir os desvios causados pelas rajadas."},{"id":345,"q":"O sistema nervoso central é afectado por alguns medicamentos.","o":["Só se não forem receitados por um médico.","Depende do sexo e do peso.","Certo.","Os medicamentos não afectam o sistema nervoso central"],"c":2,"img":"img/q345.jpg","e":"Certo. Muitos medicamentos (para dormir, ansiedade, alergias, dores fortes) afectam o sistema nervoso e podem causar sono ou lentidão."},{"id":346,"q":"Como deve ser feita a entrada e saída de passageiros?","o":["Pelo lado direito, se a paragem do veículo for permitida desse lado.","Sempre pelo lado direito.","Sempre pelo lado esquerdo."],"c":0,"img":"img/q346.jpg","e":"Os passageiros entram e saem pelo lado direito apenas se a paragem for permitida desse lado. Regra geral, saem pelo lado da berma ou passeio."},{"id":347,"q":"Em caso de nevoeiro (cacimba) forte:","o":["Deve pensar em parar em local seguro e aguardar que o nevoeiro levante.","Deve pensar em seguir viagem o mais depressa possível para sair da zona de nevoeiro rapidamente.","Deve pensar em seguir viagem buzinando constantemente para assinalar a sua presença.","Deve ligar as luzes de estrada e as luzes de emergência para ser mais facilmente visto pelos outros condutores."],"c":0,"img":"img/q347.jpg","e":"Com nevoeiro muito forte, o mais seguro é parar num local seguro, fora da via, e esperar que o nevoeiro levante."},{"id":348,"q":"Circular com o braço fora do veículo:","o":["É uma contravenção punida com a multa de 500,00 Mt.","É uma contravenção punida com a multa de 1.000,00 Mt.","É uma contravenção punida com a multa de 2.000,00 Mt.","É uma contravenção punida com a multa de 3.000,00 Mt."],"c":1,"img":"img/q348.jpg","e":"Circular com o braço fora do veículo é contravenção punida com multa de 1.000,00 Mt."},{"id":349,"q":"É livre o trânsito rodoviário nas vias de domínio público do Estado e nas vias de domínio privado quando abertas ao trânsito público?","o":["Sim, mas as pessoas devem abster-se de actos que impeçam ou embaracem o trânsito ou comprometam a segurança ou a comodidade dos utentes das vias.","Não, mas as pessoas podem praticar actos que impeçam ou embaracem o trânsito e comprometam a segurança ou a comodidade dos utentes das vias.","Sim, mas as pessoas podem praticar actos que impeçam ou embaracem o trânsito e comprometam a segurança ou a comodidade dos utentes das vias.","Sim, desde que não comprometam a segurança."],"c":0,"img":"img/q349.jpg","e":"O trânsito é livre nas vias públicas e nas privadas abertas ao público, mas ninguém pode fazer nada que impeça, dificulte ou ponha em perigo o trânsito."},{"id":350,"q":"A distância de reacção é:","o":["A distância percorrida pelo veículo desde que o condutor acciona o travão até parar.","A distância percorrida pelo veículo desde que o condutor vê o perigo até reagir.","A distância percorrida pelo veículo desde que o condutor vê o perigo até parar.","A distância percorrida pelo veículo até que o condutor vê o perigo."],"c":1,"img":"img/q350.jpg","e":"Distância de reacção é o que o carro percorre desde que o condutor vê o perigo até começar a reagir (por exemplo, a carregar no travão)."},{"id":351,"q":"Em condições de frio, neve e gelo:","o":["Verifica-se um aumento da aderência e da capacidade de tracção do veículo.","Só em caso de neve e frio é que se verifica uma diminuição da aderência e da capacidade de tracção do veículo.","Verifica-se uma diminuição da aderência e da capacidade de tracção do veículo."],"c":2,"img":"img/q351.jpg","e":"Com frio, neve e gelo, os pneus agarram menos ao piso. A aderência e a tracção diminuem e o carro escorrega mais facilmente."},{"id":352,"q":"Para a realização da tarefa de condução, o sentido da visão é importante porque:","o":["Porque possibilita que se conduza com maior velocidade.","Porque possibilita identificar os gestos da polícia.","Possibilita identificar as formas, as cores e os movimentos de todos os elementos presentes no ambiente rodoviário.","O sentido da visão não é importante para a condução, porque são as mãos e os pés que realizam a tarefa da condução."],"c":2,"img":"img/q352.jpg","e":"A visão é o sentido mais importante na condução: permite identificar formas, cores e movimentos de tudo o que está na estrada."},{"id":353,"q":"O frio excessivo, a chuva e o calor:","o":["Apenas o frio e a chuva aumentam a fadiga na condução.","Aumentam a fadiga na condução.","Apenas a chuva e o calor aumentam a fadiga na condução.","Não aumentam a fadiga na condução."],"c":1,"img":"img/q353.jpg","e":"Frio, chuva e calor obrigam o corpo a esforçar-se mais e aumentam a fadiga na condução."},{"id":354,"q":"Se o veículo entrar em aquaplanagem (hidroplanagem) deve:","o":["Manter a calma e ser suave com os controlos, travar e girar o volante suavemente.","Manter a calma e ser suave com os controlos, acelerar e girar o volante suavemente.","Manter a calma e ser suave com os controlos, não travar nem acelerar ou girar o volante.","Travar forte segurando bem o volante para que a trajectória do veículo não se altere."],"c":2,"img":"img/q354.jpg","e":"Em aquaplanagem os pneus não tocam no chão. Deve manter a calma e não travar, acelerar nem virar o volante, até os pneus voltarem a agarrar."},{"id":355,"q":"Para a execução de manobras, qual dos seguintes lhe parece mais importante?","o":["Dedicação, atenção e uma atitude adequada.","Empenho, atitude adequada e atenção.","Treino, experiência e uma atitude adequada.","Coragem, dedicação e determinação."],"c":2,"img":"img/q355.jpg","e":"As manobras aprendem-se com treino e experiência, e precisam de uma atitude adequada (calma e prudência)."},{"id":356,"q":"A condução defensiva manifesta-se por:","o":["O condutor ser sempre o primeiro a avançar em todas as intersecções.","O condutor ceder os seus direitos em benefício da segurança rodoviária.","O condutor ter em conta apenas os seus direitos e nunca os seus deveres.","O condutor ceder sempre a passagem aos condutores que se apresentem numa intersecção."],"c":1,"img":"img/q356.jpg","e":"Na condução defensiva, o condutor está disposto a abdicar dos seus direitos (por exemplo, da prioridade) se isso evitar um acidente."},{"id":357,"q":"Como devo actuar perante a diminuição da aderência, que provoca o aumento da distância de travagem?","o":["Aumentar a velocidade.","Diminuir a velocidade.","A diminuição da aderência diminui a distância de travagem.","Manter a velocidade."],"c":1,"img":"img/q357.jpg","e":"Com menos aderência, o carro precisa de mais metros para travar. Para compensar, deve diminuir a velocidade."},{"id":358,"q":"Entende-se por cruzamento de veículos:","o":["Quando na mesma via, se encontram dois veículos transitando no mesmo sentido.","Quando os condutores de dois veículos que transitam na mesma via e em sentidos opostos, passam um pelo outro em simultâneo.","Quando dois veículos, circulando na mesma fila, o que se encontra atrás passa para diante do outro."],"c":1,"img":"img/q358.jpg","e":"Cruzamento de veículos é quando dois veículos na mesma via, em sentidos opostos, passam um pelo outro."},{"id":359,"q":"Entende-se por automóvel ligeiro:","o":["O automóvel cuja lotação não excede os 8 lugares.","Todos os automóveis até ao peso de 4500 kg.","O automóvel com PB até 3500 kg e com lotação não superior a 9 lugares, incluindo o condutor."],"c":2,"img":"img/q359.jpg","e":"Automóvel ligeiro é o que tem peso bruto até 3.500 kg e até 9 lugares, contando com o do condutor."},{"id":360,"q":"Quando um veículo acelera a direito (longitudinalmente):","o":["O peso é em parte transferido para o eixo traseiro, devido à inércia.","O peso é em parte transferido para o eixo dianteiro, devido à inércia.","O peso é em parte transferido para o eixo traseiro, devido à força centrífuga.","O peso não é transferido nem para a frente nem para trás devido à suspensão do veículo."],"c":0,"img":"img/q360.jpg","e":"Ao acelerar, a inércia faz o peso passar em parte para trás, para o eixo traseiro. Ao travar acontece o contrário."},{"id":361,"q":"Quem exceder de 30 Km/h a 60 Km/h de velocidade (automóveis ligeiros e motociclos) os limites, fora das localidades é punido:","o":["Com multa de 3.000,00 Mt e contravenção média.","Com multa de 2.000,00 Mt e contravenção leve.","Com multa de 2.000,00 Mt e contravenção média.","Com multa de 2.000,00 Mt e contravenção grave."],"c":2,"img":"img/q361.jpg","e":"Exceder o limite entre 30 e 60 km/h fora das localidades (ligeiros e motociclos) é contravenção média, com multa de 2.000,00 Mt."},{"id":362,"q":"O que deve ser ajustado antes de iniciar a marcha?","o":["De forma folgada o cinto de segurança.","A distância do assento aos pedais, a inclinação das costas do banco e o encosto de cabeça.","O encosto de cabeça e o cinto de segurança."],"c":1,"img":"img/q362.jpg","e":"Antes de arrancar deve ajustar o banco: distância aos pedais, inclinação das costas e encosto de cabeça. O cinto deve ficar justo, não folgado."},{"id":363,"q":"A paragem e o estacionamento devem fazer-se, dentro das localidades,","o":["Nos locais especialmente destinados para esse efeito e pela forma indicada ou na faixa de rodagem, o mais longe possível do respectivo limite esquerdo, paralelamente a este e no mesmo sentido de marcha.","Nos locais especialmente destinados para esse efeito e pela forma indicada ou na faixa de rodagem, o mais próximo possível do limite esquerdo, paralelamente a este e no mesmo sentido de marcha.","Nos locais especialmente destinados para esse efeito e pela forma indicada ou na faixa de rodagem, o mais perto possível do eixo da via, paralelamente a este e no sentido de marcha.","Nos locais especialmente destinados para esse efeito e pela forma indicada ou na faixa de rodagem, o mais próximo possível do limite esquerdo, paralelamente a este e no sentido contrário ao da marcha."],"c":1,"img":"img/q363.jpg","e":"Dentro das localidades, para-se nos locais próprios. Se não houver, na faixa de rodagem, o mais perto possível do limite esquerdo, paralelo a ele e no sentido da marcha."},{"id":364,"q":"Excepto o disposto em regulamentos locais e em caso de manifesta necessidade:","o":["Pode utilizar-se o lado direito da faixa de rodagem para estacionar.","Pode utilizar-se o lado direito da faixa de rodagem para a manobra de marcha atrás.","Pode utilizar-se o lado direito da faixa de rodagem para ultrapassar ou mudar de direcção.","Pode utilizar-se o lado direito da faixa de rodagem para conduzir a grande velocidade."],"c":2,"img":"img/q364.jpg","e":"Como se circula pela esquerda, o lado direito da faixa só se usa para ultrapassar ou mudar de direcção (salvo regulamentos locais ou necessidade)."},{"id":365,"q":"O desempenho da condução é afectado de forma negativa pela agressividade?","o":["Errado.","Certo, mas só em condução urbana.","Certo."],"c":2,"img":"img/q365.jpg","e":"Certo. A agressividade faz o condutor arriscar mais e pensar menos, o que piora a condução e aumenta o risco de acidente."},{"id":366,"q":"A ingestão de pequenas quantidades de bebidas alcoólicas, pode prejudicar a capacidade de condução?","o":["Não, pequenas quantidades são completamente inofensivas.","Sim, pois podem levar à sobrevalorização da capacidade de condução.","Não, se forem ingeridas durante a refeição e com água.","Sim, mas só em condutores pouco habituados a beber."],"c":1,"img":"img/q366.jpg","e":"Mesmo pouco álcool faz o condutor sobrevalorizar a sua capacidade e arriscar mais, além de atrasar as reacções."},{"id":367,"q":"Conduzir em condições atmosféricas adversas:","o":["Afecta a distância de travagem.","Afecta a taxa de alcoolemia.","Reduz a fadiga."],"c":0,"img":"img/q367.jpg","e":"Chuva, nevoeiro, vento ou gelo diminuem a aderência dos pneus. Por isso a distância de travagem aumenta."},{"id":368,"q":"A definição de paragem é:","o":["Imobilização de um veículo pelo tempo estritamente necessário para a entrada ou saída de passageiros ou para breves operações de carga ou descarga, desde que o condutor esteja pronto a retomar a marcha.","Imobilização de um veículo pelo tempo estritamente necessário para a entrada ou saída de passageiros ou para breves operações de carga ou descarga.","Estacionamento de um veículo pelo tempo estritamente necessário para a entrada ou saída de passageiros ou para breves operações de carga ou descarga.","Estacionamento de um veículo pelo tempo estritamente necessário para a entrada ou saída de passageiros ou para breves operações de carga ou descarga, desde que o condutor esteja pronto a retomar a marcha."],"c":0,"img":"img/q368.jpg","e":"Paragem é imobilizar o veículo só o tempo necessário para entrar ou sair passageiros ou carga rápida, com o condutor pronto a arrancar."},{"id":369,"q":"A postura e o posicionamento correctos do condutor, devem:","o":["Proporcionar o alcance aos comandos do rádio e GPS.","Proporcionar o alcance a todos os comandos e controlos, sem que o condutor tenha de se movimentar ou afastar do assento.","Proporcionar o uso folgado do cinto de segurança."],"c":1,"img":"img/q369.jpg","e":"O condutor deve sentar-se de forma a chegar a todos os comandos sem ter de se mexer ou afastar do banco."},{"id":370,"q":"Os condutores devem, nos cruzamentos, entroncamentos e rotundas","o":["Ceder passagem aos veículos que se desloquem sobre carris.","Ceder passagem a todos os veículos.","Ceder passagem a todos os veículos que se apresentem pela esquerda.","Ceder passagem a todos os velocípedes."],"c":0,"img":"img/q370.jpg","e":"Nos cruzamentos, entroncamentos e rotundas, deve ceder a passagem aos veículos que andam sobre carris (como o comboio ou eléctrico)."},{"id":371,"q":"Só é permitido fazer marcha atrás:","o":["Como manobra auxiliar ou de recurso e deve efectuar-se o mais possível à direita, em local de boa visibilidade e onde não prejudique o trânsito.","Como manobra auxiliar ou de recurso e deve efectuar-se o mais possível à esquerda, em local de boa visibilidade e onde não prejudique o trânsito.","Como manobra auxiliar ou de recurso e deve efectuar-se o mais possível junto ao eixo da via, em local de boa visibilidade e onde não prejudique o trânsito.","Como manobra auxiliar ou de recurso e deve efectuar-se o mais possível à esquerda, em local de fraca visibilidade e onde não prejudique o trânsito."],"c":1,"img":"img/q371.jpg","e":"A marcha atrás só se faz como manobra auxiliar, devagar, o mais possível à esquerda (lado por onde se circula), com boa visibilidade e sem prejudicar o trânsito."},{"id":372,"q":"Porque lado o trânsito de veículos ou de animais é feito:","o":["Pela direita das faixas de rodagem e o mais próximo possível das bermas ou passeios mas a uma distância destes que permita evitar qualquer acidente.","Pela esquerda das faixas de rodagem e o mais longe possível das bermas ou passeios mas a uma distância destes que permita evitar qualquer acidente.","Pela esquerda das faixas de rodagem e o mais próximo possível das bermas ou passeios mas a uma distância destes que permita evitar qualquer acidente.","Pela direita das faixas de rodagem e o mais próximo possível das bermas ou passeios mas a uma distância destes que não permita evitar qualquer acidente."],"c":2,"img":"img/q372.jpg","e":"Em Moçambique circula-se pela esquerda da faixa de rodagem, perto da berma ou passeio, mas a uma distância que permita evitar acidentes."},{"id":373,"q":"Este sinal significa:","o":["Raquetas e bandeirola de sinalização.","Proibido passar.","Obrigatório parar.","Homens na via a trabalhar."],"c":0,"img":"img/q373.jpg","e":"As raquetas e a bandeirola são usadas por trabalhadores ou agentes para regular o trânsito em obras (mandar parar ou avançar)."},{"id":374,"q":"O que deve fazer se perceber que o seu veículo vai ser ultrapassado nesta situação?","o":["Afastar-se o mais possível para a esquerda e não aumentar a velocidade, enquanto não for ultrapassado.","Não mudar a sua posição na faixa de rodagem.","Facilitar a ultrapassagem desviando-se para a direita e não aumentando a velocidade.","Impedir que seja realizada a manobra, aumentando a velocidade."],"c":0,"img":"img/q374.jpg","e":"Quando vai ser ultrapassado (pela direita), deve encostar-se o mais possível à esquerda e não acelerar enquanto não for ultrapassado."},{"id":375,"q":"Quem exceder até 20 Km/h de velocidade (automóveis ligeiros e motociclos) os limites, dentro das localidades é punido:","o":["Com multa de 2.000,00 Mt e contravenção leve.","Com multa de 1.000,00 Mt e contravenção leve.","Com multa de 1.000,00 Mt e contravenção média.","Com multa de 2.000,00 Mt e contravenção grave."],"c":1,"img":"img/q375.jpg","e":"Exceder o limite até 20 km/h dentro das localidades (ligeiros e motociclos) é contravenção leve, com multa de 1.000,00 Mt."},{"id":376,"q":"A definição de entroncamento é:","o":["Zona triangular de via pública.","Zona de junção ou bifurcação de vias públicas.","Zona de confluência de trânsito de via pública.","Zona de ultrapassagem proibida."],"c":1,"img":"img/q376.jpg","e":"Entroncamento é a zona onde as vias públicas se juntam ou se separam (bifurcação), por exemplo em forma de T ou Y."},{"id":377,"q":"Posso circular pela parte direita da faixa de rodagem numa via urbana com duplo sentido e uma faixa para cada sentido?","o":["Sim, na aproximação a um cruzamento em que pretenda mudar de direcção à direita.","Sim, em via urbana posso circular pela via da esquerda ou a da direita.","Sim, para ultrapassar.","Não."],"c":2,"img":"img/q377.jpg","e":"Numa via com um só sentido para cada lado, circula-se pela esquerda. O lado direito só se pode usar para ultrapassar."},{"id":378,"q":"O significado destes sinais é:","o":["A - Parque de descanso; B - Parque de estacionamento para veículos do corpo diplomático.","A - Parque de estacionamento; B - Parque de estacionamento para veículos do corpo diplomático.","A - Parque de estacionamento; B - Parque de estacionamento para veículos do governo.","A - Parque de estacionamento; B - Parque de estacionamento para veículos do ministério."],"c":1,"img":"img/q378.jpg","e":"Os sinais indicam: A, parque de estacionamento; B, parque de estacionamento para veículos do corpo diplomático."},{"id":379,"q":"Como medida de prevenção, quando o piso da via está molhado, deve:","o":["Parar.","Reduzir a velocidade.","Aumentar um pouco a velocidade para que a distância de paragem diminua.","Reduzir a distância de segurança."],"c":1,"img":"img/q379.jpg","e":"Com piso molhado os pneus agarram menos e o carro demora mais a parar. Deve reduzir a velocidade."},{"id":380,"q":"O que indica o sinal circular com fundo azul?","o":["Via obrigatória para veículos de construção.","Via obrigatória para autocarros de excursão.","Via obrigatória para circulação de veículos de dimensões anormais."],"c":2,"img":"img/q380.jpg","e":"O sinal azul circular com o símbolo de um veículo largo indica via obrigatória para veículos de dimensões anormais."},{"id":381,"q":"O que se entende por sanção?","o":["A repetição de valores positivos.","A repetição de valores negativos.","O prémio ou castigo anexo às acções humanas."],"c":2,"img":"img/q381.jpg","e":"Sanção é o prémio ou o castigo que resulta das acções humanas. No trânsito, normalmente é a punição de uma infracção."},{"id":382,"q":"O significado deste sinal é:","o":["Queda de pedras à direita.","Queda de pedras à esquerda.","Estrada com buracos na esquerda.","Estrada com buracos na direita."],"c":1,"img":"img/q382.jpg","e":"Sinal de perigo com pedras a cair do lado esquerdo: avisa queda de pedras à esquerda."},{"id":383,"q":"O significado deste sinal é:","o":["Prioridade para quem circula à esquerda.","Prioridade para quem circula à direita.","Trânsito nos dois sentidos.","Prioridade temporária para quem circula à direita."],"c":2,"img":"img/q383.jpg","e":"O sinal de perigo com duas setas em sentidos opostos avisa que a via passa a ter trânsito nos dois sentidos."},{"id":384,"q":"Um pára-brisas sujo, à noite e com chuva, pode:","o":["Aumentar a capacidade de ver as alternativas de acção e aumentar o tempo de análise necessário à tomada de decisão.","Diminuir o tempo de reacção.","Diminuir a capacidade de ver as alternativas de acção e aumentar o tempo de análise necessário à tomada de decisão."],"c":2,"img":"img/q384.jpg","e":"Um pára-brisas sujo, à noite e com chuva, faz ver pior. O condutor vê menos alternativas e precisa de mais tempo para decidir."},{"id":385,"q":"Os condutores não podem exceder as seguintes velocidades instantâneas (em quilómetros/hora):","o":["Motociclos com carro, dentro das localidades 40, fora das localidades 70.","Motociclos com carro, dentro das localidades 50, fora das localidades 70.","Motociclos com carro, dentro das localidades 50, fora das localidades 80.","Motociclos com carro, dentro das localidades 60, fora das localidades 90."],"c":1,"img":"img/q385.jpg","e":"Os motociclos com carro (side-car) podem andar até 50 km/h dentro das localidades e até 70 km/h fora delas."},{"id":386,"q":"O significado deste sinal é:","o":["Trabalhos na estrada.","Obras adjudicadas.","Obras incompletas.","Prudência porque o parque está em obras."],"c":0,"img":"img/q386.jpg","e":"O sinal de perigo com um trabalhador a cavar avisa trabalhos na estrada."},{"id":387,"q":"As luzes devem ser usadas, durante o nevoeiro (cacimba) :","o":["De dia ou de noite.","Só durante a noite.","Durante o dia, se o nevoeiro for muito denso.","De dia e de noite, principalmente as luzes de estrada."],"c":0,"img":"img/q387.jpg","e":"Com nevoeiro deve ligar as luzes de dia e de noite, para ver e ser visto. Os máximos devem ser evitados."},{"id":388,"q":"O que deve fazer quando um velocípede segue no mesmo sentido de trânsito?","o":["Utilizar os sinais sonoros.","Ultrapassá-lo a grande velocidade.","Ter em atenção a instabilidade desse veículo."],"c":2,"img":"img/q388.jpg","e":"Uma bicicleta é instável e pode desviar-se de repente. Deve ter atenção, manter distância lateral e ultrapassá-la com cuidado."},{"id":389,"q":"O que indica o sinal?","o":["Trânsito proibido a veículos de peso total superior a 2 toneladas.","Trânsito proibido a veículos de peso por eixo superior a 2 toneladas.","Trânsito proibido a veículos de peso por eixo inferior a 2 toneladas."],"c":1,"img":"img/q389.jpg","e":"O sinal proíbe a passagem a veículos com peso por eixo superior a 2 toneladas."},{"id":390,"q":"O agente regulador de trânsito, manda:","o":["Parar o tráfego que venha da retaguarda e da frente.","Avançar o tráfego da esquerda.","Parar o tráfego que venha da retaguarda."],"c":2,"img":"img/q390.jpg","e":"Pela posição do agente na imagem, o trânsito que vem da retaguarda (por trás dele) deve parar."},{"id":391,"q":"Dentro das localidades os sinais sonoros, só podem ser usados:","o":["Em caso de manifesta necessidade, podendo ser proibidos nas zonas em que o ordenamento do trânsito seja assegurado por agentes da autoridade ou por instrumentos de sinalização vertical.","Em caso de manifesta necessidade, podendo ser autorizados nas zonas em que o ordenamento do trânsito seja assegurado por sinalização vertical.","Em caso de manifesta necessidade, podendo ser autorizados nas zonas em que o ordenamento do trânsito seja assegurado por sinalização horizontal.","Sempre durante a noite;"],"c":0,"img":"img/q391.jpg","e":"Nas localidades, a buzina só se usa em caso de manifesta necessidade. Pode ser proibida onde o trânsito é regulado por agentes ou por sinais verticais."},{"id":392,"q":"A definição de localidade é:","o":["Zona com edificações cujos limites não são sinalizados.","Zona com edificações cujos limites são devidamente sinalizados.","Zona urbana cujos limites não são sinalizados.","Zona regional cujos limites são sinalizados com sinalização luminosa."],"c":1,"img":"img/q392.jpg","e":"Localidade é uma zona com edificações cujos limites estão sinalizados (com sinais de início e fim de localidade)."},{"id":393,"q":"Como se mede a quantidade de álcool ingerido?","o":["Pela proporção entre a quantidade de álcool ingerido num determinado espaço de tempo.","Pela proporção entre a quantidade de álcool existente num determinado volume de sangue.","Pela proporção entre a quantidade de álcool ingerido em duas horas."],"c":1,"img":"img/q393.jpg","e":"A taxa de álcool mede-se pela quantidade de álcool num certo volume de sangue (g/l), ou no ar expirado (mg/l)."},{"id":394,"q":"A distância de reacção é influenciada por:","o":["Velocidade e tempo de reacção","Distância de travagem e tempo de reacção.","Tempo de reacção e estado da via.","Apenas por factores externos ao condutor."],"c":0,"img":"img/q394.jpg","e":"A distância de reacção depende da velocidade e do tempo de reacção do condutor."},{"id":395,"q":"A direcção assistida permite:","o":["Aumentar o ângulo de viragem.","Diminuir o esforço do condutor no volante.","Diminuir a desmultiplicação no volante.","Efectuar as curvas de uma forma mais rápida."],"c":1,"img":"img/q395.jpg","e":"A direcção assistida torna o volante mais leve, diminuindo o esforço do condutor."},{"id":396,"q":"Nas descidas de inclinação acentuada:","o":["Os automóveis ligeiros não podem transitar sem utilizarem o motor como auxiliar do travão","Todos os automóveis não podem transitar sem utilizarem o motor como auxiliar do travão","Os automóveis pesados não podem transitar sem utilizarem o motor como auxiliar do travão","Só os automóveis pesados de passageiros não podem transitar sem utilizarem o motor como auxiliar do travão"],"c":2,"img":"img/q396.jpg","e":"Nas descidas acentuadas, os pesados devem usar o motor (uma mudança baixa) para ajudar a travar, para os travões não aquecerem e falharem."},{"id":397,"q":"Se passar por um acidente ou por vítimas de doença súbita, deve:","o":["Ligar de imediato para o hospital.","Iniciar de imediato as ações de primeiro socorro mesmo que não domine os procedimentos.","Iniciar de imediato as ações para evitar que a situação de emergência se agrave, incluindo proceder à segurança do local, das vítimas e dos que prestam socorro."],"c":2,"img":"img/q397.jpg","e":"Primeiro deve evitar que a situação piore: sinalizar e tornar seguro o local, protegendo as vítimas e quem ajuda. Só depois socorrer."},{"id":398,"q":"Quem exceder de 40 Km/h até 60 Km/h de velocidade (automóveis ligeiros e motociclos) os limites, dentro das localidades é punido:","o":["Com multa de 4.000,00 Mt e contravenção grave.","Com multa de 6.000,00 Mt e contravenção grave.","Com multa de 4.000,00 Mt e contravenção média.","Com multa de 2.000,00 Mt e contravenção grave."],"c":0,"img":"img/q398.jpg","e":"Exceder o limite entre 40 e 60 km/h dentro das localidades (ligeiros e motociclos) é contravenção grave, com multa de 4.000,00 Mt."},{"id":399,"q":"A distância de travagem depende principalmente de que factores?","o":["Estado psicofísico do condutor e velocidade do veículo.","Tipo e estado da via, estado e velocidade do veículo.","Estado do veículo, tipo de via e visibilidade.","Só depende do estado físico e psiquico do condutor."],"c":1,"img":"img/q399.jpg","e":"A distância de travagem depende do tipo e estado da via e do estado e velocidade do veículo (travões, pneus, carga)."},{"id":400,"q":"Numa paragem ou estacionamento irregular:","o":["A contravenção é punida com a multa de 1000,00 Mt.","A contravenção é punida com a multa de 500,00 Mt.","A contravenção é punida com a multa de 2000,00 Mt.","A contravenção é punida com a multa de 3000,00 Mt."],"c":1,"img":"img/q400.jpg","e":"Parar ou estacionar de forma irregular é contravenção punida com multa de 500,00 Mt."},{"id":401,"q":"Qual das seguintes é uma afirmação falsa:","o":["O sistema de circulação rodoviária é um conjunto de elementos interligados e dependentes.","O homem é o elemento mais importante do sistema rodoviário.","O acidente resulta sempre da falha de vários elementos do sistema rodoviário.","A probabilidade de acidente aumenta quando há uma alteração na interacção entre os vários elementos do sistema rodoviário."],"c":2,"img":"img/q401.jpg","e":"A afirmação falsa é a C: um acidente pode resultar da falha de um só elemento (por exemplo, só do condutor). Não é sempre a soma de várias falhas."},{"id":402,"q":"Em caso de nevoeiro (cacimba), o que devemos ter presente, ao considerar a distância de segurança?","o":["Que basta manter uma distância pequena independentemente da velocidade.","Que essa distância depende unicamente do tipo de veículo que vai à nossa frente.","Que há zonas mais densas onde a visibilidade repentinamente se reduz.","Que como a velocidade praticada pelos veículos é menor devemos seguir mais perto possível do veículo da frente."],"c":2,"img":"img/q402.jpg","e":"O nevoeiro não é uniforme: há zonas mais densas onde a visibilidade cai de repente. Por isso deve manter uma distância maior."},{"id":403,"q":"O condutor está sujeito ao aparecimento de fadiga, quando circula com trânsito intenso?","o":["Está porque é uma situação de transito monótona o que provoca fadiga.","Não está porque circula a velocidade reduzida.","Não está porque nesta situação pode descansar devido à pouca velocidade do trânsito."],"c":0,"img":"img/q403.jpg","e":"Sim. O trânsito intenso, com pára-arranca, é monótono e cansativo e provoca fadiga, mesmo a baixa velocidade."},{"id":404,"q":"Parar ou estacionar, é proibido:","o":["A menos de 3 m para a frente e 15 m para um e outro lado dos sinais indicativos da paragem dos veículos de transporte colectivo de passageiros, consoante circulem ou não sobre carris.","A menos de 5 m para a frente e 15 m para um e outro lado dos sinais indicativos da paragem dos veículos de transporte colectivo de passageiros, consoante circulem ou não sobre carris.","A menos de 3 m para a frente e 10 m para um e outro lado dos sinais indicativos da paragem dos veículos de transporte colectivo de passageiros, consoante circulem ou não sobre carris.","A menos de 1 m para a frente e 10 m para um e outro lado dos sinais indicativos da paragem dos veículos de transporte colectivo de passageiros, consoante circulem ou não sobre carris."],"c":0,"img":"img/q404.jpg","e":"É proibido parar ou estacionar a menos de 3 m para a frente e 15 m para cada lado dos sinais de paragem de transportes colectivos."},{"id":405,"q":"Todo o condutor de veículos ou de animais é obrigado:","o":["Sempre que não haja obstáculo que o impeça, a facilitar imediatamente a ultrapassagem desviando-se o mais possível para a direita e não aumentar a sua velocidade enquanto não for ultrapassado.","Sempre que não haja obstáculo que o impeça, a facilitar imediatamente a ultrapassagem desviando-se o mais possível para a esquerda e aumentar a sua velocidade enquanto não for ultrapassado.","Sempre que não haja obstáculo que o impeça, a facilitar imediatamente a ultrapassagem desviando-se o mais possível para a esquerda e não aumentar a sua velocidade enquanto não for ultrapassado.","Sempre que não haja obstáculo que o impeça, a facilitar imediatamente a ultrapassagem desviando-se o mais possível para o eixo da via e não aumentar a sua velocidade enquanto não for ultrapassado."],"c":2,"img":"img/q405.jpg","e":"Quando vai ser ultrapassado (pela direita), deve encostar-se o mais possível à esquerda e não aumentar a velocidade."},{"id":406,"q":"A expressão “TRAVAR COM O MOTOR” significa:","o":["Desligar o motor, mantendo uma mudança engrenada.","Utilizar o motor de arranque para auxiliar a travagem.","Engrenar uma mudança de maior força em andamento e não acelerar.","Engrenar uma mudança de menor força em andamento e não acelerar."],"c":2,"img":"img/q406.jpg","e":"Travar com o motor é engrenar uma mudança de maior força (uma mudança mais baixa, como a 2.ª ou a 3.ª) e tirar o pé do acelerador. O motor segura o carro."},{"id":407,"q":"Por causa do sono e mesmo sem ter ficado a dormir, pode ter um acidente?","o":["Não.","Sim, mas só durante noite.","Sim, os primeiros sintomas de sonolência já afectam a condução.","Não, se o condutor for experiente e saiba conduzir mesmo com sono."],"c":2,"img":"img/q407.jpg","e":"Antes de adormecer já há sinais de sono (bocejos, olhos pesados, falhas de atenção) que afectam a condução e podem causar acidentes."},{"id":408,"q":"Os condutores de veículos prioritários:","o":["Podem, se necessário, não observar as regras e os sinais de trânsito, com a excepção dos sinais dos agentes reguladores de trânsito.","Não podem nunca deixar de observar as regras e os sinais de trânsito.","Podem, se necessário, não observar os sinais dos agentes reguladores de trânsito."],"c":0,"img":"img/q408.jpg","e":"Os veículos prioritários, em missão urgente, podem não cumprir as regras e os sinais se for necessário, mas têm sempre de obedecer aos agentes reguladores do trânsito."},{"id":409,"q":"Ao aproximar-se de qualquer tipo de intersecção, o condutor do veículo deve:","o":["Demonstrar prudência especial, circulando em velocidade moderada para que possa deter o seu veículo com segurança, para dar passagem ao peão e a veículos que tenham o direito de preferência.","Demonstrar prudência especial, circulando em alta velocidade de forma que possa passar o mais rapidamente possível.","Demonstrar prudência especial, circulando à velocidade de 30Km/h, para que possa travar o seu veículo para dar passagem a animais que transitem na via.","Demonstrar prudência especial, circulando à velocidade de 20Km/h, para que possa travar o seu veículo para dar passagem a animais que transitem na via."],"c":0,"img":"img/q409.jpg","e":"Ao aproximar-se de uma intersecção, deve moderar a velocidade para conseguir parar em segurança e dar passagem aos peões e a quem tem prioridade."},{"id":410,"q":"Assinale a afirmação incorrecta:","o":["A fadiga, a ingestão de bebidas alcoólicas, a velocidade, as condições atmosféricas e o estado emocional do condutor podem influenciar o seu tempo de reacção.","O tempo de reacção é o tempo entre o momento em que o condutor avista um obstáculo e o acto de o tentar evitar.","O aumento do tempo de reacção não aumenta a distância de paragem.","A distância de paragem é influenciada pelo tempo de reacção de um condutor."],"c":2,"img":"img/q410.jpg","e":"A afirmação incorrecta é a C: se o tempo de reacção aumenta, o carro percorre mais metros antes de travar, logo a distância de paragem aumenta."},{"id":411,"q":"O comportamento dos peões deve despertar a nossa atenção?","o":["Sim, apenas em circulação urbana.","Sim, só nos locais destinados à sua travessia.","Sim, sempre e em todas as situações.","Não, quem deve prestar atenção aos veículos são os peões."],"c":2,"img":"img/q411.jpg","e":"Os peões podem ter comportamentos imprevisíveis (crianças, idosos, distraídos). Deve estar atento a eles sempre e em todas as situações."},{"id":412,"q":"O tomar bebidas alcoólicas:","o":["Aumenta o campo visual, a capacidade de exploração visual, a visão dupla e redução da capacidade de readaptação após encandeamento.","Reduz o campo visual, a capacidade de exploração visual e a capacidade de readaptação visual após encandeamento.","Reduz o campo visual, a capacidade de exploração visual e aumenta a capacidade de readaptação visual após encandeamento."],"c":1,"img":"img/q412.jpg","e":"O álcool reduz o campo visual, a capacidade de olhar à volta e a recuperação depois de ser encandeado."},{"id":413,"q":"Um condutor que aproximar excessivamente o automóvel do veículo da frente ou acelerar e travar, de forma inesperada e intencional:","o":["Não viola nenhuma regra do código da estrada nem de civismo.","Manifesta agressividade na condução.","Demonstra que é um condutor seguro, respeitador e que consegue desembaraçar-se no trânsito.","Demonstra que está na posse de qualidades de condução acima da média já que controla as situações de perigo."],"c":1,"img":"img/q413.jpg","e":"Colar ao carro da frente ou acelerar e travar de propósito para assustar é agressividade na condução, e é perigoso."},{"id":414,"q":"A condução nocturna deve influenciar a velocidade a que circulo?","o":["Não, porque quando a visibilidade é menor devo ligar as luzes de estrada.","Não, porque se ligar as luzes de estrada vejo melhor a via do que durante o dia.","Sim, porque influencia a recolha de informação.","Sim, porque de noite pode-se circular um pouco mais rápido, dentro dos limites, porque existe menos trânsito."],"c":2,"img":"img/q414.jpg","e":"Sim. À noite vê-se menos e recolhe-se pior a informação, por isso deve reduzir a velocidade."},{"id":415,"q":"Assinale a afirmação falsa relativa a eventuais efeitos da chuva intensa.","o":["Quando passar num lençol de água e o veículo deslizar, é aconselhável pressionar o travão até que a aderência das rodas seja retomada.","O “aquaplanning” pode ser agravado pelo mau estado dos pneumáticos e pela circulação com velocidade excessiva.","A água acumulada no solo pode reduzir a eficácia do funcionamento dos travões.","O “aquaplanning” pode ser agravado pelo mau estado da suspensão do veículo."],"c":0,"img":"img/q415.jpg","e":"A afirmação falsa é a A: se o carro deslizar num lençol de água, não deve travar. Deve tirar o pé do acelerador e segurar o volante até as rodas voltarem a agarrar."},{"id":416,"q":"Os condutores devem, para permitir a circulação de um veículo prioritário ou da polícia, assinalando devidamente a marcha, que transite numa via congestionada:","o":["Deixar livre uma passagem do lado esquerdo da parte da faixa de rodagem afecta ao seu sentido de circulação, chegando-se o mais possível para a direita e ppdendo, se necessário, utilizar as bermas, excepto se for numa autoestrada.","Deixar livre uma passagem do lado direito da parte da faixa de rodagem afecta ao seu sentido de circulação, chegando-se o mais possível para a esquerda e podendo, se necessário, utilizar as bermas, excepto se for numa autoestrada.","Deixar livre uma passagem do lado esquerdo da parte da faixa de rodagem afecta ao seu sentido de circulação, chegando-se o mais possível para a direita e ppdendo, se necessário, utilizar as bermas, sobretudo se for numa autoestrada."],"c":1,"img":"img/q416.jpg","e":"Como se circula pela esquerda, os veículos prioritários passam pela direita. Deve encostar-se o mais possível à esquerda, deixando passagem livre do lado direito."},{"id":417,"q":"O tomar bebidas alcoólicas:","o":["Reduz a descoordenação motora e a capacidade de avaliação das distâncias.","Aumenta a descoordenação motora e afecta a capacidade de avaliação das distâncias.","Aumenta a descoordenação motora e reduz o risco de acidente.","Em pequenas quantidades não afecta o acto da condução"],"c":1,"img":"img/q417.jpg","e":"O álcool aumenta a descoordenação dos movimentos e piora a avaliação das distâncias."},{"id":418,"q":"Se perceber o principio de um incêndio:","o":["Actue de imediato, desligando as luzes do veículo e utilizando um extintor.","Actue de imediato, desligando o ar condicionado do veículo e utilizando um extintor.","Actue de imediato, desligando o motor do veículo e utilizando um extintor."],"c":2,"img":"img/q418.jpg","e":"Se houver princípio de incêndio, deve desligar logo o motor (corta o combustível e a electricidade) e usar o extintor."},{"id":419,"q":"Qual a frase que melhor define “ver” na afirmação \"conduzir implica ver, pensar e agir”?","o":["Estar muito atento ao condutor que vai à sua frente.","Procurar e seleccionar informação significativa.","Olhar o mais longe possível."],"c":1,"img":"img/q419.jpg","e":"'Ver', na condução, é procurar e seleccionar a informação importante à sua volta, e não apenas olhar."},{"id":420,"q":"Quando um condutor toma bebidas alcoólicas, atinge a taxa (TAS) máxima:","o":["Cerca de 1 hora após a ingestão do último copo.","Cerca de 30 minutos após a ingestão do último copo.","Cerca de 1 hora após a ingestão do primeiro copo."],"c":0,"img":"img/q420.jpg","e":"A taxa de álcool no sangue atinge o máximo cerca de 1 hora depois do último copo."},{"id":421,"q":"O tomar bebidas alcoólicas:","o":["Afecta a trajectória do veículo.","Afecta as capacidades cognitivas e perceptivas do condutor.","Aumenta a capacidade de reacção do condutor.","Diminui a possibilidade de o condutor sofrer de fadiga."],"c":1,"img":"img/q421.jpg","e":"O álcool afecta as capacidades cognitivas (pensar, decidir) e perceptivas (ver, avaliar distâncias) do condutor."},{"id":422,"q":"Como medida defensiva, o condutor deve:","o":["Circular com óculos escuros para evitar encadeamento.","Deve usar sempre a buzina para alertar outros utentes da via da sua presença.","Dar a conhecer as suas intenções através de sinalização.","Parar sempre que se aproxime de um cruzamento para evitar um acidente."],"c":2,"img":"img/q422.jpg","e":"Na condução defensiva, deve mostrar as suas intenções com tempo, usando a sinalização (piscas), para que os outros possam prever o que vai fazer."},{"id":423,"q":"Assinale a afirmação falsa:","o":["A perda momentânea da visão designada por encadeamento, é sempre resultado do cruzamento com um veículo em sentido contrário e com as luzes de estrada ligadas.","Durante a condução nocturna, a visão cromática é afectada o que afecta a identificação dos obstáculos.","Apesar da menor intensidade de trânsito, a gravidade dos acidentes rodoviários verificados durante a noite é normalmente maior.","Nos períodos de aurora (nascer do dia) e crepúsculo (por-do-sol), é mais difícil avaliar as distâncias, bem como distinguir as formas e as cores dos obstáculos"],"c":0,"img":"img/q423.jpg","e":"A afirmação falsa é a A: o encandeamento não vem só dos máximos de quem vem de frente. Também pode ser causado pelo sol, por reflexos ou pelos faróis de quem vem atrás."},{"id":424,"q":"O que pode ser favorecido se tiver a suspensão em bom estado?","o":["A redução da distância de reacção.","A redução da distância de travagem.","O aumento das distâncias de manobra.","A redução da atenção do condutor."],"c":1,"img":"img/q424.jpg","e":"Com a suspensão em bom estado, os pneus mantêm-se em contacto com o chão. Assim a travagem é mais eficaz e a distância de travagem diminui."},{"id":425,"q":"Consideram-se veículos prioritários:","o":["As ambulâncias e veículos da polícia;","Só os que transitam em missão urgente de socorro e comitivas governamentais, mesmo não assinalando adequadamente a sua marcha.","Os que transitam em missão urgente de socorro e comitivas governamentais, assinalando adequadamente a sua marcha.","Apenas as comitivas governamentais;"],"c":2,"img":"img/q425.jpg","e":"São prioritários os veículos em missão urgente de socorro e as comitivas governamentais, desde que assinalem a marcha com sirene e luzes."},{"id":426,"q":"A deslocação do ar causado pela passagem de veículos pesados em alta velocidade:","o":["Provoca ventos frontais que afectam os veículos ligeiros mais leves.","Provoca ventos laterais que afectam, sobretudo os veículos pesados de passageiros.","Provoca ventos laterais que afectam os veículos ligeiros mais leves.","Não tem influência para os outros condutores."],"c":2,"img":"img/q426.jpg","e":"A passagem de um pesado em alta velocidade cria ventos laterais que empurram e desviam os veículos ligeiros mais leves."},{"id":427,"q":"A definição de multa é:","o":["Sanção pecuniária destinada a punir a prática de uma contravenção ao Código da Estrada.","Condenação dada a um indivíduo que infringiu uma norma estabelecida na legislação.","Condenação disciplinar.","Condenação administrativa."],"c":0,"img":"img/q427.jpg","e":"Multa é uma sanção em dinheiro (pecuniária) para punir uma contravenção ao Código da Estrada."},{"id":428,"q":"Quem exceder em mais de 80 Km/h de velocidade (automóveis lig const Q = DATA.questions;
const LETTERS = ['A','B','C','D','E'];
const store = {
  get(k, d) { try { const v = localStorage.getItem('inatter:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('inatter:' + k, JSON.stringify(v)); } catch (e) {} }
};
let hist = store.get('hist', {});
let best = store.get('best', {});
const app = document.getElementById('app');
let S = null;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wrongIds() { return Object.keys(hist).filter(id => hist[id].last === 0 && Q[id]).map(Number); }
function seenCount() { return Object.keys(hist).filter(id => Q[id]).length; }

function lamps(on) {
  return `<div class="lamps" aria-hidden="true"><i class="lamp ${on === 'r' ? 'r' : ''}"></i><i class="lamp ${on === 'y' ? 'y' : ''}"></i><i class="lamp ${on === 'g' ? 'g' : ''}"></i></div>`;
}

function home() {
  S = null;
  const wr = wrongIds();
  const mastered = Object.keys(hist).filter(id => Q[id] && hist[id].last === 1).length;
  app.innerHTML = `
    <header class="light-head">
      ${lamps('g')}
      <div class="txt">
        <h1>Treino INATTER</h1>
        <p>Exame teórico de condução. As perguntas e as opções mudam de ordem em cada tentativa, e cada resposta traz a explicação.</p>
      </div>
    </header>
    <div class="stats">
      <div class="stat"><b>${Q.length}</b><span>perguntas diferentes</span></div>
      <div class="stat g"><b>${mastered}</b><span>já acertadas</span></div>
      <div class="stat r"><b>${wr.length}</b><span>por rever</span></div>
    </div>
    <div class="section-h">Treinar</div>
    <div class="modes">
      <button class="mode" id="m-sim"><i class="dot g"></i><strong>Simulação de exame</strong><span class="s">25 perguntas ao acaso de todos os exames</span></button>
      <button class="mode" id="m-wrong" ${wr.length ? '' : 'disabled'}><i class="dot r"></i><strong>Rever as que errei</strong><span class="s">${wr.length ? wr.length + ' perguntas que falhaste da última vez' : 'Ainda não falhaste nenhuma'}</span></button>
      <button class="mode" id="m-new" ${seenCount() < Q.length ? '' : 'disabled'}><i class="dot y"></i><strong>Perguntas novas</strong><span class="s">${Q.length - seenCount()} que ainda não respondeste</span></button>
      <button class="mode" id="m-all"><i class="dot k"></i><strong>Todas as perguntas</strong><span class="s">As ${Q.length}, em ordem aleatória</span></button>
    </div>
    <div class="section-h">Exames</div>
    <div class="exams">
      ${DATA.exams.map(e => {
        const b = best[e.n];
        const r = b == null ? null : b / e.q.length;
        const cls = r == null ? '' : r >= 0.9 ? 'ok' : r >= 0.7 ? 'mid' : 'bad';
        return `<button class="exam ${cls}" data-exam="${e.n}"><i></i><strong>Exame ${e.n}</strong><small>${b == null ? e.q.length + ' perguntas' : 'melhor: ' + b + '/' + e.q.length}</small></button>`;
      }).join('')}
    </div>
    <div class="legend">
      <span><i style="background:var(--green)"></i>90% ou mais</span>
      <span><i style="background:var(--amber)"></i>70 a 89%</span>
      <span><i style="background:var(--red)"></i>menos de 70%</span>
    </div>
    <p class="note" style="margin-top:22px">O teu progresso fica guardado neste navegador.
      <button class="danger" id="reset">Apagar progresso</button></p>
  `;
  document.getElementById('m-sim').onclick = () => start('Simulação', shuffle(Q.map(q => q.id)).slice(0, 25));
  document.getElementById('m-all').onclick = () => start('Todas as perguntas', Q.map(q => q.id));
  document.getElementById('m-wrong').onclick = () => start('Rever erros', wrongIds());
  document.getElementById('m-new').onclick = () => start('Perguntas novas', Q.map(q => q.id).filter(id => !hist[id]));
  app.querySelectorAll('[data-exam]').forEach(b => b.onclick = () => {
    const e = DATA.exams.find(x => x.n == b.dataset.exam);
    start('Exame ' + e.n, e.q.slice(), e.n);
  });
  const r = document.getElementById('reset');
  r.onclick = () => {
    if (r.dataset.confirm) { hist = {}; best = {}; store.set('hist', hist); store.set('best', best); home(); }
    else { r.dataset.confirm = 1; r.textContent = 'Tens a certeza? Toca outra vez para apagar'; }
  };
  window.scrollTo(0, 0);
}

// Every session: new question order and new option order for each question.
function start(title, ids, examN) {
  if (!ids.length) return;
  const order = shuffle(ids);
  const perm = {};
  order.forEach(id => { perm[id] = shuffle(Q[id].o.map((_, i) => i)); });
  S = { title, base: ids.slice(), ids: order, perm, examN, i: 0, answers: [] };
  showQ();
}

function trackHTML() {
  return `<div class="track" aria-hidden="true">${S.ids.map((id, k) => {
    const a = S.answers[k];
    return `<i class="${a ? (a.ok ? 'ok' : 'no') : (k === S.i ? 'now' : '')}"></i>`;
  }).join('')}</div>`;
}

function showQ() {
  const q = Q[S.ids[S.i]];
  const p = S.perm[q.id];
  app.innerHTML = `
    <div class="topbar">
      <button class="back" id="back">← Sair</button>
      <div class="title">${esc(S.title)}</div>
      <div class="counter">${S.i + 1} / ${S.ids.length}</div>
    </div>
    ${trackHTML()}
    <article class="card">
      ${q.img ? `<div class="pic"><img src="${q.img}" alt="Imagem da pergunta"></div>` : ''}
      <div class="qtext">${esc(q.q)}</div>
    </article>
    <div class="opts">
      ${p.map((orig, pos) => `<button class="opt" data-k="${orig}"><span class="l">${LETTERS[pos]}</span><span class="t">${esc(q.o[orig])}</span></button>`).join('')}
    </div>
    <div id="fb"></div>
  `;
  document.getElementById('back').onclick = () => S.answers.length ? finish() : home();
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  window.scrollTo(0, 0);
}

function letterOf(q, orig) { return LETTERS[S.perm[q.id].indexOf(orig)]; }

function answer(k) {
  const q = Q[S.ids[S.i]];
  const ok = k === q.c;
  S.answers.push({ id: q.id, k, ok });
  const h = hist[q.id] || { r: 0, w: 0 };
  ok ? h.r++ : h.w++; h.last = ok ? 1 : 0; hist[q.id] = h; store.set('hist', hist);
  app.querySelectorAll('.opt').forEach(b => {
    const bk = +b.dataset.k; b.disabled = true;
    if (bk === q.c) b.classList.add('right');
    else if (bk === k) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const tr = app.querySelector('.track'); if (tr) tr.outerHTML = trackHTML();
  const last = S.i === S.ids.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="verdict ${ok ? 'ok' : 'no'}">
      <i class="lamp ${ok ? 'g' : 'r'}"></i>
      <div>${ok ? 'Certo!' : 'Errado'}
        ${ok ? '' : `<small>A resposta certa é a ${letterOf(q, q.c)}: ${esc(q.o[q.c])}</small>`}
      </div>
    </div>
    ${q.e ? `<div class="why"><b>Porquê?</b><span>${esc(q.e)}</span></div>` : ''}
    <div class="actions"><button class="primary" id="next">${last ? 'Ver resultado' : 'Próxima pergunta →'}</button></div>
  `;
  const nx = document.getElementById('next');
  nx.onclick = () => { if (last) finish(); else { S.i++; showQ(); } };
  nx.focus({ preventScroll: true });
  document.getElementById('fb').scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function revCard(a) {
  const q = Q[a.id];
  return `
    <div class="rev ${a.ok ? 'ok' : 'no'}">
      ${q.img ? `<img src="${q.img}" alt="">` : ''}
      <div class="q">${esc(q.q)}</div>
      ${a.ok ? '' : `<div class="you">Respondeste: ${esc(q.o[a.k])}</div>`}
      <div class="right">Certa: ${esc(q.o[q.c])}</div>
      ${q.e ? `<div class="ex"><b>Porquê?</b> ${esc(q.e)}</div>` : ''}
    </div>`;
}

function finish() {
  const right = S.answers.filter(a => a.ok).length;
  const total = S.answers.length;
  const full = total === S.ids.length;
  if (S.examN != null && full) {
    if (best[S.examN] == null || right > best[S.examN]) { best[S.examN] = right; store.set('best', best); }
  }
  const wrong = S.answers.filter(a => !a.ok);
  const good = S.answers.filter(a => a.ok);
  const pct = total ? Math.round(right / total * 100) : 0;
  const lamp = pct >= 90 ? 'g' : pct >= 70 ? 'y' : 'r';
  const msg = pct >= 90 ? 'Muito bem! Estás preparado.' : pct >= 70 ? 'Quase lá. Revê as que erraste.' : 'Continua a treinar. Lê as explicações das erradas.';
  app.innerHTML = `
    <div class="topbar"><button class="back" id="back">← Início</button><div class="title">${esc(S.title)}</div></div>
    <section class="result">
      ${lamps(lamp)}
      <div>
        <div class="score">${right}<small> / ${total}</small></div>
        <p>${pct}% certas${full ? '' : ' (paraste a meio)'}. ${msg}</p>
      </div>
    </section>
    <div class="actions">
      ${wrong.length ? '<button class="primary redb" id="again-wrong">' + (wrong.length === 1 ? 'Repetir a errada' : 'Repetir as ' + wrong.length + ' erradas') + '</button>' : ''}
      <button class="${wrong.length ? 'secondary' : 'primary'}" id="again">Repetir tudo (nova ordem)</button>
    </div>
    ${wrong.length ? `<details class="group" open><summary>Erradas (${wrong.length})</summary><div class="review">${wrong.map(revCard).join('')}</div></details>` : ''}
    ${good.length ? `<details class="group" ${wrong.length ? '' : 'open'}><summary>Certas (${good.length})</summary><div class="review">${good.map(revCard).join('')}</div></details>` : ''}
  `;
  const base = S.base, title = S.title, ex = S.examN;
  document.getElementById('back').onclick = home;
  document.getElementById('again').onclick = () => start(title, base, ex);
  const aw = document.getElementById('again-wrong');
  if (aw) aw.onclick = () => start(title.replace(/ · erradas$/, '') + ' · erradas', wrong.map(a => a.id));
  window.scrollTo(0, 0);
}

home();
</script>
</body></html>
