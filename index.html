<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4e8c"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Treino INATTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one column, road-sign plates on a tarmac-tinted ground; a question card with its picture, then answer plates A–D. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --fg: #16202b;
  --muted: #5b6876;
  --line: #d3dae2;
  --sign: #1f4e8c;        /* road-sign blue */
  --sign-ink: #ffffff;
  --amber: #f2b705;       /* warning-sign yellow */
  --ok: #138a3e;
  --ok-soft: #e3f4e9;
  --bad: #c62828;
  --bad-soft: #fbe6e6;
  --chip: #e4e9ef;
  --display: "Overpass", "Arial Narrow", system-ui, sans-serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #1a2129; --fg: #e8edf2; --muted: #9aa7b4; --line: #2d3742;
    --sign: #4f86d1; --sign-ink: #0d1520; --amber: #f2c230; --ok: #3fbf6c; --ok-soft: #13301f;
    --bad: #ef5a5a; --bad-soft: #3a1919; --chip: #242d37; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #1a2129; --fg: #e8edf2; --muted: #9aa7b4; --line: #2d3742;
  --sign: #4f86d1; --sign-ink: #0d1520; --amber: #f2c230; --ok: #3fbf6c; --ok-soft: #13301f;
  --bad: #ef5a5a; --bad-soft: #3a1919; --chip: #242d37; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.45; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* header plate */
.plate { background: var(--sign); color: var(--sign-ink); border-radius: 10px; padding: 18px 20px; border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--sign); display: grid; gap: 6px; }
.plate h1 { font-size: 30px; font-weight: 800; letter-spacing: .01em; }
.plate p { margin: 0; opacity: .92; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }

.section-h { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--display); font-weight: 700; margin: 26px 0 10px; }

.modes { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.mode { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; }
.mode:hover { border-color: var(--sign); }
.mode strong { font-family: var(--display); font-size: 18px; }
.mode span { color: var(--muted); font-size: 14px; }
.mode[disabled] { opacity: .5; cursor: default; }

.exams { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.exam { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 8px; text-align: center; display: grid; gap: 2px; }
.exam:hover { border-color: var(--sign); }
.exam strong { font-family: var(--display); font-size: 17px; }
.exam small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.exam.done-ok { border-color: var(--ok); }
.exam.done-ok small { color: var(--ok); font-weight: 600; }
.exam.done-bad small { color: var(--bad); font-weight: 600; }

/* quiz */
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.back { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 15px; }
.topbar .title { font-family: var(--display); font-weight: 700; font-size: 18px; flex: 1; min-width: 0; }
.counter { font-family: var(--display); font-variant-numeric: tabular-nums; font-weight: 700; background: var(--chip); border-radius: 999px; padding: 4px 12px; font-size: 15px; }
.bar { height: 6px; background: var(--chip); border-radius: 999px; margin: 12px 0 16px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sign); width: 0; transition: width .25s; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.card .pic { background: #000; display: flex; justify-content: center; }
.card .pic img { display: block; max-height: 300px; width: auto; max-width: 100%; }
.card .qtext { padding: 16px 18px; font-size: 19px; font-weight: 700; }

.opts { display: grid; gap: 10px; margin-top: 14px; }
.opt { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.opt:hover:not([disabled]) { border-color: var(--sign); }
.opt .l { width: 40px; height: 40px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 18px; }
.opt .t { min-width: 0; padding-top: 8px; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .l { background: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .l { background: var(--bad); color: var(--surface); }

.feedback { margin-top: 14px; border-radius: 10px; padding: 12px 14px; font-weight: 600; display: grid; gap: 4px; }
.feedback.ok { background: var(--ok-soft); color: var(--ok); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback .ans { color: var(--fg); font-weight: 400; }

.actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.primary { background: var(--sign); color: var(--sign-ink); border: 0; border-radius: 10px; padding: 12px 20px; font-family: var(--display); font-weight: 700; font-size: 17px; flex: 1; min-width: 160px; }
.secondary { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px; font-weight: 600; }

/* result */
.result { text-align: center; display: grid; gap: 8px; padding: 26px 16px; }
.score { font-family: var(--display); font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.score small { font-size: 28px; color: var(--muted); }
.review { display: grid; gap: 10px; margin-top: 10px; }
.rev { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; }
.rev .q { font-weight: 700; }
.rev .you { color: var(--bad); font-size: 15px; }
.rev .ok { color: var(--ok); font-size: 15px; font-weight: 600; }
.rev img { max-width: 160px; border-radius: 6px; }
.note { color: var(--muted); font-size: 14px; }
.danger { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 14px; padding: 4px 0; }
@media (max-width: 480px) {
  .plate h1 { font-size: 25px; }
  .card .qtext { font-size: 18px; }
  .stats { gap: 6px; }
  .stat b { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<script>
const DATA = {"questions":[{"id":0,"q":"O que indica o sinal?","o":["Desvio da fila de trânsito para a direita.","Desvio da fila de trânsito para a esquerda.","Desvio e aumento de filas de trânsito para a esquerda."],"c":1,"img":"img/q000.jpg"},{"id":1,"q":"É necessário verificar com frequência o sistema de iluminação?","o":["Sim, mudando todos os fusíveis.","Sim, para se assegurar que todas as luzes funcionam e que os faróis estão bem regulados.","Não, porque se deve fazer unicamente numa oficina.","Não, é suficiente a revisão na inspecção periódica obrigatória."],"c":1,"img":"img/q001.jpg"},{"id":2,"q":"Que deve fazer o condutor de um veículo avariado enquanto não for devidamente estacionado ou removido?","o":["Colocar os sinais de pré-sinalização de perigo e depois vestir o colete reflector.","Colocar um sinal de pré-sinalização de perigo 5 metros à frente do veículo.","Adoptar as medidas necessárias para que os outros se apercebam da sua presença.","Colocar um sinal de pré-sinalização de perigo 10 metros à retaguarda do veículo."],"c":2,"img":"img/q002.jpg"},{"id":3,"q":"O que deve fazer o condutor que circula por uma auto-estrada?","o":["Aumentar a distância de segurança, por se seguir a velocidades mais elevadas.","Diminuir a distância de segurança, por se seguir a velocidades elevadas.","Circular pela via de trânsito mais à direita, ainda que a via da esquerda se encontre livre de trânsito."],"c":0,"img":"img/q003.jpg"},{"id":4,"q":"O que indica o sinal luminoso?","o":["Acesso ou passagem interdito.","Acesso ou passagem autorizado.","Acesso ou passagem condicionado."],"c":0,"img":"img/q004.jpg"},{"id":5,"q":"A luz de cruzamento (médios), destina-se a iluminar a via para frente do veículo numa distância até:","o":["30 metros.","40 metros.","50 metros.","60 metros."],"c":0,"img":"img/q005.jpg"},{"id":6,"q":"Que indica a marca rodoviária?","o":["Linha de cedência de prioridade com símbolo triangular.","Linha de paragem obrigatória com stop.","Linha de paragem obrigatória."],"c":0,"img":"img/q006.jpg"},{"id":7,"q":"Um torniquete é...","o":["um pedaço de pau curto amarrado em torno de um membro.","um pedaço de papel onde se menciona a parte do corpo que foi amarrada.","uma tira larga de pano, amarrada firmemente em torno de um membro.","uma peça de madeira, utilizada para aliviar a dor da vítima de acidente."],"c":2,"img":"img/q007.jpg"},{"id":8,"q":"Podem ser submetidos às provas para a detecção de álcool! ou substâncias estupefacientes ou psicotrópicas:","o":["Apenas os condutores de veículos automóveis.","Os peões, sempre que sejam intervenientes em acidentes de trânsito e os condutores.","Todos os condutores e peões que transitem pela via pública.","Só os condutores que sejam intervenientes em acidentes de trânsito."],"c":1,"img":"img/q008.jpg"},{"id":9,"q":"Fora das localidades, os condutores de ciclomotores e quadriciclos, não devem exceder a velocidade instantânea de:","o":["50 km/h.","40 km/h.","45 km/h.","35 km/h."],"c":2,"img":"img/q009.jpg"},{"id":10,"q":"Que veículos devem ter o seguro de responsabilidade civil para transitar na via pública?","o":["Todos os veículos.","Os veículos a motor.","Só os ciclomotores.","Apenas os veículos automóveis."],"c":1,"img":"img/q010.jpg"},{"id":11,"q":"Qual é a função do cinto de segurança de um veículo?","o":["Reter e proteger os ocupantes numa colisão.","Manter os ocupantes sentados na posição correcta.","Permitir que os ocupantes se desloquem sobre o assento em caso de acidente.","Apenas impedir as lesões do condutor em caso de capotagem."],"c":0,"img":"img/q011.jpg"},{"id":12,"q":"Para garantir uma proteção adequada, os sistemas de retenção de crianças devem ser:","o":["Da cor dos estofos do veículo.","Colocados sem cautela em cima dos bancos do veículo.","Adequados ao tamanho e peso da criança."],"c":2,"img":"img/q012.jpg"},{"id":13,"q":"É perigoso conduzir quando o condutor está cansado?","o":["Não há perigo, já que o cansaço relaxa.","Sim, porque o condutor demora mais tempo a reagir.","Não, porque se conduz mais devagar.","Sim, mais só quando se conduz dentro das localidades."],"c":1,"img":"img/q013.jpg"},{"id":14,"q":"O que indica o sinal?","o":["Indica a existência de uma via rápida.","Indica a existência de uma via de sentido único.","Indica a existência de uma Auto-Estrada."],"c":2,"img":"img/q014.jpg"},{"id":15,"q":"O que significa responsabilidade moral?","o":["Responder perante o Tribunal.","Responder pelos seus próprios actos.","Prestar contas perante os membros da sociedade."],"c":1,"img":"img/q015.jpg"},{"id":16,"q":"O que indica o sinal?","o":["Via obrigatória para veículos que transportam substâncias perigosas.","Fim da proibição de circulação de veículos que transportam substâncias perigosas.","Via obrigatória para automóveis pesados."],"c":0,"img":"img/q016.jpg"},{"id":17,"q":"Nesta situação, quem tem prioridade de passagem?","o":["O condutor que entra na rotunda.","O condutor que chegar primeiro.","O condutor que circula dentro da rotunda.","O condutor que circule com uma velocidade mais elevada."],"c":2,"img":"img/q017.jpg"},{"id":18,"q":"Fumar enquanto conduz...","o":["é aconselhável, pois ajuda a manter a atenção.","é proibido.","pode afectar a atenção na condução.","reduz a agressividade do condutor."],"c":2,"img":"img/q018.jpg"},{"id":19,"q":"O que indica o sinal?","o":["Estacionamento proibido.","Paragem e estacionamento proibidos.","Estacionamento condicionado."],"c":1,"img":"img/q019.jpg"},{"id":20,"q":"Na situação apresentada, pode ultrapassar o veículo pela esquerda?","o":["Sim, se esse veículo circula por baixo do limite máximo de velocidade.","Não.","Sim, pode-se sempre ultrapassar pela esquerda.","Sim, porque a linha é descontinua."],"c":1,"img":"img/q020.jpg"},{"id":21,"q":"O que indica o sinal?","o":["Proibição de circulação de peões.","Prioridade de passagem para peões.","Proibição de passagem de peões.","Pista obrigatória para peões."],"c":1,"img":"img/q021.jpg"},{"id":22,"q":"O que indica o sinal?","o":["Sinalização luminosa em manutenção.","Sinalização luminosa.","Passagem de nível."],"c":0,"img":"img/q022.jpg"},{"id":23,"q":"Posso mudar de direcção para a direita nesta situação?","o":["Sim, desde que o assinale com a devida antecedência.","Sim, porque não há nenhuma sinalização que o impeça.","Não, porque não é possível assegurar-se que a manobra pode ser realizada sem perigo."],"c":2,"img":"img/q023.jpg"},{"id":24,"q":"Diante do sinal, o condutor fica a saber que:","o":["Não pode utilizar os sinais sonoros.","Deve utilizar os sinais sonoros.","É obrigado a desligar as luzes de estrada."],"c":0,"img":"img/q024.jpg"},{"id":25,"q":"Não sendo o homem um ser isolado, mas sim que vive em contacto com pessoas iguais a si, os deveres para com os seus semelhantes podem ser:","o":["De respeito e de liberdade.","De dignidade e de integridade física.","De justiça e de caridade."],"c":2,"img":"img/q025.jpg"},{"id":26,"q":"O que indica o sinal luminoso?","o":["Acesso ou passagem autorizado.","Acesso ou passagem interdito.","Acesso ou passagem condicionado."],"c":2,"img":"img/q026.jpg"},{"id":27,"q":"Que indica a marca rodoviária?","o":["Passagem para peões.","Passagem para ciclistas.","Linha de cedência de prioridade."],"c":0,"img":"img/q027.jpg"},{"id":28,"q":"A ingestão de bebidas alcoólicas, mesmo que em pequenas quantidades, pode ter como consequência:","o":["Diminuição do tempo de reacção e da distância de paragem.","Aumento do tempo de reacção e da distância de paragem.","Aumento do tempo de reacção, mas não da distância de paragem.","Maior concentração na tarefa da condução."],"c":1,"img":"img/q028.jpg"},{"id":29,"q":"Os automóveis ligeiros de passageiros, devem estar equipados com sinais de pré-sinalização de perigo?","o":["Sim, um colete reflector e um triangulo de pré-sinalização de perigo.","Não.","Sim, dois triangulos de pré-sinalização de perigo e um colete reflector.","Sim, apenas são obrigatórios dois triangulos de pré-sinalização de perigo."],"c":2,"img":"img/q029.jpg"},{"id":30,"q":"O condutor do veículo amarelo ao mudar de direcção para a direita, a quem deve ceder a passagem?","o":["Apenas aos condutores que se apresentem pela direita.","Aos que circulam em sentido contrário e pretendam seguir em frente ou mudar de direcção para a esquerda.","A todos os condutores que circulem pela via transversal.","Só aos condutores que circulam em sentido contrário e sigam em frente."],"c":1,"img":"img/q030.jpg"},{"id":31,"q":"Uma criança de 8 anos, como deve viajar num automóvel equipado com cintos de segurança em todos os lugares?","o":["No banco da frente, com um sistema de retenção homologado e adaptado ao seu tamanho e peso.","No banco da retaguarda, com um sistema de retenção homologado e adaptado ao seu tamanho e peso.","É indiferente, sempre que utilize um sistema de retenção homologado e adaptado ao seu tamanho e peso.","Basta utilizar o cinto de segurança do banco da retaguarda."],"c":1,"img":"img/q031.jpg"},{"id":32,"q":"Quando o condutor tem uma distracção...","o":["demora mais tempo em reagir.","aumenta inconscientemente a velocidade do veículo.","deve avisar com as luzes de perigo.","demora menos tempo em obter as informações necessárias para conduzir com segurança."],"c":0,"img":"img/q032.jpg"},{"id":33,"q":"O que indica o sinal vertical?","o":["Pré-sinalização de via sem saída à direita.","Estrada sem saída.","Pré-sinalização de via sem saída à esquerda."],"c":0,"img":"img/q033.jpg"},{"id":34,"q":"De que modo deve verificar o nível de óleo do motor?","o":["Com o motor quente.","Com o motor parado e frio.","Com o motor ligado."],"c":1,"img":"img/q034.jpg"},{"id":35,"q":"Se pretender inverter o sentido de marcha, deve ter em conta...","o":["que só é permitido fazê-lo nas rotundas.","que é proibido fazê-lo em todos os cruzamentos e entroncamentos.","que a manobra deve ser feita em local e de forma a não prejudicar o trânsito.","que é proibido fazê-lo dentro das localidades."],"c":2,"img":"img/q035.jpg"},{"id":36,"q":"O que indica o sinal?","o":["Fim da fila de trânsito à esquerda.","Fim da fila de trânsito à direita.","Convergência de filas de trânsito."],"c":2,"img":"img/q036.jpg"},{"id":37,"q":"Diante do sinal, é proibido:","o":["Mudar de direcção para à direita.","Inverter o sentido de marcha.","Mudar de direcção para à esquerda."],"c":1,"img":"img/q037.jpg"},{"id":38,"q":"O uso do cinto de segurança nos assentos traseiros...","o":["podem salvar a vida aos seus ocupantes e impedem que eles causem lesões graves aos outros passageiros.","só são obrigatórios fora das localidades.","são da exclusiva responsabilidade dos ocupantes, já que num acidente seriam os únicos afectados.","não é obrigatório, mas é aconselhável."],"c":0,"img":"img/q038.jpg"},{"id":39,"q":"Durante o exame para obter a carta de condução, a responsabilidade pelas contravenções praticadas, é do:","o":["Instrutor.","Examinador.","Examinando."],"c":2,"img":"img/q039.jpg"},{"id":40,"q":"Se o condutor que me precede assinala a manobra de mudança de direcção para a direita, posso ultrapassar?","o":["Sim, pela direita.","Sim, pela esquerda, certificando-se que o pode fazer sem perigo de acidente.","Não.","Sim, pela direita ou pela esquerda, sempre que o veículo não esteja em movimento."],"c":1,"img":"img/q040.jpg"},{"id":41,"q":"O que indica o sinal?","o":["Sentidos obrigatórios possíveis.","Sentido obrigatório para à direita.","Sentido obrigatório giratório."],"c":2,"img":"img/q041.jpg"},{"id":42,"q":"Qual é a velocidade instantânea que não devem exceder os condutores de ciclomotores e quadriciclos dentro das localidades?","o":["45 km/h.","40 km/h.","50 km/h.","60 km/h."],"c":1,"img":"img/q042.jpg"},{"id":43,"q":"O feixe luminoso emitido pelas luzes de cruzamento (médios), deve projectar-se no solo:","o":["E iluminá-lo eficazmente, numa distância não superior a 30 metros.","E no mínimo, iluminá-lo a 100 metros.","E iluminá-lo eficazmente, numa distância não superior a 50 metros."],"c":0,"img":"img/q043.jpg"},{"id":44,"q":"Que efeitos tem a fadiga na condução?","o":["Reduz o tempo de reacção do condutor.","Diminui a sensibilidade ao encandeamento.","Reduz a capacidade de concentração e a segurança.","Melhora a atenção do condutor."],"c":2,"img":"img/q044.jpg"},{"id":45,"q":"A condução urbana, caracteriza-se essencialmente:","o":["Por uma grande intensidade de trânsito.","Pela abundância de sinais luminosos.","Pela ausência de regras de trânsito.","Pela pouca presença de peões."],"c":0,"img":"img/q045.jpg"},{"id":46,"q":"Pode transportar bebidas alcoólicas na parte do veículo reservada aos passageiros?","o":["Sim, se o condutor não estiver sob influência de álcool.","Sim, sempre que o condutor não tome nada de álcool.","Não, já que é proibido o porte e transporte de bebidas alcoólicas nesta parte do veículo.","Sim."],"c":2,"img":"img/q046.jpg"},{"id":47,"q":"O sinal de cor amarela e preta, indica:","o":["Barricada.","Baia limitadora de altura.","Baia indicadora de separador físico."],"c":1,"img":"img/q047.jpg"},{"id":48,"q":"O que se entende por primeiros socorros?","o":["É a chegada rápida do pessoal especializado ao local da ocorrência do sinistro.","É o transporte adequado do sinistrado ou doente ao posto médico.","São os cuidados prestados a uma pessoa que se fere ou adoece de repente, para mantê-la viva e impedir o agravamento da situação.","São os meios humanos e materiais utilizados para a remoção dos acidentados."],"c":2,"img":"img/q048.jpg"},{"id":49,"q":"Para manter a segurança do veículo, devem ser revistos periodicamente:","o":["As luzes, espelhos e o sistema de escape.","Os pneus, amortecedores e travões.","A bateria, o filtro de óleo e o do ar.","O sistema de som."],"c":1,"img":"img/q049.jpg"},{"id":50,"q":"Nas vias públicas, os peões devem transitar...","o":["pelos passeios, pistas ou passagens a eles destinados ou, se não existirem, pelas bermas.","pela faixa de rodagem, mesmo que existam bermas.","sempre pelas bermas, mesmo que existam pistas especiais desti altera."],"c":2,"img":"img/q101.jpg"},{"id":102,"q":"Que deve fazer o condutor perante a marca rodoviária de cor branca?","o":["Manter-se na via de trânsito que ela delimita, só podendo ser pisada ou transposta para efectuar manobras.","Manter-se na via de trânsito que ela delimita, não podendo ser pisada ou transposta.","Manter-se na via de trânsito que ela delimita, devendo abrandar a marcha."],"c":0,"img":"img/q102.jpg"},{"id":103,"q":"O significado deste sinal é:","o":["Queda de pedras à esquerda.","Queda de pedras à direita.","Estrada com buracos na esquerda.","Estrada com buracos na direita."],"c":1,"img":"img/q103.jpg"},{"id":104,"q":"O ordenamento do trânsito em todas as estradas, compete...","o":["aos Corpos Administrativos ou Conselhos Municipais.","à Policia Municipal.","ao INATTER.","à Policia de Trânsito."],"c":2,"img":"img/q104.jpg"},{"id":105,"q":"Os condutores de veículos ou animais que pretendam mudar de direcção para à direita, devem:","o":["Aproximar-se com a devida antecedência da berma da via e efectuar a manobra de modo a dar a esquerda à parte central do cruzamento ou entroncamento.","Aproximar-se com a devida antecedência do eixo da via e efectuar a manobra de modo a dar a esquerda à parte central do cruzamento ou entroncamento.","Aproximar-se com a devida antecedência do eixo da via e efectuar a manobra de modo a dar a direita à parte central do cruzamento ou entroncamento.","Aproximar-se com a devida antecedência da berma da via e efectuar a manobra de modo a dar a direita à parte central do cruzamento ou entroncamento."],"c":1,"img":"img/q105.jpg"},{"id":106,"q":"Com nevoeiro (cacimba), a distância de segurança aplicável:","o":["É a mesma que em condições de boa visibilidade.","É a indicada pela sinalização vertical.","Não é a mesma que em condições de boa visibilidade.","É menor para permitir ver o carro que segue à sua frente."],"c":2,"img":"img/q106.jpg"},{"id":107,"q":"Os sistemas de segurança activa de um veículo...","o":["ajudam o co ocidade das estradas.","circular abaixo dos limites mínimos de velocidade.","regular a velocidade atendendo às características do veículo, às condições da via e ao estado do condutor.","ficar em ponto morto nas descidas muito inclinadas."],"c":2,"img":"img/q113.jpg"},{"id":114,"q":"Se o condutor que segue à minha frente assinala a manobra de mudança de direcção para a direita, posso ultrapassar?","o":["Sim, pela direita.","Não.","Sim, pela esquerda, certificando-se que o pode fazer sem perigo de acidente.","Sim, pela direita ou pela esquerda, sempre que o veículo não esteja em movimento."],"c":2,"img":"img/q114.jpg"},{"id":115,"q":"O significado deste sinal é:","o":["Curva à direita e contracurva à direita.","Curva à direita e contracurva.","Curva à esquerda e contracurva.","Curva à esquerda e contracurva à direita"],"c":1,"img":"img/q115.jpg"},{"id":116,"q":"O significado deste sinal é:","o":["Curva à direita.","Inclinação à direita.","Curva à esquerda.","Sentido obrigatório para a direita."],"c":0,"img":"img/q116.jpg"},{"id":117,"q":"A definição de parque de estacionamento é:","o":["Local exclusivamente destinado ao estacionamento de veículos.","Local exclusivamente destinado ao descanso dos condutores.","Local exclusivamente destinado às cargas e descargas dos veículos.","Local exclusivamente destinado a manutenção e reparação dos veículos."],"c":0,"img":"img/q117.jpg"},{"id":118,"q":"Onde é proibido inverter o sentido de marcha?","o":["Nas rotundas.","Nos cruzamentos ou entroncamentos de visibilidade reduzida.","Fora das localidades.","Só quando haja grande intensidade de tráfego."],"c":1,"img":"img/q118.jpg"},{"id":119,"q":"É necessário regular e ajustar o encosto de cabeça para a altura dos ocupantes?","o":["Não é necessário, porque é apenas um elemento de conforto.","Sim, mas só nos bancos da frente.","Sim, porque pode evitar lesões na zona do pescoço.","Não, se o veículo tiver cintos de segurança."],"c":2,"img":"img/q119.jpg"},{"id":120,"q":"É proibido estacionar...","o":["de noite, nas faixas de rodagem das localidades.","a 50 metros das passagens de nível.","em cima dos passeios.","no lado da faixa de rodagem em que esteja uma linha contínua de cor branca."],"c":2,"img":"img/q120.jpg"},{"id":121,"q":"O agente de trânsito que aparece na fotografia, manda:","o":["Avançar o tráfego que venha da retaguarda.","Parar o tráfego que venha da esquerda.","Avançar o tráfego que venha da esquerda."],"c":2,"img":"img/q121.jpg"},{"id":122,"q":"O significado deste sinal é:","o":["Via temporariamente interrompida;","Via temporariamente interrompida, mas pode seguir em frente;","Via definitivamente interrompida;","Via temporariamente interrompida, só durante a noite;"],"c":0,"img":"img/q122.jpg"},{"id":123,"q":"O sinal luminoso com a seta verde indica:","o":["Acesso ou passagem interdito.","Acesso ou passagem autorizado.","Acesso ou passagem condicionado."],"c":1,"img":"img/q123.jpg"},{"id":124,"q":"Num veículo equipado com motor Diesel em aceleração, a libertação de muito fumo negro pelo tubo de escape, significa:","o":["Óptima qualidade do combustível.","Necessidade de regulação da bomba injectora.","Que o veículo está a queimar muito óleo.","Que o veículo acelera bem."],"c":1,"img":"img/q124.jpg"},{"id":125,"q":"O significado deste sinal é:","o":["Entroncamento agudo da esquerda.","Entroncamento convergente para a esquerda.","Entroncamento divergente da esquerda.","Entroncamento agudo da direita."],"c":0,"img":"img/q125.jpg"},{"id":126,"q":"O significado deste sinal é:","o":["Travessia de peões.","Travessia de idosos.","Travessia de crianças.","Passagem de peões."],"c":0,"img":"img/q126.jpg"},{"id":127,"q":"Qual dos veículos tem prioridade de passagem nesta situação?","o":["O veículo vermelho.","O veículo amarelo.","O primeiro que chegar ao cruzamento."],"c":1,"img":"img/q127.jpg"},{"id":128,"q":"Que veículo deve retroceder para dar passagem ao outro, numa passagen estreita sem sinalização onde não seja possível efectuar o cruzamento?","o":["O veículo mais pesado.","O veículo com maior largura.","O veículo que está mais próximo do local em que o cruzamento seja possível.","O veículo que desce se for numa via de inclinação acentuada."],"c":2,"img":"img/q128.jpg"},{"id":129,"q":"Quando os peões transitem na faixa de rodagem, devem fazê-lo...","o":["a par, quando transitem desde o anoitecer ao amanhecer.","numa única fila, sempre que as condições de visibilidade ou a intensidade do trânsito o aconselhem.","pela esquerda da faixa de rodagem, em relação ao seu sentido de marcha.","a par, quando transitem em condições de visibilidade insuficiente."],"c":1,"img":"img/q129.jpg"},{"id":130,"q":"Os condutores com pouco tempo de condução (inexperientes):","o":["Têm capacidades menos eficientes na recolha de informações.","Têm capacidades mais eficientes na recolha de informações.","Têm capacidades mais acertadas na recolha de informações.","As capacidades na recolha da informação não tem relação com a experiência, sim com a visão."],"c":0,"img":"img/q130.jpg"},{"id":131,"q":"Para praticar uma condução defensiva a antecipação é um comportamento importante.","o":["Errado.","Só nas passagens para peões.","Certo."],"c":2,"img":"img/q131.jpg"},{"id":132,"q":"Os automóveis ligeiros de passageiros e mistos sem reboque, fora das localidades, não devem exceder a velocidade instantânea de:","o":["80 km/h.","120 km/h.","100 km/h.","140 km/h."],"c":1,"img":"img/q132.jpg"},{"id":133,"q":"A Condução Defensiva deve ser mais “pró-activa”, isto significa que:","o":["Deve adivinhar as situações de perigo e concentrar-se em aproximar-se o mais possível da berma para se proteger.","Deve estar atendo aos ruídos estranhos dos veículos no trânsito e sinalizar.","Deve prever as situações antes de acontecerem e mesmo que não aconteçam prever a probabilidade de que aconteçam.","Deve ser mais rápida e activa para sair rapidamente das zonas de perigo."],"c":2,"img":"img/q133.jpg"},{"id":134,"q":"O que indica o sinal?","o":["Paragem obrigatória.","Paragem obrigatória em três vias.","Paragem obrigatória a três metros."],"c":1,"img":"img/q134.jpg"},{"id":135,"q":"Nos dias quentes, é recomendável...","o":["efectuar mais descansos durante uma viagem, porque a fadiga e o sono aparecem mais facilmente.","fazer menos descansos durante a viagem, para chegar ao destino o mais rapidamente possível.","evitar conduzir com o ar condicionado ligado.","evitar tomar bebidas como água ou sumos naturais."],"c":0,"img":"img/q135.jpg"},{"id":136,"q":"Que comunica o condutor aos outros utentes da via?","o":["Que vai reduzir a velocidade.","Que vai voltar para o lado esquerdo do volante.","Que vai voltar para o lado direito do volante."],"c":0,"img":"img/q136.jpg"},{"id":137,"q":"O que indica o sinal?","o":["Pista obrigatória para veículos de tracção manual.","Pista obrigatória para peões e velocípedes.","Pista obrigatória para peões.","Trânsito proibido a velocípedes e peões."],"c":1,"img":"img/q137.jpg"},{"id":138,"q":"O significado deste sinal é:","o":["Fim de duas vias.","Fim de via à esquerda.","Entroncamento agudo da direita.","Fim de via à direita."],"c":2,"img":"img/q138.jpg"},{"id":139,"q":"A condução sob influência do álcool provoca no condutor:","o":["A diminuição do tempo de reacção.","O aumento do tempo de reacção.","Não afecta o processo de condução.","O aumento dos reflexos."],"c":1,"img":"img/q139.jpg"},{"id":140,"q":"Os condutores não podem exceder as seguintes velocidades instantâneas (em quilómetros/hora):","o":["Automóveis pesados de passageiros dentro das localidades 50, fora das localidades 100.","Automóveis pesados de passageiros dentro das localidades 60, fora das localidades 100.","Automóveis pesados de passageiros dentro das localidades 60, fora das localidades 120.","Automóveis pesados de passageiros dentro das localidades 50, fora das localidades 120."],"c":1,"img":"img/q140.jpg"},{"id":141,"q":"A distância de segurança, se o condutor que transita à minha frente diminuir a velocidade:","o":["Aumenta.","Diminui.","Não se altera."],"c":1,"img":"img/q141.jpg"},{"id":142,"q":"O condutor determina qual é a resposta motora a executar, em que processo da tarefa da condução?","o":["Decisão.","Antecipação.","Previsão.","Recolha"],"c":0,"img":"img/q142.jpg"},{"id":143,"q":"O vento afecta a estabilidade do veículo:","o":["Particularmente quando é muito forte em túneis.","Particularmente em veículos de caixa aberta.","Particularmente quando é muito forte e sopra lateralmente.","Não."],"c":2,"img":"img/q143.jpg"},{"id":144,"q":"Que veículos consideram-se prioritários?","o":["As ambulâncias que transportam feridos.","As comitivas governamentais.","Os que transitam em missão urgente de socorro e comitivas governamentais, assinalando adequadamente a sua marcha."],"c":2,"img":"img/q144.jpg"},{"id":145,"q":"O que indica o sinal?","o":["Paragem obrigatória.","Trânsito proibido a veículos com comprimento superior a 60 metros.","Paragem obrigatória a 60 metros."],"c":2,"img":"img/q145.jpg"},{"id":146,"q":"Parar ou estacionar, é proibido:","o":["A menos de 3 m das passagens assinaladas para a travessia de peões e velocípedes.","A menos de 10 m das passagens assinaladas para a travessia de peões e velocípedes.","A menos de 15 m das passagens assinaladas para a travessia de peões e velocípedes.","A menos de 5 m das passagens assinaladas para a travessia de peões e velocípedes."],"c":3,"img":"img/q146.jpg"},{"id":147,"q":"A distância percorrida desde que o condutor identifica um perigo até que o veículo pare completamente...","o":["depende apenas do estado dos travões.","depende apenas do estado do condutor.","é maior quanto maior for a velocidade.","só varia se o veículo ou a via estão em mau estado."],"c":2,"img":"img/q147.jpg"},{"id":148,"q":"O significado deste sinal é:","o":["Terreno com pedras à esquerda.","Terreno falso à esquerda.","Zona de passagem pela direita.","Zona de passagem pela esquerda."],"c":1,"img":"img/q148.jpg"},{"id":149,"q":"Nas estradas nacionais, a suspensão do trânsito deve ser solicitada:","o":["À ANE e, nas estradas locais, aos conselhos municipais.","Ao INATTER e nas estradas locais, aos conselhos municipais.","À polícia de segurança pública e nas estradas locais, aos conselhos municipais.","Ao Ministério dos transportes e nas estradas locais, aos conselhos municipais."],"c":0,"img":"img/q149.jpg"},{"id":150,"q":"Como pode ser definido o stress?","o":["Acalmia mental diante de pressões ou exigências que ultrapassem os limites das suas próprias capacidades.","Indiferença perante pressões ou exigências que ultrapassem os limites das suas próprias capacidades.","Tensão mental diante de pressões ou exigências que ultrapassem os limites das suas próprias capacidades."],"c":2,"img":"img/q150.jpg"},{"id":151,"q":"O significado destes sinais é:","o":["Área reservada para táxis; Pista reservada para velocípedes do lado esquerdo; Área reservada para veículos de deficientes.","Área reservada para táxis; Pista reservada para velocípedes do lado direito; Área reservada para veículos de deficientes.","Área reservada para táxis; Pista reservada para velocípedes do lado esquerdo; Pista reservada para veículos de deficientes.","Área reservada para transporte coletivo; Pista reservada para velocípedes do lado esquerdo; Área reservada para veículos de deficientes."],"c":0,"img":"img/q151.jpg"},{"id":152,"q":"A distância de segurança entre veículos em marcha depende:","o":["Apenas da pressa do condutor.","De que circulem em autoestrada, podendo ser mais pequena neste caso.","Sempre da velocidade.","Da capacidade de travagem do veículo."],"c":2,"img":"img/q152.jpg"},{"id":153,"q":"A definição de cruzamento é:","o":["Zona de intersecção de vias privadas ao mesmo nível.","Zona de intersecção de vias privadas ao nível superior.","Zona de intersecção de vias públicas ao mesmo nível.","Zona de intersecção de vias privadas ao nível inferior."],"c":2,"img":"img/q153.jpg"},{"id":154,"q":"Quem tem prioridade de passagem nesta intersecção?","o":["Os condutores que se apresentem pela esquerda.","Todos os condutores que circulem pela via transversal.","Os condutores que circulem pela via de maior largura.","Os condutores que se apresentem pela direita."],"c":3,"img":"img/q154.jpg"},{"id":155,"q":"É perigoso utilizar o telefone móvel durante a condução?","o":["Não, já que não afecta a condução.","Sim, porque reduz a atenção necessária para conduzir com segurança.","Não, quando a conversa não durar muito tempo.","Sim, mas só quando se utilizar um aparelho \"mãos livres\"."],"c":1,"img":"img/q155.jpg"},{"id":156,"q":"Um condutor que expressa o descontentamento através de gestos ou palavras agressivas:","o":["Manifesta agressividade e falta de civismo.","Está apenas, e bem, a demonstrar o seu descontentamento com o comportamento dos outros.","Está a contribuir para mais e melhor cidadania no transito.","Está a exercer um direito que lhe assiste perante a ignorância dos outros condutores."],"c":0,"img":"img/q156.jpg"},{"id":157,"q":"Quando existe cruzamento de veículos?","o":["Os condutores de dois veículos que transitem na mesma faixa de rodagem e no mesmo sentido, o que vai à frente realize uma ultrapassagem.","Os condutores de dois veículos que transitem na mesma via e no mesmo sentido passem um pelo outro.","Os condutores de dois veículos que transitem na mesma estrada e no mesmo sentido passem um pelo outro.","Os condutores de dois veículos, que transitem na mesma via e em sentidos opostos, passem um pelo outro em simultâneo;"],"c":3,"img":"img/q157.jpg"},{"id":158,"q":"Quais são os efeitos efeitos mais comuns da fadiga ao volante?","o":["A dificuldade em manter o veículo, dentro dos limites da faixa de rodagem.","Sentir fome e sede o que provoca a necessidade de se deslocar com maior velocidade para chegar mais rápido ao seu destino.","Sentir-se enérgico podendo controlar melhor o veículo."],"c":0,"img":"img/q158.jpg"},{"id":159,"q":"A ingestão de drogas:","o":["Diminui as capacidades do condutor, alterando os reflexos e a coordenação de movimentos.","Aumenta as capacidades do condutor, melhorando os reflexos e a coordenação de movimentos.","Afecta as capacidades do condutor, melhorando os reflexos e a coordenação de movimentos.","Em determinadas condições ajudam o condutor a estar mais atento."],"c":0,"img":"img/q159.jpg"},{"id":160,"q":"O que é a ergonomia de um veículo?","o":["É a capacidade de adaptação do equipamento às particularidades de cada ser humano.","É a capacidade de um condutor economizar no combustível.","É a capacidade de um veículo economizar no combustível."],"c":0,"img":"img/q160.jpg"},{"id":161,"q":"O significado deste sinal é:","o":["Zona onde só podem passar três carros de cada vez.","Congestionamento de tráfego.","Zona de estacionamento em fila.","Zona de paragem em fila."],"c":1,"img":"img/q161.jpg"},{"id":162,"q":"A definição de tara é:","o":["Peso do veículo com carga.","Peso do veículo em vazio.","Peso da carga que o veículo transporta.","Peso do veículo mais o condutor."],"c":1,"img":"img/q162.jpg"},{"id":163,"q":"O significado deste sinal é:","o":["Passagem estreita.","Só veículos pesados de passageiros.","Um veículo de cada vez.","Só veículos pesados de mercadorias."],"c":2,"img":"img/q163.jpg"},{"id":164,"q":"As luzes de travagem dos automóveis tem a cor:","o":["Branca ou amarela.","Amarela ou alaranjada.","Vermelha."],"c":2,"img":"img/q164.jpg"},{"id":165,"q":"Como é feito o processo de eliminação do álcool no organismo?","o":["Pela urina e pela transpiração.","Pelo ar expirado, pela urina e quantidade de água ingerida.","Pelo fígado, pelo ar expirado, pela urina e pela transpiração.","Pela quantidade de café e água que tome depois de beber."],"c":2,"img":"img/q165.jpg"},{"id":166,"q":"Nos veículos de mercadorias, a carga deve ser disposta de modo a que:","o":["O principal peso fique sobre o eixo da retaguarda.","Seja assegurado o equilíbrio do veículo, parado ou em movimento.","Fique livre o maior espaço possível à retaguarda da caixa de carga."],"c":1,"img":"img/q166.jpg"},{"id":167,"q":"A marcha atrás, e uma manobra que deve ser efectuada...","o":["o mais à direita possível, em local de boa visibilidade.","o mais rapidamente possível, em local onde não prejudique o trânsito.","lentamente e o mais possível à esquerda.","rapidamente e no menor trajecto possível."],"c":2,"img":"img/q167.jpg"},{"id":168,"q":"O que deve fazer o condutor se a fila da esquerda estiver a circular mais rapidamente?","o":["Manter-se na fila de trânsito em que se encontra.","Mudar de fila de trânsito.","Sinalizar e mudar de fila de trânsito."],"c":0,"img":"img/q168.jpg"},{"id":169,"q":"O condutor de veículo utilizado no transporte colectivo de passageiros, só pode parar nas faixas de rodagem para:","o":["Carregar e descarregar mercadorias, só durante o dia.","Carregar e descarregar mercadorias, só durante a noite.","A entrada e saída de passageiros nos locais especialmente destinados a esse fim.","A entrada e saída de passageiros, em qualquer lugar que lhe de mais jeito."],"c":2,"img":"img/q169.jpg"},{"id":170,"q":"O que é a força centrífuga?","o":["É a força aparente que “empurra” os veículos para o interior das curvas;","É a força aparente que “empurra” os veículos para o exterior das curvas","É a força aparente que trava os veículos nas curvas","Uma força que só ocorre quando o veículo vai em linha recta."],"c":1,"img":"img/q170.jpg"},{"id":171,"q":"Nas pontes, túneis e passagens de nível:","o":["Os animais atrelados ou não, devem seguir a passo.","Os animais só quando estiverem atrelados, devem seguir a passo.","Os animais quando não atrelados, devem seguir a passo de corrida.","Os animais atrelados ou não, devem seguir a passo de corrida."],"c":0,"img":"img/q171.jpg"},{"id":172,"q":"Se conduz muito tempo sem descansar...","o":["aumenta a atenção do condutor.","a condução torna-se perigosa.","aumenta a segurança.","o condutor relaxa-se e conduz melhor."],"c":1,"img":"img/q172.jpg"},{"id":173,"q":"O que indica o sinal?","o":["Trânsito proibido ao conjunto de veículos de mercadorias, de peso total superior a 10t.","Trânsito proibido a veículos de peso por eixo superior a 10t.","Trânsito proibido a veículos de peso por eixo múltiplo superior a 10t."],"c":2,"img":"img/q173.jpg"},{"id":174,"q":"Depois de ter tomado bebidas alcoólicas:","o":["O álcool entra rapidamente no sistema circulatório.","O álcool entra directamente no sistema urinário.","O álcool demora duas horas a entrar no sistema circulatório."],"c":0,"img":"img/q174.jpg"},{"id":175,"q":"Que indica o sinal?","o":["Terreno falso à direita.","Cruzamento facilmente congestionável.","Congestionamento de tráfego."],"c":2,"img":"img/q175.jpg"},{"id":176,"q":"O sinal, pertence ao grupo de sinais de:","o":["Pré-sinalização e de direcção.","Direcção.","Direcção para auto-estradas."],"c":2,"img":"img/q176.jpg"},{"id":177,"q":"A definição de tractor é:","o":["Veículo a motor exclusivamente construído para desenvolver esforço de tracção, sem comportar carga útil.","Veículo automóvel exclusivamente construído para desenvolver esforço de tracção, sem comportar carga útil.","Veículo automóvel exclusivamente construído para desenvolver esforço de tracção, comportando carga útil.","Veículo automóvel exclusivamente construído para desenvolver esforço do motor, comportando alguma carga."],"c":1,"img":"img/q177.jpg"},{"id":178,"q":"A condução em dias de chuva provoca um aumento do risco de acidente, por causa de factores como:","o":["Menor visibilidade, menor aderência e maior stress físico.","Maior tempo de reacção e menor tempo de paragem.","Piso mais escorregadio e menor distância de paragem.","Diminuição do tempo de reacção por falta de visibilidade."],"c":0,"img":"img/q178.jpg"},{"id":179,"q":"Como deve actuar o condutor quando tem que fazer uma curva?","o":["Reduzir a velocidade, já dentro da curva.","Aumentar a velocidade, antes de entrar na curva.","Adaptar a velocidade, antes de entrar na curva.","Pressionar o pedal de embraiagem e não acelerar dentro da curva."],"c":2,"img":"img/q179.jpg"},{"id":180,"q":"O sinal indica:","o":["Existência de controlo de tráfego adiante.","Controlo policial por pirilampos.","Congestionamento do tráfego."],"c":1,"img":"img/q180.jpg"},{"id":181,"q":"Os automóveis classificam-se em:","o":["Ligeiros e Pesados.","Ligeiros, Pesados e Motociclos.","Motociclos, Ciclomotores, Triciclos, Quadriciclos, ligeiros e Pesados.","Ligeiros, Pesados e Mistos."],"c":0,"img":"img/q181.jpg"},{"id":182,"q":"É aconselhável viajar à noite para evitar a fadiga?","o":["Não, porque o sono aparece mais facilmente.","Sim, se a viagem é longa.","Sim, porque há menos tráfego.","Sim, viajar durante a noite é sempre mais seguro."],"c":0,"img":"img/q182.jpg"},{"id":183,"q":"O que indica o sinal de informação?","o":["Area reservada para automóveis ligeiros.","Área reservada para táxis.","Parque de estacionamento para automóveis ligeiros de passageiros."],"c":0,"img":"img/q183.jpg"},{"id":184,"q":"Deve utilizar-se as luzes de perigo...","o":["ao estacionar em segunda fila.","para avisar os outros utentes que o veículo vai fazer marcha atrás.","em caso de imobilização por acidente ou avaria, se origina perigo para os demais utentes da via.","apenas quando o veículo esteja a ser rebocado."],"c":2,"img":"img/q184.jpg"},{"id":185,"q":"O que indica a marca rodoviária branca?","o":["Indica a existência de bandas sonoras.","Indica a redução de filas de trânsito.","Indica a existência de lombas."],"c":2,"img":"img/q185.jpg"},{"id":186,"q":"Atirar do veículo ou abandonar na via objectos ou substâncias, constitui contravenção:","o":["Leve.","Grave.","Média."],"c":2,"img":"img/q186.jpg"},{"id":187,"q":"Entende-se por visibilidade reduzida ou insuficiente, quando o condutor não possa avistar a faixa de rodagem em toda a sua largura numa extensão de:","o":["Pelo menos, 50 metros.","Pelo menos, 200 metros.","Pelo menos, 100 metros.","Pelo menos, 25 metros."],"c":0,"img":"img/q187.jpg"},{"id":188,"q":"O que indica o sinal?","o":["Sentido proibido.","Trânsito proibido.","Trânsito proibido a automóveis ligeiros de passageiros."],"c":1,"img":"img/q188.jpg"},{"id":189,"q":"Uma das consequências de aumentar a velocidade, é que...","o":["melhora o tempo de reacção.","aumenta a gravidade das lesões em caso de acidente.","reduz a distância de travagem.","reduz as distracções."],"c":1,"img":"img/q189.jpg"},{"id":190,"q":"O trânsito de veículos ou de animais é feito...","o":["do lado direito das faixas de rodagem e o mais próximo possível das bermas ou passeios.","próximo do eixo da via.","pela esquerda das faixas de rodagem e o mais próximo possível das bermas ou passeios, mas a uma distância destes que permita evitar qualquer acidente."],"c":2,"img":"img/q190.jpg"},{"id":191,"q":"Numa auto - estrada, pode-se inverter o sentido de marcha?","o":["Sempre que possível.","Nunca.","Sim, se a manobra for feita lentamente."],"c":1,"img":"img/q191.jpg"},{"id":192,"q":"O que indica o sinal?","o":["Paragem proibida a veículos que transportam substâncias perigosas.","Paragem obrigatória para veículos que transportam substâncias perigosas.","Área reservada para veículos que transportam substâncias perigosas."],"c":0,"img":"img/q192.jpg"},{"id":193,"q":"O que indica o sinal?","o":["A presença de cancela motorizada ao centro.","A presença de ponte móvel.","A presença de entroncamento obliquo à esquerda."],"c":1,"img":"img/q193.jpg"},{"id":194,"q":"O que indica o sinal?","o":["Pré-advertência da direcção de saída.","Advertência da direcção de saída.","Direcção de saída."],"c":0,"img":"img/q194.jpg"},{"id":195,"q":"Considera-se morte por acidente de viação:","o":["Aquela que ocorre até 30 dias após o registo do sinistro.","Só aquela que ocorre no local do sinistro.","Só aquela aquela que ocorre à caminho da unidade sanitária.","Aquela que ocorre 30 dias depois do registo do sinistro."],"c":0,"img":"img/q195.jpg"},{"id":196,"q":"Os peões, para atravessar a faixa de rodagem...","o":["podem fazê-lo sem utilizar as passagens para peões, se não existe nenhuma a uma distância inferior a 10 m.","estão sempre obrigados a utilizar a passagem desnivelada para peões.","têm sempre prioridade de passagem.","devem certificar-se de que a distância e velocidade dos veículos, permite fazê-lo sem perigo de acidente."],"c":3,"img":"img/q196.jpg"},{"id":197,"q":"É proibido ultrapassar:","o":["Em todas as curvas.","Depois dos cruzamentos.","Nas estradas que só tenham uma via de trânsito para cada sentido.","Imediatamente antes e nas passagens para peões."],"c":3,"img":"img/q197.jpg"},{"id":198,"q":"Os automóveis pesados de passageiros, fora das localidades, não devem exceder a velocidade instantânea de:","o":["80 km/h.","120 km/h.","100 km/h."],"c":2,"img":"img/q198.jpg"},{"id":199,"q":"Todos os condutores de veículos ou animais são obrigados a...","o":["abandonar os veículos nos locais de estacionamento sem motivo justificado.","reduzir ou suspender intencionalmente a circulação, formando filas de trânsito desnecessárias.","obedecer ao sinal de paragem feito pelas autoridades com competência para fiscalização do trânsito."],"c":2,"img":"img/q199.jpg"},{"id":200,"q":"O que indica o sinal?","o":["Sentido obrigatório para a frente.","Via rápida.","Existência de portagem na via em que segue."],"c":2,"img":"img/q200.jpg"},{"id":201,"q":"Em acidente de viação com vitima, deixar de prestar ou providenciar socorro, constitui contravenção:","o":["Leve.","Média.","Grave."],"c":2,"img":"img/q201.jpg"},{"id":202,"q":"Nos locais onde é proibido, a inversão do sentido de marcha:","o":["É contravenção punida com a multa de 1.000,00 Mt.","É contravenção punida com a multa de 500,00 Mt.","É contravenção punida com a multa de 2.000,00 Mt.","Não é considerada contravenção."],"c":0,"img":"img/q202.jpg"},{"id":203,"q":"Para conduzir com segurança, deve moderar especialmente a velocidade...","o":["só nas pontes, túneis e passagens de nível.","nos cruzamentos e entroncamentos nos que tenha prioridade de passagem.","nas curvas, lombas e outros locais de visibilidade reduzida.","nos locais assinalados com sinais de obrigação."],"c":2,"img":"img/q203.jpg"},{"id":204,"q":"Na condução nocturna, os hábitos do condutor aumentam ou não a fadiga?","o":["Factores como alimentação, seu tipo, quantidade e frequência não acentuam a fadiga.","Sim, factores como alimentação, seu tipo, quantidade e frequência.","Apenas a ingestão de bebidas alcoólicas acentuam a fadiga.","Os hábitos do condutor não aumentam a fadiga."],"c":1,"img":"img/q204.jpg"},{"id":205,"q":"A definição de berma é:","o":["Superfície de via pública especialmente destinada ao trânsito de veículos e que ladeia a faixa de rodagem;","Superfície de via pública não especialmente destinada ao trânsito de veículos e que ladeia a faixa de rodagem;","Superfície de via pública destinada ao trânsito de veículos e que ladeia a faixa de rodagem;","Superfície de via pública não especialmente destinada ao trânsito de automóveis e que ladeia a faixa de rodagem;"],"c":1,"img":"img/q205.jpg"},{"id":206,"q":"Quando os pneus têm uma pressão incorrecta:","o":["Desgastam-se mais e correm maior risco de rebentar.","Desgastam-se menos e têm menos risco de rebentar.","Consome-se menos combustível.","Melhora a estabilidade do veículo e o seu conforto."],"c":0,"img":"img/q206.jpg"},{"id":207,"q":"O uso do capacete para proteger a cabeça...","o":["é recomendável para os condutores e passageiros de motociclos, mas não é obrigatório.","é obrigatório para os condutores e passageiros de motociclos e ciclomotores.","só é obrigatório para os condutores e passageiros de motociclos.","não é eficaz em caso de acidente."],"c":1,"img":"img/q207.jpg"},{"id":208,"q":"Qual é a validade que tem a carta de condução da categoria B?","o":["Cinco anos.","Dois anos.","Três anos.","Dez anos."],"c":0,"img":"img/q208.jpg"},{"id":209,"q":"A recolha da informação é influenciada pela fadiga?","o":["Não.","Sim, mas apenas em condução urbana.","Sim, assim como influencia toda a tarefa da condução.","Não, a menos que o condutor esteja muito cansado."],"c":2,"img":"img/q209.jpg"},{"id":210,"q":"Factores de risco serão:","o":["Todos os elementos exteriores a um veículo que possam provocar riscos na pintura.","Todas as marcas rodoviárias que contenham riscos.","Todos os factores que aumentem o risco de acidente.","Todos os factores externos ao condutor."],"c":2,"img":"img/q210.jpg"},{"id":211,"q":"Sempre que no mesmo sentido sejam possíveis duas ou mais filas de trânsito:","o":["O condutor deve circular pela via de trânsito mais à direita, podendo utilizar-se outra se não houver lugar naquela, e para ultrapassar ou mudar de direcção.","O condutor deve circular pela via de trânsito mais à esquerda, podendo utilizar-se outra se não houver lugar naquela, e para ultrapassar ou mudar de direcção.","O condutor deve circular pela via de trânsito mais à esquerda, podendo utilizar-se outra se não houver lugar naquela, e para estacionar.","O condutor deve circular pela via de trânsito mais à direita, podendo utilizar-se outra, para ultrapassar ou mudar de direcção."],"c":1,"img":"img/q211.jpg"},{"id":212,"q":"O que indica o sinal?","o":["Área reservada para autocarros e autocarros médios.","Parque de estacionamento para autocarros e autocarros médios.","Faixa reservada para qualquer tipo de autocarro do lado esquerdo."],"c":0,"img":"img/q212.jpg"},{"id":213,"q":"Pode conduzir um automóvel ligeiro com reboque com a carta de condução da categoria B?","o":["Sim, desde que o peso bruto do reboque não exceda 750 kg.","Não, é necessária a da categoria C1E.","Sim, desde que o peso bruto do reboque não exceda 3500 kg.","Não, é necessária a da categoria G."],"c":0,"img":"img/q213.jpg"},{"id":214,"q":"O facto de conduzir de noite, deve ter influência na velocidade a que segue?","o":["Não, porque a utilização de luzes é obrigatória.","Sim, mas apenas dentro das localidades.","Sim.","Não, se conheço bem a estrada."],"c":2,"img":"img/q214.jpg"},{"id":215,"q":"Exploração perceptiva é:","o":["Procedimentos do condutor para manter a trajectória do veículo controlada.","Procedimentos do condutor, para recolher do ambiente rodoviário, as informações importantes para a tarefa de condução.","Procedimentos do condutor para realizar manobras mais rapidamente."],"c":1,"img":"img/q215.jpg"},{"id":216,"q":"Como deve ser feita a carga e descarga de um veículo na via pública?","o":["Sempre pela retaguarda.","Sempre pela direita.","Pela retaguarda ou pelo lado da faixa de rodagem junto da qual o veículo esteja parado ou estacionado."],"c":2,"img":"img/q216.jpg"},{"id":217,"q":"Se estacionar o veículo na faixa de rodagem desde anoitecer até ao amanhecer, deve utilizar alguma luz?","o":["Não, mesmo que seja num local sem iluminação.","Sim, as de presença (mínimos), se a iluminação não permite reconhecer o veículo a 100 metros.","Sim, as de estrada (máximos).","Sim, as de cruzamento (médios), se a iluminação não permite reconhecer o veículo a 100 metros."],"c":1,"img":"img/q217.jpg"},{"id":218,"q":"Na via pública, a carga e descarga de um veículo deve ser feita:","o":["Sempre pela direita.","Sempre pela retaguarda.","Pela retaguarda ou pelo lado permitido para a paragem do veículo.","Sempre pela esquerda ."],"c":2,"img":"img/q218.jpg"},{"id":219,"q":"Que entende-se por consciência moral?","o":["A capacidade de o indivíduo interpretar os sinais de trânsito.","A faculdade de a pessoa distinguir entre o bem e o mal, de julgar os seus actos e de adoptar uma determinada forma de conduta.","A faculdade de permitir a passagem dos peões na mudança de direcção para a esquerda."],"c":1,"img":"img/q219.jpg"},{"id":220,"q":"Os sinais sonoros:","o":["Não podem ser afinados ou reparados na via pública.","Podem ser afinados ou reparados na via pública.","Podem ser afinados ou reparados na via pública só durante a noite.","Podem ser afinados ou reparados na via pública só durante o dia."],"c":0,"img":"img/q220.jpg"},{"id":221,"q":"O significado deste sinal é:","o":["Descida de inclinação acentuada.","Subida de inclinação acentuada.","Descida de inclinação acentuada para camiões.","Subida de inclinação acentuada para camiões."],"c":1,"img":"img/q221.jpg"},{"id":222,"q":"Que indica o sinal?","o":["Pavimento escorregadio.","Visibilidade reduzida.","Inicio de estrada alcatroada."],"c":1,"img":"img/q222.jpg"},{"id":223,"q":"O que indica o sinal?","o":["Descida de inclinação acentuada.","Entroncamento obliquo à direita.","Descida de inclinação acentuada ao longo da distância indicada."],"c":2,"img":"img/q223.jpg"},{"id":224,"q":"As pessoas que são encontradas a conduzir sem possuir carta de condução:","o":["São punidas com pena de prisão de três dias a seis meses e multa de 5000 Mt.","São punidas apenas com uma multa de 500 Mt.","São punidas com pena de prisão de um a três dias e multa de 5000 Mt.","Não podem ser punidas."],"c":0,"img":"img/q224.jpg"},{"id":225,"q":"Um dos elementos de segurança é a almofada de ar (airbag)?","o":["Não.","Sim, de segurança passiva.","Sim, de segurança activa."],"c":1,"img":"img/q225.jpg"},{"id":226,"q":"O condutor selecciona o acto motor a realizar em que momento?","o":["Quando recolhe a informação.","Quando trata a informação.","Quando age sobre o veículo.","Quando detecta um perigo."],"c":2,"img":"img/q226.jpg"},{"id":227,"q":"As luzes de máximos, com nevoeiro (cacimba):","o":["Devem obrigatoriamente ser usadas.","Devem ser evitadas, em especial à noite.","Só devem ser usados à noite.","Só devem ser usados de dia."],"c":1,"img":"img/q227.jpg"},{"id":228,"q":"Se o condutor consome álcool, em que momento aumenta o risco de acidente?","o":["Antes de superar o limite legal permitido.","Depois de superar o limite legal permitido.","Só quando o consome com substâncias psicotrópicas.","Só quando é tomado com medicamentos."],"c":0,"img":"img/q228.jpg"},{"id":229,"q":"Qual é a velocidade instantânea que não devem exceder os automóveis ligeiros de passageiros e mistos dentro das localidades?","o":["50 km/h, se tem reboque.","60 km/h.","40 Km/h.","70 km/h."],"c":1,"img":"img/q229.jpg"},{"id":230,"q":"A definição de estacionamento é:","o":["Imobilização de um veículo que constitua paragem e que seja motivada por circunstâncias próprias da circulação.","Imobilização de um veículo que não constitua paragem e que seja motivada por circunstâncias próprias da circulação.","Imobilização de um veículo que não constitua paragem e que não seja motivada por circunstâncias próprias da circulação.","Imobilização de um veículo que constitua paragem e que seja motivada por circunstâncias de excesso de tráfego."],"c":2,"img":"img/q230.jpg"},{"id":231,"q":"Os condutores não podem exceder as seguintes velocidades instantâneas (em quilómetros/hora):","o":["Automóveis ligeiros de mercadorias com reboque dentro das localidades 60, fora das localidades 80.","Automóveis ligeiros de mercadorias com reboque dentro das localidades 50, fora das localidades 90.","Automóveis ligeiros de mercadorias com reboque dentro das localidades 60, fora das localidades 100.","Automóveis ligeiros de mercadorias com reboque dentro das localidades 40, fora das localidades 90."],"c":2,"img":"img/q231.jpg"},{"id":232,"q":"Como o álcool afecta tarefa de conduzir?","o":["Reduz o campo de visão do condutor.","Aumenta a atenção do condutor, assim que as distracções são reduzidas.","Melhora a apreciação das velocidades.","Melhora a apreciação das distâncias."],"c":0,"img":"img/q232.jpg"},{"id":233,"q":"A paragem e o estacionamento devem fazer-se, fora das localidades:","o":["Nas faixas de rodagem ou, não sendo isso possível, o mais próximo possível da margem esquerda, paralelamente a esta e no mesmo sentido da marcha.","Fora das faixas de rodagem ou, não sendo isso possível, o mais próximo possível da margem direita, paralelamente a esta e no sentido da marcha.","Fora das faixas de rodagem ou, não sendo isso possível, o mais próximo possível da margem esquerda, paralelamente a esta e no mesmo sentido da marcha.","Fora das faixas de rodagem ou, não sendo isso possível, o mais próximo possível da respectiva margem esquerda, paralelamente a esta e no sentido contrário ao da marcha."],"c":2,"img":"img/q233.jpg"},{"id":234,"q":"A definição de auto-estrada é:","o":["Via pública destinada a trânsito lento, com separação física de faixas de rodagem, sem cruzamentos de nível nem acesso a propriedades marginais, com acessos condicionados e sinalizada como tal.","Via pública destinada a trânsito rápido, sem separação física de faixas de rodagem, sem cruzamentos de nível nem acesso a propriedades marginais, com acessos condicionados e sinalizada como tal.","Via pública destinada a trânsito rápido, com separação física de faixas de rodagem, sem cruzamentos de nível nem acesso a propriedades marginais, com acessos condicionados e sinalizada como tal.","Via pública destinada a trânsito rápido, com separação física de faixas de rodagem, com cruzamentos de nível e com acesso a propriedades marginais, com acessos condicionados e sinalizada como tal."],"c":2,"img":"img/q234.jpg"},{"id":235,"q":"Ao ligar as luzes, se no painel aparecer o símbolo do farol, com a cor azul, indica que:","o":["Estão ligadas as luzes de estrada (máximos).","Estão ligadas as luzes de cruzamento (médios).","Estão ligadas as luzes de presença."],"c":0,"img":"img/q235.jpg"},{"id":236,"q":"Quando existe dificuldade na recolha de informação, a velocidade:","o":["Deve aumentar.","Deve diminuir.","Deve manter-se, desde que as luzes do veículo estejam ligadas."],"c":1,"img":"img/q236.jpg"},{"id":237,"q":"Para que aconteçam graves acidentes de trânsito, a fadiga é um dos factores que mais contribuem, sobretudo:","o":["Durante a manhã.","Durante a noite.","Durante a tarde.","Entre as 15 e as 17 horas."],"c":1,"img":"img/q237.jpg"},{"id":238,"q":"Nesta situação, posso ultrapassar?","o":["Não.","Sim, mas só aos veículos que mudam de direcção para a direita.","Sim, já que tenho prioridade no cruzamento.","Sim, mas só aos veículos de duas rodas."],"c":2,"img":"img/q238.jpg"},{"id":239,"q":"O condutor dum ciclomotor, pode levar o capacete mal ajustado e apertado?","o":["Não, porque não garante uma protecção eficaz em caso de acidente.","Sim, sempre que seja um modelo aprovado oficialmente.","Sim, ainda seja um modelo não aprovado oficialmente.","Sim, já que não é obrigatório para os condutores de ciclomotores."],"c":0,"img":"img/q239.jpg"},{"id":240,"q":"O sinal, quando proíbe a inversão do sentido de marcha?","o":["De dia.","De noite.","Nos dias de chuva."],"c":1,"img":"img/q240.jpg"},{"id":241,"q":"O que indica o sinal?","o":["Via de sentido único.","Via de sentido único para a esquerda.","Via de sentido único para a direita."],"c":2,"img":"img/q241.jpg"},{"id":242,"q":"O significado deste sinal é:","o":["Área reservada para veículos de dimensões normais.","Área reservada para veículos de dimensões anormais.","Área reservada para veículos de pesos anormais.","Área reservada para veículos de comprimentos anormais."],"c":1,"img":"img/q242.jpg"},{"id":243,"q":"Pode ter consequências num acidente o facto de não levar o cinto de segurança bem colocado?","o":["Não, se o veículo estiver equipado com airbag.","Não, o cinto é sempre eficaz.","Sim, porque pode provocar ferimentos graves.","Sim, por isso o seu uso não é obrigatório."],"c":2,"img":"img/q243.jpg"},{"id":244,"q":"Qual é a hierarquia entre as prescrições resultantes da sinalização?","o":["Prescrições resultantes dos sinais verticais e prescrições resultantes de sinalização temporária que modifique o regime normal de utilização da via.","Prescrições resultantes das marcas rodoviárias e prescrições resultantes dos sinais verticais.","Prescrições resultantes de sinalização temporária que modifique o regime normal de utilização da via e prescrições resultantes dos sinais luminosos.","Prescrições resultantes das marcas rodoviárias e prescrições resultantes de sinalização temporária que modifique o regime normal de utilização da via."],"c":2,"img":"img/q244.jpg"},{"id":245,"q":"O significado deste sinal é:","o":["Área reservada para autocarros de excursão;","Área reservada para autocarros de transporte escolar.","Área reservada para veículos de passeio.","Área reservada para autocarros de turismo."],"c":0,"img":"img/q245.jpg"},{"id":246,"q":"Em especial à noite, com nevoeiro (cacimba), as luzes de estrada:","o":["Devem ser usadas porque permitem uma maior visibilidade a maior distância.","Devem ser evitadas porque permitem uma maior visibilidade a maior distância.","Devem ser evitadas porque reflectem-se no nevoeiro impedindo a visibilidade a maior distância.","São as mais aconselháveis para garantir alguma visibilidade."],"c":2,"img":"img/q246.jpg"},{"id":247,"q":"Em condições de nevoeiro (cacimba), a velocidade segura a que circula:","o":["Deve ser a velocidade indicada pela sinalização vertical.","Deve permitir que o condutor, consiga parar no espaço livre e visível.","Deve ser uma velocidade muito lenta.","Deve ser inferior a 40 Km/h."],"c":1,"img":"img/q247.jpg"},{"id":248,"q":"A luz indicadora de mudança de direcção à direita accionada ao iniciar uma ultrapassagem, só deve ser desligada...","o":["quando termine de mudar de via de trânsito.","uma vez finalizada a ultrapassagem.","antes de mudar de via de trânsito.","só depois de percorrer uma distância de 500 metros."],"c":0,"img":"img/q248.jpg"},{"id":249,"q":"Quais são os princípios gerais do socorrismo?","o":["Prevenir, alertar e socorrer.","Prevenir, socorrer e evacuar.","Prevenir, observar e socorrer."],"c":0,"img":"img/q249.jpg"},{"id":250,"q":"Num acidente há feridos muito graves. Que deve fazer se não sabe como os ajudar?","o":["Abandonar o local e não fazer nada.","Não lhes tocar e ligar ao 112.","Retirar rapidamente os feridos do veículo e levá-los para o hospital mais próximo."],"c":1,"img":"img/q250.jpg"},{"id":251,"q":"A definição de passeio é:","o":["Parte que ladeia a faixa de rodagem, destinada exclusivamente ao trânsito de veículos.","Parte que ladeia a faixa de rodagem, destinada ao estacionamento de veículos.","Parte que ladeia a faixa de rodagem, destinada exclusivamente ao trânsito de peões.","Parte da faixa de rodagem, destinada exclusivamente ao trânsito de peões."],"c":2,"img":"img/q251.jpg"},{"id":252,"q":"Que entende-se por dever?","o":["A obrigação de avançar rapidamente, logo que o sinal verde do semáforo assim o permita.","A intenção de iniciar a marcha sem a devida sinalização.","A obrigação moral de proceder de acordo com as normas e a consciência."],"c":2,"img":"img/q252.jpg"},{"id":253,"q":"Os sistemas de segurança passiva dos veículos, têm a função de:","o":["Evitar os acidentes.","Evitar ou reduzir as lesões que podem ocorrer no caso de sofrer um acidente.","Transmitir uma sensação de segurança quando se circula a velocidades elevadas."],"c":1,"img":"img/q253.jpg"},{"id":254,"q":"O que indica o sinal?","o":["Área reservada para miniautocarros.","Área reservada para veículos de emergência.","Área reservada para veículos com dimensões anormais."],"c":1,"img":"img/q254.jpg"},{"id":255,"q":"A sonolência provocada pela fadiga provoca o aumento:","o":["Da distância de travagem.","Do tempo de reacção e não da distância de paragem.","Do tempo de reacção e da distância de paragem."],"c":2,"img":"img/q255.jpg"},{"id":256,"q":"Para combater a fadiga e o sono, o melhor remédio é:","o":["Parar de conduzir, descansar e, se necessário, dormir um pouco.","Conduzir com o banco inclinado para trás.","Fechar todas as janelas.","Tomar uma bebida com álcool."],"c":0,"img":"img/q256.jpg"},{"id":257,"q":"Entende-se por tarefa de condução aquela que tem como principal objectivo:","o":["O controlo de um veículo e do espaço envolvente.","O controlo do trânsito e dos sinais dos outros condutores.","O autocontrolo no trânsito."],"c":0,"img":"img/q257.jpg"},{"id":258,"q":"O significado deste sinal é:","o":["Controlo de tráfego adiante","Controlo de tráfego com obrigatoriedade de parar.","Controlo de tráfego a 100 metros.","Controlo de tráfego a 50 metros."],"c":0,"img":"img/q258.jpg"},{"id":259,"q":"O significado deste sinal é:","o":["Parque de estacionamento para veículos pesados que transportam substâncias perigosas.","Parque de estacionamento para veículos que transportam substâncias perigosas.","Parque de estacionamento para veículos que transportam substâncias não autorizadas.","Parque de estacionamento para veículos que transportam material militar."],"c":1,"img":"img/q259.jpg"},{"id":260,"q":"Com o fim de ter a uma boa capacidade de manobra e garantir o bom funcionamento dos sistemas de segurança do veículo, o condutor deve regular o assento...","o":["por forma a ficar muito próximo do volante, com as pernas e braços encolhidos.","por forma a ficar longe do volante, com as pernas e braços esticados.","por forma a que as pernas e braços fiquem ligeiramente fletidos."],"c":2,"img":"img/q260.jpg"},{"id":261,"q":"O significado deste sinal é:","o":["Convergência de filas à direita.","Fim da fila à direita.","Convergência de filas à esquerda.","Fim da fila à esquerda."],"c":1,"img":"img/q261.jpg"},{"id":262,"q":"A linha transversal descontínua, é uma:","o":["Linha de paragem obrigatória.","Linha descontinua de aviso.","Linha de cedência de prioridade."],"c":2,"img":"img/q262.jpg"},{"id":263,"q":"Nesta situação, se não for possível efectuar o cruzamento com segurança, como deve proceder o condutor?","o":["Acelerar para passar antes do veículo que circula em sentido contrário.","Reduzir a velocidade ou parar, de modo a dar a passagem ao outro veículo.","Nada, porque eu tenho prioridade de passagem.","Utilizar os sinais sonoros para que o outro condutor pare."],"c":1,"img":"img/q263.jpg"},{"id":264,"q":"Que deve fazer o condutor perante a marca rodoviária de cor branca?","o":["Pisar ou transpor a linha.","Abrandar a marcha.","Circular à sua esquerda, quando a linha fizer a separação de sentidos de trânsito."],"c":2,"img":"img/q264.jpg"},{"id":265,"q":"As ordens dos agentes reguladores do trânsito, prevalecem sobre os sinais luminosos:","o":["Verdes.","De qualquer cor.","Amarelos.","Vermelho."],"c":1,"img":"img/q265.jpg"},{"id":266,"q":"O significado deste sinal é:","o":["Parque de estacionamento para veículos do Governo.","Parque de estacionamento para veículos do Ministério.","Parque de estacionamento para veículos da Polícia.","Parque de estacionamento para veículos do Parlamento."],"c":2,"img":"img/q266.jpg"},{"id":267,"q":"Os sinais sonoros devem ser:","o":["Longos, usados de forma moderada e em caso algum devem servir de meio de protesto contra interrupções do trânsito ou como meios de chamamento.","Breves, usados de forma moderada e podem servir de meio de protesto contra interrupções do trânsito ou como meios de chamamento.","Breves, usados de forma moderada e em caso algum devem servir de meio de protesto contra interrupções do trânsito ou como meios de chamamento.","Longos e insistentes, usados como forma de protesto contra interrupções do trânsito ou como meios de chamamento."],"c":2,"img":"img/q267.jpg"},{"id":268,"q":"Para ter mais segurança, os peões devem...","o":["transitar sempre do lado esquerdo da faixa de rodagem, em relação ao seu sentido de marcha.","transitar pelo lado direito, em relação ao seu sentido de marcha, a não ser que tal comprometa a sua segurança.","fazer o atravessamento da faixa de rodagem o mais lentamente possível."],"c":1,"img":"img/q268.jpg"},{"id":269,"q":"Ao ligar as luzes, se no painel aparecer o símbolo do farol de cor verde, significa que estão ligadas:","o":["As luzes de estrada (máximos).","As luzes de cruzamento (médios).","As luzes mínimas."],"c":1,"img":"img/q269.jpg"},{"id":270,"q":"Se os ocupantes do veículo não utilizarem o cinto de segurança, o airbag é eficaz?","o":["Não e pode causar lesões graves.","Sim, o airbag é sempre eficaz.","Sim, sempre que os passageiros estejam sentados correctamente.","Sim, mas apenas para o condutor."],"c":0,"img":"img/q270.jpg"},{"id":271,"q":"Só pode ser ordenada a suspensão do trânsito por:","o":["Ser feriado e haver festejos.","Motivos de segurança, de emergência grave ou de obras, ou com o fim de promover produtos e marcas de automóveis.","Motivos de segurança, de emergência grave ou de obras, ou com o fim de realizar a conservação dos pavimentos, instalações e obras de arte.","Ser fim de semana."],"c":2,"img":"img/q271.jpg"},{"id":272,"q":"A que grupo pertence o sinal triângular?","o":["Sinais temporários de perigo.","Sinais temporários de obrigação.","Sinais temporários de proibição."],"c":0,"img":"img/q272.jpg"},{"id":273,"q":"Em situações de chuva forte:","o":["Aumenta a probabilidade de aquaplanagem (hidroplanagem).","Reduz a probabilidade de aquaplanagem (hidroplanagem).","Reduz a probabilidade de aquaplanagem (hidroplanagem), sobretudo a velocidade moderada."],"c":0,"img":"img/q273.jpg"},{"id":274,"q":"Os peões podem transitar pela faixa de rodagem nesta estrada?","o":["Não, nesta estrada não podem transitar, já que não tem bermas.","Sim, com prudência e por forma a não prejudicar o trânsito de veículos.","Sim e devem fazê-lo pela esquerda da faixa de rodagem, em relação ao seu sentido de marcha.","Sim, mais só quando necessitem atravessar."],"c":1,"img":"img/q274.jpg"},{"id":275,"q":"Os condutores não podem exceder as seguintes velocidades instantâneas (em quilómetros/hora):","o":["Automóveis ligeiros de passageiros e mistos sem reboque dentro das localidades 60, fora das localidades 120.","Automóveis ligeiros de passageiros e mistos sem reboque dentro das localidades 50, fora das localidades 120.","Automóveis ligeiros de passageiros e mistos sem reboque dentro das localidades 60, fora das localidades 100.","Automóveis ligeiros de passageiros e mistos sem reboque dentro das localidades 50, fora das localidades 100."],"c":0,"img":"img/q275.jpg"},{"id":276,"q":"É necessário verificar o nível do líquido de travão com frequência?","o":["Sim e deve ser substituído dentro do período indicado pelo fabricante.","Sim, mas não precisa de ser substituído.","Não, porque não se desgasta com o uso.","Sim, para juntar óleo do motor em caso de necessidade."],"c":0,"img":"img/q276.jpg"},{"id":277,"q":"Para os condutores de transporte de serviço público ou de carga perigosa, quando em exercício, a taxa de álcool deve ser de:","o":["0.3 mg/l.","0.0 mg/l.","0.6 mg/l."],"c":1,"img":"img/q277.jpg"},{"id":278,"q":"O que indica o sinal?","o":["A presença de máquinas na via.","Passagem de nível.","Passagem de um veículo automóvel de cada vez."],"c":1,"img":"img/q278.jpg"},{"id":279,"q":"A distância de reacção é influenciada:","o":["Pelo tempo dividido pela velocidade.","Pelo somatório do tempo mais a velocidade.","Principalmente de factores externos ao condutor.","Pelo tempo multiplicado pela velocidade."],"c":3,"img":"img/q279.jpg"},{"id":280,"q":"Quando existe um forte vento lateral corremos o perigo de sermos desviados da nossa trajectória. Nestas circunstâncias a melhor solução é:","o":["Circular ao lado de um veículo pesado, se for possível.","Acelerar mais para vencer a força do vento.","Moderar a velocidade e ajustar-nos às circunstâncias.","Parar o veículo e aguardar até que o vento passe."],"c":2,"img":"img/q280.jpg"},{"id":281,"q":"A definição de lotação é:","o":["Número de passageiros que o veículo pode transportar, não incluindo o condutor.","Número de lugares que o veículo tem, incluindo o condutor.","Número de passageiros que o veículo consiga transportar, incluindo o condutor.","Número de lugares que o veículo tem, não incluindo o condutor."],"c":1,"img":"img/q281.jpg"},{"id":282,"q":"O agente regulador de trânsito que aparece na fotografia, manda:","o":["Avançar o tráfego que venha da esquerda.","Parar o tráfego que venha da direita.","Avançar o tráfego que venha da direita."],"c":2,"img":"img/q282.jpg"},{"id":283,"q":"Em cada situação, a decisão que tomo:","o":["Depende exclusivamente da sinalização que encontro no local.","É consequência unicamente da intensidade do trânsito.","Não é influenciada pelo estado físico em que me encontro.","É sempre influenciada pela previsão que faço."],"c":3,"img":"img/q283.jpg"},{"id":284,"q":"É permitido que uma criança de 6 anos viaje no banco da frente de um automóvel?","o":["Não, em nenhum caso.","Sim, se não tiver bancos ou cintos de segurança na retaguarda.","Sim, mesmo que não utilize cinto de segurança.","Sim, sempre que utilize o cinto de segurança."],"c":1,"img":"img/q284.jpg"},{"id":285,"q":"A distância de segurança, é um factor a considerar:","o":["Apenas em condução urbana, devido à intensidade do trânsito.","Nas estradas rurais pela diminuição dos limites de velocidade.","Em qualquer situação."],"c":2,"img":"img/q285.jpg"},{"id":286,"q":"Conduzir sob influência de álcool, sob efeitos de substâncias legalmente consideradas como estupefacientes ou psicotrópicas, constitui contravenção:","o":["Leve.","Média.","Grave."],"c":2,"img":"img/q286.jpg"},{"id":287,"q":"O significado deste sinal é:","o":["Parque de estacionamento para automóveis pesados de passageiros de peso total superior a 10 Toneladas.","Parque de estacionamento para automóveis pesados de mercadorias de peso total superior a 10 Kilos.","Parque de estacionamento para automóveis pesados de mercadorias de peso total superior a 10 Toneladas.","Parque de estacionamento para todos os automóveis de peso total superior a 10 toneladas."],"c":2,"img":"img/q287.jpg"},{"id":288,"q":"O significado deste sinal é:","o":["Sinalização luminosa e de passagem de nível.","Sinalização luminosa em manutenção.","Sinalização luminosa inexistente.","Sinalização luminosa e de passagem de nível com uma via."],"c":1,"img":"img/q288.jpg"},{"id":289,"q":"A correcta exploração visual permite:","o":["Conduzir com maior velocidade.","Que o condutor tenha em sua posse a informação necessária para tomar as decisões adequadas e agir correctamente.","Só é importante dentro das localidades para ver os peões que se propõem a at
