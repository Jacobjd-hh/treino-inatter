":"A marcha atrás, e uma manobra que deve ser efectuada...","o":["o mais à direita possível, em local de boa visibilidade.","o mais rapidamente possível, em local onde não prejudique o trânsito.","lentamente e o mais possível à esquerda.","rapidamente e no menor trajecto possível."],"c":2,"img":"img/q167.jpg","e":"A marcha atrás faz-se devagar, porque se vê pior. Como se circula pela esquerda, deve ser feita o mais possível à esquerda, junto à berma."},{"id":168,"q":"O que deve fazer o condutor se a fila da esquerda estiver a circular mais rapidamente?","o":["Manter-se na fila de trânsito em que se encontra.","Mudar de fila de trânsito.","Sinalizar e mudar de fila de trânsito."],"c":0,"img":"img/q168.jpg","e":"Mudar de fila só porque a outra anda mais depressa aumenta o risco e quase nunca faz ganhar tempo. Deve manter-se na sua fila."},{"id":169,"q":"O condutor de veículo utilizado no transporte colectivo de passageiros, só pode parar nas faixas de rodagem para:","o":["Carregar e descarregar mercadorias, só durante o dia.","Carregar e descarregar mercadorias, só durante a noite.","A entrada e saída de passageiros nos locais especialmente destinados a esse fim.","A entrada e saída de passageiros, em qualquer lugar que lhe de mais jeito."],"c":2,"img":"img/q169.jpg","e":"Os veículos de transporte colectivo só podem parar na faixa de rodagem para entrada e saída de passageiros, nos locais próprios (paragens)."},{"id":170,"q":"O que é a força centrífuga?","o":["É a força aparente que “empurra” os veículos para o interior das curvas;","É a força aparente que “empurra” os veículos para o exterior das curvas","É a força aparente que trava os veículos nas curvas","Uma força que só ocorre quando o veículo vai em linha recta."],"c":1,"img":"img/q170.jpg","e":"A força centrífuga empurra o veículo para fora da curva. Quanto maior a velocidade, mais forte é, e por isso se deve abrandar antes da curva."},{"id":171,"q":"Nas pontes, túneis e passagens de nível:","o":["Os animais atrelados ou não, devem seguir a passo.","Os animais só quando estiverem atrelados, devem seguir a passo.","Os animais quando não atrelados, devem seguir a passo de corrida.","Os animais atrelados ou não, devem seguir a passo de corrida."],"c":0,"img":"img/q171.jpg","e":"Nas pontes, túneis e passagens de nível, os animais, atrelados ou não, devem seguir a passo, sem correr, para não perderem o controlo."},{"id":172,"q":"Se conduz muito tempo sem descansar...","o":["aumenta a atenção do condutor.","a condução torna-se perigosa.","aumenta a segurança.","o condutor relaxa-se e conduz melhor."],"c":1,"img":"img/q172.jpg","e":"Conduzir muito tempo seguido provoca fadiga e sono, o que torna a condução perigosa. Deve parar para descansar com regularidade."},{"id":173,"q":"O que indica o sinal?","o":["Trânsito proibido ao conjunto de veículos de mercadorias, de peso total superior a 10t.","Trânsito proibido a veículos de peso por eixo superior a 10t.","Trânsito proibido a veículos de peso por eixo múltiplo superior a 10t."],"c":2,"img":"img/q173.jpg","e":"O sinal proíbe a passagem a veículos com peso por eixo múltiplo (eixos duplos ou triplos) superior a 10 toneladas, para proteger pontes e pavimentos."},{"id":174,"q":"Depois de ter tomado bebidas alcoólicas:","o":["O álcool entra rapidamente no sistema circulatório.","O álcool entra directamente no sistema urinário.","O álcool demora duas horas a entrar no sistema circulatório."],"c":0,"img":"img/q174.jpg","e":"O álcool passa rapidamente do estômago e intestino para o sangue, e começa a fazer efeito pouco depois de beber."},{"id":175,"q":"Que indica o sinal?","o":["Terreno falso à direita.","Cruzamento facilmente congestionável.","Congestionamento de tráfego."],"c":2,"img":"img/q175.jpg","e":"O sinal de perigo com veículos em fila avisa congestionamento de tráfego."},{"id":176,"q":"O sinal, pertence ao grupo de sinais de:","o":["Pré-sinalização e de direcção.","Direcção.","Direcção para auto-estradas."],"c":2,"img":"img/q176.jpg","e":"Segundo a resposta oficial do exame, este sinal pertence ao grupo dos sinais de direcção para auto-estradas: indica os destinos e a distância até à saída."},{"id":177,"q":"A definição de tractor é:","o":["Veículo a motor exclusivamente construído para desenvolver esforço de tracção, sem comportar carga útil.","Veículo automóvel exclusivamente construído para desenvolver esforço de tracção, sem comportar carga útil.","Veículo automóvel exclusivamente construído para desenvolver esforço de tracção, comportando carga útil.","Veículo automóvel exclusivamente construído para desenvolver esforço do motor, comportando alguma carga."],"c":1,"img":"img/q177.jpg","e":"Tractor é um veículo automóvel construído só para puxar (fazer força de tracção) e que não leva carga útil."},{"id":178,"q":"A condução em dias de chuva provoca um aumento do risco de acidente, por causa de factores como:","o":["Menor visibilidade, menor aderência e maior stress físico.","Maior tempo de reacção e menor tempo de paragem.","Piso mais escorregadio e menor distância de paragem.","Diminuição do tempo de reacção por falta de visibilidade."],"c":0,"img":"img/q178.jpg","e":"Com chuva vê-se pior, os pneus agarram menos ao piso e o condutor fica mais cansado e tenso. Tudo isto aumenta o risco."},{"id":179,"q":"Como deve actuar o condutor quando tem que fazer uma curva?","o":["Reduzir a velocidade, já dentro da curva.","Aumentar a velocidade, antes de entrar na curva.","Adaptar a velocidade, antes de entrar na curva.","Pressionar o pedal de embraiagem e não acelerar dentro da curva."],"c":2,"img":"img/q179.jpg","e":"A velocidade deve ser ajustada antes de entrar na curva. Travar dentro da curva pode desequilibrar o carro."},{"id":180,"q":"O sinal indica:","o":["Existência de controlo de tráfego adiante.","Controlo policial por pirilampos.","Congestionamento do tráfego."],"c":1,"img":"img/q180.jpg","e":"O sinal indica controlo policial por pirilampos (luzes azuis intermitentes): há polícia à frente a fiscalizar o trânsito."},{"id":181,"q":"Os automóveis classificam-se em:","o":["Ligeiros e Pesados.","Ligeiros, Pesados e Motociclos.","Motociclos, Ciclomotores, Triciclos, Quadriciclos, ligeiros e Pesados.","Ligeiros, Pesados e Mistos."],"c":0,"img":"img/q181.jpg","e":"Os automóveis classificam-se em ligeiros e pesados. Motociclos e ciclomotores não são automóveis."},{"id":182,"q":"É aconselhável viajar à noite para evitar a fadiga?","o":["Não, porque o sono aparece mais facilmente.","Sim, se a viagem é longa.","Sim, porque há menos tráfego.","Sim, viajar durante a noite é sempre mais seguro."],"c":0,"img":"img/q182.jpg","e":"À noite o corpo tem mais tendência para dormir, por isso a fadiga e o sono aparecem mais facilmente. Não é aconselhável."},{"id":183,"q":"O que indica o sinal de informação?","o":["Area reservada para automóveis ligeiros.","Área reservada para táxis.","Parque de estacionamento para automóveis ligeiros de passageiros."],"c":0,"img":"img/q183.jpg","e":"O sinal de informação indica uma área reservada a automóveis ligeiros."},{"id":184,"q":"Deve utilizar-se as luzes de perigo...","o":["ao estacionar em segunda fila.","para avisar os outros utentes que o veículo vai fazer marcha atrás.","em caso de imobilização por acidente ou avaria, se origina perigo para os demais utentes da via.","apenas quando o veículo esteja a ser rebocado."],"c":2,"img":"img/q184.jpg","e":"As luzes de perigo (4 piscas) usam-se quando o veículo fica imobilizado por acidente ou avaria e isso cria perigo para os outros."},{"id":185,"q":"O que indica a marca rodoviária branca?","o":["Indica a existência de bandas sonoras.","Indica a redução de filas de trânsito.","Indica a existência de lombas."],"c":2,"img":"img/q185.jpg","e":"As marcas brancas em forma de triângulos ou dentes na via avisam a existência de uma lomba."},{"id":186,"q":"Atirar do veículo ou abandonar na via objectos ou substâncias, constitui contravenção:","o":["Leve.","Grave.","Média."],"c":2,"img":"img/q186.jpg","e":"Atirar ou abandonar objectos ou substâncias na via é contravenção média."},{"id":187,"q":"Entende-se por visibilidade reduzida ou insuficiente, quando o condutor não possa avistar a faixa de rodagem em toda a sua largura numa extensão de:","o":["Pelo menos, 50 metros.","Pelo menos, 200 metros.","Pelo menos, 100 metros.","Pelo menos, 25 metros."],"c":0,"img":"img/q187.jpg","e":"Há visibilidade reduzida quando o condutor não consegue ver a faixa de rodagem em toda a largura numa extensão de pelo menos 50 metros."},{"id":188,"q":"O que indica o sinal?","o":["Sentido proibido.","Trânsito proibido.","Trânsito proibido a automóveis ligeiros de passageiros."],"c":1,"img":"img/q188.jpg","e":"O sinal circular branco com rebordo vermelho, sem nada dentro, significa trânsito proibido em ambos os sentidos."},{"id":189,"q":"Uma das consequências de aumentar a velocidade, é que...","o":["melhora o tempo de reacção.","aumenta a gravidade das lesões em caso de acidente.","reduz a distância de travagem.","reduz as distracções."],"c":1,"img":"img/q189.jpg","e":"Quanto maior a velocidade, mais energia tem o veículo no choque, por isso as lesões são mais graves."},{"id":190,"q":"O trânsito de veículos ou de animais é feito...","o":["do lado direito das faixas de rodagem e o mais próximo possível das bermas ou passeios.","próximo do eixo da via.","pela esquerda das faixas de rodagem e o mais próximo possível das bermas ou passeios, mas a uma distância destes que permita evitar qualquer acidente."],"c":2,"img":"img/q190.jpg","e":"Em Moçambique circula-se pela esquerda da faixa de rodagem, perto da berma ou passeio, mas a uma distância que permita evitar acidentes."},{"id":191,"q":"Numa auto - estrada, pode-se inverter o sentido de marcha?","o":["Sempre que possível.","Nunca.","Sim, se a manobra for feita lentamente."],"c":1,"img":"img/q191.jpg","e":"Nunca se pode inverter a marcha numa auto-estrada: os veículos andam muito depressa e a manobra seria extremamente perigosa."},{"id":192,"q":"O que indica o sinal?","o":["Paragem proibida a veículos que transportam substâncias perigosas.","Paragem obrigatória para veículos que transportam substâncias perigosas.","Área reservada para veículos que transportam substâncias perigosas."],"c":0,"img":"img/q192.jpg","e":"O S cortado proíbe a paragem; a placa por baixo, com o símbolo de mercadorias perigosas, limita essa proibição aos veículos que transportam substâncias perigosas."},{"id":193,"q":"O que indica o sinal?","o":["A presença de cancela motorizada ao centro.","A presença de ponte móvel.","A presença de entroncamento obliquo à esquerda."],"c":1,"img":"img/q193.jpg","e":"O sinal de perigo avisa uma ponte móvel, que pode abrir para deixar passar barcos."},{"id":194,"q":"O que indica o sinal?","o":["Pré-advertência da direcção de saída.","Advertência da direcção de saída.","Direcção de saída."],"c":0,"img":"img/q194.jpg","e":"Este sinal aparece antes da saída para avisar com antecedência a direcção da saída: é uma pré-advertência."},{"id":195,"q":"Considera-se morte por acidente de viação:","o":["Aquela que ocorre até 30 dias após o registo do sinistro.","Só aquela que ocorre no local do sinistro.","Só aquela aquela que ocorre à caminho da unidade sanitária.","Aquela que ocorre 30 dias depois do registo do sinistro."],"c":0,"img":"img/q195.jpg","e":"Para efeitos estatísticos, conta como morte por acidente de viação a que acontece até 30 dias depois do acidente."},{"id":196,"q":"Os peões, para atravessar a faixa de rodagem...","o":["podem fazê-lo sem utilizar as passagens para peões, se não existe nenhuma a uma distância inferior a 10 m.","estão sempre obrigados a utilizar a passagem desnivelada para peões.","têm sempre prioridade de passagem.","devem certificar-se de que a distância e velocidade dos veículos, permite fazê-lo sem perigo de acidente."],"c":3,"img":"img/q196.jpg","e":"Antes de atravessar, o peão deve verificar a distância e a velocidade dos carros para ter a certeza de que pode passar sem perigo. Nem sempre tem prioridade."},{"id":197,"q":"É proibido ultrapassar:","o":["Em todas as curvas.","Depois dos cruzamentos.","Nas estradas que só tenham uma via de trânsito para cada sentido.","Imediatamente antes e nas passagens para peões."],"c":3,"img":"img/q197.jpg","e":"É proibido ultrapassar imediatamente antes e nas passagens de peões, porque o veículo ultrapassado pode tapar um peão a atravessar."},{"id":198,"q":"Os automóveis pesados de passageiros, fora das localidades, não devem exceder a velocidade instantânea de:","o":["80 km/h.","120 km/h.","100 km/h."],"c":2,"img":"img/q198.jpg","e":"Fora das localidades, os pesados de passageiros não podem exceder 100 km/h."},{"id":199,"q":"Todos os condutores de veículos ou animais são obrigados a...","o":["abandonar os veículos nos locais de estacionamento sem motivo justificado.","reduzir ou suspender intencionalmente a circulação, formando filas de trânsito desnecessárias.","obedecer ao sinal de paragem feito pelas autoridades com competência para fiscalização do trânsito."],"c":2,"img":"img/q199.jpg","e":"Todos os condutores são obrigados a obedecer ao sinal de paragem dado pelas autoridades de fiscalização do trânsito."},{"id":200,"q":"O que indica o sinal?","o":["Sentido obrigatório para a frente.","Via rápida.","Existência de portagem na via em que segue."],"c":2,"img":"img/q200.jpg","e":"O sinal indica a existência de uma portagem na via em que circula."},{"id":201,"q":"Em acidente de viação com vitima, deixar de prestar ou providenciar socorro, constitui contravenção:","o":["Leve.","Média.","Grave."],"c":2,"img":"img/q201.jpg","e":"Não prestar nem chamar socorro a uma vítima de acidente é contravenção grave. Ajudar quem está ferido é um dever."},{"id":202,"q":"Nos locais onde é proibido, a inversão do sentido de marcha:","o":["É contravenção punida com a multa de 1.000,00 Mt.","É contravenção punida com a multa de 500,00 Mt.","É contravenção punida com a multa de 2.000,00 Mt.","Não é considerada contravenção."],"c":0,"img":"img/q202.jpg","e":"Inverter a marcha onde é proibido é contravenção punida com multa de 1.000,00 Mt."},{"id":203,"q":"Para conduzir com segurança, deve moderar especialmente a velocidade...","o":["só nas pontes, túneis e passagens de nível.","nos cruzamentos e entroncamentos nos que tenha prioridade de passagem.","nas curvas, lombas e outros locais de visibilidade reduzida.","nos locais assinalados com sinais de obrigação."],"c":2,"img":"img/q203.jpg","e":"Curvas, lombas e outros locais de pouca visibilidade escondem o que vem à frente. Por isso deve moderar especialmente a velocidade nesses locais."},{"id":204,"q":"Na condução nocturna, os hábitos do condutor aumentam ou não a fadiga?","o":["Factores como alimentação, seu tipo, quantidade e frequência não acentuam a fadiga.","Sim, factores como alimentação, seu tipo, quantidade e frequência.","Apenas a ingestão de bebidas alcoólicas acentuam a fadiga.","Os hábitos do condutor não aumentam a fadiga."],"c":1,"img":"img/q204.jpg","e":"Os hábitos do condutor, como o que, quanto e quando come, influenciam a fadiga. Uma refeição pesada antes de conduzir à noite dá sono."},{"id":205,"q":"A definição de berma é:","o":["Superfície de via pública especialmente destinada ao trânsito de veículos e que ladeia a faixa de rodagem;","Superfície de via pública não especialmente destinada ao trânsito de veículos e que ladeia a faixa de rodagem;","Superfície de via pública destinada ao trânsito de veículos e que ladeia a faixa de rodagem;","Superfície de via pública não especialmente destinada ao trânsito de automóveis e que ladeia a faixa de rodagem;"],"c":1,"img":"img/q205.jpg","e":"A berma é a parte da via ao lado da faixa de rodagem que não é especialmente destinada ao trânsito de veículos."},{"id":206,"q":"Quando os pneus têm uma pressão incorrecta:","o":["Desgastam-se mais e correm maior risco de rebentar.","Desgastam-se menos e têm menos risco de rebentar.","Consome-se menos combustível.","Melhora a estabilidade do veículo e o seu conforto."],"c":0,"img":"img/q206.jpg","e":"Com pressão errada, o pneu deforma-se, aquece, desgasta-se mais depressa e pode rebentar. Também piora a estabilidade e aumenta o consumo."},{"id":207,"q":"O uso do capacete para proteger a cabeça...","o":["é recomendável para os condutores e passageiros de motociclos, mas não é obrigatório.","é obrigatório para os condutores e passageiros de motociclos e ciclomotores.","só é obrigatório para os condutores e passageiros de motociclos.","não é eficaz em caso de acidente."],"c":1,"img":"img/q207.jpg","e":"O capacete é obrigatório para condutores e passageiros de motociclos e de ciclomotores, porque protege a cabeça numa queda."},{"id":208,"q":"Qual é a validade que tem a carta de condução da categoria B?","o":["Cinco anos.","Dois anos.","Três anos.","Dez anos."],"c":0,"img":"img/q208.jpg","e":"Segundo as regras do exame, a carta da categoria B tem validade de cinco anos."},{"id":209,"q":"A recolha da informação é influenciada pela fadiga?","o":["Não.","Sim, mas apenas em condução urbana.","Sim, assim como influencia toda a tarefa da condução.","Não, a menos que o condutor esteja muito cansado."],"c":2,"img":"img/q209.jpg","e":"A fadiga afecta toda a tarefa da condução: vê-se e percebe-se pior, decide-se mais devagar e age-se com menos precisão."},{"id":210,"q":"Factores de risco serão:","o":["Todos os elementos exteriores a um veículo que possam provocar riscos na pintura.","Todas as marcas rodoviárias que contenham riscos.","Todos os factores que aumentem o risco de acidente.","Todos os factores externos ao condutor."],"c":2,"img":"img/q210.jpg","e":"Factores de risco são todos os que aumentam a probabilidade de acidente: velocidade, álcool, fadiga, mau tempo, mau estado do veículo, etc."},{"id":211,"q":"Sempre que no mesmo sentido sejam possíveis duas ou mais filas de trânsito:","o":["O condutor deve circular pela via de trânsito mais à direita, podendo utilizar-se outra se não houver lugar naquela, e para ultrapassar ou mudar de direcção.","O condutor deve circular pela via de trânsito mais à esquerda, podendo utilizar-se outra se não houver lugar naquela, e para ultrapassar ou mudar de direcção.","O condutor deve circular pela via de trânsito mais à esquerda, podendo utilizar-se outra se não houver lugar naquela, e para estacionar.","O condutor deve circular pela via de trânsito mais à direita, podendo utilizar-se outra, para ultrapassar ou mudar de direcção."],"c":1,"img":"img/q211.jpg","e":"Como se circula pela esquerda, deve usar a via mais à esquerda. As outras usam-se se aquela estiver ocupada, para ultrapassar ou para mudar de direcção."},{"id":212,"q":"O que indica o sinal?","o":["Área reservada para autocarros e autocarros médios.","Parque de estacionamento para autocarros e autocarros médios.","Faixa reservada para qualquer tipo de autocarro do lado esquerdo."],"c":0,"img":"img/q212.jpg","e":"O sinal indica uma área reservada a autocarros e autocarros médios (machimbombos e semicolectivos)."},{"id":213,"q":"Pode conduzir um automóvel ligeiro com reboque com a carta de condução da categoria B?","o":["Sim, desde que o peso bruto do reboque não exceda 750 kg.","Não, é necessária a da categoria C1E.","Sim, desde que o peso bruto do reboque não exceda 3500 kg.","Não, é necessária a da categoria G."],"c":0,"img":"img/q213.jpg","e":"Com a carta B pode levar um reboque leve, até 750 kg de peso bruto. Reboques mais pesados exigem outra categoria."},{"id":214,"q":"O facto de conduzir de noite, deve ter influência na velocidade a que segue?","o":["Não, porque a utilização de luzes é obrigatória.","Sim, mas apenas dentro das localidades.","Sim.","Não, se conheço bem a estrada."],"c":2,"img":"img/q214.jpg","e":"À noite vê-se menos e mais tarde, por isso a velocidade deve ser menor do que de dia, mesmo com as luzes ligadas."},{"id":215,"q":"Exploração perceptiva é:","o":["Procedimentos do condutor para manter a trajectória do veículo controlada.","Procedimentos do condutor, para recolher do ambiente rodoviário, as informações importantes para a tarefa de condução.","Procedimentos do condutor para realizar manobras mais rapidamente."],"c":1,"img":"img/q215.jpg","e":"Exploração perceptiva é o que o condutor faz para recolher do ambiente à sua volta (olhar, ouvir) as informações importantes para conduzir."},{"id":216,"q":"Como deve ser feita a carga e descarga de um veículo na via pública?","o":["Sempre pela retaguarda.","Sempre pela direita.","Pela retaguarda ou pelo lado da faixa de rodagem junto da qual o veículo esteja parado ou estacionado."],"c":2,"img":"img/q216.jpg","e":"Carregar e descarregar faz-se por trás do veículo ou pelo lado junto à berma ou passeio onde ele está parado, nunca pelo lado do trânsito."},{"id":217,"q":"Se estacionar o veículo na faixa de rodagem desde anoitecer até ao amanhecer, deve utilizar alguma luz?","o":["Não, mesmo que seja num local sem iluminação.","Sim, as de presença (mínimos), se a iluminação não permite reconhecer o veículo a 100 metros.","Sim, as de estrada (máximos).","Sim, as de cruzamento (médios), se a iluminação não permite reconhecer o veículo a 100 metros."],"c":1,"img":"img/q217.jpg","e":"Se estacionar na faixa de rodagem de noite e a iluminação pública não deixar ver o carro a 100 metros, deve deixar os mínimos (luzes de presença) ligados."},{"id":218,"q":"Na via pública, a carga e descarga de um veículo deve ser feita:","o":["Sempre pela direita.","Sempre pela retaguarda.","Pela retaguarda ou pelo lado permitido para a paragem do veículo.","Sempre pela esquerda ."],"c":2,"img":"img/q218.jpg","e":"A carga e descarga faz-se por trás ou pelo lado onde o veículo pode parar, longe do trânsito."},{"id":219,"q":"Que entende-se por consciência moral?","o":["A capacidade de o indivíduo interpretar os sinais de trânsito.","A faculdade de a pessoa distinguir entre o bem e o mal, de julgar os seus actos e de adoptar uma determinada forma de conduta.","A faculdade de permitir a passagem dos peões na mudança de direcção para a esquerda."],"c":1,"img":"img/q219.jpg","e":"Consciência moral é a capacidade de distinguir o bem do mal, avaliar os próprios actos e escolher como agir."},{"id":220,"q":"Os sinais sonoros:","o":["Não podem ser afinados ou reparados na via pública.","Podem ser afinados ou reparados na via pública.","Podem ser afinados ou reparados na via pública só durante a noite.","Podem ser afinados ou reparados na via pública só durante o dia."],"c":0,"img":"img/q220.jpg","e":"É proibido afinar ou reparar buzinas na via pública, porque o barulho incomoda e pode confundir os outros utentes."},{"id":221,"q":"O significado deste sinal é:","o":["Descida de inclinação acentuada.","Subida de inclinação acentuada.","Descida de inclinação acentuada para camiões.","Subida de inclinação acentuada para camiões."],"c":1,"img":"img/q221.jpg","e":"O sinal de perigo com um camião a subir uma rampa indica uma subida de inclinação acentuada."},{"id":222,"q":"Que indica o sinal?","o":["Pavimento escorregadio.","Visibilidade reduzida.","Inicio de estrada alcatroada."],"c":1,"img":"img/q222.jpg","e":"Este sinal de perigo avisa uma zona de visibilidade reduzida (por exemplo, por nevoeiro ou fumo frequente)."},{"id":223,"q":"O que indica o sinal?","o":["Descida de inclinação acentuada.","Entroncamento obliquo à direita.","Descida de inclinação acentuada ao longo da distância indicada."],"c":2,"img":"img/q223.jpg","e":"O sinal de descida acentuada com a placa adicional de distância indica que a descida continua ao longo da distância indicada."},{"id":224,"q":"As pessoas que são encontradas a conduzir sem possuir carta de condução:","o":["São punidas com pena de prisão de três dias a seis meses e multa de 5000 Mt.","São punidas apenas com uma multa de 500 Mt.","São punidas com pena de prisão de um a três dias e multa de 5000 Mt.","Não podem ser punidas."],"c":0,"img":"img/q224.jpg","e":"Conduzir sem carta é crime, punido com prisão de três dias a seis meses e multa de 5.000 Mt."},{"id":225,"q":"Um dos elementos de segurança é a almofada de ar (airbag)?","o":["Não.","Sim, de segurança passiva.","Sim, de segurança activa."],"c":1,"img":"img/q225.jpg","e":"O airbag é um elemento de segurança passiva: não evita o acidente, mas reduz as lesões quando ele acontece."},{"id":226,"q":"O condutor selecciona o acto motor a realizar em que momento?","o":["Quando recolhe a informação.","Quando trata a informação.","Quando age sobre o veículo.","Quando detecta um perigo."],"c":2,"img":"img/q226.jpg","e":"O acto motor (virar, travar, acelerar) é seleccionado e executado quando o condutor age sobre os comandos do veículo."},{"id":227,"q":"As luzes de máximos, com nevoeiro (cacimba):","o":["Devem obrigatoriamente ser usadas.","Devem ser evitadas, em especial à noite.","Só devem ser usados à noite.","Só devem ser usados de dia."],"c":1,"img":"img/q227.jpg","e":"Os máximos reflectem-se nas gotas de nevoeiro e criam uma parede de luz que encandeia o próprio condutor. Devem ser evitados, sobretudo à noite."},{"id":228,"q":"Se o condutor consome álcool, em que momento aumenta o risco de acidente?","o":["Antes de superar o limite legal permitido.","Depois de superar o limite legal permitido.","Só quando o consome com substâncias psicotrópicas.","Só quando é tomado com medicamentos."],"c":0,"img":"img/q228.jpg","e":"O álcool começa a afectar o condutor logo com pequenas quantidades. O risco de acidente aumenta mesmo antes de chegar ao limite legal."},{"id":229,"q":"Qual é a velocidade instantânea que não devem exceder os automóveis ligeiros de passageiros e mistos dentro das localidades?","o":["50 km/h, se tem reboque.","60 km/h.","40 Km/h.","70 km/h."],"c":1,"img":"img/q229.jpg","e":"Dentro das localidades, os ligeiros de passageiros e mistos podem andar até 60 km/h."},{"id":230,"q":"A definição de estacionamento é:","o":["Imobilização de um veículo que constitua paragem e que seja motivada por circunstâncias próprias da circulação.","Imobilização de um veículo que não constitua paragem e que seja motivada por circunstâncias próprias da circulação.","Imobilização de um veículo que não constitua paragem e que não seja motivada por circunstâncias próprias da circulação.","Imobilização de um veículo que constitua paragem e que seja motivada por circunstâncias de excesso de tráfego."],"c":2,"img":"img/q230.jpg","e":"Estacionamento é parar o veículo por um motivo que não é a própria circulação (por exemplo, deixar o carro para ir às compras) e por mais tempo do que uma paragem."},{"id":231,"q":"Os condutores não podem exceder as seguintes velocidades instantâneas (em quilómetros/hora):","o":["Automóveis ligeiros de mercadorias com reboque dentro das localidades 60, fora das localidades 80.","Automóveis ligeiros de mercadorias com reboque dentro das localidades 50, fora das localidades 90.","Automóveis ligeiros de mercadorias com reboque dentro das localidades 60, fora das localidades 100.","Automóveis ligeiros de mercadorias com reboque dentro das localidades 40, fora das localidades 90."],"c":2,"img":"img/q231.jpg","e":"Os ligeiros de mercadorias com reboque podem andar até 60 km/h dentro das localidades e até 100 km/h fora delas."},{"id":232,"q":"Como o álcool afecta tarefa de conduzir?","o":["Reduz o campo de visão do condutor.","Aumenta a atenção do condutor, assim que as distracções são reduzidas.","Melhora a apreciação das velocidades.","Melhora a apreciação das distâncias."],"c":0,"img":"img/q232.jpg","e":"O álcool reduz o campo de visão (efeito túnel): o condutor vê menos o que se passa dos lados."},{"id":233,"q":"A paragem e o estacionamento devem fazer-se, fora das localidades:","o":["Nas faixas de rodagem ou, não sendo isso possível, o mais próximo possível da margem esquerda, paralelamente a esta e no mesmo sentido da marcha.","Fora das faixas de rodagem ou, não sendo isso possível, o mais próximo possível da margem direita, paralelamente a esta e no sentido da marcha.","Fora das faixas de rodagem ou, não sendo isso possível, o mais próximo possível da margem esquerda, paralelamente a esta e no mesmo sentido da marcha.","Fora das faixas de rodagem ou, não sendo isso possível, o mais próximo possível da respectiva margem esquerda, paralelamente a esta e no sentido contrário ao da marcha."],"c":2,"img":"img/q233.jpg","e":"Fora das localidades, deve parar fora da faixa de rodagem. Se não der, encostado à margem esquerda, paralelo a ela e no sentido da marcha, porque se circula pela esquerda."},{"id":234,"q":"A definição de auto-estrada é:","o":["Via pública destinada a trânsito lento, com separação física de faixas de rodagem, sem cruzamentos de nível nem acesso a propriedades marginais, com acessos condicionados e sinalizada como tal.","Via pública destinada a trânsito rápido, sem separação física de faixas de rodagem, sem cruzamentos de nível nem acesso a propriedades marginais, com acessos condicionados e sinalizada como tal.","Via pública destinada a trânsito rápido, com separação física de faixas de rodagem, sem cruzamentos de nível nem acesso a propriedades marginais, com acessos condicionados e sinalizada como tal.","Via pública destinada a trânsito rápido, com separação física de faixas de rodagem, com cruzamentos de nível e com acesso a propriedades marginais, com acessos condicionados e sinalizada como tal."],"c":2,"img":"img/q234.jpg","e":"Auto-estrada é uma via de trânsito rápido, com faixas separadas fisicamente, sem cruzamentos de nível, sem acesso às propriedades à volta e com acessos condicionados."},{"id":235,"q":"Ao ligar as luzes, se no painel aparecer o símbolo do farol, com a cor azul, indica que:","o":["Estão ligadas as luzes de estrada (máximos).","Estão ligadas as luzes de cruzamento (médios).","Estão ligadas as luzes de presença."],"c":0,"img":"img/q235.jpg","e":"A luz azul do farol no painel indica que os máximos (luzes de estrada) estão ligados."},{"id":236,"q":"Quando existe dificuldade na recolha de informação, a velocidade:","o":["Deve aumentar.","Deve diminuir.","Deve manter-se, desde que as luzes do veículo estejam ligadas."],"c":1,"img":"img/q236.jpg","e":"Se tem dificuldade em ver ou perceber o que se passa (nevoeiro, chuva, noite), deve reduzir a velocidade para ter mais tempo de reagir."},{"id":237,"q":"Para que aconteçam graves acidentes de trânsito, a fadiga é um dos factores que mais contribuem, sobretudo:","o":["Durante a manhã.","Durante a noite.","Durante a tarde.","Entre as 15 e as 17 horas."],"c":1,"img":"img/q237.jpg","e":"A fadiga contribui mais para acidentes graves durante a noite, quando o corpo está preparado para dormir."},{"id":238,"q":"Nesta situação, posso ultrapassar?","o":["Não.","Sim, mas só aos veículos que mudam de direcção para a direita.","Sim, já que tenho prioridade no cruzamento.","Sim, mas só aos veículos de duas rodas."],"c":2,"img":"img/q238.jpg","e":"Na situação da imagem, circula na via com prioridade no cruzamento, por isso a ultrapassagem é permitida. A regra que proíbe ultrapassar nos cruzamentos tem excepção quando se circula na via com prioridade."},{"id":239,"q":"O condutor dum ciclomotor, pode levar o capacete mal ajustado e apertado?","o":["Não, porque não garante uma protecção eficaz em caso de acidente.","Sim, sempre que seja um modelo aprovado oficialmente.","Sim, ainda seja um modelo não aprovado oficialmente.","Sim, já que não é obrigatório para os condutores de ciclomotores."],"c":0,"img":"img/q239.jpg","e":"Um capacete mal ajustado ou desapertado pode sair da cabeça na queda e não protege. Deve estar sempre bem ajustado e apertado."},{"id":240,"q":"O sinal, quando proíbe a inversão do sentido de marcha?","o":["De dia.","De noite.","Nos dias de chuva."],"c":1,"img":"img/q240.jpg","e":"A placa adicional com o símbolo da lua indica que a proibição só se aplica de noite."},{"id":241,"q":"O que indica o sinal?","o":["Via de sentido único.","Via de sentido único para a esquerda.","Via de sentido único para a direita."],"c":2,"img":"img/q241.jpg","e":"Sinal azul com seta para a direita: indica uma via de sentido único, com o trânsito a circular para a direita."},{"id":242,"q":"O significado deste sinal é:","o":["Área reservada para veículos de dimensões normais.","Área reservada para veículos de dimensões anormais.","Área reservada para veículos de pesos anormais.","Área reservada para veículos de comprimentos anormais."],"c":1,"img":"img/q242.jpg","e":"O sinal indica uma área reservada a veículos de dimensões anormais (muito largos, altos ou compridos)."},{"id":243,"q":"Pode ter consequências num acidente o facto de não levar o cinto de segurança bem colocado?","o":["Não, se o veículo estiver equipado com airbag.","Não, o cinto é sempre eficaz.","Sim, porque pode provocar ferimentos graves.","Sim, por isso o seu uso não é obrigatório."],"c":2,"img":"img/q243.jpg","e":"Um cinto mal colocado (torcido, folgado, por baixo do braço) pode causar ferimentos graves num choque, em vez de proteger."},{"id":244,"q":"Qual é a hierarquia entre as prescrições resultantes da sinalização?","o":["Prescrições resultantes dos sinais verticais e prescrições resultantes de sinalização temporária que modifique o regime normal de utilização da via.","Prescrições resultantes das marcas rodoviárias e prescrições resultantes dos sinais verticais.","Prescrições resultantes de sinalização temporária que modifique o regime normal de utilização da via e prescrições resultantes dos sinais luminosos.","Prescrições resultantes das marcas rodoviárias e prescrições resultantes de sinalização temporária que modifique o regime normal de utilização da via."],"c":2,"img":"img/q244.jpg","e":"A hierarquia é: agentes, sinalização temporária, sinais luminosos, sinais verticais e marcas rodoviárias. A sinalização temporária prevalece sobre os sinais luminosos."},{"id":245,"q":"O significado deste sinal é:","o":["Área reservada para autocarros de excursão;","Área reservada para autocarros de transporte escolar.","Área reservada para veículos de passeio.","Área reservada para autocarros de turismo."],"c":0,"img":"img/q245.jpg","e":"O sinal indica uma área reservada a autocarros de excursão."},{"id":246,"q":"Em especial à noite, com nevoeiro (cacimba), as luzes de estrada:","o":["Devem ser usadas porque permitem uma maior visibilidade a maior distância.","Devem ser evitadas porque permitem uma maior visibilidade a maior distância.","Devem ser evitadas porque reflectem-se no nevoeiro impedindo a visibilidade a maior distância.","São as mais aconselháveis para garantir alguma visibilidade."],"c":2,"img":"img/q246.jpg","e":"Com nevoeiro, a luz forte dos máximos reflecte-se nas gotas de água e encandeia o próprio condutor, que passa a ver ainda menos."},{"id":247,"q":"Em condições de nevoeiro (cacimba), a velocidade segura a que circula:","o":["Deve ser a velocidade indicada pela sinalização vertical.","Deve permitir que o condutor, consiga parar no espaço livre e visível.","Deve ser uma velocidade muito lenta.","Deve ser inferior a 40 Km/h."],"c":1,"img":"img/q247.jpg","e":"Com nevoeiro, a velocidade segura é a que permite parar dentro do espaço livre que consegue ver à frente."},{"id":248,"q":"A luz indicadora de mudança de direcção à direita accionada ao iniciar uma ultrapassagem, só deve ser desligada...","o":["quando termine de mudar de via de trânsito.","uma vez finalizada a ultrapassagem.","antes de mudar de via de trânsito.","só depois de percorrer uma distância de 500 metros."],"c":0,"img":"img/q248.jpg","e":"O pisca deve ficar ligado até acabar a mudança de via. Se o desligar antes, os outros não percebem o que vai fazer."},{"id":249,"q":"Quais são os princípios gerais do socorrismo?","o":["Prevenir, alertar e socorrer.","Prevenir, socorrer e evacuar.","Prevenir, observar e socorrer."],"c":0,"img":"img/q249.jpg","e":"Os princípios do socorrismo são, por esta ordem: prevenir (evitar novos acidentes), alertar (chamar socorro) e socorrer (ajudar a vítima)."},{"id":250,"q":"Num acidente há feridos muito graves. Que deve fazer se não sabe como os ajudar?","o":["Abandonar o local e não fazer nada.","Não lhes tocar e ligar ao 112.","Retirar rapidamente os feridos do veículo e levá-los para o hospital mais próximo."],"c":1,"img":"img/q250.jpg","e":"Se não sabe ajudar, não deve mexer nos feridos graves (pode piorar lesões na coluna) e deve chamar o socorro pelo número de emergência."},{"id":251,"q":"A definição de passeio é:","o":["Parte que ladeia a faixa de rodagem, destinada exclusivamente ao trânsito de veículos.","Parte que ladeia a faixa de rodagem, destinada ao estacionamento de veículos.","Parte que ladeia a faixa de rodagem, destinada exclusivamente ao trânsito de peões.","Parte da faixa de rodagem, destinada exclusivamente ao trânsito de peões."],"c":2,"img":"img/q251.jpg","e":"O passeio é a parte ao lado da faixa de rodagem destinada exclusivamente aos peões."},{"id":252,"q":"Que entende-se por dever?","o":["A obrigação de avançar rapidamente, logo que o sinal verde do semáforo assim o permita.","A intenção de iniciar a marcha sem a devida sinalização.","A obrigação moral de proceder de acordo com as normas e a consciência."],"c":2,"img":"img/q252.jpg","e":"Dever é a obrigação moral de agir de acordo com as normas e com a própria consciência."},{"id":253,"q":"Os sistemas de segurança passiva dos veículos, têm a função de:","o":["Evitar os acidentes.","Evitar ou reduzir as lesões que podem ocorrer no caso de sofrer um acidente.","Transmitir uma sensação de segurança quando se circula a velocidades elevadas."],"c":1,"img":"img/q253.jpg","e":"Segurança passiva (cinto, airbag, encosto de cabeça) não evita o acidente, mas reduz ou evita as lesões quando ele acontece."},{"id":254,"q":"O que indica o sinal?","o":["Área reservada para miniautocarros.","Área reservada para veículos de emergência.","Área reservada para veículos com dimensões anormais."],"c":1,"img":"img/q254.jpg","e":"O sinal indica uma área reservada a veículos de emergência (ambulâncias, bombeiros)."},{"id":255,"q":"A sonolência provocada pela fadiga provoca o aumento:","o":["Da distância de travagem.","Do tempo de reacção e não da distância de paragem.","Do tempo de reacção e da distância de paragem."],"c":2,"img":"img/q255.jpg","e":"Com sono, o condutor reage mais devagar. Durante esse tempo o carro continua a andar, por isso a distância de paragem também aumenta."},{"id":256,"q":"Para combater a fadiga e o sono, o melhor remédio é:","o":["Parar de conduzir, descansar e, se necessário, dormir um pouco.","Conduzir com o banco inclinado para trás.","Fechar todas as janelas.","Tomar uma bebida com álcool."],"c":0,"img":"img/q256.jpg","e":"A única solução eficaz contra o sono é parar, descansar e, se for preciso, dormir um pouco. Café ou abrir a janela só disfarçam por pouco tempo."},{"id":257,"q":"Entende-se por tarefa de condução aquela que tem como principal objectivo:","o":["O controlo de um veículo e do espaço envolvente.","O controlo do trânsito e dos sinais dos outros condutores.","O autocontrolo no trânsito."],"c":0,"img":"img/q257.jpg","e":"O objectivo da tarefa de condução é controlar o veículo e o espaço à sua volta, para chegar ao destino em segurança."},{"id":258,"q":"O significado deste sinal é:","o":["Controlo de tráfego adiante","Controlo de tráfego com obrigatoriedade de parar.","Controlo de tráfego a 100 metros.","Controlo de tráfego a 50 metros."],"c":0,"img":"img/q258.jpg","e":"O sinal avisa que há um posto de controlo de tráfego mais à frente."},{"id":259,"q":"O significado deste sinal é:","o":["Parque de estacionamento para veículos pesados que transportam substâncias perigosas.","Parque de estacionamento para veículos que transportam substâncias perigosas.","Parque de estacionamento para veículos que transportam substâncias não autorizadas.","Parque de estacionamento para veículos que transportam material militar."],"c":1,"img":"img/q259.jpg","e":"O sinal indica um parque de estacionamento para veículos que transportam substâncias perigosas."},{"id":260,"q":"Com o fim de ter a uma boa capacidade de manobra e garantir o bom funcionamento dos sistemas de segurança do veículo, o condutor deve regular o assento...","o":["por forma a ficar muito próximo do volante, com as pernas e braços encolhidos.","por forma a ficar longe do volante, com as pernas e braços esticados.","por forma a que as pernas e braços fiquem ligeiramente fletidos."],"c":2,"img":"img/q260.jpg","e":"O banco deve ser regulado de forma que as pernas e os braços fiquem ligeiramente dobrados. Assim controla melhor os pedais e o volante e o airbag protege bem."},{"id":261,"q":"O significado deste sinal é:","o":["Convergência de filas à direita.","Fim da fila à direita.","Convergência de filas à esquerda.","Fim da fila à esquerda."],"c":1,"img":"img/q261.jpg","e":"O sinal mostra que a fila da direita vai acabar: deve preparar-se para mudar de fila ou deixar entrar quem vem dela."},{"id":262,"q":"A linha transversal descontínua, é uma:","o":["Linha de paragem obrigatória.","Linha descontinua de aviso.","Linha de cedência de prioridade."],"c":2,"img":"img/q262.jpg","e":"A linha transversal descontínua (tracejada atravessada na via) é uma linha de cedência de prioridade."},{"id":263,"q":"Nesta situação, se não for possível efectuar o cruzamento com segurança, como deve proceder o condutor?","o":["Acelerar para passar antes do veículo que circula em sentido contrário.","Reduzir a velocidade ou parar, de modo a dar a passagem ao outro veículo.","Nada, porque eu tenho prioridade de passagem.","Utilizar os sinais sonoros para que o outro condutor pare."],"c":1,"img":"img/q263.jpg","e":"Se não há espaço para os dois passarem com segurança, deve abrandar ou parar para deixar passar o outro. Acelerar ou buzinar só aumenta o perigo."},{"id":264,"q":"Que deve fazer o condutor perante a marca rodoviária de cor branca?","o":["Pisar ou transpor a linha.","Abrandar a marcha.","Circular à sua esquerda, quando a linha fizer a separação de sentidos de trânsito."],"c":2,"img":"img/q264.jpg","e":"Quando a linha branca separa os sentidos de trânsito, deve circular à esquerda dela, porque em Moçambique se circula pela esquerda."},{"id":265,"q":"As ordens dos agentes reguladores do trânsito, prevalecem sobre os sinais luminosos:","o":["Verdes.","De qualquer cor.","Amarelos.","Vermelho."],"c":1,"img":"img/q265.jpg","e":"As ordens dos agentes reguladores do trânsito estão acima dos semáforos, seja qual for a cor."},{"id":266,"q":"O significado deste sinal é:","o":["Parque de estacionamento para veículos do Governo.","Parque de estacionamento para veículos do Ministério.","Parque de estacionamento para veículos da Polícia.","Parque de estacionamento para veículos do Parlamento."],"c":2,"img":"img/q266.jpg","e":"O sinal indica um parque de estacionamento reservado a veículos da Polícia."},{"id":267,"q":"Os sinais sonoros devem ser:","o":["Longos, usados de forma moderada e em caso algum devem servir de meio de protesto contra interrupções do trânsito ou como meios de chamamento.","Breves, usados de forma moderada e podem servir de meio de protesto contra interrupções do trânsito ou como meios de chamamento.","Breves, usados de forma moderada e em caso algum devem servir de meio de protesto contra interrupções do trânsito ou como meios de chamamento.","Longos e insistentes, usados como forma de protesto contra interrupções do trânsito ou como meios de chamamento."],"c":2,"img":"img/q267.jpg","e":"A buzina deve usar-se com toques breves e moderados, só para avisar. Nunca serve para protestar contra o trânsito nem para chamar alguém."},{"id":268,"q":"Para ter mais segurança, os peões devem...","o":["transitar sempre do lado esquerdo da faixa de rodagem, em relação ao seu sentido de marcha.","transitar pelo lado direito, em relação ao seu sentido de marcha, a não ser que tal comprometa a sua segurança.","fazer o atravessamento da faixa de rodagem o mais lentamente possível."],"c":1,"img":"img/q268.jpg","e":"Como os carros circulam pela esquerda, o peão que anda pela direita vê os carros a vir de frente. Por isso deve andar pela direita, salvo se isso o puser em perigo."},{"id":269,"q":"Ao ligar as luzes, se no painel aparecer o símbolo do farol de cor verde, significa que estão ligadas:","o":["As luzes de estrada (máximos).","As luzes de cruzamento (médios).","As luzes mínimas."],"c":1,"img":"img/q269.jpg","e":"O farol verde no painel indica que as luzes de cruzamento (médios) estão ligadas. O azul é dos máximos."},{"id":270,"q":"Se os ocupantes do veículo não utilizarem o cinto de segurança, o airbag é eficaz?","o":["Não e pode causar lesões graves.","Sim, o airbag é sempre eficaz.","Sim, sempre que os passageiros estejam sentados correctamente.","Sim, mas apenas para o condutor."],"c":0,"img":"img/q270.jpg","e":"O airbag foi feito para funcionar junto com o cinto. Sem cinto, o corpo vai contra o airbag a abrir e pode sofrer lesões graves."},{"id":271,"q":"Só pode ser ordenada a suspensão do trânsito por:","o":["Ser feriado e haver festejos.","Motivos de segurança, de emergência grave ou de obras, ou com o fim de promover produtos e marcas de automóveis.","Motivos de segurança, de emergência grave ou de obras, ou com o fim de realizar a conservação dos pavimentos, instalações e obras de arte.","Ser fim de semana."],"c":2,"img":"img/q271.jpg","e":"A suspensão do trânsito só pode ser ordenada por motivos de segurança, emergência grave, obras ou conservação dos pavimentos, instalações e obras de arte."},{"id":272,"q":"A que grupo pertence o sinal triângular?","o":["Sinais temporários de perigo.","Sinais temporários de obrigação.","Sinais temporários de proibição."],"c":0,"img":"img/q272.jpg","e":"Os sinais triangulares temporários (geralmente com fundo amarelo) são sinais temporários de perigo, usados em obras."},{"id":273,"q":"Em situações de chuva forte:","o":["Aumenta a probabilidade de aquaplanagem (hidroplanagem).","Reduz a probabilidade de aquaplanagem (hidroplanagem).","Reduz a probabilidade de aquaplanagem (hidroplanagem), sobretudo a velocidade moderada."],"c":0,"img":"img/q273.jpg","e":"Com chuva forte acumula-se água no piso. Os pneus deixam de tocar no chão e deslizam sobre a água (aquaplanagem)."},{"id":274,"q":"Os peões podem transitar pela faixa de rodagem nesta estrada?","o":["Não, nesta estrada não podem transitar, já que não tem bermas.","Sim, com prudência e por forma a não prejudicar o trânsito de veículos.","Sim e devem fazê-lo pela esquerda da faixa de rodagem, em relação ao seu sentido de marcha.","Sim, mais só quando necessitem atravessar."],"c":1,"img":"img/q274.jpg","e":"Se não há passeio nem berma, os peões podem andar pela faixa de rodagem, com prudência e sem prejudicar o trânsito."},{"id":275,"q":"Os condutores não podem exceder as seguintes velocidades instantâneas (em quilómetros/hora):","o":["Automóveis ligeiros de passageiros e mistos sem reboque dentro das localidades 60, fora das localidades 120.","Automóveis ligeiros de passageiros e mistos sem reboque dentro das localidades 50, fora das localidades 120.","Automóveis ligeiros de passageiros e mistos sem reboque dentro das localidades 60, fora das localidades 100.","Automóveis ligeiros de passageiros e mistos sem reboque dentro das localidades 50, fora das localidades 100."],"c":0,"img":"img/q275.jpg","e":"Os ligeiros de passageiros e mistos sem reboque podem andar até 60 km/h dentro das localidades e até 120 km/h fora delas."},{"id":276,"q":"É necessário verificar o nível do líquido de travão com frequência?","o":["Sim e deve ser substituído dentro do período indicado pelo fabricante.","Sim, mas não precisa de ser substituído.","Não, porque não se desgasta com o uso.","Sim, para juntar óleo do motor em caso de necessidade."],"c":0,"img":"img/q276.jpg","e":"O líquido dos travões deve ser verificado com frequência e substituído no prazo indicado pelo fabricante, porque com o tempo absorve humidade e perde eficácia."},{"id":277,"q":"Para os condutores de transporte de serviço público ou de carga perigosa, quando em exercício, a taxa de álcool deve ser de:","o":["0.3 mg/l.","0.0 mg/l.","0.6 mg/l."],"c":1,"img":"img/q277.jpg","e":"Os condutores de transporte público e de cargas perigosas, em serviço, não podem ter nenhum álcool no sangue (0,0)."},{"id":278,"q":"O que indica o sinal?","o":["A presença de máquinas na via.","Passagem de nível.","Passagem de um veículo automóvel de cada vez."],"c":1,"img":"img/q278.jpg","e":"O sinal de perigo com um comboio avisa uma passagem de nível (cruzamento com a linha do comboio)."},{"id":279,"q":"A distância de reacção é influenciada:","o":["Pelo tempo dividido pela velocidade.","Pelo somatório do tempo mais a velocidade.","Principalmente de factores externos ao condutor.","Pelo tempo multiplicado pela velocidade."],"c":3,"img":"img/q279.jpg","e":"A distância de reacção é o tempo de reacção multiplicado pela velocidade: quanto mais depressa e mais lento a reagir, mais metros percorre."},{"id":280,"q":"Quando existe um forte vento lateral corremos o perigo de sermos desviados da nossa trajectória. Nestas circunstâncias a melhor solução é:","o":["Circular ao lado de um veículo pesado, se for possível.","Acelerar mais para vencer a força do vento.","Moderar a velocidade e ajustar-nos às circunstâncias.","Parar o veículo e aguardar até que o vento passe."],"c":2,"img":"img/q280.jpg","e":"Com vento lateral forte, deve moderar a velocidade e adaptar-se, segurando bem o volante. Acelerar aumenta o perigo."},{"id":281,"q":"A definição de lotação é:","o":["Número de passageiros que o veículo pode transportar, não incluindo o condutor.","Número de lugares que o veículo tem, incluindo o condutor.","Número de passageiros que o veículo consiga transportar, incluindo o condutor.","Número de lugares que o veículo tem, não incluindo o condutor."],"c":1,"img":"img/q281.jpg","e":"Lotação é o número de lugares do veículo, incluindo o do condutor."},{"id":282,"q":"O agente regulador de trânsito que aparece na fotografia, manda:","o":["Avançar o tráfego que venha da esquerda.","Parar o tráfego que venha da direita.","Avançar o tráfego que venha da direita."],"c":2,"img":"img/q282.jpg","e":"O agente de perfil, com os braços estendidos, deixa passar o trânsito que se apresenta de lado. Na foto, quem vem da direita do agente pode avançar."},{"id":283,"q":"Em cada situação, a decisão que tomo:","o":["Depende exclusivamente da sinalização que encontro no local.","É consequência unicamente da intensidade do trânsito.","Não é influenciada pelo estado físico em que me encontro.","É sempre influenciada pela previsão que faço."],"c":3,"img":"img/q283.jpg","e":"A decisão depende sempre da previsão que o condutor faz do que vai acontecer, além da sinalização, do trânsito e do seu estado."},{"id":284,"q":"É permitido que uma criança de 6 anos viaje no banco da frente de um automóvel?","o":["Não, em nenhum caso.","Sim, se não tiver bancos ou cintos de segurança na retaguarda.","Sim, mesmo que não utilize cinto de segurança.","Sim, sempre que utilize o cinto de segurança."],"c":1,"img":"img/q284.jpg","e":"Uma criança de 6 anos deve ir atrás, numa cadeirinha. Só pode ir à frente se o carro não tiver bancos ou cintos atrás."},{"id":285,"q":"A distância de segurança, é um factor a considerar:","o":["Apenas em condução urbana, devido à intensidade do trânsito.","Nas estradas rurais pela diminuição dos limites de velocidade.","Em qualquer situação."],"c":2,"img":"img/q285.jpg","e":"A distância de segurança deve ser respeitada em qualquer situação: cidade, estrada, auto-estrada, com bom ou mau tempo."},{"id":286,"q":"Conduzir sob influência de álcool, sob efeitos de substâncias legalmente consideradas como estupefacientes ou psicotrópicas, constitui contravenção:","o":["Leve.","Média.","Grave."],"c":2,"img":"img/q286.jpg","e":"Conduzir sob influência de álcool ou de drogas é contravenção grave."},{"id":287,"q":"O significado deste sinal é:","o":["Parque de estacionamento para automóveis pesados de passageiros de peso total superior a 10 Toneladas.","Parque de estacionamento para automóveis pesados de mercadorias de peso total superior a 10 Kilos.","Parque de estacionamento para automóveis pesados de mercadorias de peso total superior a 10 Toneladas.","Parque de estacionamento para todos os automóveis de peso total superior a 10 toneladas."],"c":2,"img":"img/q287.jpg","e":"O sinal indica um parque de estacionamento para pesados de mercadorias com peso total superior a 10 toneladas."},{"id":288,"q":"O significado deste sinal é:","o":["Sinalização luminosa e de passagem de nível.","Sinalização luminosa em manutenção.","Sinalização luminosa inexistente.","Sinalização luminosa e de passagem de nível com uma via."],"c":1,"img":"img/q288.jpg","e":"O sinal de perigo com o semáforo riscado por uma cruz avisa que os semáforos estão em manutenção e podem não funcionar normalmente."},{"id":289,"q":"A correcta exploração visual permite:","o":["Conduzir com maior velocidade.","Que o condutor tenha em sua posse a informação necessária para tomar as decisões adequadas e agir correctamente.","Só é importante dentro das localidades para ver os peões que se propõem a atravessar a via e também toda a sinalização envolvente."],"c":1,"img":"img/q289.jpg","e":"Olhar bem à volta (espelhos, frente, lados) dá ao condutor a informação de que precisa para decidir e agir correctamente."},{"id":290,"q":"Como é punida a colocação de obstáculos que possam impedir ou embaraçar o trânsito e comprometer a segurança e comodidade dos utentes da via?","o":["Multa de 1.000,00 Mt.","Multa de 500,00 Mt.","Multa de 2,000,00 Mt.","Multa de 3.000,00 Mt."],"c":0,"img":"img/q290.jpg","e":"Colocar obstáculos que impeçam ou dificultem o trânsito é punido com multa de 1.000,00 Mt."},{"id":291,"q":"Perante um obstáculo imprevisto que o obriga a reduzir subitamente a velocidade, o condutor deve:","o":["Sinalizar a situação utilizando os máximos e os médios alternadamente.","Ligar as luzes de perigo para avisar os outros utentes da via.","Ligar as luzes de presença para avisar os outros utentes da via."],"c":1,"img":"img/q291.jpg","e":"Se tiver de travar de repente por um obstáculo, deve ligar as luzes de perigo para avisar quem vem atrás."},{"id":292,"q":"Considera-se “condução defensiva”:","o":["Não ultrapassar os 30Km em zona urbana.","Ajustar a velocidade e a trajectória de forma a evitar acidentes.","Não efectuar manobras que o possam colocar em perigo, independentemente dos outros condutores.","Circular sempre a 40 Km por hora para evitar ser surpreendido por algum perigo."],"c":1,"img":"img/q292.jpg","e":"Condução defensiva é ajustar a velocidade e a trajectória para evitar acidentes, mesmo quando os outros cometem erros."},{"id":293,"q":"Que entende-se por liberdade?","o":["O poder que o Homem tem de dominar a ciência e a técnica.","A condução de veículos automóveis por longos períodos de tempo.","O poder que o Homem tem de agir, de praticar uma acção sem qualquer pressão ou constrangimento.","A faculdade de num cruzamento não sinalizado, avançar sem observar a regra de prioridade."],"c":2,"img":"img/q293.jpg","e":"Liberdade é o poder de agir sem pressão nem constrangimento. Na estrada, a liberdade de cada um tem os limites das regras e dos direitos dos outros."},{"id":294,"q":"Muitas tarefas que são necessárias à condução, exigem que o condutor retire os olhos da estrada:","o":["Errado.","Certo."],"c":1,"img":"img/q294.jpg","e":"Certo. Tarefas como ver o painel, os espelhos ou mudar de mudança obrigam a tirar os olhos da estrada por instantes, por isso devem ser rápidas."},{"id":295,"q":"Uma das partes importantes para praticar uma condução defensiva é:","o":["A capacidade mental de prever os acontecimentos perante um estímulo visual.","A capacidade de dominar a trajectória do veículo em condições adversas.","A capacidade de acelerar dentro dos limites impostos pela sinalização.","A capacidade de efectuar travagens sempre que necessário."],"c":0,"img":"img/q295.jpg","e":"A condução defensiva exige a capacidade mental de prever o que pode acontecer a partir do que se vê."},{"id":296,"q":"O significado deste sinal é:","o":["Travessia de peões.","Passagem de peões.","Passagem de idosos.","Passagem de peões a 50 metros."],"c":1,"img":"img/q296.jpg","e":"Sinal de perigo com um peão sobre a passadeira: avisa a aproximação de uma passagem de peões."},{"id":297,"q":"A força centrípeta e centrífuga:","o":["São forças que actuam no mesmo sentido e se acumulam uma à outra.","Só depende do raio da trajectória não tendo a velocidade nenhuma influência.","São forças que actuam em sentido contrário uma em relação à outra.","São forças que só ocorrem quando o veículo vai em linha recta."],"c":2,"img":"img/q297.jpg","e":"Numa curva, a força centrípeta (aderência dos pneus) puxa o carro para dentro e a centrífuga empurra-o para fora. Actuam em sentidos contrários."},{"id":298,"q":"Quem exceder em mais de 30 Km/h de velocidade (automóveis ligeiros e motociclos) os limites, fora das localidades é punido:","o":["Com multa de 2.000,00 Mt e contravenção leve.","Com multa de 1.000,00 Mt e contravenção média.","Com multa de 1.000,00 Mt e contravenção leve.","Com multa de 1.000,00 Mt e contravenção grave."],"c":2,"img":"img/q298.jpg","e":"Segundo as regras do exame, exceder o limite em mais de 30 km/h fora das localidades (ligeiros e motociclos) é contravenção leve, com multa de 1.000,00 Mt."},{"id":299,"q":"Como pode definir derrapagem?","o":["Quando o veículo segue uma trajetória diferente da das rodas e estas em velocidades diferentes.","Quando nas curvas o veículo segue a mesma trajectória das rodas e estas em velocidade diferentes.","Sempre que o carro efectua uma curva."],"c":0,"img":"img/q299.jpg","e":"Há derrapagem quando o veículo deixa de seguir a trajectória das rodas e escorrega, com as rodas a girar a velocidades diferentes."},{"id":300,"q":"O que indica o sinal de interesse turístico?","o":["Posto de socorro.","Hospital.","Hospital com emergência médica."],"c":1,"img":"img/q300.jpg","e":"O sinal com um H num círculo indica a proximidade de um hospital."},{"id":301,"q":"O que indica o sinal?","o":["Passagem de peões.","Pista obrigatória para peões.","Passagem desnivelada para peões com rampas."],"c":2,"img":"img/q301.jpg","e":"O sinal indica uma passagem desnivelada (por cima ou por baixo da estrada) para peões, com rampas."},{"id":302,"q":"Dentro das localidades, é proibido parar ou estacionar?","o":["A menos de 50 metros dos cruzamentos ou entroncamentos.","A menos de 25 metros para um e outro lado dos cruzamentos ou entroncamentos.","A menos de 5 metros antes das passagens assinaladas para a travessia de peões e velocípedes.","Na faixa de rodagem, em qualquer caso."],"c":2,"img":"img/q302.jpg","e":"É proibido parar ou estacionar a menos de 5 metros antes das passagens de peões e velocípedes, para não tapar a visão de quem atravessa."},{"id":303,"q":"O que influencia a distância de reacção?","o":["Tempo de reacção e velocidade.","Estado do veículo e condições ambientais.","Velocidade e estado da via.","Condições do condutor e distância de travagem."],"c":0,"img":"img/q303.jpg","e":"A distância de reacção depende do tempo que o condutor demora a reagir e da velocidade a que vai."},{"id":304,"q":"O significado destes sinais é:","o":["Saída com uma via de rodagem.","Saída com uma estrada de um sentido.","Saída com uma faixa de rodagem.","Entrada com uma faixa de rodagem."],"c":2,"img":"img/q304.jpg","e":"Os sinais indicam uma saída com uma faixa de rodagem."},{"id":305,"q":"Sempre que uma autoridade policial ou seus agentes, lhes façam sinal para Isso, os condutores de veículos ou animais são obrigados a parar?","o":["Sim, desde que estejam armados.","Sim, desde que estejam devidamente uniformizados e identificados.","Sim, sempre que exibam o sinal de STOP.","Não, nunca."],"c":1,"img":"img/q305.jpg","e":"Os condutores devem parar quando os agentes lhes fazem sinal, desde que estejam devidamente uniformizados e identificados."},{"id":306,"q":"O socorrista, na avaliação do grau de consciência deve:","o":["Ver os movimentos do tórax e do abdómen.","Abanar levemente a vitima ao nível dos ombros e falar com ela, questionando se está a ouvir, está a sentir-se bem, onde está, como se chama, que dia é hoje...","Sentir o ar expirado, encostando a sua face ao nariz e boca da vitima."],"c":1,"img":"img/q306.jpg","e":"Para avaliar a consciência, o socorrista abana levemente a vítima pelos ombros e fala com ela, fazendo perguntas simples (nome, onde está, que dia é)."},{"id":307,"q":"O espaço percorrido pelo veículo durante o tempo de reacção do condutor não é sempre o mesmo e depende:","o":["Só do tempo da reacção do condutor e não tem influência a velocidade do veículo.","Do tempo da reacção e da velocidade do veículo.","Só da velocidade do veículo e não tem influência o tempo de reacção do condutor.","Principalmente de factores externos ao condutor."],"c":1,"img":"img/q307.jpg","e":"Durante o tempo de reacção o carro continua à mesma velocidade. Por isso a distância percorrida depende do tempo de reacção e da velocidade."},{"id":308,"q":"Durante a noite, o condutor deve circular com:","o":["Sempre com os médios ligados, utilizando os mínimos no cruzamento com outros veículos e os máximos quando não houver trânsito.","Sempre com os máximos ligados, utilizando os mínimos no cruzamento com outros veículos.","Os médios ligados e utilizar os máximos, quando não existir outro trânsito a circular à sua frente ou em sentido contrário.","É indiferente as luzes usadas desde que consiga ver bem a estrada."],"c":2,"img":"img/q308.jpg","e":"De noite circula-se com os médios. Os máximos só se usam quando não há trânsito à frente nem em sentido contrário, para não encandear."},{"id":309,"q":"O estado emocional do condutor, é um factor de ordem interna, que influência:","o":["O tempo de reacção e a distância de travagem.","Apenas a distância de travagem.","Apenas a distância de segurança."],"c":0,"img":"img/q309.jpg","e":"Um condutor nervoso, triste ou zangado reage pior e mais tarde. Isto aumenta o tempo de reacção e, com ele, a distância necessária para parar."},{"id":310,"q":"Qual a antecedência mínima que a entidade que ordenar a suspensão do trânsito nas estradas nacionais, deve anunciá-la ao público?","o":["Uma semana.","Quinze dias.","Três dias.","Um dia."],"c":2,"img":"img/q310.jpg","e":"A suspensão do trânsito nas estradas nacionais deve ser anunciada ao público com pelo menos três dias de antecedência."},{"id":311,"q":"A condução sob influência do álcool:","o":["Aumenta o risco de acidente.","Diminui o risco de acidente.","Em nada interfere com a segurança rodoviária.","Pode melhorar o estado do condutor devido à melhora da sua disposição."],"c":0,"img":"img/q311.jpg","e":"O álcool atrasa as reacções, reduz a visão e dá falsa confiança. Por isso aumenta o risco de acidente."},{"id":312,"q":"Se o condutor sofre de uma doença, o que deve fazer para reduzir o risco de ter um acidente?","o":["Interromper a medicação que estiver a tomar, se tem que conduzir.","Deixar de conduzir em todos os casos.","Conhecer os efeitos secundários dos medicamentos.","Ignorar os sintomas para evitar distracções."],"c":2,"img":"img/q312.jpg","e":"Quem está doente deve conhecer os efeitos secundários dos medicamentos (sono, tonturas) para saber se pode conduzir. Não deve parar a medicação por conta própria."},{"id":313,"q":"A razão pela qual não se deve retirar ou movimentar do interior dos veículos, as vítimas de acidentes é:","o":["Para não contaminar o local do acidente.","Para não passar doenças a quem socorre.","Para serem evitadas lesões crânio encefálicas, lesões da coluna cervical ou outras em órgãos internos OU Ossos fracturados."],"c":2,"img":"img/q313.jpg","e":"Mexer numa vítima pode agravar lesões na cabeça, na coluna, em órgãos internos ou em ossos partidos. Só se retira se houver perigo imediato, como fogo."},{"id":314,"q":"Com relação aos acidentados, qual a ordem pela qual devem ser postos em prática os três princípios de actuação?","o":["Socorrer, Alertar e Prevenir.","Alertar, Socorrer e Prevenir.","Prevenir, Alertar e Socorrer."],"c":2,"img":"img/q314.jpg","e":"A ordem é prevenir (sinalizar e evitar mais acidentes), alertar (chamar o socorro) e socorrer (ajudar as vítimas)."},{"id":315,"q":"Quem não teve uma boa noite de descanso:","o":["Deve tomar mais cafés durante o dia enquanto conduz.","Deve beber muita água durante o dia enquanto conduz.","Não afecta a sua capacidade de condução.","Mais facilmente se torna vítima de estados de fadiga."],"c":3,"img":"img/q315.jpg","e":"Quem dormiu mal fica cansado mais depressa. Café ou água não substituem o descanso."},{"id":316,"q":"O estado de alerta do condutor, é influenciado pela fadiga, afectando a forma como:","o":["O veículo se comporta no ambiente rodoviário.","O condutor realiza a manobra de ultrapassagem.","O condutor recolhe as informações relevantes do ambiente rodoviário."],"c":2,"img":"img/q316.jpg","e":"A fadiga diminui o estado de alerta e o condutor passa a recolher pior a informação do que se passa à sua volta."},{"id":317,"q":"A definição de pista especial é:","o":["Via privada especialmente destinada, de acordo com sinalização, ao trânsito de peões, de animais ou de certa espécie de veículos.","Via privada especialmente destinada, de acordo com sinalização, ao trânsito de veículos automóveis.","Via pública especialmente destinada ao trânsito de veículos de polícia.","Via pública especialmente destinada, de acordo com sinalização, ao trânsito de peões, de animais ou de certa espécie de veículos."],"c":3,"img":"img/q317.jpg","e":"Pista especial é uma via pública destinada, por sinalização, a peões, animais ou a um certo tipo de veículo (ex.: pista para bicicletas)."},{"id":318,"q":"Em caso de nevoeiro (cacimba) os 4 piscas ou luzes de emergência, só devem ser utilizados:","o":["Se o veículo estiver imobilizado, a circular a velocidades muito baixas ou quando fizer uma travagem forte e repentina.","Quando o veículo circular a uma velocidade moderada.","Sempre que mudar de direcção ou iniciar uma ultrapassagem.","Devem ser usadas sempre."],"c":0,"img":"img/q318.jpg","e":"Com nevoeiro, os 4 piscas usam-se quando o veículo está parado, a andar muito devagar ou numa travagem forte e repentina, para avisar quem vem atrás."},{"id":319,"q":"Perante a luz verde, não deve avançar:","o":["Quando no passeio existam peões que pretendam iniciar a travessia da faixa de rodagem.","Quando pela intensidade de trânsito, seja previsível a imobilização no centro da intersecção.","Quando um agente regulador de trânsito se encontre nas proximidades."],"c":1,"img":"img/q319.jpg","e":"Mesmo com o verde, não deve avançar se o trânsito for ficar parado e o obrigar a ficar no meio do cruzamento, a bloquear os outros."},{"id":320,"q":"O planeamento da velocidade e da trajectória do veículo assenta:","o":["Nas motivações e necessidade do condutor sem influência da informação que ele recebe do exterior.","Na informação que ele recebe do exterior.","Nas motivações e necessidades do condutor e também na informação que ele recebe do exterior."],"c":2,"img":"img/q320.jpg","e":"O condutor planeia a velocidade e a trajectória com base no que quer e precisa (objectivos) e no que vê à sua volta (informação do exterior)."},{"id":321,"q":"A definição de plataforma é:","o":["Parte das arestas externas das valetas laterais da estrada.","Parte das arestas internas das valetas laterais da estrada.","Parte das valetas laterais da estrada.","O conjunto de estrada e bermas."],"c":1,"img":"img/q321.jpg","e":"A plataforma é a parte da estrada entre as arestas internas das valetas: inclui a faixa de rodagem e as bermas."},{"id":322,"q":"O que indica uma curta distância existente entre os veículos que circulam à minha frente?","o":["Que devo moderar a velocidade.","Que circulo mais rápido do que eles.","Que vou entrar numa localidade.","Que devo ultrapassar para não estar em perigo."],"c":0,"img":"img/q322.jpg","e":"Se os veículos à frente estão muito juntos, o trânsito pode parar de repente. Deve moderar a velocidade."},{"id":323,"q":"O vento afecta a estabilidade do veículo:","o":["Especialmente em zonas urbanas com muitos edifícios altos.","Especialmente em zonas abertas de planície, zonas marítimas costeiras ou de montanha.","Especialmente em zonas de parques de estacionamento fechados.","Não."],"c":1,"img":"img/q323.jpg","e":"O vento é mais forte e perigoso em zonas abertas, como planícies, costa e montanha, onde não há nada que o trave."},{"id":324,"q":"Os veículos possuem, para combater a escuridão ou falta de iluminação na condução nocturna:","o":["Buzinas.","Luzes de emergência.","Luzes, sinalizadores e reflectores."],"c":2,"img":"img/q324.jpg","e":"Para conduzir à noite, os veículos têm luzes (para ver e ser visto), sinalizadores (piscas, stop) e reflectores (catadióptricos)."},{"id":325,"q":"É permitido levar um bebé nos braços quando o veículo está em circulação?","o":["Não, deve sempre usar um dispositivo adequado ao tamanho e ao peso do bebé.","Sim, se a viagem é curta.","Sim, sempre que a velocidade seja muito reduzida.","Sim, mas apenas nos assentos traseiros."],"c":0,"img":"img/q325.jpg","e":"Nunca se leva um bebé ao colo: num choque, ninguém o consegue segurar. Deve ir sempre numa cadeirinha adequada ao seu tamanho e peso."},{"id":326,"q":"Devido à ingestão de bebidas alcoólicas, a alteração do campo visual de um condutor, manifesta-se por:","o":["Aumento da visão lateral.","Aumento da visão periférica.","Redução da visão lateral.","Aumento da visão em profundidade."],"c":2,"img":"img/q326.jpg","e":"O álcool reduz a visão lateral (efeito túnel): o condutor vê bem só à frente e não repara no que se passa dos lados."},{"id":327,"q":"É proibido parar ou estacionar, fora das localidades:","o":["A menos de 30 m dos cruzamentos, entroncamentos, curvas ou lombas de visibilidade reduzida;","A menos de 50 m dos cruzamentos, entroncamentos, curvas ou lombas de visibilidade reduzida.","A menos de 10 m dos cruzamentos, entroncamentos, curvas ou lombas de visibilidade reduzida;","A menos de 20 m dos cruzamentos, entroncamentos, curvas ou lombas de visibilidade reduzida;"],"c":1,"img":"img/q327.jpg","e":"Fora das localidades é proibido parar ou estacionar a menos de 50 metros de cruzamentos, entroncamentos, curvas ou lombas de visibilidade reduzida."},{"id":328,"q":"Os estados de fadiga podem tornar as pessoas mais:","o":["Pacientes, aumentando-lhes a capacidade para se concentrarem e para tomarem decisões.","Irritadiças, diminuindo-lhes a capacidade para se concentrarem e para tomarem decisões.","Amáveis, aumentando-lhes a capacidade para se concentrarem e para tomarem decisões.","Atentas, dado que para combater a fadiga têm tendência a aumentar os níveis de atenção."],"c":1,"img":"img/q328.jpg","e":"A fadiga deixa as pessoas mais irritadiças e com menos capacidade de concentração e de decisão, o que é perigoso ao volante."},{"id":329,"q":"A tarefa de condução, pode ser muito afectada pela fadiga porque:","o":["Contribui para o aumento das capacidades perceptivas, intelectuais e também motoras.","Contribui para despertar as capacidades cognitivas e também motoras.","Contribui para a diminuição das capacidades perceptivas, cognitivas e também motoras.","Um condutor fatigado vê diminuido o seu tempo de reacção."],"c":2,"img":"img/q329.jpg","e":"A fadiga diminui todas as capacidades usadas na condução: perceber (ver, ouvir), pensar (decidir) e agir (movimentos)."},{"id":330,"q":"A distância de segurança deve ser sempre a que me permita imobilizar o veículo sem perigo de acidente.","o":["Errado.","A distância de segurança só deve depender da capacidade de travagem do veículo.","Certo."],"c":2,"img":"img/q330.jpg","e":"Certo. A distância de segurança deve ser a que permite parar sem bater, se o veículo da frente travar de repente."},{"id":331,"q":"Entende-se por prioridade de passagem:","o":["A obrigação que o condutor tem de imobilizar o veículo num cruzamento com sinal de paragem obrigatória.","O direito que o condutor tem de passar em primeiro lugar.","A movimentação de veículos e animais nas vias de comunicação rodoviária."],"c":1,"img":"img/q331.jpg","e":"Prioridade de passagem é o direito de passar em primeiro lugar num cruzamento, entroncamento ou outra situação."},{"id":332,"q":"Que deve fazer ao aproximar-se desta intersecção?","o":["Demonstrar prudência especial, moderando a velocidade e ceder a passagem aos veículos que tenham prioridade.","Ceder a passagem aos veículos que se apresentem pela via transversal.","Apenas ceder a passagem aos peões que tenham prioridade.","Ceder a passagem aos veículos que se apresentem pela esquerda."],"c":0,"img":"img/q332.jpg","e":"Ao aproximar-se de uma intersecção deve ter prudência especial: moderar a velocidade e ceder a passagem a quem tem prioridade."},{"id":333,"q":"Nenhum condutor deve tomar a direita dos veículos ou animais:","o":["Que pretenda ultrapassar sem avisar da sua intenção aos respectivos condutores.","Sem fazer sinais de luzes durante o dia.","Sem fazer sinais de luzes durante a noite.","Sem buzinar para avisar da sua intenção."],"c":0,"img":"img/q333.jpg","e":"Ultrapassa-se pela direita, mas antes deve avisar o condutor que vai ser ultrapassado (pisca ou sinal), para ele saber o que vai fazer."},{"id":334,"q":"O condutor está sujeito ao aparecimento de fadiga, quando circula com trânsito intenso?","o":["Está porque é uma situação de transito monótona o que provoca fadiga.","Não está porque circula a velocidade reduzida.","Não está porque nesta situação pode descansar devido à pouca velocidade do trânsito.","Está e para evitar a fadiga deve beber café e bebidas estimulantes."],"c":0,"img":"img/q334.jpg","e":"Sim. O trânsito intenso, com pára-arranca, é monótono e cansativo e provoca fadiga, mesmo a baixa velocidade."},{"id":335,"q":"No caso de passar por um acidente, é obrigado a parar para dar assistência?","o":["Não, mas não dar o alerta pode incorrer no crime de omissão de auxílio.","Sim, porque se não der o alerta pode incorrer no crime de omissão de auxílio.","Sim sempre."],"c":0,"img":"img/q335.jpg","e":"Segundo esta pergunta do exame, não é obrigado a parar se outros já estão a ajudar, mas tem de dar o alerta. Não alertar o socorro pode ser crime de omissão de auxílio."},{"id":336,"q":"O que provoca no condutor o aparecimento da fadiga?","o":["O aumento do seu tempo de reacção.","A diminuição do seu tempo de reacção.","A fadiga não influencia a capacidade do condutor."],"c":0,"img":"img/q336.jpg","e":"A fadiga torna o condutor mais lento, ou seja, aumenta o seu tempo de reacção."},{"id":337,"q":"O que provoca num condutor, a elevada ingestão de bebidas alcoólicas","o":["A redução da distância de paragem.","O aumento da capacidade de atenção e concentração.","A redução da capacidade de reacção.","O aumento das capacidades de avaliação das distâncias."],"c":2,"img":"img/q337.jpg","e":"Muito álcool reduz a capacidade de reacção: o condutor reage mais devagar e pior. Não melhora nada na condução."},{"id":338,"q":"A distância mínima a guardar em relação ao veículo que transita à minha frente:","o":["Não deve ser inferior a 30 metros.","Deve ser aquela que me permita, se necessário, imobilizar o veículo em segurança.","Não deve ser superior à distância de paragem.","Deve ser aquela que me permita ver as rodas traseiras do veículo que vai à minha frente."],"c":1,"img":"img/q338.jpg","e":"Não há um número fixo de metros. A distância mínima é a que permite parar em segurança se o veículo da frente travar."},{"id":339,"q":"Mudança de direcção é uma manobra em que:","o":["Um condutor toma outra via que se intersecta com aquela em que vinha circulando.","Um condutor toma outra via que é paralela aquela em que vinha circulando.","Um condutor toma outra faixa de sentido contrário aquela em que vinha circulando.","Um condutor faz inversão de sentido de marcha."],"c":0,"img":"img/q339.jpg","e":"Mudar de direcção é sair da via onde se vai e entrar noutra via que se cruza com ela (virar num cruzamento ou entroncamento)."},{"id":340,"q":"Os veículos que, em razão do serviço a que se destinam, devam parar na via pública ou deslocar-se em marcha lenta devem:","o":["Utilizar o triângulo de pré-sinalização e a luz de presença.","Utilizar as luzes de máximos.","Utilizar avisadores luminosos especiais, em que as características e condições de utilização são fixadas em regulamento.","Utilizar as luzes de médios em alternância com as luzes de presença como fixado em regulamento;"],"c":2,"img":"img/q340.jpg","e":"Veículos que trabalham parados ou devagar na via (obras, reboque, limpeza) usam avisadores luminosos especiais (luzes rotativas amarelas), definidos em regulamento."},{"id":341,"q":"A condução de um veículo implica uma estratégia por parte do seu condutor, que inclui:","o":["A definição de vários trajectos e do tempo de viagem.","A definição de uma trajectória e de uma velocidade.","A definição dos tempos de descanso durante o trajecto."],"c":1,"img":"img/q341.jpg","e":"Conduzir exige uma estratégia: decidir por onde vai passar (trajectória) e a que velocidade."},{"id":342,"q":"O significado deste sinal é:","o":["Parque de estacionamento para todos os automóveis.","Parque de estacionamento para automóveis pesados.","Parque de estacionamento para automóveis ligeiros.","Zona de paragem para automóveis ligeiros."],"c":2,"img":"img/q342.jpg","e":"O sinal de estacionamento (P) com o símbolo de um carro ligeiro indica um parque para automóveis ligeiros."},{"id":343,"q":"Se um indivíduo atingir uma TAS de 1,2 g/l às 0 horas, só por volta das:","o":["12 horas do dia seguinte é que terá eliminado completamente o álcool no seu sangue.","8 horas do dia seguinte é que terá eliminado completamente o álcool no seu sangue.","22 horas do dia seguinte é que terá eliminado completamente o álcool no seu sangue.","4 horas do dia seguinte é que terá eliminado completamente o álcool no seu sangue, se dormir bem."],"c":0,"img":"img/q343.jpg","e":"O corpo elimina cerca de 0,1 g/l de álcool por hora. Com 1,2 g/l são precisas cerca de 12 horas, por isso só ao meio-dia do dia seguinte o álcool desaparece."},{"id":344,"q":"Quando se circula numa zona com grande intensidade de vento, além de reduzir a velocidade, qual deve ser o comportamento a adoptar:","o":["Segurar o volante com especial suavidade por forma a não contrariar as oscilações do veículo.","Segurar o volante com maior firmeza.","Rodar ligeiramente o volante para o lado contrário à direcção do vento.","Acelerar para passar mais rapidamente pela zona onde o vento sopra forte."],"c":1,"img":"img/q344.jpg","e":"Com vento forte, além de abrandar, deve segurar o volante com mais firmeza para corrigir os desvios causados pelas rajadas."},{"id":345,"q":"O sistema nervoso central é afectado por alguns medicamentos.","o":["Só se não forem receitados por um médico.","Depende do sexo e do peso.","Certo.","Os medicamentos não afectam o sistema nervoso central"],"c":2,"img":"img/q345.jpg","e":"Certo. Muitos medicamentos (para dormir, ansiedade, alergias, dores fortes) afectam o sistema nervoso e podem causar sono ou lentidão."},{"id":346,"q":"Como deve ser feita a entrada e saída de passageiros?","o":["Pelo lado direito, se a paragem do veículo for permitida desse lado.","Sempre pelo lado direito.","Sempre pelo lado esquerdo."],"c":0,"img":"img/q346.jpg","e":"Os passageiros entram e saem pelo lado direito apenas se a paragem for permitida desse lado. Regra geral, saem pelo lado da berma ou passeio."},{"id":347,"q":"Em caso de nevoeiro (cacimba) forte:","o":["Deve pensar em parar em local seguro e aguardar que o nevoeiro levante.","Deve pensar em seguir viagem o mais depressa possível para sair da zona de nevoeiro rapidamente.","Deve pensar em seguir viagem buzinando constantemente para assinalar a sua presença.","Deve ligar as luzes de estrada e
