 as luzes de emergência para ser mais facilmente visto pelos outros condutores."],"c":0,"img":"img/q347.jpg","e":"Com nevoeiro muito forte, o mais seguro é parar num local seguro, fora da via, e esperar que o nevoeiro levante."},{"id":348,"q":"Circular com o braço fora do veículo:","o":["É uma contravenção punida com a multa de 500,00 Mt.","É uma contravenção punida com a multa de 1.000,00 Mt.","É uma contravenção punida com a multa de 2.000,00 Mt.","É uma contravenção punida com a multa de 3.000,00 Mt."],"c":1,"img":"img/q348.jpg","e":"Circular com o braço fora do veículo é contravenção punida com multa de 1.000,00 Mt."},{"id":349,"q":"É livre o trânsito rodoviário nas vias de domínio público do Estado e nas vias de domínio privado quando abertas ao trânsito público?","o":["Sim, mas as pessoas devem abster-se de actos que impeçam ou embaracem o trânsito ou comprometam a segurança ou a comodidade dos utentes das vias.","Não, mas as pessoas podem praticar actos que impeçam ou embaracem o trânsito e comprometam a segurança ou a comodidade dos utentes das vias.","Sim, mas as pessoas podem praticar actos que impeçam ou embaracem o trânsito e comprometam a segurança ou a comodidade dos utentes das vias.","Sim, desde que não comprometam a segurança."],"c":0,"img":"img/q349.jpg","e":"O trânsito é livre nas vias públicas e nas privadas abertas ao público, mas ninguém pode fazer nada que impeça, dificulte ou ponha em perigo o trânsito."},{"id":350,"q":"A distância de reacção é:","o":["A distância percorrida pelo veículo desde que o condutor acciona o travão até parar.","A distância percorrida pelo veículo desde que o condutor vê o perigo até reagir.","A distância percorrida pelo veículo desde que o condutor vê o perigo até parar.","A distância percorrida pelo veículo até que o condutor vê o perigo."],"c":1,"img":"img/q350.jpg","e":"Distância de reacção é o que o carro percorre desde que o condutor vê o perigo até começar a reagir (por exemplo, a carregar no travão)."},{"id":351,"q":"Em condições de frio, neve e gelo:","o":["Verifica-se um aumento da aderência e da capacidade de tracção do veículo.","Só em caso de neve e frio é que se verifica uma diminuição da aderência e da capacidade de tracção do veículo.","Verifica-se uma diminuição da aderência e da capacidade de tracção do veículo."],"c":2,"img":"img/q351.jpg","e":"Com frio, neve e gelo, os pneus agarram menos ao piso. A aderência e a tracção diminuem e o carro escorrega mais facilmente."},{"id":352,"q":"Para a realização da tarefa de condução, o sentido da visão é importante porque:","o":["Porque possibilita que se conduza com maior velocidade.","Porque possibilita identificar os gestos da polícia.","Possibilita identificar as formas, as cores e os movimentos de todos os elementos presentes no ambiente rodoviário.","O sentido da visão não é importante para a condução, porque são as mãos e os pés que realizam a tarefa da condução."],"c":2,"img":"img/q352.jpg","e":"A visão é o sentido mais importante na condução: permite identificar formas, cores e movimentos de tudo o que está na estrada."},{"id":353,"q":"O frio excessivo, a chuva e o calor:","o":["Apenas o frio e a chuva aumentam a fadiga na condução.","Aumentam a fadiga na condução.","Apenas a chuva e o calor aumentam a fadiga na condução.","Não aumentam a fadiga na condução."],"c":1,"img":"img/q353.jpg","e":"Frio, chuva e calor obrigam o corpo a esforçar-se mais e aumentam a fadiga na condução."},{"id":354,"q":"Se o veículo entrar em aquaplanagem (hidroplanagem) deve:","o":["Manter a calma e ser suave com os controlos, travar e girar o volante suavemente.","Manter a calma e ser suave com os controlos, acelerar e girar o volante suavemente.","Manter a calma e ser suave com os controlos, não travar nem acelerar ou girar o volante.","Travar forte segurando bem o volante para que a trajectória do veículo não se altere."],"c":2,"img":"img/q354.jpg","e":"Em aquaplanagem os pneus não tocam no chão. Deve manter a calma e não travar, acelerar nem virar o volante, até os pneus voltarem a agarrar."},{"id":355,"q":"Para a execução de manobras, qual dos seguintes lhe parece mais importante?","o":["Dedicação, atenção e uma atitude adequada.","Empenho, atitude adequada e atenção.","Treino, experiência e uma atitude adequada.","Coragem, dedicação e determinação."],"c":2,"img":"img/q355.jpg","e":"As manobras aprendem-se com treino e experiência, e precisam de uma atitude adequada (calma e prudência)."},{"id":356,"q":"A condução defensiva manifesta-se por:","o":["O condutor ser sempre o primeiro a avançar em todas as intersecções.","O condutor ceder os seus direitos em benefício da segurança rodoviária.","O condutor ter em conta apenas os seus direitos e nunca os seus deveres.","O condutor ceder sempre a passagem aos condutores que se apresentem numa intersecção."],"c":1,"img":"img/q356.jpg","e":"Na condução defensiva, o condutor está disposto a abdicar dos seus direitos (por exemplo, da prioridade) se isso evitar um acidente."},{"id":357,"q":"Como devo actuar perante a diminuição da aderência, que provoca o aumento da distância de travagem?","o":["Aumentar a velocidade.","Diminuir a velocidade.","A diminuição da aderência diminui a distância de travagem.","Manter a velocidade."],"c":1,"img":"img/q357.jpg","e":"Com menos aderência, o carro precisa de mais metros para travar. Para compensar, deve diminuir a velocidade."},{"id":358,"q":"Entende-se por cruzamento de veículos:","o":["Quando na mesma via, se encontram dois veículos transitando no mesmo sentido.","Quando os condutores de dois veículos que transitam na mesma via e em sentidos opostos, passam um pelo outro em simultâneo.","Quando dois veículos, circulando na mesma fila, o que se encontra atrás passa para diante do outro."],"c":1,"img":"img/q358.jpg","e":"Cruzamento de veículos é quando dois veículos na mesma via, em sentidos opostos, passam um pelo outro."},{"id":359,"q":"Entende-se por automóvel ligeiro:","o":["O automóvel cuja lotação não excede os 8 lugares.","Todos os automóveis até ao peso de 4500 kg.","O automóvel com PB até 3500 kg e com lotação não superior a 9 lugares, incluindo o condutor."],"c":2,"img":"img/q359.jpg","e":"Automóvel ligeiro é o que tem peso bruto até 3.500 kg e até 9 lugares, contando com o do condutor."},{"id":360,"q":"Quando um veículo acelera a direito (longitudinalmente):","o":["O peso é em parte transferido para o eixo traseiro, devido à inércia.","O peso é em parte transferido para o eixo dianteiro, devido à inércia.","O peso é em parte transferido para o eixo traseiro, devido à força centrífuga.","O peso não é transferido nem para a frente nem para trás devido à suspensão do veículo."],"c":0,"img":"img/q360.jpg","e":"Ao acelerar, a inércia faz o peso passar em parte para trás, para o eixo traseiro. Ao travar acontece o contrário."},{"id":361,"q":"Quem exceder de 30 Km/h a 60 Km/h de velocidade (automóveis ligeiros e motociclos) os limites, fora das localidades é punido:","o":["Com multa de 3.000,00 Mt e contravenção média.","Com multa de 2.000,00 Mt e contravenção leve.","Com multa de 2.000,00 Mt e contravenção média.","Com multa de 2.000,00 Mt e contravenção grave."],"c":2,"img":"img/q361.jpg","e":"Exceder o limite entre 30 e 60 km/h fora das localidades (ligeiros e motociclos) é contravenção média, com multa de 2.000,00 Mt."},{"id":362,"q":"O que deve ser ajustado antes de iniciar a marcha?","o":["De forma folgada o cinto de segurança.","A distância do assento aos pedais, a inclinação das costas do banco e o encosto de cabeça.","O encosto de cabeça e o cinto de segurança."],"c":1,"img":"img/q362.jpg","e":"Antes de arrancar deve ajustar o banco: distância aos pedais, inclinação das costas e encosto de cabeça. O cinto deve ficar justo, não folgado."},{"id":363,"q":"A paragem e o estacionamento devem fazer-se, dentro das localidades,","o":["Nos locais especialmente destinados para esse efeito e pela forma indicada ou na faixa de rodagem, o mais longe possível do respectivo limite esquerdo, paralelamente a este e no mesmo sentido de marcha.","Nos locais especialmente destinados para esse efeito e pela forma indicada ou na faixa de rodagem, o mais próximo possível do limite esquerdo, paralelamente a este e no mesmo sentido de marcha.","Nos locais especialmente destinados para esse efeito e pela forma indicada ou na faixa de rodagem, o mais perto possível do eixo da via, paralelamente a este e no sentido de marcha.","Nos locais especialmente destinados para esse efeito e pela forma indicada ou na faixa de rodagem, o mais próximo possível do limite esquerdo, paralelamente a este e no sentido contrário ao da marcha."],"c":1,"img":"img/q363.jpg","e":"Dentro das localidades, para-se nos locais próprios. Se não houver, na faixa de rodagem, o mais perto possível do limite esquerdo, paralelo a ele e no sentido da marcha."},{"id":364,"q":"Excepto o disposto em regulamentos locais e em caso de manifesta necessidade:","o":["Pode utilizar-se o lado direito da faixa de rodagem para estacionar.","Pode utilizar-se o lado direito da faixa de rodagem para a manobra de marcha atrás.","Pode utilizar-se o lado direito da faixa de rodagem para ultrapassar ou mudar de direcção.","Pode utilizar-se o lado direito da faixa de rodagem para conduzir a grande velocidade."],"c":2,"img":"img/q364.jpg","e":"Como se circula pela esquerda, o lado direito da faixa só se usa para ultrapassar ou mudar de direcção (salvo regulamentos locais ou necessidade)."},{"id":365,"q":"O desempenho da condução é afectado de forma negativa pela agressividade?","o":["Errado.","Certo, mas só em condução urbana.","Certo."],"c":2,"img":"img/q365.jpg","e":"Certo. A agressividade faz o condutor arriscar mais e pensar menos, o que piora a condução e aumenta o risco de acidente."},{"id":366,"q":"A ingestão de pequenas quantidades de bebidas alcoólicas, pode prejudicar a capacidade de condução?","o":["Não, pequenas quantidades são completamente inofensivas.","Sim, pois podem levar à sobrevalorização da capacidade de condução.","Não, se forem ingeridas durante a refeição e com água.","Sim, mas só em condutores pouco habituados a beber."],"c":1,"img":"img/q366.jpg","e":"Mesmo pouco álcool faz o condutor sobrevalorizar a sua capacidade e arriscar mais, além de atrasar as reacções."},{"id":367,"q":"Conduzir em condições atmosféricas adversas:","o":["Afecta a distância de travagem.","Afecta a taxa de alcoolemia.","Reduz a fadiga."],"c":0,"img":"img/q367.jpg","e":"Chuva, nevoeiro, vento ou gelo diminuem a aderência dos pneus. Por isso a distância de travagem aumenta."},{"id":368,"q":"A definição de paragem é:","o":["Imobilização de um veículo pelo tempo estritamente necessário para a entrada ou saída de passageiros ou para breves operações de carga ou descarga, desde que o condutor esteja pronto a retomar a marcha.","Imobilização de um veículo pelo tempo estritamente necessário para a entrada ou saída de passageiros ou para breves operações de carga ou descarga.","Estacionamento de um veículo pelo tempo estritamente necessário para a entrada ou saída de passageiros ou para breves operações de carga ou descarga.","Estacionamento de um veículo pelo tempo estritamente necessário para a entrada ou saída de passageiros ou para breves operações de carga ou descarga, desde que o condutor esteja pronto a retomar a marcha."],"c":0,"img":"img/q368.jpg","e":"Paragem é imobilizar o veículo só o tempo necessário para entrar ou sair passageiros ou carga rápida, com o condutor pronto a arrancar."},{"id":369,"q":"A postura e o posicionamento correctos do condutor, devem:","o":["Proporcionar o alcance aos comandos do rádio e GPS.","Proporcionar o alcance a todos os comandos e controlos, sem que o condutor tenha de se movimentar ou afastar do assento.","Proporcionar o uso folgado do cinto de segurança."],"c":1,"img":"img/q369.jpg","e":"O condutor deve sentar-se de forma a chegar a todos os comandos sem ter de se mexer ou afastar do banco."},{"id":370,"q":"Os condutores devem, nos cruzamentos, entroncamentos e rotundas","o":["Ceder passagem aos veículos que se desloquem sobre carris.","Ceder passagem a todos os veículos.","Ceder passagem a todos os veículos que se apresentem pela esquerda.","Ceder passagem a todos os velocípedes."],"c":0,"img":"img/q370.jpg","e":"Nos cruzamentos, entroncamentos e rotundas, deve ceder a passagem aos veículos que andam sobre carris (como o comboio ou eléctrico)."},{"id":371,"q":"Só é permitido fazer marcha atrás:","o":["Como manobra auxiliar ou de recurso e deve efectuar-se o mais possível à direita, em local de boa visibilidade e onde não prejudique o trânsito.","Como manobra auxiliar ou de recurso e deve efectuar-se o mais possível à esquerda, em local de boa visibilidade e onde não prejudique o trânsito.","Como manobra auxiliar ou de recurso e deve efectuar-se o mais possível junto ao eixo da via, em local de boa visibilidade e onde não prejudique o trânsito.","Como manobra auxiliar ou de recurso e deve efectuar-se o mais possível à esquerda, em local de fraca visibilidade e onde não prejudique o trânsito."],"c":1,"img":"img/q371.jpg","e":"A marcha atrás só se faz como manobra auxiliar, devagar, o mais possível à esquerda (lado por onde se circula), com boa visibilidade e sem prejudicar o trânsito."},{"id":372,"q":"Porque lado o trânsito de veículos ou de animais é feito:","o":["Pela direita das faixas de rodagem e o mais próximo possível das bermas ou passeios mas a uma distância destes que permita evitar qualquer acidente.","Pela esquerda das faixas de rodagem e o mais longe possível das bermas ou passeios mas a uma distância destes que permita evitar qualquer acidente.","Pela esquerda das faixas de rodagem e o mais próximo possível das bermas ou passeios mas a uma distância destes que permita evitar qualquer acidente.","Pela direita das faixas de rodagem e o mais próximo possível das bermas ou passeios mas a uma distância destes que não permita evitar qualquer acidente."],"c":2,"img":"img/q372.jpg","e":"Em Moçambique circula-se pela esquerda da faixa de rodagem, perto da berma ou passeio, mas a uma distância que permita evitar acidentes."},{"id":373,"q":"Este sinal significa:","o":["Raquetas e bandeirola de sinalização.","Proibido passar.","Obrigatório parar.","Homens na via a trabalhar."],"c":0,"img":"img/q373.jpg","e":"As raquetas e a bandeirola são usadas por trabalhadores ou agentes para regular o trânsito em obras (mandar parar ou avançar)."},{"id":374,"q":"O que deve fazer se perceber que o seu veículo vai ser ultrapassado nesta situação?","o":["Afastar-se o mais possível para a esquerda e não aumentar a velocidade, enquanto não for ultrapassado.","Não mudar a sua posição na faixa de rodagem.","Facilitar a ultrapassagem desviando-se para a direita e não aumentando a velocidade.","Impedir que seja realizada a manobra, aumentando a velocidade."],"c":0,"img":"img/q374.jpg","e":"Quando vai ser ultrapassado (pela direita), deve encostar-se o mais possível à esquerda e não acelerar enquanto não for ultrapassado."},{"id":375,"q":"Quem exceder até 20 Km/h de velocidade (automóveis ligeiros e motociclos) os limites, dentro das localidades é punido:","o":["Com multa de 2.000,00 Mt e contravenção leve.","Com multa de 1.000,00 Mt e contravenção leve.","Com multa de 1.000,00 Mt e contravenção média.","Com multa de 2.000,00 Mt e contravenção grave."],"c":1,"img":"img/q375.jpg","e":"Exceder o limite até 20 km/h dentro das localidades (ligeiros e motociclos) é contravenção leve, com multa de 1.000,00 Mt."},{"id":376,"q":"A definição de entroncamento é:","o":["Zona triangular de via pública.","Zona de junção ou bifurcação de vias públicas.","Zona de confluência de trânsito de via pública.","Zona de ultrapassagem proibida."],"c":1,"img":"img/q376.jpg","e":"Entroncamento é a zona onde as vias públicas se juntam ou se separam (bifurcação), por exemplo em forma de T ou Y."},{"id":377,"q":"Posso circular pela parte direita da faixa de rodagem numa via urbana com duplo sentido e uma faixa para cada sentido?","o":["Sim, na aproximação a um cruzamento em que pretenda mudar de direcção à direita.","Sim, em via urbana posso circular pela via da esquerda ou a da direita.","Sim, para ultrapassar.","Não."],"c":2,"img":"img/q377.jpg","e":"Numa via com um só sentido para cada lado, circula-se pela esquerda. O lado direito só se pode usar para ultrapassar."},{"id":378,"q":"O significado destes sinais é:","o":["A - Parque de descanso; B - Parque de estacionamento para veículos do corpo diplomático.","A - Parque de estacionamento; B - Parque de estacionamento para veículos do corpo diplomático.","A - Parque de estacionamento; B - Parque de estacionamento para veículos do governo.","A - Parque de estacionamento; B - Parque de estacionamento para veículos do ministério."],"c":1,"img":"img/q378.jpg","e":"Os sinais indicam: A, parque de estacionamento; B, parque de estacionamento para veículos do corpo diplomático."},{"id":379,"q":"Como medida de prevenção, quando o piso da via está molhado, deve:","o":["Parar.","Reduzir a velocidade.","Aumentar um pouco a velocidade para que a distância de paragem diminua.","Reduzir a distância de segurança."],"c":1,"img":"img/q379.jpg","e":"Com piso molhado os pneus agarram menos e o carro demora mais a parar. Deve reduzir a velocidade."},{"id":380,"q":"O que indica o sinal circular com fundo azul?","o":["Via obrigatória para veículos de construção.","Via obrigatória para autocarros de excursão.","Via obrigatória para circulação de veículos de dimensões anormais."],"c":2,"img":"img/q380.jpg","e":"O sinal azul circular com o símbolo de um veículo largo indica via obrigatória para veículos de dimensões anormais."},{"id":381,"q":"O que se entende por sanção?","o":["A repetição de valores positivos.","A repetição de valores negativos.","O prémio ou castigo anexo às acções humanas."],"c":2,"img":"img/q381.jpg","e":"Sanção é o prémio ou o castigo que resulta das acções humanas. No trânsito, normalmente é a punição de uma infracção."},{"id":382,"q":"O significado deste sinal é:","o":["Queda de pedras à direita.","Queda de pedras à esquerda.","Estrada com buracos na esquerda.","Estrada com buracos na direita."],"c":1,"img":"img/q382.jpg","e":"Sinal de perigo com pedras a cair do lado esquerdo: avisa queda de pedras à esquerda."},{"id":383,"q":"O significado deste sinal é:","o":["Prioridade para quem circula à esquerda.","Prioridade para quem circula à direita.","Trânsito nos dois sentidos.","Prioridade temporária para quem circula à direita."],"c":2,"img":"img/q383.jpg","e":"O sinal de perigo com duas setas em sentidos opostos avisa que a via passa a ter trânsito nos dois sentidos."},{"id":384,"q":"Um pára-brisas sujo, à noite e com chuva, pode:","o":["Aumentar a capacidade de ver as alternativas de acção e aumentar o tempo de análise necessário à tomada de decisão.","Diminuir o tempo de reacção.","Diminuir a capacidade de ver as alternativas de acção e aumentar o tempo de análise necessário à tomada de decisão."],"c":2,"img":"img/q384.jpg","e":"Um pára-brisas sujo, à noite e com chuva, faz ver pior. O condutor vê menos alternativas e precisa de mais tempo para decidir."},{"id":385,"q":"Os condutores não podem exceder as seguintes velocidades instantâneas (em quilómetros/hora):","o":["Motociclos com carro, dentro das localidades 40, fora das localidades 70.","Motociclos com carro, dentro das localidades 50, fora das localidades 70.","Motociclos com carro, dentro das localidades 50, fora das localidades 80.","Motociclos com carro, dentro das localidades 60, fora das localidades 90."],"c":1,"img":"img/q385.jpg","e":"Os motociclos com carro (side-car) podem andar até 50 km/h dentro das localidades e até 70 km/h fora delas."},{"id":386,"q":"O significado deste sinal é:","o":["Trabalhos na estrada.","Obras adjudicadas.","Obras incompletas.","Prudência porque o parque está em obras."],"c":0,"img":"img/q386.jpg","e":"O sinal de perigo com um trabalhador a cavar avisa trabalhos na estrada."},{"id":387,"q":"As luzes devem ser usadas, durante o nevoeiro (cacimba) :","o":["De dia ou de noite.","Só durante a noite.","Durante o dia, se o nevoeiro for muito denso.","De dia e de noite, principalmente as luzes de estrada."],"c":0,"img":"img/q387.jpg","e":"Com nevoeiro deve ligar as luzes de dia e de noite, para ver e ser visto. Os máximos devem ser evitados."},{"id":388,"q":"O que deve fazer quando um velocípede segue no mesmo sentido de trânsito?","o":["Utilizar os sinais sonoros.","Ultrapassá-lo a grande velocidade.","Ter em atenção a instabilidade desse veículo."],"c":2,"img":"img/q388.jpg","e":"Uma bicicleta é instável e pode desviar-se de repente. Deve ter atenção, manter distância lateral e ultrapassá-la com cuidado."},{"id":389,"q":"O que indica o sinal?","o":["Trânsito proibido a veículos de peso total superior a 2 toneladas.","Trânsito proibido a veículos de peso por eixo superior a 2 toneladas.","Trânsito proibido a veículos de peso por eixo inferior a 2 toneladas."],"c":1,"img":"img/q389.jpg","e":"O sinal proíbe a passagem a veículos com peso por eixo superior a 2 toneladas."},{"id":390,"q":"O agente regulador de trânsito, manda:","o":["Parar o tráfego que venha da retaguarda e da frente.","Avançar o tráfego da esquerda.","Parar o tráfego que venha da retaguarda."],"c":2,"img":"img/q390.jpg","e":"Pela posição do agente na imagem, o trânsito que vem da retaguarda (por trás dele) deve parar."},{"id":391,"q":"Dentro das localidades os sinais sonoros, só podem ser usados:","o":["Em caso de manifesta necessidade, podendo ser proibidos nas zonas em que o ordenamento do trânsito seja assegurado por agentes da autoridade ou por instrumentos de sinalização vertical.","Em caso de manifesta necessidade, podendo ser autorizados nas zonas em que o ordenamento do trânsito seja assegurado por sinalização vertical.","Em caso de manifesta necessidade, podendo ser autorizados nas zonas em que o ordenamento do trânsito seja assegurado por sinalização horizontal.","Sempre durante a noite;"],"c":0,"img":"img/q391.jpg","e":"Nas localidades, a buzina só se usa em caso de manifesta necessidade. Pode ser proibida onde o trânsito é regulado por agentes ou por sinais verticais."},{"id":392,"q":"A definição de localidade é:","o":["Zona com edificações cujos limites não são sinalizados.","Zona com edificações cujos limites são devidamente sinalizados.","Zona urbana cujos limites não são sinalizados.","Zona regional cujos limites são sinalizados com sinalização luminosa."],"c":1,"img":"img/q392.jpg","e":"Localidade é uma zona com edificações cujos limites estão sinalizados (com sinais de início e fim de localidade)."},{"id":393,"q":"Como se mede a quantidade de álcool ingerido?","o":["Pela proporção entre a quantidade de álcool ingerido num determinado espaço de tempo.","Pela proporção entre a quantidade de álcool existente num determinado volume de sangue.","Pela proporção entre a quantidade de álcool ingerido em duas horas."],"c":1,"img":"img/q393.jpg","e":"A taxa de álcool mede-se pela quantidade de álcool num certo volume de sangue (g/l), ou no ar expirado (mg/l)."},{"id":394,"q":"A distância de reacção é influenciada por:","o":["Velocidade e tempo de reacção","Distância de travagem e tempo de reacção.","Tempo de reacção e estado da via.","Apenas por factores externos ao condutor."],"c":0,"img":"img/q394.jpg","e":"A distância de reacção depende da velocidade e do tempo de reacção do condutor."},{"id":395,"q":"A direcção assistida permite:","o":["Aumentar o ângulo de viragem.","Diminuir o esforço do condutor no volante.","Diminuir a desmultiplicação no volante.","Efectuar as curvas de uma forma mais rápida."],"c":1,"img":"img/q395.jpg","e":"A direcção assistida torna o volante mais leve, diminuindo o esforço do condutor."},{"id":396,"q":"Nas descidas de inclinação acentuada:","o":["Os automóveis ligeiros não podem transitar sem utilizarem o motor como auxiliar do travão","Todos os automóveis não podem transitar sem utilizarem o motor como auxiliar do travão","Os automóveis pesados não podem transitar sem utilizarem o motor como auxiliar do travão","Só os automóveis pesados de passageiros não podem transitar sem utilizarem o motor como auxiliar do travão"],"c":2,"img":"img/q396.jpg","e":"Nas descidas acentuadas, os pesados devem usar o motor (uma mudança baixa) para ajudar a travar, para os travões não aquecerem e falharem."},{"id":397,"q":"Se passar por um acidente ou por vítimas de doença súbita, deve:","o":["Ligar de imediato para o hospital.","Iniciar de imediato as ações de primeiro socorro mesmo que não domine os procedimentos.","Iniciar de imediato as ações para evitar que a situação de emergência se agrave, incluindo proceder à segurança do local, das vítimas e dos que prestam socorro."],"c":2,"img":"img/q397.jpg","e":"Primeiro deve evitar que a situação piore: sinalizar e tornar seguro o local, protegendo as vítimas e quem ajuda. Só depois socorrer."},{"id":398,"q":"Quem exceder de 40 Km/h até 60 Km/h de velocidade (automóveis ligeiros e motociclos) os limites, dentro das localidades é punido:","o":["Com multa de 4.000,00 Mt e contravenção grave.","Com multa de 6.000,00 Mt e contravenção grave.","Com multa de 4.000,00 Mt e contravenção média.","Com multa de 2.000,00 Mt e contravenção grave."],"c":0,"img":"img/q398.jpg","e":"Exceder o limite entre 40 e 60 km/h dentro das localidades (ligeiros e motociclos) é contravenção grave, com multa de 4.000,00 Mt."},{"id":399,"q":"A distância de travagem depende principalmente de que factores?","o":["Estado psicofísico do condutor e velocidade do veículo.","Tipo e estado da via, estado e velocidade do veículo.","Estado do veículo, tipo de via e visibilidade.","Só depende do estado físico e psiquico do condutor."],"c":1,"img":"img/q399.jpg","e":"A distância de travagem depende do tipo e estado da via e do estado e velocidade do veículo (travões, pneus, carga)."},{"id":400,"q":"Numa paragem ou estacionamento irregular:","o":["A contravenção é punida com a multa de 1000,00 Mt.","A contravenção é punida com a multa de 500,00 Mt.","A contravenção é punida com a multa de 2000,00 Mt.","A contravenção é punida com a multa de 3000,00 Mt."],"c":1,"img":"img/q400.jpg","e":"Parar ou estacionar de forma irregular é contravenção punida com multa de 500,00 Mt."},{"id":401,"q":"Qual das seguintes é uma afirmação falsa:","o":["O sistema de circulação rodoviária é um conjunto de elementos interligados e dependentes.","O homem é o elemento mais importante do sistema rodoviário.","O acidente resulta sempre da falha de vários elementos do sistema rodoviário.","A probabilidade de acidente aumenta quando há uma alteração na interacção entre os vários elementos do sistema rodoviário."],"c":2,"img":"img/q401.jpg","e":"A afirmação falsa é a C: um acidente pode resultar da falha de um só elemento (por exemplo, só do condutor). Não é sempre a soma de várias falhas."},{"id":402,"q":"Em caso de nevoeiro (cacimba), o que devemos ter presente, ao considerar a distância de segurança?","o":["Que basta manter uma distância pequena independentemente da velocidade.","Que essa distância depende unicamente do tipo de veículo que vai à nossa frente.","Que há zonas mais densas onde a visibilidade repentinamente se reduz.","Que como a velocidade praticada pelos veículos é menor devemos seguir mais perto possível do veículo da frente."],"c":2,"img":"img/q402.jpg","e":"O nevoeiro não é uniforme: há zonas mais densas onde a visibilidade cai de repente. Por isso deve manter uma distância maior."},{"id":403,"q":"O condutor está sujeito ao aparecimento de fadiga, quando circula com trânsito intenso?","o":["Está porque é uma situação de transito monótona o que provoca fadiga.","Não está porque circula a velocidade reduzida.","Não está porque nesta situação pode descansar devido à pouca velocidade do trânsito."],"c":0,"img":"img/q403.jpg","e":"Sim. O trânsito intenso, com pára-arranca, é monótono e cansativo e provoca fadiga, mesmo a baixa velocidade."},{"id":404,"q":"Parar ou estacionar, é proibido:","o":["A menos de 3 m para a frente e 15 m para um e outro lado dos sinais indicativos da paragem dos veículos de transporte colectivo de passageiros, consoante circulem ou não sobre carris.","A menos de 5 m para a frente e 15 m para um e outro lado dos sinais indicativos da paragem dos veículos de transporte colectivo de passageiros, consoante circulem ou não sobre carris.","A menos de 3 m para a frente e 10 m para um e outro lado dos sinais indicativos da paragem dos veículos de transporte colectivo de passageiros, consoante circulem ou não sobre carris.","A menos de 1 m para a frente e 10 m para um e outro lado dos sinais indicativos da paragem dos veículos de transporte colectivo de passageiros, consoante circulem ou não sobre carris."],"c":0,"img":"img/q404.jpg","e":"É proibido parar ou estacionar a menos de 3 m para a frente e 15 m para cada lado dos sinais de paragem de transportes colectivos."},{"id":405,"q":"Todo o condutor de veículos ou de animais é obrigado:","o":["Sempre que não haja obstáculo que o impeça, a facilitar imediatamente a ultrapassagem desviando-se o mais possível para a direita e não aumentar a sua velocidade enquanto não for ultrapassado.","Sempre que não haja obstáculo que o impeça, a facilitar imediatamente a ultrapassagem desviando-se o mais possível para a esquerda e aumentar a sua velocidade enquanto não for ultrapassado.","Sempre que não haja obstáculo que o impeça, a facilitar imediatamente a ultrapassagem desviando-se o mais possível para a esquerda e não aumentar a sua velocidade enquanto não for ultrapassado.","Sempre que não haja obstáculo que o impeça, a facilitar imediatamente a ultrapassagem desviando-se o mais possível para o eixo da via e não aumentar a sua velocidade enquanto não for ultrapassado."],"c":2,"img":"img/q405.jpg","e":"Quando vai ser ultrapassado (pela direita), deve encostar-se o mais possível à esquerda e não aumentar a velocidade."},{"id":406,"q":"A expressão “TRAVAR COM O MOTOR” significa:","o":["Desligar o motor, mantendo uma mudança engrenada.","Utilizar o motor de arranque para auxiliar a travagem.","Engrenar uma mudança de maior força em andamento e não acelerar.","Engrenar uma mudança de menor força em andamento e não acelerar."],"c":2,"img":"img/q406.jpg","e":"Travar com o motor é engrenar uma mudança de maior força (uma mudança mais baixa, como a 2.ª ou a 3.ª) e tirar o pé do acelerador. O motor segura o carro."},{"id":407,"q":"Por causa do sono e mesmo sem ter ficado a dormir, pode ter um acidente?","o":["Não.","Sim, mas só durante noite.","Sim, os primeiros sintomas de sonolência já afectam a condução.","Não, se o condutor for experiente e saiba conduzir mesmo com sono."],"c":2,"img":"img/q407.jpg","e":"Antes de adormecer já há sinais de sono (bocejos, olhos pesados, falhas de atenção) que afectam a condução e podem causar acidentes."},{"id":408,"q":"Os condutores de veículos prioritários:","o":["Podem, se necessário, não observar as regras e os sinais de trânsito, com a excepção dos sinais dos agentes reguladores de trânsito.","Não podem nunca deixar de observar as regras e os sinais de trânsito.","Podem, se necessário, não observar os sinais dos agentes reguladores de trânsito."],"c":0,"img":"img/q408.jpg","e":"Os veículos prioritários, em missão urgente, podem não cumprir as regras e os sinais se for necessário, mas têm sempre de obedecer aos agentes reguladores do trânsito."},{"id":409,"q":"Ao aproximar-se de qualquer tipo de intersecção, o condutor do veículo deve:","o":["Demonstrar prudência especial, circulando em velocidade moderada para que possa deter o seu veículo com segurança, para dar passagem ao peão e a veículos que tenham o direito de preferência.","Demonstrar prudência especial, circulando em alta velocidade de forma que possa passar o mais rapidamente possível.","Demonstrar prudência especial, circulando à velocidade de 30Km/h, para que possa travar o seu veículo para dar passagem a animais que transitem na via.","Demonstrar prudência especial, circulando à velocidade de 20Km/h, para que possa travar o seu veículo para dar passagem a animais que transitem na via."],"c":0,"img":"img/q409.jpg","e":"Ao aproximar-se de uma intersecção, deve moderar a velocidade para conseguir parar em segurança e dar passagem aos peões e a quem tem prioridade."},{"id":410,"q":"Assinale a afirmação incorrecta:","o":["A fadiga, a ingestão de bebidas alcoólicas, a velocidade, as condições atmosféricas e o estado emocional do condutor podem influenciar o seu tempo de reacção.","O tempo de reacção é o tempo entre o momento em que o condutor avista um obstáculo e o acto de o tentar evitar.","O aumento do tempo de reacção não aumenta a distância de paragem.","A distância de paragem é influenciada pelo tempo de reacção de um condutor."],"c":2,"img":"img/q410.jpg","e":"A afirmação incorrecta é a C: se o tempo de reacção aumenta, o carro percorre mais metros antes de travar, logo a distância de paragem aumenta."},{"id":411,"q":"O comportamento dos peões deve despertar a nossa atenção?","o":["Sim, apenas em circulação urbana.","Sim, só nos locais destinados à sua travessia.","Sim, sempre e em todas as situações.","Não, quem deve prestar atenção aos veículos são os peões."],"c":2,"img":"img/q411.jpg","e":"Os peões podem ter comportamentos imprevisíveis (crianças, idosos, distraídos). Deve estar atento a eles sempre e em todas as situações."},{"id":412,"q":"O tomar bebidas alcoólicas:","o":["Aumenta o campo visual, a capacidade de exploração visual, a visão dupla e redução da capacidade de readaptação após encandeamento.","Reduz o campo visual, a capacidade de exploração visual e a capacidade de readaptação visual após encandeamento.","Reduz o campo visual, a capacidade de exploração visual e aumenta a capacidade de readaptação visual após encandeamento."],"c":1,"img":"img/q412.jpg","e":"O álcool reduz o campo visual, a capacidade de olhar à volta e a recuperação depois de ser encandeado."},{"id":413,"q":"Um condutor que aproximar excessivamente o automóvel do veículo da frente ou acelerar e travar, de forma inesperada e intencional:","o":["Não viola nenhuma regra do código da estrada nem de civismo.","Manifesta agressividade na condução.","Demonstra que é um condutor seguro, respeitador e que consegue desembaraçar-se no trânsito.","Demonstra que está na posse de qualidades de condução acima da média já que controla as situações de perigo."],"c":1,"img":"img/q413.jpg","e":"Colar ao carro da frente ou acelerar e travar de propósito para assustar é agressividade na condução, e é perigoso."},{"id":414,"q":"A condução nocturna deve influenciar a velocidade a que circulo?","o":["Não, porque quando a visibilidade é menor devo ligar as luzes de estrada.","Não, porque se ligar as luzes de estrada vejo melhor a via do que durante o dia.","Sim, porque influencia a recolha de informação.","Sim, porque de noite pode-se circular um pouco mais rápido, dentro dos limites, porque existe menos trânsito."],"c":2,"img":"img/q414.jpg","e":"Sim. À noite vê-se menos e recolhe-se pior a informação, por isso deve reduzir a velocidade."},{"id":415,"q":"Assinale a afirmação falsa relativa a eventuais efeitos da chuva intensa.","o":["Quando passar num lençol de água e o veículo deslizar, é aconselhável pressionar o travão até que a aderência das rodas seja retomada.","O “aquaplanning” pode ser agravado pelo mau estado dos pneumáticos e pela circulação com velocidade excessiva.","A água acumulada no solo pode reduzir a eficácia do funcionamento dos travões.","O “aquaplanning” pode ser agravado pelo mau estado da suspensão do veículo."],"c":0,"img":"img/q415.jpg","e":"A afirmação falsa é a A: se o carro deslizar num lençol de água, não deve travar. Deve tirar o pé do acelerador e segurar o volante até as rodas voltarem a agarrar."},{"id":416,"q":"Os condutores devem, para permitir a circulação de um veículo prioritário ou da polícia, assinalando devidamente a marcha, que transite numa via congestionada:","o":["Deixar livre uma passagem do lado esquerdo da parte da faixa de rodagem afecta ao seu sentido de circulação, chegando-se o mais possível para a direita e ppdendo, se necessário, utilizar as bermas, excepto se for numa autoestrada.","Deixar livre uma passagem do lado direito da parte da faixa de rodagem afecta ao seu sentido de circulação, chegando-se o mais possível para a esquerda e podendo, se necessário, utilizar as bermas, excepto se for numa autoestrada.","Deixar livre uma passagem do lado esquerdo da parte da faixa de rodagem afecta ao seu sentido de circulação, chegando-se o mais possível para a direita e ppdendo, se necessário, utilizar as bermas, sobretudo se for numa autoestrada."],"c":1,"img":"img/q416.jpg","e":"Como se circula pela esquerda, os veículos prioritários passam pela direita. Deve encostar-se o mais possível à esquerda, deixando passagem livre do lado direito."},{"id":417,"q":"O tomar bebidas alcoólicas:","o":["Reduz a descoordenação motora e a capacidade de avaliação das distâncias.","Aumenta a descoordenação motora e afecta a capacidade de avaliação das distâncias.","Aumenta a descoordenação motora e reduz o risco de acidente.","Em pequenas quantidades não afecta o acto da condução"],"c":1,"img":"img/q417.jpg","e":"O álcool aumenta a descoordenação dos movimentos e piora a avaliação das distâncias."},{"id":418,"q":"Se perceber o principio de um incêndio:","o":["Actue de imediato, desligando as luzes do veículo e utilizando um extintor.","Actue de imediato, desligando o ar condicionado do veículo e utilizando um extintor.","Actue de imediato, desligando o motor do veículo e utilizando um extintor."],"c":2,"img":"img/q418.jpg","e":"Se houver princípio de incêndio, deve desligar logo o motor (corta o combustível e a electricidade) e usar o extintor."},{"id":419,"q":"Qual a frase que melhor define “ver” na afirmação \"conduzir implica ver, pensar e agir”?","o":["Estar muito atento ao condutor que vai à sua frente.","Procurar e seleccionar informação significativa.","Olhar o mais longe possível."],"c":1,"img":"img/q419.jpg","e":"'Ver', na condução, é procurar e seleccionar a informação importante à sua volta, e não apenas olhar."},{"id":420,"q":"Quando um condutor toma bebidas alcoólicas, atinge a taxa (TAS) máxima:","o":["Cerca de 1 hora após a ingestão do último copo.","Cerca de 30 minutos após a ingestão do último copo.","Cerca de 1 hora após a ingestão do primeiro copo."],"c":0,"img":"img/q420.jpg","e":"A taxa de álcool no sangue atinge o máximo cerca de 1 hora depois do último copo."},{"id":421,"q":"O tomar bebidas alcoólicas:","o":["Afecta a trajectória do veículo.","Afecta as capacidades cognitivas e perceptivas do condutor.","Aumenta a capacidade de reacção do condutor.","Diminui a possibilidade de o condutor sofrer de fadiga."],"c":1,"img":"img/q421.jpg","e":"O álcool afecta as capacidades cognitivas (pensar, decidir) e perceptivas (ver, avaliar distâncias) do condutor."},{"id":422,"q":"Como medida defensiva, o condutor deve:","o":["Circular com óculos escuros para evitar encadeamento.","Deve usar sempre a buzina para alertar outros utentes da via da sua presença.","Dar a conhecer as suas intenções através de sinalização.","Parar sempre que se aproxime de um cruzamento para evitar um acidente."],"c":2,"img":"img/q422.jpg","e":"Na condução defensiva, deve mostrar as suas intenções com tempo, usando a sinalização (piscas), para que os outros possam prever o que vai fazer."},{"id":423,"q":"Assinale a afirmação falsa:","o":["A perda momentânea da visão designada por encadeamento, é sempre resultado do cruzamento com um veículo em sentido contrário e com as luzes de estrada ligadas.","Durante a condução nocturna, a visão cromática é afectada o que afecta a identificação dos obstáculos.","Apesar da menor intensidade de trânsito, a gravidade dos acidentes rodoviários verificados durante a noite é normalmente maior.","Nos períodos de aurora (nascer do dia) e crepúsculo (por-do-sol), é mais difícil avaliar as distâncias, bem como distinguir as formas e as cores dos obstáculos"],"c":0,"img":"img/q423.jpg","e":"A afirmação falsa é a A: o encandeamento não vem só dos máximos de quem vem de frente. Também pode ser causado pelo sol, por reflexos ou pelos faróis de quem vem atrás."},{"id":424,"q":"O que pode ser favorecido se tiver a suspensão em bom estado?","o":["A redução da distância de reacção.","A redução da distância de travagem.","O aumento das distâncias de manobra.","A redução da atenção do condutor."],"c":1,"img":"img/q424.jpg","e":"Com a suspensão em bom estado, os pneus mantêm-se em contacto com o chão. Assim a travagem é mais eficaz e a distância de travagem diminui."},{"id":425,"q":"Consideram-se veículos prioritários:","o":["As ambulâncias e veículos da polícia;","Só os que transitam em missão urgente de socorro e comitivas governamentais, mesmo não assinalando adequadamente a sua marcha.","Os que transitam em missão urgente de socorro e comitivas governamentais, assinalando adequadamente a sua marcha.","Apenas as comitivas governamentais;"],"c":2,"img":"img/q425.jpg","e":"São prioritários os veículos em missão urgente de socorro e as comitivas governamentais, desde que assinalem a marcha com sirene e luzes."},{"id":426,"q":"A deslocação do ar causado pela passagem de veículos pesados em alta velocidade:","o":["Provoca ventos frontais que afectam os veículos ligeiros mais leves.","Provoca ventos laterais que afectam, sobretudo os veículos pesados de passageiros.","Provoca ventos laterais que afectam os veículos ligeiros mais leves.","Não tem influência para os outros condutores."],"c":2,"img":"img/q426.jpg","e":"A passagem de um pesado em alta velocidade cria ventos laterais que empurram e desviam os veículos ligeiros mais leves."},{"id":427,"q":"A definição de multa é:","o":["Sanção pecuniária destinada a punir a prática de uma contravenção ao Código da Estrada.","Condenação dada a um indivíduo que infringiu uma norma estabelecida na legislação.","Condenação disciplinar.","Condenação administrativa."],"c":0,"img":"img/q427.jpg","e":"Multa é uma sanção em dinheiro (pecuniária) para punir uma contravenção ao Código da Estrada."},{"id":428,"q":"Quem exceder em mais de 80 Km/h de velocidade (automóveis ligeiros e motociclos) os limites, fora das localidades é punido:","o":["Com multa de 6.000,00 Mt e contravenção grave.","Com multa de 8.000,00 Mt e contravenção média.","Com multa de 8.000,00 Mt e contravenção leve.","Com multa de 8.000,00 Mt e contravenção grave."],"c":3,"img":"img/q428.jpg","e":"Exceder o limite em mais de 80 km/h fora das localidades (ligeiros e motociclos) é contravenção grave, com multa de 8.000,00 Mt."},{"id":429,"q":"Quando os veículos transitem com as luzes acesas por falta de luminosidade:","o":["Os sinais sonoros não podem ser substituídos por sinais luminosos dos faróis do veículo.","É obrigatória a substituição por sinais luminosos dos faróis do veículo usados intermitentemente e por forma a não causar encandeamento.","Os sinais sonoros podem ser substituídos por sinais luminosos dos faróis do veículo usados intermitentemente e por forma a não causar encandeamento.","Os sinais sonoros podem ser substituídos por sinais luminosos dos faróis do veículo usando as luzes de máximos."],"c":2,"img":"img/q429.jpg","e":"Com as luzes acesas, a buzina pode ser substituída por sinais de luzes (piscar os faróis), sem encandear os outros."},{"id":430,"q":"Excedeu o limite de velocidade dentro de uma localidade em 15 km/h, num automóvel ligeiro. Como é punido?","o":["Multa de 1.000,00 Mt, contravenção leve.","Multa de 2.000,00 Mt, contravenção média.","Multa de 500,00 Mt, contravenção leve.","Apenas advertência verbal."],"c":0,"img":"img/q140.jpg","e":"Dentro das localidades, um excesso até 20 km/h (ligeiros e motociclos) é contravenção leve, com multa de 1.000,00 Mt.","t":"Multas e contravenções"},{"id":431,"q":"Dentro de uma localidade, um condutor de ligeiro excede o limite em 50 km/h. Qual é a punição?","o":["Multa de 2.000,00 Mt, contravenção média.","Multa de 4.000,00 Mt, contravenção grave.","Multa de 8.000,00 Mt, contravenção grave.","Multa de 1.000,00 Mt, contravenção leve."],"c":1,"img":"img/q229.jpg","e":"Dentro das localidades, um excesso entre 40 e 60 km/h (ligeiros e motociclos) é contravenção grave, com multa de 4.000,00 Mt.","t":"Multas e contravenções"},{"id":432,"q":"Fora das localidades, um ligeiro circula 45 km/h acima do limite. Como é punido?","o":["Multa de 1.000,00 Mt, contravenção leve.","Multa de 4.000,00 Mt, contravenção grave.","Multa de 2.000,00 Mt, contravenção média.","Multa de 8.000,00 Mt, contravenção grave."],"c":2,"img":"img/q132.jpg","e":"Nas respostas oficiais do INATTER, exceder o limite fora das localidades entre 30 e 60 km/h (ligeiros e motociclos) é contravenção média, com multa de 2.000,00 Mt.","t":"Multas e contravenções"},{"id":433,"q":"Fora das localidades, um ligeiro circula a 210 km/h numa estrada com limite de 120 km/h. Qual é a punição?","o":["Multa de 4.000,00 Mt, contravenção média.","Multa de 8.000,00 Mt, contravenção grave.","Multa de 2.000,00 Mt, contravenção grave.","Multa de 6.000,00 Mt, contravenção grave."],"c":1,"img":"img/q231.jpg","e":"São 90 km/h acima do limite. Exceder em mais de 80 km/h fora das localidades é contravenção grave, com multa de 8.000,00 Mt.","t":"Multas e contravenções"},{"id":434,"q":"Quanto custa inverter o sentido de marcha num local onde é proibido?","o":["500,00 Mt.","2.000,00 Mt.","1.000,00 Mt.","Não é contravenção."],"c":2,"img":"img/q202.jpg","e":"Inverter a marcha onde é proibido é contravenção punida com multa de 1.000,00 Mt (resposta oficial do INATTER).","t":"Multas e contravenções"},{"id":435,"q":"Um passageiro atira uma garrafa pela janela para a estrada. Que tipo de contravenção é?","o":["Leve.","Média.","Grave.","Não é contravenção, porque foi o passageiro."],"c":1,"img":"img/q186.jpg","e":"Atirar ou abandonar objectos ou substâncias na via é contravenção média, seja feito pelo condutor ou por um passageiro.","t":"Multas e contravenções"},{"id":436,"q":"Passa por um acidente com feridos e segue viagem sem prestar nem chamar socorro. Que tipo de contravenção comete?","o":["Leve.","Média.","Grave.","Nenhuma, se não foi o causador."],"c":2,"img":"img/q201.jpg","e":"Deixar de prestar ou providenciar socorro a vítimas de acidente é contravenção grave. Pode até ser crime de omissão de auxílio.","t":"Multas e contravenções"},{"id":437,"q":"Conduzir sob influência de álcool ou de drogas é uma contravenção:","o":["Leve.","Média.","Grave.","Só é contravenção se houver acidente."],"c":2,"img":"img/q286.jpg","e":"Conduzir sob influência de álcool ou de substâncias estupefacientes ou psicotrópicas é sempre contravenção grave.","t":"Multas e contravenções"},{"id":438,"q":"Qual é a punição para quem é apanhado a conduzir sem nunca ter tirado a carta de condução?","o":["Multa de 500,00 Mt.","Apreensão do veículo apenas.","Prisão de três dias a seis meses e multa de 5.000,00 Mt.","Multa de 1.000,00 Mt e contravenção leve."],"c":2,"img":"img/q224.jpg","e":"Conduzir sem carta é crime, punido com prisão de três dias a seis meses e multa de 5.000,00 Mt.","t":"Multas e contravenções"},{"id":439,"q":"Estacionou o carro de forma irregular. Segundo os exames do INATTER, qual é a multa?","o":["500,00 Mt.","1.000,00 Mt.","2.000,00 Mt.","3.000,00 Mt."],"c":0,"img":"img/q400.jpg","e":"Nas respostas oficiais do INATTER, a paragem ou o estacionamento irregular é punido com multa de 500,00 Mt.","t":"Multas e contravenções"},{"id":440,"q":"Colocar na estrada obstáculos que impeçam ou dificultem o trânsito é punido com:","o":["Multa de 500,00 Mt.","Multa de 1.000,00 Mt.","Multa de 3.000,00 Mt.","Apenas remoção do obstáculo."],"c":1,"img":"img/q290.jpg","e":"Colocar obstáculos que impeçam ou embaracem o trânsito e comprometam a segurança é punido com multa de 1.000,00 Mt.","t":"Multas e contravenções"},{"id":441,"q":"O condutor leva o braço pendurado fora da janela durante a marcha. O que acontece se for fiscalizado?","o":["Nada, não é proibido.","Multa de 1.000,00 Mt.","Multa de 500,00 Mt.","Multa de 3.000,00 Mt."],"c":1,"img":"img/q348.jpg","e":"Circular com o braço fora do veículo é contravenção punida com multa de 1.000,00 Mt.","t":"Multas e contravenções"},{"id":442,"q":"Qual destas é a definição correcta de multa?","o":["Sanção em dinheiro para punir uma contravenção ao Código da Estrada.","Pena de prisão aplicada pelo tribunal.","Apreensão da carta de condução.","Advertência escrita feita pelo agente."],"c":0,"img":"img/q427.jpg","e":"Multa é uma sanção pecuniária (em dinheiro) destinada a punir a prática de uma contravenção ao Código da Estrada.","t":"Multas e contravenções"},{"id":443,"q":"Segundo o Código da Estrada (art. 87), não usar o cinto de segurança é punido com:","o":["Multa de 200,00 Mt.","Multa de 500,00 Mt e possível inibição de conduzir.","Multa de 5.000,00 Mt.","Não tem multa, é só um conselho."],"c":1,"img":"img/q243.jpg","e":"O Código da Estrada (art. 87) pune o não uso do cinto com multa de 500,00 Mt, podendo haver inibição de conduzir conforme a reincidência.","t":"Multas e contravenções"},{"id":444,"q":"Segundo o Código da Estrada (art. 89), usar o telemóvel ao volante sem auricular nem alta voz é punido com:","o":["Multa de 500,00 Mt.","Multa de 1.000,00 Mt.","Multa de 2.000,00 Mt.","Não é proibido se a chamada for curta."],"c":2,"img":"img/q155.jpg","e":"O art. 89 proíbe usar telemóvel durante a marcha sem auricular ou sistema de alta voz. A multa é de 2.000,00 Mt.","t":"Multas e contravenções"},{"id":445,"q":"Durante uma fiscalização, o condutor recusa fazer o teste do álcool. O que acontece?","o":["Nada, o teste é voluntário.","Paga só 500,00 Mt.","Comete crime de desobediência e pode ficar inibido de conduzir.","Tem de fazer o teste no dia seguinte."],"c":2,"img":"img/q008.jpg","e":"Segundo o Código da Estrada (art. 80), recusar o teste de álcool é crime de desobediência, com prisão até 3 meses e inibição de conduzir.","t":"Multas e contravenções"},{"id":446,"q":"Qual é o limite de velocidade de um automóvel ligeiro de passageiros sem reboque DENTRO das localidades?","o":["50 km/h.","60 km/h.","40 km/h.","70 km/h."],"c":1,"img":"img/q063.jpg","e":"Dentro das localidades, os ligeiros de passageiros e mistos sem reboque não podem exceder 60 km/h.","t":"Velocidades"},{"id":447,"q":"Qual é o limite de velocidade de um automóvel ligeiro de passageiros sem reboque FORA das localidades?","o":["100 km/h.","90 km/h.","120 km/h.","140 km/h."],"c":2,"img":"img/q003.jpg","e":"Fora das localidades, os ligeiros de passageiros e mistos sem reboque podem andar até 120 km/h.","t":"Velocidades"},{"id":448,"q":"Um autocarro (pesado de passageiros) circula fora das localidades. Qual é a velocidade máxima?","o":["80 km/h.","100 km/h.","120 km/h.","90 km/h."],"c":1,"img":"img/q198.jpg","e":"Os pesados de passageiros podem andar até 60 km/h dentro das localidades e até 100 km/h fora delas.","t":"Velocidades"},{"id":449,"q":"Uma carrinha ligeira de mercadorias com reboque, fora das localidades, não pode exceder:","o":["80 km/h.","90 km/h.","100 km/h.","120 km/h."],"c":2,"img":"img/q213.jpg","e":"Os ligeiros de mercadorias com reboque podem andar até 60 km/h dentro das localidades e até 100 km/h fora delas.","t":"Velocidades"},{"id":450,"q":"Um motociclo simples (sem carro lateral) fora das localidades não pode exceder:","o":["70 km/h.","80 km/h.","90 km/h.","120 km/h."],"c":2,"img":"img/q073.jpg","e":"Fora das localidades, os motociclos simples não podem exceder 90 km/h.","t":"Velocidades"},{"id":451,"q":"Um motociclo com carro lateral (side-car), dentro e fora das localidades, não pode exceder:","o":["40 e 70 km/h.","50 e 70 km/h.","50 e 80 km/h.","60 e 90 km/h."],"c":1,"img":"img/q385.jpg","e":"Os motociclos com carro podem andar até 50 km/h dentro das localidades e até 70 km/h fora delas.","t":"Velocidades"},{"id":452,"q":"Um ciclomotor (motorizada pequena) circula fora de uma localidade. Qual é a velocidade máxima?","o":["40 km/h.","45 km/h.","50 km/h.","60 km/h."],"c":1,"img":"img/q009.jpg","e":"Ciclomotores e quadriciclos: até 40 km/h dentro das localidades e até 45 km/h fora delas.","t":"Velocidades"},{"id":453,"q":"E dentro da localidade, qual é o limite para um ciclomotor ou quadriciclo?","o":["30 km/h.","40 km/h.","45 km/h.","50 km/h."],"c":1,"img":"img/q042.jpg","e":"Dentro das localidades, ciclomotores e quadriciclos não podem exceder 40 km/h.","t":"Velocidades"},{"id":454,"q":"Segundo o Código da Estrada (art. 33), qual é a velocidade MÍNIMA numa auto-estrada?","o":["Não existe velocidade mínima.","40 km/h.","60 km/h.","80 km/h."],"c":1,"img":"img/q234.jpg","e":"O art. 33 proíbe circular numa auto-estrada abaixo de 40 km/h, porque um veículo muito lento é um perigo para os que seguem rápido.","t":"Velocidades"},{"id":455,"q":"Segundo o Código da Estrada (art. 33), um condutor com carta há menos de um ano (não profissional) não pode exceder:","o":["80 km/h.","90 km/h.","100 km/h.","O limite normal da estrada."],"c":1,"img":"img/q130.jpg","e":"O art. 33 limita os condutores não profissionais com carta há menos de um ano a 90 km/h, mesmo que a estrada permita mais.","t":"Velocidades"},{"id":456,"q":"Quando é que a velocidade é considerada excessiva, mesmo abaixo do limite máximo?","o":["Nunca, se respeitar o limite.","Quando o condutor não consegue parar no espaço livre e visível à sua frente.","Só à noite.","Só quando há peões na via."],"c":1,"img":"img/q147.jpg","e":"A velocidade é excessiva sempre que o condutor não consegue parar no espaço livre e visível à frente, mesmo dentro do limite (art. 30 do Código da Estrada).","t":"Velocidades"},{"id":457,"q":"Numa recta com limite de 120 km/h, começa a chover muito. A que velocidade deve andar?","o":["120 km/h, porque é o limite.","A uma velocidade adaptada à chuva, que lhe permita parar no espaço que vê.","Acima de 120 km/h, para sair depressa da chuva.","Sempre a 40 km/h."],"c":1,"img":"img/q178.jpg","e":"O limite é o máximo permitido, não uma obrigação. Com chuva deve reduzir a velocidade, porque a aderência e a visibilidade diminuem.","t":"Velocidades"},{"id":458,"q":"Que efeito tem duplicar a velocidade na distância de travagem?","o":["Fica igual.","Duplica.","Fica cerca de quatro vezes maior.","Diminui para metade."],"c":2,"img":"img/q399.jpg","e":"A distância de travagem cresce com o quadrado da velocidade: a dobrar a velocidade, precisa de cerca de quatro vezes mais metros para parar.","t":"Velocidades"},{"id":459,"q":"Um ligeiro com reboque está dentro de uma localidade. Qual é o limite?","o":["50 km/h.","60 km/h.","40 km/h.","80 km/h."],"c":1,"img":"img/q213.jpg","e":"Dentro das localidades, os ligeiros com reboque também têm o limite de 60 km/h.","t":"Velocidades"},{"id":460,"q":"A que distância, no mínimo, deve ser visível o triângulo de pré-sinalização de perigo?","o":["25 metros.","50 metros.","100 metros.","10 metros."],"c":2,"img":"img/q062.jpg","e":"O triângulo deve ser colocado de forma a ficar bem visível a pelo menos 100 metros, para dar tempo aos outros de abrandar.","t":"Distâncias"},{"id":461,"q":"Dentro das localidades, é proibido parar ou estacionar a menos de quantos metros ANTES de uma passadeira para peões?","o":["3 metros.","5 metros.","10 metros.","15 metros."],"c":1,"img":"img/q302.jpg","e":"É proibido parar ou estacionar a menos de 5 metros antes das passagens assinaladas para peões e velocípedes.","t":"Distâncias"},{"id":462,"q":"Fora das localidades, é proibido parar ou estacionar a menos de quantos metros de cruzamentos, curvas ou lombas de visibilidade reduzida?","o":["20 metros.","30 metros.","50 metros.","100 metros."],"c":2,"img":"img/q327.jpg","e":"Fora das localidades, a distância mínima é de 50 metros dos cruzamentos, entroncamentos, curvas ou lombas de visibilidade reduzida.","t":"Distâncias"},{"id":463,"q":"Junto a uma paragem de machimbombo (autocarro), onde é proibido parar ou estacionar?","o":["A menos de 3 m para a frente e 15 m para cada lado do sinal da paragem.","A menos de 5 m para a frente e 10 m para cada lado.","A menos de 1 m para a frente.","Pode estacionar se for rápido."],"c":0,"img":"img/q404.jpg","e":"É proibido parar ou estacionar a menos de 3 m para a frente e 15 m para um e outro lado dos sinais de paragem de transportes colectivos.","t":"Distâncias"},{"id":464,"q":"Há visibilidade reduzida quando o condutor não consegue ver a faixa de rodagem em toda a largura numa extensão de, pelo menos:","o":["25 metros.","50 metros.","100 metros.","200 metros."],"c":1,"img":"img/q187.jpg","e":"Considera-se visibilidade reduzida ou insuficiente quando não se vê a faixa de rodagem em toda a largura em pelo menos 50 metros.","t":"Distâncias"},{"id":465,"q":"Até que distância devem iluminar eficazmente as luzes de cruzamento (médios)?","o":["Até 30 metros.","Até 50 metros.","Até 100 metros.","Pelo menos 150 metros."],"c":0,"img":"img/q005.jpg","e":"Os médios são baixos para não encandear e iluminam eficazmente a via até 30 metros, no máximo.","t":"Distâncias"},{"id":466,"q":"Qual é a distância de segurança correcta em relação ao veículo da frente?","o":["Sempre 30 metros.","A que permite parar sem bater se o da frente travar de repente.","A suficiente para ver a matrícula do da frente.","2 metros em cidade."],"c":1,"img":"img/q338.jpg","e":"Não há um número fixo de metros. A distância de segurança é a que permite imobilizar o veículo em segurança se o da frente travar.","t":"Distâncias"},{"id":467,"q":"A distância de paragem é igual a:","o":["Distância de reacção + distância de travagem.","Só a distância de travagem.","Distância de segurança + distância de travagem.","Tempo de reacção a dividir pela velocidade."],"c":0,"img":"img/q410.jpg","e":"Distância de paragem = o que percorre enquanto reage + o que percorre a travar até parar.","t":"Distâncias"},{"id":468,"q":"Como se calcula a distância de reacção?","o":["Tempo de reacção a dividir pela velocidade.","Tempo de reacção multiplicado pela velocidade.","Velocidade menos o tempo de reacção.","Depende só do estado dos travões."],"c":1,"img":"img/q279.jpg","e":"Distância de reacção = tempo de reacção × velocidade. Quanto mais depressa e mais lento a reagir, mais metros percorre.","t":"Distâncias"},{"id":469,"q":"O veículo da frente abranda e você mantém a velocidade. O que acontece à distância de segurança?","o":["Aumenta.","Diminui.","Fica igual.","Depende do tipo de veículo."],"c":1,"img":"img/q141.jpg","e":"Se o da frente abranda e você não, aproxima-se dele: a distância de segurança diminui. Deve abrandar também.","t":"Distâncias"},{"id":470,"q":"Se estacionar de noite na faixa de rodagem, deve deixar os mínimos ligados quando a iluminação não permite ver o veículo a:","o":["30 metros.","50 metros.","100 metros.","200 metros."],"c":2,"img":"img/q072.jpg","e":"Se a iluminação pública não permitir reconhecer o veículo a 100 metros, deve deixar ligadas as luzes de presença (mínimos).","t":"Distâncias"},{"id":471,"q":"Segundo o Código da Estrada (art. 61), é proibido usar os máximos quando se segue atrás de outro veículo a menos de:","o":["50 metros.","100 metros.","200 metros.","500 metros."],"c":1,"img":"img/q308.jpg","e":"Os máximos encandeiam pelo espelho. O art. 61 proíbe usá-los a menos de 100 m do veículo da frente e ao cruzar com outros veículos.","t":"Distâncias"},{"id":472,"q":"Com a estrada molhada, a distância de travagem:","o":["Diminui.","Aumenta.","Fica igual.","Só aumenta nos pesados."],"c":1,"img":"img/q379.jpg","e":"Com piso molhado os pneus agarram menos, por isso o veículo precisa de mais metros para parar.","t":"Distâncias"},{"id":473,"q":"No painel acende-se um farol AZUL. Que luzes estão ligadas?","o":["Mínimos.","Médios.","Máximos.","Luzes de nevoeiro."],"c":2,"img":"img/q235.jpg","e":"O farol azul no painel indica as luzes de estrada (máximos). O verde indica os médios.","t":"Luzes"},{"id":474,"q":"No painel acende-se um farol VERDE. Que luzes estão ligadas?","o":["Máximos.","Médios.","Luzes de perigo.","Nenhuma, é um aviso de avaria."],"c":1,"img":"img/q269.jpg","e":"O farol verde indica as luzes de cruzamento (médios). Se fosse azul, seriam os máximos.","t":"Luzes"},{"id":475,"q":"De noite, numa estrada sem trânsito à frente nem em sentido contrário, que luzes pode usar?","o":["Só os mínimos.","Os máximos.","As luzes de perigo.","Nenhuma, se houver luar."],"c":1,"img":"img/q414.jpg","e":"De noite circula-se com os médios. Os máximos podem usar-se quando não há trânsito à frente nem em sentido contrário.","t":"Luzes"},{"id":476,"q":"Vem um carro de frente, de noite. O que deve fazer se tem os máximos ligados?","o":["Manter os máximos para ver melhor.","Passar para os médios, para não o encandear.","Desligar todas as luzes.","Ligar as luzes de perigo."],"c":1,"img":"img/q043.jpg","e":"Ao cruzar com outro veículo deve passar aos médios. Os máximos encandeiam o outro condutor e podem causar um acidente.","t":"Luzes"},{"id":477,"q":"Para que servem as luzes de presença (mínimos)?","o":["Para iluminar a estrada à noite.","Para o veículo ser visto, sobretudo parado ou com pouca luz.","Para substituir os médios em cidade.","Para circular com nevoeiro em vez dos médios."],"c":1,"img":"img/q324.jpg","e":"Os mínimos servem para assinalar a presença do veículo. Não iluminam a via: para isso usam-se os médios e os máximos.","t":"Luzes"},{"id":478,"q":"Quando se devem usar as luzes de perigo (4 piscas)?","o":["Para estacionar em segunda fila.","Quando o veículo fica imobilizado por acidente ou avaria e cria perigo, ou numa travagem brusca.","Para agradecer a outro condutor.","Sempre que chove."],"c":1,"img":"img/q184.jpg","e":"Os 4 piscas usam-se em imobilização por acidente ou avaria que crie perigo, e para avisar quem vem atrás de uma travagem forte ou de um obstáculo.","t":"Luzes"},{"id":479,"q":"De noite, dentro de uma localidade, quer avisar outro condutor. O que deve usar?","o":["A buzina com toques longos.","Sinais luminosos (piscar os faróis), sem encandear.","Gestos com o braço fora da janela.","Nada, é proibido avisar."],"c":1,"img":"img/q078.jpg","e":"À noite, nas localidades, a buzina deve ser substituída por sinais luminosos, para não perturbar o descanso das pessoas.","t":"Luzes"},{"id":480,"q":"Qual é a cor das luzes de travagem (stop)?","o":["Branca.","Amarela.","Vermelha.","Laranja."],"c":2,"img":"img/q167.jpg","e":"As luzes de travagem são sempre vermelhas. Os piscas são amarelos ou cor de laranja e a luz de marcha atrás é branca.","t":"Luzes"},{"id":481,"q":"Qual é a cor da luz de marcha atrás?","o":["Vermelha.","Branca.","Amarela.","Azul."],"c":1,"img":"img/q371.jpg","e":"A luz de marcha atrás é branca, para iluminar atrás do veículo e avisar que ele vai recuar.","t":"Luzes"},{"id":482,"q":"Que luzes iluminam a estrada à noite?","o":["Mínimos ou máximos.","Médios ou máximos.","Mínimos ou médios.","Só as luzes de perigo."],"c":1,"img":"img/q072.jpg","e":"Para iluminar a via usam-se os médios (cruzamento) ou os máximos (estrada). Os mínimos só tornam o veículo visível.","t":"Luzes"},{"id":483,"q":"O pisca ligado para iniciar uma ultrapassagem deve ser desligado:","o":["Antes de mudar de via.","Quando termina a mudança de via.","Só no fim da ultrapassagem completa.","Depois de 500 metros."],"c":1,"img":"img/q248.jpg","e":"O pisca fica ligado até terminar a mudança de via. Para regressar à via original, volta a assinalar.","t":"Luzes"},{"id":484,"q":"Um semáforo mostra luz amarela fixa. O que significa?","o":["Acelerar para passar antes do vermelho.","Parar, a não ser que já esteja tão perto que não consiga parar em segurança.","Avançar com prioridade.","Semáforo avariado."],"c":1,"img":"img/q319.jpg","e":"O amarelo fixo manda parar. Só pode passar se já estiver tão perto que uma travagem seria perigosa.","t":"Luzes"},{"id":485,"q":"Um semáforo está com o amarelo intermitente (a piscar). O que deve fazer?","o":["Parar sempre.","Avançar com prudência redobrada, respeitando as regras de prioridade.","Acelerar, porque não há semáforo a funcionar.","Esperar pelo verde."],"c":1,"img":"img/q065.jpg","e":"O amarelo intermitente avisa para passar com especial cuidado. Aplicam-se as regras de prioridade e os sinais existentes.","t":"Luzes"},{"id":486,"q":"Com nevoeiro (cacimba), porque deve evitar os máximos?","o":["Porque gastam muita bateria.","Porque a luz se reflecte no nevoeiro e encandeia o próprio condutor.","Porque são proibidos durante o dia.","Porque os outros não vêem os máximos."],"c":1,"img":"img/q227.jpg","e":"A luz forte reflecte-se nas gotas do nevoeiro e cria uma parede branca. Com os médios vê-se melhor.","t":"Nevoeiro, chuva e vento"},{"id":487,"q":"Com nevoeiro, as luzes devem estar ligadas:","o":["Só de noite.","De dia e de noite.","Só se o nevoeiro for muito denso.","Só nas auto-estradas."],"c":1,"img":"img/q387.jpg","e":"Com nevoeiro deve ligar as luzes de dia e de noite, para ver e, sobretudo, ser visto.","t":"Nevoeiro, chuva e vento"},{"id":488,"q":"Com nevoeiro, qual é a velocidade segura?","o":["A indicada nos sinais.","A que permite parar no espaço livre e visível à frente.","Sempre abaixo de 20 km/h.","A mesma que com bom tempo."],"c":1,"img":"img/q247.jpg","e":"A velocidade segura é a que permite parar dentro do espaço que consegue ver. Com nevoeiro, esse espaço é pequeno.","t":"Nevoeiro, chuva e vento"},{"id":489,"q":"Entra num nevoeiro muito denso e quase não vê nada. Qual é a atitude mais segura?","o":["Acelerar para sair depressa.","Parar num local seguro, fora da via, e esperar que levante.","Buzinar sempre para avisar.","Ligar máximos e 4 piscas e continuar."],"c":1,"img":"img/q347.jpg","e":"Com nevoeiro muito forte, o mais seguro é parar num local seguro, fora da faixa de rodagem, e esperar.","t":"Nevoeiro, chuva e vento"},{"id":490,"q":"Porque é que, com nevoeiro, deve aumentar a distância de segurança?","o":["Porque os carros andam mais devagar.","Porque há zonas mais densas onde a visibilidade cai de repente.","Porque os travões aquecem.","Não deve: deve seguir colado ao da frente para ver as luzes."],"c":1,"img":"img/q402.jpg","e":"O nevoeiro não é igual em todo o lado. Num banco mais denso, o da frente pode travar de repente e precisa de espaço para parar.","t":"Nevoeiro, chuva e vento"},{"id":491,"q":"O que é a aquaplanagem (hidroplanagem)?","o":["Os pneus deixam de tocar no piso e deslizam sobre uma camada de água.","Uma avaria no limpa-vidros.","Os vidros embaciados com a chuva.","A água a entrar no motor."],"c":0,"img":"img/q273.jpg","e":"Com muita água no piso, os pneus não conseguem escoá-la e o carro flutua sobre ela, perdendo a direcção e a travagem.","t":"Nevoeiro, chuva e vento"},{"id":492,"q":"O carro entrou em aquaplanagem. O que deve fazer?","o":["Travar a fundo.","Acelerar para sair.","Não travar nem acelerar nem virar bruscamente, até os pneus voltarem a agarrar.","Virar o volante todo para um lado."],"c":2,"img":"img/q354.jpg","e":"Mantenha a calma, segure o volante direito e tire o pé do acelerador sem travar, até as rodas voltarem a tocar no piso.","t":"Nevoeiro, chuva e vento"},{"id":493,"q":"Com nevoeiro, quando deve usar os 4 piscas?","o":["Sempre, enquanto houver nevoeiro.","Com o veículo parado, a andar muito devagar ou numa travagem forte e repentina.","Para mudar de direcção.","Nunca."],"c":1,"img":"img/q318.jpg","e":"Com nevoeiro, os 4 piscas usam-se com o veículo imobilizado, em marcha muito lenta ou numa travagem forte, para avisar quem vem atrás.","t":"Nevoeiro, chuva e vento"},{"id":494,"q":"Com frio e nevoeiro os vidros embaciam por dentro. Qual é a consequência?","o":["Vê-se melhor.","A visibilidade diminui, por isso deve usar a ventilação ou o desembaciador.","Não tem importância.","Os travões ficam mais fracos."],"c":1,"img":"img/q096.jpg","e":"O embaciamento tira visibilidade. Ligue a ventilação ou o desembaciador e não arranque sem ter os vidros limpos.","t":"Nevoeiro, chuva e vento"},{"id":495,"q":"Que riscos traz conduzir à chuva?","o":["Menos visibilidade, menos aderência e mais cansaço.","Mais aderência e menor distância de paragem.","Nenhum, se o carro for novo.","Só o risco de sujar o carro."],"c":0,"img":"img/q367.jpg","e":"Com chuva vê-se pior, os pneus agarram menos e o condutor cansa-se mais. Tudo isto aumenta o risco de acidente.","t":"Nevoeiro, chuva e vento"},{"id":496,"q":"Com vento lateral forte, o que deve fazer?","o":["Acelerar para vencer o vento.","Moderar a velocidade e segurar o volante com firmeza.","Seguir ao lado de um camião para se proteger.","Soltar o volante para o carro se ajustar sozinho."],"c":1,"img":"img/q280.jpg","e":"O vento lateral empurra o carro para fora da trajectória. Abrande e segure bem o volante, sobretudo ao sair de pontes ou ao cruzar com pesados.","t":"Nevoeiro, chuva e vento"},{"id":497,"q":"Onde é o vento lateral mais perigoso?","o":["Em ruas com prédios altos.","Em zonas abertas: planícies, costa, montanha e pontes.","Em parques de estacionamento fechados.","Dentro de túneis."],"c":1,"img":"img/q323.jpg","e":"Em zonas abertas não há nada que trave o vento, por isso as rajadas são mais fortes e inesperadas.","t":"Nevoeiro, chuva e vento"},{"id":498,"q":"A partir de que taxa se considera que um condutor está sob influência de álcool?","o":["0,1 mg/l no ar expirado.","0,3 mg/l no ar expirado (0,6 g/l no sangue).","0,6 mg/l no ar expirado.","Só a partir de 1,2 g/l."],"c":1,"img":"img/q060.jpg","e":"Considera-se sob influência de álcool quem tem 0,3 mg/l ou mais no teste de ar expirado, o que corresponde a 0,6 g/l no sangue.","t":"Álcool e drogas"},{"id":499,"q":"Um motorista de machimbombo em serviço pode ter que taxa de álcool?","o":["Até 0,3 mg/l.","Até 0,6 mg/l.","0,0: nenhum álcool.","Até 0,1 mg/l."],"c":2,"img":"img/q277.jpg","e":"Os condutores de transporte público e de cargas perigosas, em serviço, não podem ter nenhum álcool (taxa 0,0).","t":"Álcool e drogas"},{"id":500,"q":"Quanto tempo depois do último copo a taxa de álcool no sangue chega ao máximo?","o":["Logo que se bebe.","Cerca de 30 minutos.","Cerca de 1 hora.","Cerca de 6 horas."],"c":2,"img":"img/q420.jpg","e":"A taxa de álcool no sangue atinge o máximo cerca de 1 hora depois do último copo. Por isso não se deve conduzir logo depois de beber.","t":"Álcool e drogas"},{"id":501,"q":"Que órgão elimina a maior parte do álcool do corpo?","o":["Os pulmões.","Os rins.","O fígado.","O estômago."],"c":2,"img":"img/q165.jpg","e":"O fígado elimina a maior parte do álcool, devagar. Respiração, urina e suor eliminam só uma pequena parte.","t":"Álcool e drogas"},{"id":502,"q":"Bebeu demais. O que faz o álcool sair mais depressa do sangue?","o":["Beber café forte.","Tomar um banho frio.","Beber muita água.","Nada: só o tempo elimina o álcool."],"c":3,"img":"img/q174.jpg","e":"Café, água ou banho frio não aceleram a eliminação. O fígado trabalha ao seu ritmo e só o tempo baixa a taxa de álcool.","t":"Álcool e drogas"},{"id":503,"q":"Às 0 horas uma pessoa tem 1,2 g/l de álcool no sangue. Quando terá eliminado tudo, aproximadamente?","o":["Às 4 horas.","Às 8 horas.","Às 12 horas do dia seguinte.","Às 22 horas do dia seguinte."],"c":2,"img":"img/q343.jpg","e":"O corpo elimina cerca de 0,1 g/l por hora: 1,2 g/l demora cerca de 12 horas, ou seja, até ao meio-dia.","t":"Álcool e drogas"},{"id":504,"q":"Que efeito tem o álcool na visão do condutor?","o":["Aumenta a visão lateral.","Reduz o campo visual (efeito túnel) e a recuperação após encandeamento.","Melhora a visão nocturna.","Não afecta a visão."],"c":1,"img":"img/q326.jpg","e":"O álcool reduz o campo visual, a capacidade de explorar com os olhos e a recuperação depois de ser encandeado.","t":"Álcool e drogas"},{"id":505,"q":"Porque é que mesmo pouco álcool é perigoso?","o":["Porque dá sono imediato.","Porque o condutor se sente mais confiante e arrisca mais, ao mesmo tempo que reage mais devagar.","Não é perigoso abaixo do limite.","Só é perigoso para condutores novos."],"c":1,"img":"img/q366.jpg","e":"Logo com pequenas quantidades o condutor sobrevaloriza a sua capacidade, arrisca mais e reage mais tarde. O risco começa antes do limite legal.","t":"Álcool e drogas"},{"id":506,"q":"Onde pode transportar bebidas alcoólicas num automóvel?","o":["No banco do passageiro.","No porta-luvas.","Fora do habitáculo, por exemplo na bagageira.","Em qualquer lugar, se estiverem fechadas."],"c":2,"img":"img/q046.jpg","e":"É proibido transportar bebidas alcoólicas na parte do veículo reservada aos passageiros. Devem ir na bagageira.","t":"Álcool e drogas"},{"id":507,"q":"Quem pode ser sujeito ao teste de álcool?","o":["Só os condutores de pesados.","Os condutores e os peões intervenientes em acidentes.","Só quem causou um acidente.","Todas as pessoas na rua."],"c":1,"img":"img/q393.jpg","e":"Os testes podem ser feitos aos condutores e também aos peões que intervenham num acidente de trânsito.","t":"Álcool e drogas"},{"id":508,"q":"Toma um medicamento que dá sono. O que deve fazer antes de conduzir?","o":["Parar a medicação por conta própria.","Ler os efeitos secundários e não conduzir se o medicamento afectar a atenção.","Beber café para compensar.","Nada, os medicamentos não afectam a condução."],"c":1,"img":"img/q312.jpg","e":"Alguns medicamentos afectam o sistema nervoso e dão sono. Deve conhecer os efeitos e falar com o médico, sem parar a medicação por conta própria.","t":"Álcool e drogas"},{"id":509,"q":"Uma criança com menos de 3 anos pode ir no banco da frente?","o":["Nunca.","Sim, numa cadeirinha virada para trás e com o airbag do passageiro desligado.","Sim, ao colo de um adulto com cinto.","Sim, com o cinto normal."],"c":1,"img":"img/q031.jpg","e":"Só numa cadeirinha virada para trás e com o airbag desligado. Se o airbag abrir contra a cadeirinha, pode matar a criança.","t":"Crianças, cinto e carta"},{"id":510,"q":"Uma criança de 8 anos, num carro com cintos em todos os lugares, deve ir:","o":["À frente, com o cinto normal.","Atrás, com sistema de retenção homologado e adequado ao seu tamanho e peso.","Atrás, só com o cinto.","Onde quiser, desde que vá sentada."],"c":1,"img":"img/q031.jpg","e":"A criança deve ir atrás, num sistema de retenção (cadeira ou assento elevatório) adequado ao seu tamanho e peso.","t":"Crianças, cinto e carta"},{"id":511,"q":"Pode levar um bebé ao colo, mesmo numa viagem curta?","o":["Sim, se for devagar.","Sim, se for no banco de trás.","Não, deve ir sempre num dispositivo adequado.","Sim, se o adulto tiver o cinto posto."],"c":2,"img":"img/q325.jpg","e":"Num choque, ninguém consegue segurar um bebé ao colo. Ele deve ir sempre numa cadeirinha adequada.","t":"Crianças, cinto e carta"},{"id":512,"q":"A partir de que idade pode uma criança ir num motociclo, segundo os exames do INATTER?","o":["3 anos.","5 anos.","7 anos.","12 anos."],"c":2,"img":"img/q076.jpg","e":"Nas respostas oficiais do INATTER, a criança pode ir num motociclo a partir dos 7 anos, com capacete ajustado e apertado.","t":"Crianças, cinto e carta"},{"id":513,"q":"O cinto de segurança nos bancos de trás é:","o":["Opcional.","Obrigatório.","Obrigatório só fora das localidades.","Só para crianças."],"c":1,"img":"img/q038.jpg","e":"O cinto é obrigatório também atrás. Um passageiro sem cinto pode morrer e ferir gravemente quem vai à frente.","t":"Crianças, cinto e carta"},{"id":514,"q":"Sem o cinto posto, o airbag:","o":["Protege na mesma.","Pode causar lesões graves, porque foi feito para funcionar com o cinto.","Não abre.","Protege só o condutor."],"c":1,"img":"img/q270.jpg","e":"O airbag abre com muita força. Sem cinto, o corpo vai contra ele no momento em que abre e pode sofrer lesões graves.","t":"Crianças, cinto e carta"},{"id":515,"q":"Que veículos pode conduzir com a carta da categoria B?","o":["Motociclos.","Automóveis ligeiros.","Pesados de mercadorias.","Todos."],"c":1,"img":"img/q092.jpg","e":"A categoria B dá para automóveis ligeiros: até 3.500 kg de peso bruto e até 9 lugares, contando com o do condutor.","t":"Crianças, cinto e carta"},{"id":516,"q":"Com a carta B, pode puxar um reboque com que peso bruto máximo?","o":["750 kg.","1.500 kg.","3.500 kg.","Não pode puxar reboques."],"c":0,"img":"img/q213.jpg","e":"Com a carta B pode levar um reboque até 750 kg de peso bruto. Reboques mais pesados exigem outra categoria.","t":"Crianças, cinto e carta"},{"id":517,"q":"Segundo os exames do INATTER, qual é a validade da carta da categoria B?","o":["2 anos.","5 anos.","10 anos.","Para toda a vida."],"c":1,"img":"img/q208.jpg","e":"Nas respostas oficiais do INATTER, a carta da categoria B tem validade de cinco anos.","t":"Crianças, cinto e carta"},{"id":518,"q":"O que é um automóvel ligeiro?","o":["Até 8 lugares, qualquer peso.","Peso bruto até 3.500 kg e até 9 lugares, incluindo o condutor.","Qualquer automóvel até 4.500 kg.","Qualquer automóvel com 4 rodas."],"c":1,"img":"img/q359.jpg","e":"Automóvel ligeiro: peso bruto até 3.500 kg e lotação até 9 lugares, contando com o do condutor.","t":"Crianças, cinto e carta"},{"id":519,"q":"Durante o exame de condução, quem paga as contravenções cometidas?","o":["O instrutor.","O examinador.","O examinando.","A escola de condução."],"c":2,"img":"img/q039.jpg","e":"Quem conduz no exame é o examinando, por isso é ele o responsável pelas contravenções que cometer.","t":"Crianças, cinto e carta"},{"id":520,"q":"Em Moçambique, por que lado da faixa de rodagem se circula?","o":["Pela direita.","Pela esquerda.","Pelo centro.","Depende da estrada."],"c":1,"img":"img/q190.jpg","e":"Em Moçambique circula-se pela esquerda, o mais perto possível da berma ou passeio, mas a uma distância que evite acidentes.","t":"Regras de circulação"},{"id":521,"q":"Por que lado se faz normalmente a ultrapassagem?","o":["Pela esquerda.","Pela direita.","Por qualquer lado.","Pela berma."],"c":1,"img":"img/q110.jpg","e":"Como se circula pela esquerda, a ultrapassagem faz-se pela direita do veículo da frente.","t":"Regras de circulação"},{"id":522,"q":"Quando pode ultrapassar pela ESQUERDA?","o":["Nunca.","Quando o veículo da frente assinala que vai virar à direita e se encosta ao eixo da via.","Sempre que a berma estiver livre.","Quando tem pressa."],"c":1,"img":"img/q040.jpg","e":"É a excepção: se o da frente vai virar à direita e se chega ao centro da via, pode passá-lo pela esquerda, sem perigo.","t":"Regras de circulação"},{"id":523,"q":"Vai ser ultrapassado. O que deve fazer?","o":["Acelerar.","Encostar-se o mais possível à esquerda e não aumentar a velocidade.","Desviar-se para a direita.","Buzinar."],"c":1,"img":"img/q374.jpg","e":"Deve facilitar a ultrapassagem: encostar-se à esquerda e não acelerar até ser ultrapassado.","t":"Regras de circulação"},{"id":524,"q":"Num cruzamento sem sinalização, a quem deve ceder a passagem?","o":["A quem vem pela esquerda.","A quem vem pela direita.","Ao veículo maior.","A quem chegar primeiro."],"c":1,"img":"img/q154.jpg","e":"A regra geral, sem sinalização, é ceder a passagem a quem se apresenta pela direita.","t":"Regras de circulação"},{"id":525,"q":"Numa rotunda, quem tem prioridade?","o":["Quem entra.","Quem já circula dentro da rotunda.","Quem vem mais depressa.","Os veículos pesados."],"c":1,"img":"img/q017.jpg","e":"Quem já está a circular dentro da rotunda tem prioridade. Quem entra cede a passagem.","t":"Regras de circulação"},{"id":526,"q":"Uma ambulância com sirene e luzes aproxima-se numa via congestionada. O que deve fazer?","o":["Parar onde está.","Encostar-se o mais possível à esquerda, deixando passagem livre do lado direito.","Encostar-se à direita.","Acelerar à frente dela."],"c":1,"img":"img/q416.jpg","e":"Como se circula pela esquerda, os prioritários passam pela direita. Encoste-se à esquerda, usando a berma se for preciso (excepto em auto-estrada).","t":"Regras de circulação"},{"id":527,"q":"Qual é a ordem de importância da sinalização?","o":["Marcas no chão, sinais verticais, semáforos, agentes.","Agentes, sinalização temporária, semáforos, sinais verti
