<script>
(function () {
  var CACHE = "treino-inatter-d6e30028e8", TOTAL = 434;
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  window.updateOffline = async function () {
    var el = document.getElementById('offline');
    if (!el || !('caches' in window) || !('serviceWorker' in navigator)) return;
    try {
      var c = await caches.open(CACHE);
      var n = (await c.keys()).length;
      if (n >= TOTAL) { el.textContent = '✓ Pronto para usar sem internet.'; el.className = 'note offline ready'; }
      else { el.textContent = 'A preparar o modo offline… ' + Math.round(n / TOTAL * 100) + '% (mantém a internet ligada)'; el.className = 'note offline'; setTimeout(window.updateOffline, 1500); }
    } catch (e) {}
  };
})();
</script>

<style>
/* Layout: one column. A traffic-light housing heads the page; red / amber / green carry meaning everywhere:
   green = certo / avançar, red = errado / parar, amber = atenção / explicação. */
:root {
  --bg: #f3f1ec;
  --surface: #ffffff;
  --fg: #1b1d21;
  --muted: #5d6169;
  --line: #dcd8cf;
  --housing: #1f2227;      /* traffic-light body */
  --housing-ink: #f5f3ee;
  --red: #d7262b;
  --red-soft: #fde7e6;
  --amber: #f2a900;
  --amber-ink: #6b4a00;
  --amber-soft: #fff4d6;
  --green: #17914a;
  --green-soft: #e1f4e8;
  --off: #3a3e45;          /* unlit lamp */
  --chip: #ebe8e1;
  --display: "Overpass", "Arial Narrow", system-ui, sans-serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417; --surface: #1c1f24; --fg: #eceae5; --muted: #a2a6ad; --line: #30343b;
    --housing: #0b0c0e; --housing-ink: #f5f3ee; --red: #ff5a52; --red-soft: #3a1717;
    --amber: #ffc23a; --amber-ink: #ffd77a; --amber-soft: #352a0f; --green: #3fcf78; --green-soft: #12301f;
    --off: #2b2f35; --chip: #262a30; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417; --surface: #1c1f24; --fg: #eceae5; --muted: #a2a6ad; --line: #30343b;
  --housing: #0b0c0e; --housing-ink: #f5f3ee; --red: #ff5a52; --red-soft: #3a1717;
  --amber: #ffc23a; --amber-ink: #ffd77a; --amber-soft: #352a0f; --green: #3fcf78; --green-soft: #12301f;
  --off: #2b2f35; --chip: #262a30; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.45; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* traffic-light header */
.light-head { background: var(--housing); color: var(--housing-ink); border-radius: 18px; padding: 18px 20px; display: flex; align-items: center; gap: 18px; }
.lamps { display: grid; gap: 8px; background: #000; padding: 10px; border-radius: 14px; flex: none; }
.lamp { width: 30px; height: 30px; border-radius: 50%; background: var(--off); }
.lamp.r { background: var(--red); box-shadow: 0 0 14px var(--red); }
.lamp.y { background: var(--amber); box-shadow: 0 0 14px var(--amber); }
.lamp.g { background: var(--green); box-shadow: 0 0 14px var(--green); }
.light-head h1 { font-size: 32px; font-weight: 900; letter-spacing: .01em; }
.light-head p { margin: 6px 0 0; opacity: .85; font-size: 16px; }
.light-head .txt { min-width: 0; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; }
.stat b { font-family: var(--display); font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); line-height: 1.25; }
.stat.g b { color: var(--green); }
.stat.r b { color: var(--red); }

.section-h { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-family: var(--display); font-weight: 800; margin: 26px 0 10px; }

.modes { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.mode { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: 22px 1fr; gap: 4px 12px; align-items: start; }
.mode:hover:not([disabled]) { border-color: var(--fg); }
.mode .dot { grid-row: span 2; width: 22px; height: 22px; border-radius: 50%; margin-top: 2px; }
.mode .dot.g { background: var(--green); } .mode .dot.y { background: var(--amber); } .mode .dot.r { background: var(--red); } .mode .dot.k { background: var(--fg); } .mode .dot.off { background: var(--chip); border: 1px solid var(--line); }
.mode strong { font-family: var(--display); font-size: 18px; font-weight: 800; }
.mode span.s { color: var(--muted); font-size: 14px; }
.mode[disabled] { opacity: .45; cursor: default; }

.exams { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.exam { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; display: grid; gap: 4px; justify-items: center; }
.exam:hover { border-color: var(--fg); }
.exam strong { font-family: var(--display); font-size: 17px; font-weight: 800; }
.exam small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.exam i { width: 10px; height: 10px; border-radius: 50%; background: var(--chip); border: 1px solid var(--line); }
.exam.ok i { background: var(--green); border-color: var(--green); }
.exam.mid i { background: var(--amber); border-color: var(--amber); }
.exam.bad i { background: var(--red); border-color: var(--red); }
.exam.ok small { color: var(--green); font-weight: 700; }
.exam.mid small { color: var(--amber-ink); font-weight: 700; }
.exam.bad small { color: var(--red); font-weight: 700; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* quiz */
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.back { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 15px; }
.topbar .title { font-family: var(--display); font-weight: 800; font-size: 18px; flex: 1; min-width: 0; }
.counter { font-family: var(--display); font-variant-numeric: tabular-nums; font-weight: 800; background: var(--housing); color: var(--housing-ink); border-radius: 999px; padding: 4px 12px; font-size: 15px; }
.track { display: flex; gap: 3px; margin: 12px 0 16px; flex-wrap: wrap; }
.track i { flex: 1 1 6px; min-width: 4px; height: 7px; border-radius: 4px; background: var(--chip); }
.track i.ok { background: var(--green); } .track i.no { background: var(--red); } .track i.now { background: var(--amber); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.card .pic { background: #000; display: flex; justify-content: center; }
.card .pic img { display: block; max-height: 300px; width: auto; max-width: 100%; }
.card .tag { margin: 14px 18px 0; display: inline-block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--amber-ink); background: var(--amber-soft); border-radius: 999px; padding: 3px 10px; }
.card .qtext { padding: 16px 18px; font-size: 19px; font-weight: 700; }

.opts { display: grid; gap: 10px; margin-top: 14px; }
.opt { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.opt:hover:not([disabled]) { border-color: var(--fg); }
.opt .l { width: 40px; height: 40px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 18px; }
.opt .t { min-width: 0; padding-top: 8px; }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--green); background: var(--green-soft); }
.opt.right .l { background: var(--green); color: #fff; }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt.wrong .l { background: var(--red); color: #fff; }
.opt.dim { opacity: .55; }

.verdict { margin-top: 14px; border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; font-family: var(--display); font-weight: 900; font-size: 20px; }
.verdict .lamp { width: 22px; height: 22px; flex: none; }
.verdict.ok { background: var(--green-soft); color: var(--green); }
.verdict.no { background: var(--red-soft); color: var(--red); }
.verdict small { display: block; font-family: var(--body); font-weight: 600; font-size: 15px; color: var(--fg); }
.why { margin-top: 10px; background: var(--amber-soft); border-left: 5px solid var(--amber); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.why b { font-family: var(--display); font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--amber-ink); }

.actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.primary { background: var(--green); color: #fff; border: 0; border-radius: 14px; padding: 13px 20px; font-family: var(--display); font-weight: 800; font-size: 17px; flex: 1; min-width: 160px; }
.primary.redb { background: var(--red); }
.secondary { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 18px; font-weight: 600; }

/* result */
.result { display: flex; align-items: center; gap: 20px; padding: 22px 20px; margin-top: 14px; background: var(--housing); color: var(--housing-ink); border-radius: 18px; }
.score { font-family: var(--display); font-size: 60px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.score small { font-size: 26px; opacity: .7; }
.result p { margin: 4px 0 0; opacity: .85; }
.review { display: grid; gap: 10px; }
.rev { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.rev.no { border-left: 5px solid var(--red); }
.rev.ok { border-left: 5px solid var(--green); }
.rev .q { font-weight: 700; }
.rev .you { color: var(--red); font-size: 15px; }
.rev .right { color: var(--green); font-size: 15px; font-weight: 700; }
.rev .ex { font-size: 15px; color: var(--fg); background: var(--amber-soft); border-radius: 8px; padding: 8px 10px; }
.rev img { max-width: 160px; border-radius: 8px; }
details.group { margin-top: 18px; }
details.group summary { cursor: pointer; font-family: var(--display); font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 6px 0 10px; }
.note { color: var(--muted); font-size: 14px; }
.signgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.signitem { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.signitem .sp { background: #fff; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; padding: 8px; }
.signitem.photo .sp { padding: 0; }
.signitem .sp svg { width: 100%; height: 100%; display: block; }
.signitem .code { display: inline-block; font-family: var(--display); font-weight: 800; font-size: 12px; background: var(--chip); border-radius: 6px; padding: 1px 6px; margin-right: 6px; }
.catnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.catnav a { font-size: 13px; font-weight: 600; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; text-decoration: none; }
.cnt { font-size: 12px; background: var(--chip); color: var(--muted); border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
.card .pic.svgpic { background: #fff; padding: 14px; }
.card .pic.svgpic svg { width: auto; height: 230px; max-width: 100%; display: block; }
.revsvg { width: 120px; height: 100px; background: #fff; border-radius: 8px; padding: 6px; }
.revsvg svg { width: 100%; height: 100%; }
.signitem img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.signitem figcaption { padding: 8px 10px; font-size: 14px; font-weight: 600; line-height: 1.3; }
.catdesc { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
details.cat { margin-top: 14px; scroll-margin-top: 12px; }
details.cat summary { color: var(--fg); font-size: 16px; }
.signs-group { margin-top: 10px; }
.signs-group summary { font-size: 14px; }
.card.signcard .pic { background: #fff; }
.actions.nav .secondary { flex: none; }
.note.offline { margin-top: 18px; font-weight: 700; }
.note.offline.ready { color: var(--green); }
.danger { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 14px; padding: 4px 0; }
@media (max-width: 480px) {
  .light-head h1 { font-size: 26px; }
  .lamp { width: 24px; height: 24px; }
  .card .qtext { font-size: 18px; }
  .stats { gap: 6px; }
  .stat b { font-size: 22px; }
  .score { font-size: 50px; }
}
@media (prefers-reduced-motion: no-preference) {
  .light-head .lamp { transition: background .3s, box-shadow .3s; }
}
</style>

<script>

const SD = (() => {

  // ---- pictogramas num quadrado 100x100 ----

  function rickshaw(c) {

o tamanho e ao peso da criança e estiver bem fixada. A cor e a colocação sem cuidado não têm nada a ver com segurança."},{"id":13,"q":"É perigoso conduzir quando o condutor está cansado?","o":["Não há perigo, já que o cansaço relaxa.","Sim, porque o condutor demora mais tempo a reagir.","Não, porque se conduz mais devagar.","Sim, mais só quando se conduz dentro das localidades."],"c":1,"img":"img/q013.jpg","e":"O cansaço diminui a atenção e torna as reacções mais lentas. Com reacções lentas, o veículo percorre mais distância antes de o condutor travar, o que aumenta o risco de acidente."},{"id":14,"q":"O que indica o sinal?","o":["Indica a existência de uma via rápida.","Indica a existência de uma via de sentido único.","Indica a existência de uma Auto-Estrada."],"c":2,"img":"img/q014.jpg","e":"O sinal azul com a estrada de duas faixas e uma ponte por cima indica o início de uma auto-estrada."},{"id":15,"q":"O que significa responsabilidade moral?","o":["Responder perante o Tribunal.","Responder pelos seus próprios actos.","Prestar contas perante os membros da sociedade."],"c":1,"img":"img/q015.jpg","e":"Responsabilidade moral é responder pelos seus próprios actos perante a sua consciência. Responder perante o tribunal é a responsabilidade legal (jurídica)."},{"id":16,"q":"O que indica o sinal?","o":["Via obrigatória para veículos que transportam substâncias perigosas.","Fim da proibição de circulação de veículos que transportam substâncias perigosas.","Via obrigatória para automóveis pesados."],"c":0,"img":"img/q016.jpg","e":"Sinal circular azul com a placa de mercadorias perigosas: indica uma via obrigatória para os veículos que transportam substâncias perigosas."},{"id":17,"q":"Nesta situação, quem tem prioridade de passagem?","o":["O condutor que entra na rotunda.","O condutor que chegar primeiro.","O condutor que circula dentro da rotunda.","O condutor que circule com uma velocidade mais elevada."],"c":2,"img":"img/q017.jpg","e":"Nas rotundas, quem já está a circular dentro da rotunda tem prioridade. Quem entra deve ceder a passagem."},{"id":18,"q":"Fumar enquanto conduz...","o":["é aconselhável, pois ajuda a manter a atenção.","é proibido.","pode afectar a atenção na condução.","reduz a agressividade do condutor."],"c":2,"img":"img/q018.jpg","e":"Fumar ao volante não é proibido, mas distrai: acender o cigarro, cinza, fumo nos olhos e tirar uma mão do volante afectam a atenção na condução."},{"id":19,"q":"O que indica o sinal?","o":["Estacionamento proibido.","Paragem e estacionamento proibidos.","Estacionamento condicionado."],"c":1,"img":"img/q019.jpg","e":"O sinal com fundo azul, rebordo vermelho e cruz (X) vermelha proíbe parar e estacionar. Só com uma barra (/) proibiria apenas o estacionamento."},{"id":20,"q":"Na situação apresentada, pode ultrapassar o veículo pela esquerda?","o":["Sim, se esse veículo circula por baixo do limite máximo de velocidade.","Não.","Sim, pode-se sempre ultrapassar pela esquerda.","Sim, porque a linha é descontinua."],"c":1,"img":"img/q020.jpg","e":"Em Moçambique conduz-se pela esquerda, por isso a ultrapassagem faz-se pela direita. Ultrapassar pela esquerda só é permitido em casos especiais (por exemplo, quando o veículo da frente vai virar à direita), o que não é esta situação."},{"id":21,"q":"O que indica o sinal?","o":["Proibição de circulação de peões.","Prioridade de passagem para peões.","Proibição de passagem de peões.","Pista obrigatória para peões."],"c":1,"img":"img/q021.jpg","e":"O sinal vermelho em forma de losango com um peão indica prioridade de passagem para os peões: nesse local os condutores devem ceder-lhes a passagem."},{"id":22,"q":"O que indica o sinal?","o":["Sinalização luminosa em manutenção.","Sinalização luminosa.","Passagem de nível."],"c":0,"img":"img/q022.jpg","e":"Este sinal de perigo, colocado num suporte junto à via, mostra um semáforo riscado: a sinalização luminosa está em manutenção e pode não funcionar normalmente."},{"id":23,"q":"Posso mudar de direcção para a direita nesta situação?","o":["Sim, desde que o assinale com a devida antecedência.","Sim, porque não há nenhuma sinalização que o impeça.","Não, porque não é possível assegurar-se que a manobra pode ser realizada sem perigo."],"c":2,"img":"img/q023.jpg","e":"Só se pode mudar de direcção quando é possível fazê-lo sem perigo. Na situação da imagem não há condições para garantir isso (visibilidade, trânsito ou peões), por isso não deve virar."},{"id":24,"q":"Diante do sinal, o condutor fica a saber que:","o":["Não pode utilizar os sinais sonoros.","Deve utilizar os sinais sonoros.","É obrigado a desligar as luzes de estrada."],"c":0,"img":"img/q024.jpg","e":"O sinal com uma buzina cortada é a proibição de sinais sonoros: nessa zona não pode buzinar, salvo em caso de perigo iminente."},{"id":25,"q":"Não sendo o homem um ser isolado, mas sim que vive em contacto com pessoas iguais a si, os deveres para com os seus semelhantes podem ser:","o":["De respeito e de liberdade.","De dignidade e de integridade física.","De justiça e de caridade."],"c":2,"img":"img/q025.jpg","e":"Os deveres para com os semelhantes são de justiça (dar a cada um o que lhe é devido, respeitar os direitos dos outros) e de caridade (ajudar quem precisa)."},{"id":26,"q":"O que indica o sinal luminoso?","o":["Acesso ou passagem autorizado.","Acesso ou passagem interdito.","Acesso ou passagem condicionado."],"c":2,"img":"img/q026.jpg","e":"No sinal luminoso de controlo de via, a seta amarela oblíqua (ou a luz amarela) indica que a passagem é condicionada: deve mudar de via ou ter cuidado redobrado."},{"id":27,"q":"Que indica a marca rodoviária?","o":["Passagem para peões.","Passagem para ciclistas.","Linha de cedência de prioridade."],"c":0,"img":"img/q027.jpg","e":"As barras brancas largas pintadas paralelamente ao eixo da via (zebra) indicam uma passagem para peões."},{"id":28,"q":"A ingestão de bebidas alcoólicas, mesmo que em pequenas quantidades, pode ter como consequência:","o":["Diminuição do tempo de reacção e da distância de paragem.","Aumento do tempo de reacção e da distância de paragem.","Aumento do tempo de reacção, mas não da distância de paragem.","Maior concentração na tarefa da condução."],"c":1,"img":"img/q028.jpg","e":"O álcool torna o condutor mais lento a reagir. Se reage mais tarde, o carro percorre mais metros antes de começar a travar, por isso a distância de paragem também aumenta."},{"id":29,"q":"Os automóveis ligeiros de passageiros, devem estar equipados com sinais de pré-sinalização de perigo?","o":["Sim, um colete reflector e um triangulo de pré-sinalização de perigo.","Não.","Sim, dois triangulos de pré-sinalização de perigo e um colete reflector.","Sim, apenas são obrigatórios dois triangulos de pré-sinalização de perigo."],"c":2,"img":"img/q029.jpg","e":"Os ligeiros de passageiros devem levar dois triângulos de pré-sinalização de perigo e um colete reflector, para sinalizar o veículo e tornar o condutor visível quando sai do carro."},{"id":30,"q":"O condutor do veículo amarelo ao mudar de direcção para a direita, a quem deve ceder a passagem?","o":["Apenas aos condutores que se apresentem pela direita.","Aos que circulam em sentido contrário e pretendam seguir em frente ou mudar de direcção para a esquerda.","A todos os condutores que circulem pela via transversal.","Só aos condutores que circulam em sentido contrário e sigam em frente."],"c":1,"img":"img/q030.jpg","e":"Como se conduz pela esquerda, virar à direita significa atravessar a faixa de quem vem em sentido contrário. Por isso deve ceder a passagem a quem vem de frente e segue em frente ou vira à esquerda."},{"id":31,"q":"Uma criança de 8 anos, como deve viajar num automóvel equipado com cintos de segurança em todos os lugares?","o":["No banco da frente, com um sistema de retenção homologado e adaptado ao seu tamanho e peso.","No banco da retaguarda, com um sistema de retenção homologado e adaptado ao seu tamanho e peso.","É indiferente, sempre que utilize um sistema de retenção homologado e adaptado ao seu tamanho e peso.","Basta utilizar o cinto de segurança do banco da retaguarda."],"c":1,"img":"img/q031.jpg","e":"Crianças até aos 12 anos devem viajar no banco de trás, com um sistema de retenção homologado e adequado ao seu tamanho e peso. O cinto sozinho não serve para uma criança de 8 anos."},{"id":32,"q":"Quando o condutor tem uma distracção...","o":["demora mais tempo em reagir.","aumenta inconscientemente a velocidade do veículo.","deve avisar com as luzes de perigo.","demora menos tempo em obter as informações necessárias para conduzir com segurança."],"c":0,"img":"img/q032.jpg","e":"Quando o condutor se distrai, demora mais tempo a perceber o perigo e a reagir. Durante esse tempo o veículo continua a andar."},{"id":33,"q":"O que indica o sinal vertical?","o":["Pré-sinalização de via sem saída à direita.","Estrada sem saída.","Pré-sinalização de via sem saída à esquerda."],"c":0,"img":"img/q033.jpg","e":"Este sinal informa com antecedência que a via que sai à direita não tem saída. A posição da barra vermelha mostra o lado da via sem saída."},{"id":34,"q":"De que modo deve verificar o nível de óleo do motor?","o":["Com o motor quente.","Com o motor parado e frio.","Com o motor ligado."],"c":1,"img":"img/q034.jpg","e":"O óleo verifica-se com o motor parado e frio (e o carro em terreno plano), para que o óleo escorra todo para o cárter e a vareta dê a leitura correcta."},{"id":35,"q":"Se pretender inverter o sentido de marcha, deve ter em conta...","o":["que só é permitido fazê-lo nas rotundas.","que é proibido fazê-lo em todos os cruzamentos e entroncamentos.","que a manobra deve ser feita em local e de forma a não prejudicar o trânsito.","que é proibido fazê-lo dentro das localidades."],"c":2,"img":"img/q035.jpg","e":"A inversão de marcha é permitida desde que seja feita em local e de forma a não prejudicar nem pôr em perigo o trânsito. Não é obrigatório fazê-la só em rotundas."},{"id":36,"q":"O que indica o sinal?","o":["Fim da fila de trânsito à esquerda.","Fim da fila de trânsito à direita.","Convergência de filas de trânsito."],"c":2,"img":"img/q036.jpg","e":"O sinal mostra duas filas que se juntam numa só: indica convergência de filas de trânsito, por isso deve ter atenção aos veículos da outra fila."},{"id":37,"q":"Diante do sinal, é proibido:","o":["Mudar de direcção para à direita.","Inverter o sentido de marcha.","Mudar de direcção para à esquerda."],"c":1,"img":"img/q037.jpg","e":"O sinal circular com a seta em forma de U cortada proíbe a inversão do sentido de marcha."},{"id":38,"q":"O uso do cinto de segurança nos assentos traseiros...","o":["podem salvar a vida aos seus ocupantes e impedem que eles causem lesões graves aos outros passageiros.","só são obrigatórios fora das localidades.","são da exclusiva responsabilidade dos ocupantes, já que num acidente seriam os únicos afectados.","não é obrigatório, mas é aconselhável."],"c":0,"img":"img/q038.jpg","e":"O cinto nos bancos de trás é obrigatório. Num choque, um passageiro sem cinto é projectado com grande força e pode morrer ou ferir gravemente quem vai à frente."},{"id":39,"q":"Durante o exame para obter a carta de condução, a responsabilidade pelas contravenções praticadas, é do:","o":["Instrutor.","Examinador.","Examinando."],"c":2,"img":"img/q039.jpg","e":"Durante o exame, quem conduz é o examinando, por isso é ele o responsável pelas contravenções que cometer."},{"id":40,"q":"Se o condutor que me precede assinala a manobra de mudança de direcção para a direita, posso ultrapassar?","o":["Sim, pela direita.","Sim, pela esquerda, certificando-se que o pode fazer sem perigo de acidente.","Não.","Sim, pela direita ou pela esquerda, sempre que o veículo não esteja em movimento."],"c":1,"img":"img/q040.jpg","e":"Quando o veículo da frente assinala que vai virar à direita (e se encosta ao eixo da via), pode ultrapassá-lo pela esquerda, desde que o faça sem perigo. É uma excepção à regra de ultrapassar pela direita."},{"id":41,"q":"O que indica o sinal?","o":["Sentidos obrigatórios possíveis.","Sentido obrigatório para à direita.","Sentido obrigatório giratório."],"c":2,"img":"img/q041.jpg","e":"Sinal azul circular com setas em círculo: indica sentido giratório obrigatório, normalmente à entrada de uma rotunda."},{"id":42,"q":"Qual é a velocidade instantânea que não devem exceder os condutores de ciclomotores e quadriciclos dentro das localidades?","o":["45 km/h.","40 km/h.","50 km/h.","60 km/h."],"c":1,"img":"img/q042.jpg","e":"Dentro das localidades, ciclomotores e quadriciclos não podem exceder 40 km/h. Fora das localidades o limite é 45 km/h."},{"id":43,"q":"O feixe luminoso emitido pelas luzes de cruzamento (médios), deve projectar-se no solo:","o":["E iluminá-lo eficazmente, numa distância não superior a 30 metros.","E no mínimo, iluminá-lo a 100 metros.","E iluminá-lo eficazmente, numa distância não superior a 50 metros."],"c":0,"img":"img/q043.jpg","e":"Os médios são feitos para não encandear, por isso o feixe deve incidir no solo e iluminá-lo eficazmente até 30 metros, no máximo."},{"id":44,"q":"Que efeitos tem a fadiga na condução?","o":["Reduz o tempo de reacção do condutor.","Diminui a sensibilidade ao encandeamento.","Reduz a capacidade de concentração e a segurança.","Melhora a atenção do condutor."],"c":2,"img":"img/q044.jpg","e":"A fadiga diminui a concentração e torna o condutor mais lento a reagir, o que reduz a segurança. Não melhora nada na condução."},{"id":45,"q":"A condução urbana, caracteriza-se essencialmente:","o":["Por uma grande intensidade de trânsito.","Pela abundância de sinais luminosos.","Pela ausência de regras de trânsito.","Pela pouca presença de peões."],"c":0,"img":"img/q045.jpg","e":"Nas cidades há muitos veículos, peões, cruzamentos e paragens. A principal característica da condução urbana é esta grande intensidade de trânsito."},{"id":46,"q":"Pode transportar bebidas alcoólicas na parte do veículo reservada aos passageiros?","o":["Sim, se o condutor não estiver sob influência de álcool.","Sim, sempre que o condutor não tome nada de álcool.","Não, já que é proibido o porte e transporte de bebidas alcoólicas nesta parte do veículo.","Sim."],"c":2,"img":"img/q046.jpg","e":"É proibido levar bebidas alcoólicas na parte do veículo reservada aos passageiros, para evitar o consumo durante a viagem. Devem ir na bagageira."},{"id":47,"q":"O sinal de cor amarela e preta, indica:","o":["Barricada.","Baia limitadora de altura.","Baia indicadora de separador físico."],"c":1,"img":"img/q047.jpg","e":"As faixas amarelas e pretas indicam um obstáculo. Neste caso é uma baia limitadora de altura, que avisa a altura máxima que os veículos podem ter para passar."},{"id":48,"q":"O que se entende por primeiros socorros?","o":["É a chegada rápida do pessoal especializado ao local da ocorrência do sinistro.","É o transporte adequado do sinistrado ou doente ao posto médico.","São os cuidados prestados a uma pessoa que se fere ou adoece de repente, para mantê-la viva e impedir o agravamento da situação.","São os meios humanos e materiais utilizados para a remoção dos acidentados."],"c":2,"img":"img/q048.jpg","e":"Primeiros socorros são os cuidados dados logo a uma pessoa que se feriu ou adoeceu de repente, para a manter viva e impedir que a situação piore até chegar ajuda especializada."},{"id":49,"q":"Para manter a segurança do veículo, devem ser revistos periodicamente:","o":["As luzes, espelhos e o sistema de escape.","Os pneus, amortecedores e travões.","A bateria, o filtro de óleo e o do ar.","O sistema de som."],"c":1,"img":"img/q049.jpg","e":"Pneus, amortecedores e travões estão directamente ligados à aderência, à estabilidade e à capacidade de parar. Por isso são os elementos de segurança a rever periodicamente."},{"id":50,"q":"Nas vias públicas, os peões devem transitar...","o":["pelos passeios, pistas ou passagens a eles destinados ou, se não existirem, pelas bermas.","pela faixa de rodagem, mesmo que existam bermas.","sempre pelas bermas, mesmo que existam pistas especiais destinadas a eles.","pelos passeios, se empurram um veículo de tracção manual."],"c":0,"img":"img/q050.jpg","e":"Os peões devem andar pelos passeios, pistas ou passagens destinadas a eles. Só quando estes não existem podem usar as bermas."},{"id":51,"q":"São evitáveis os acidentes de viação?","o":["Não, porque os acidentes ocorrem por acaso.","Sim, podemos aprender a evitá-los e a reduzir as suas consequências.","Sim, mas só se o estado das estradas melhorar.","Sim, excepto os causados pelo mau estado dos pneus."],"c":1,"img":"img/q051.jpg","e":"A maioria dos acidentes resulta de erros humanos (velocidade, distracção, álcool). Por isso podem ser evitados, e as suas consequências reduzidas, com formação e boa condução."},{"id":52,"q":"Ao travar, o que é que pode acontecer se os travões actuarem de forma desigual sobre as rodas do mesmo eixo?","o":["As rodas bloqueiam.","O veículo altera a sua trajectória.","A distância de paragem diminui.","Melhora a estabilidade do veículo."],"c":1,"img":"img/q052.jpg","e":"Se uma roda trava mais do que a outra do mesmo eixo, o carro puxa para o lado que trava mais e desvia-se da sua trajectória."},{"id":53,"q":"O que indica o sinal?","o":["Fim da proibição de circulação de tractores agrícolas.","Trânsito proibido a veículos de construção.","Trânsito proibido a tractores agrícolas."],"c":2,"img":"img/q053.jpg","e":"O sinal circular com rebordo vermelho e um tractor proíbe a circulação de tractores agrícolas."},{"id":54,"q":"Se pretender inverter o sentido de marcha numa via cuja largura não permite fazê-lo sem prejudicar o trânsito, deve:","o":["Inverter o sentido de marcha com o menor número de manobras possíveis.","Parar o veículo perto do eixo da via e esperar até que não haja tráfego.","Continuar até encontrar um local adequado onde não prejudique o trânsito.","Fazer a manobra, mesmo que prejudique o trânsito."],"c":2,"img":"img/q054.jpg","e":"Se a via é estreita e a manobra prejudica o trânsito, não deve inverter a marcha ali. Deve continuar até encontrar um local adequado."},{"id":55,"q":"O condutor, quando mude de direcção, tem que ceder passagem aos peões que estejam a atravessar a faixa de rodagem?","o":["Não.","Sim, mas só aos que o façam pela passagem para peões.","Sim."],"c":2,"img":"img/q055.jpg","e":"Ao mudar de direcção, o condutor deve sempre ceder a passagem aos peões que estejam a atravessar a via para onde vai entrar, mesmo que não haja passadeira."},{"id":56,"q":"De que modo, o consumo de álcool altera o comportamento do condutor?","o":["Diminui o seu tempo de reacção.","Aumenta a autoconfiança, e por isso aumentam os riscos.","Diminui os seus erros na condução.","Reduz a sua agressividade na condução."],"c":1,"img":"img/q056.jpg","e":"O álcool dá uma falsa sensação de segurança: o condutor fica mais confiante, arrisca mais e avalia mal o perigo. Ao mesmo tempo, reage mais devagar."},{"id":57,"q":"O que indica o sinal?","o":["Trânsito proibido a senhoras.","Paragem proibida.","Paragem obrigatória.","Fim da proibição de estacionamento."],"c":1,"img":"img/q057.jpg","e":"O sinal circular com um S cortado por uma barra vermelha proíbe a paragem."},{"id":58,"q":"O que indica o sinal?","o":["Passagem de peões.","Pista obrigatória para peões.","Passagem desnivelada para peões."],"c":0,"img":"img/q058.jpg","e":"Sinal azul quadrado com um peão sobre a passadeira: indica a localização de uma passagem de peões."},{"id":59,"q":"Pode uma criança com idade inferior a 3 anos viajar no banco da frente do automóvel?","o":["Sim, utilizando um sistema de retenção virado para a retaguarda e com a almofada de ar frontal (airbag) do lado do passageiro desactivado.","Sim, sempre que utilize o cinto de segurança.","Não, em nenhum caso.","Sim, quando o automóvel não tenha nenhum cinto de segurança."],"c":0,"img":"img/q059.jpg","e":"Uma criança com menos de 3 anos pode ir à frente apenas numa cadeirinha virada para trás e com o airbag do passageiro desligado. Se o airbag abrir contra a cadeirinha, pode matar a criança."},{"id":60,"q":"Considera-se sob influência de álcool, o condutor que apresente uma taxa de álcool igual ou superior a:","o":["0.3 mg/l no teste de ar expirado, ou de 0.6 mg/l, em teste sanguíneo.","0.1 mg/l no teste de ar expirado, ou de 0.3 mg/l em teste sanguíneo.","0.6 mg/l no teste de ar expirado, ou de 0.9 mg/l em teste sanguíneo."],"c":0,"img":"img/q060.jpg","e":"Considera-se sob influência de álcool quem tenha 0,3 mg/l ou mais no teste de ar expirado (balão), o que corresponde a 0,6 g/l no sangue."},{"id":61,"q":"O que se entende por inconsciência?","o":["O estado em que o peito da vítima de acidente de viação, desce e sobe regularmente.","O estado no qual o cérebro não está a funcionar bem.","A perda de sangue, resultante da abertura dos vasos sanguíneos.","O aumento da frequência das pulsações por minuto."],"c":1,"img":"img/q061.jpg","e":"Inconsciência é o estado em que o cérebro não está a funcionar normalmente: a vítima não responde a estímulos nem tem consciência do que se passa à volta."},{"id":62,"q":"Em caso de avaria, os sinais de pre-sinalização de perigo devem colocar-se por forma a ficar bem visíveis a uma distância de...","o":["pelo menos 50 metros.","pelo menos 100 metros.","pelo menos 25 metros.","10 metros."],"c":1,"img":"img/q062.jpg","e":"O triângulo de pré-sinalização deve ficar visível a pelo menos 100 metros, para dar tempo aos outros condutores de abrandar."},{"id":63,"q":"Deve ter alguma precaução especial quando circula dentro das localidades?","o":["Não.","Sim, utilizar os sinais sonoros quando se aproximar de peões.","Sim, moderar a velocidade, especialmente nas vias marginadas por edificações.","Sim, apenas não ficar imobilizado nos cruzamentos ou entroncamentos."],"c":2,"img":"img/q063.jpg","e":"Dentro das localidades há peões, crianças e saídas de edifícios. Por isso deve moderar a velocidade, sobretudo nas ruas com casas dos dois lados."},{"id":64,"q":"O que indica a marca rodoviária amarela?","o":["Proibição de paragem.","Estacionamento condicionado.","Proibição de estacionamento."],"c":2,"img":"img/q064.jpg","e":"A linha amarela contínua junto ao passeio proíbe o estacionamento. A linha amarela em ziguezague proibiria a paragem e o estacionamento."},{"id":65,"q":"O que indica o sinal de perigo?","o":["Controlo policial por pirilampos.","Aproximação de uma estrada com prioridade.","Sinalização luminosa."],"c":2,"img":"img/q065.jpg","e":"O sinal triangular de perigo com um semáforo avisa que se aproxima uma zona com sinalização luminosa (semáforos)."},{"id":66,"q":"Nesta via de dois sentidos, posso ultrapassar o veículo azul que assinala a sua intenção de ultrapassar o veículo que o precede?","o":["Sim, pela direita.","Não.","Sim, pela esquerda.","Sim, se existir espaço suficiente para os três na faixa de rodagem.."],"c":1,"img":"img/q066.jpg","e":"Nunca deve ultrapassar um veículo que já está a ultrapassar outro: numa via de dois sentidos isso obriga a ocupar a faixa contrária e põe todos em perigo."},{"id":67,"q":"Das siguentes, qual ou quais não fazem parte das virtudes profissionais necessárias para a boa condução de veículos automóveis:","o":["Responsabilidade.","Egoísmo.","Cortesia e boas maneiras.","Honestidade."],"c":1,"img":"img/q067.jpg","e":"Responsabilidade, cortesia e honestidade são virtudes de um bom condutor. O egoísmo (pensar só em si) é o contrário e é causa de acidentes."},{"id":68,"q":"O que indica o sinal?","o":["Obrigação de circular à velocidade mínima de 60 km/h na fila à direita.","Proibição de circular à velocidade máxima de 60 km/h na fila a direita.","Obrigação de circular à velocidade mínima de 60 km/h na fila à esquerda."],"c":0,"img":"img/q068.jpg","e":"O sinal azul com o número indica velocidade mínima obrigatória: nessa fila (a da direita, neste caso) deve circular a pelo menos 60 km/h."},{"id":69,"q":"O sono pode provocar um accidente durante o dia?","o":["Não, esse tipo de acidentes só acontecem à noite.","Sim, os acidentes motivados pelo sono também acontecem durante o dia.","Sim, mas só se conduz sob a influência de álcool.","Sim, mas apenas durante as primeiras horas da manhã."],"c":1,"img":"img/q069.jpg","e":"O sono pode surgir a qualquer hora, sobretudo depois de comer, em viagens longas ou quando se dormiu pouco. Por isso também causa acidentes de dia."},{"id":70,"q":"O condutor, pode fazer a verificação do nível do óleo no motor do veículo?","o":["Sim, desde que mantenha o motor do veículo a trabalhar.","Não, apenas técnicos especializados o podem fazer.","Sim, desde que saiba a forma correcta de verificação."],"c":2,"img":"img/q070.jpg","e":"Qualquer condutor pode verificar o nível do óleo, desde que saiba fazê-lo bem: motor parado e frio, carro plano, ler a vareta entre o mínimo e o máximo."},{"id":71,"q":"O que indica o sinal?","o":["Pista obrigatória para veículos de tracção manual.","Pista obrigatória para veículos de tracção animal.","Pista obrigatória para cavaleiros."],"c":1,"img":"img/q071.jpg","e":"Sinal azul circular com uma carroça puxada por um animal: pista obrigatória para veículos de tracção animal."},{"id":72,"q":"Para a iluminação da via, os condutores devem ligar as luzes de:","o":["Médios ou máximos.","Mínimos ou máximos.","Mínimos ou médios."],"c":0,"img":"img/q072.jpg","e":"As luzes que iluminam a via são os médios (cruzamento) e os máximos (estrada). Os mínimos (presença) só servem para o veículo ser visto."},{"id":73,"q":"Os condutores de motociclos simples, fora das localidades, não devem exceder a velocidade instantânea de:","o":["90 km/h.","60 km/h.","70 km/h.","80 km/h."],"c":0,"img":"img/q073.jpg","e":"Fora das localidades, os motociclos simples não podem exceder 90 km/h."},{"id":74,"q":"Uma mulher grávida, é obrigada a usar o cinto de segurança?","o":["Não, porque é prejudicial para a criança.","Sim e é muito importante que esteja bem colocado porque senão, tanto ela como a criança, podem sofrer lesões graves em caso de acidente.","Não é obrigatório, mas é aconselhável.","Sim, mas apenas fora das cidades."],"c":1,"img":"img/q074.jpg","e":"A grávida também é obrigada a usar o cinto, com a parte de baixo abaixo da barriga, sobre a bacia. Bem colocado, protege a mãe e o bebé num acidente."},{"id":75,"q":"O que indica o sinal?","o":["A existência de uma berma baixa à esquerda.","A existência de um terreno falso à direita.","A existência de uma berma baixa à direita."],"c":2,"img":"img/q075.jpg","e":"O sinal de perigo com o desnível na berma avisa que a berma está mais baixa do que a faixa de rodagem, do lado direito."},{"id":76,"q":"Pode transportar uma criança neste motociclo?","o":["Sim, se tem pelo menos 3 anos e leva o capacete devidamente ajustado e apertado.","Sim, num assento adicional.","Sim, se tem pelo menos 7 anos e leva o capacete devidamente ajustado e apertado.","Não, nunca."],"c":2,"img":"img/q076.jpg","e":"Segundo as regras do exame, uma criança só pode ir num motociclo a partir dos 7 anos, com capacete ajustado e apertado."},{"id":77,"q":"O significado deste sinal é:","o":["Máquinas.","Zona de máquinas de agricultura.","Zona de máquinas de escavação.","Pista obrigatória para máquinas."],"c":0,"img":"img/q077.jpg","e":"O sinal de perigo com uma máquina (escavadora) avisa da presença de máquinas na via ou junto a ela, por exemplo em obras."},{"id":78,"q":"Dentro das localidades, durante a noite:","o":["Não é obrigatória a substituição dos sinais sonoros pelos sinais luminosos.","É obrigatória a substituição dos sinais sonoros pelos sinais luminosos;","É obrigatória a substituição dos sinais sonoros pelos sinais gestuais.","É escolha do condutor a substituição dos sinais sonoros pelos sinais gestuais."],"c":1,"img":"img/q078.jpg","e":"À noite, dentro das localidades, os sinais sonoros (buzina) devem ser substituídos por sinais luminosos (piscar os faróis), para não incomodar o descanso das pessoas."},{"id":79,"q":"A capacidade de o condutor prever e antecipar aumenta:","o":["Com a categoria do veículo.","Com a experiência.","Com a velocidade do veículo.","Com a idade do condutor."],"c":1,"img":"img/q079.jpg","e":"A capacidade de prever o que vai acontecer na estrada aprende-se: quanto mais experiência o condutor tem, melhor antecipa os perigos."},{"id":80,"q":"O controlo dinâmico do veículo é uma das tarefas da condução e é...","o":["Efectuado através da aceleração e travagem do veículo.","Efectuado através do sistema de direcção.","Efectuado através da definição da sua velocidade e da sua trajectória."],"c":2,"img":"img/q080.jpg","e":"Controlar dinamicamente o veículo é decidir a velocidade e a trajectória a seguir. Acelerar, travar e virar o volante são só os meios para isso."},{"id":81,"q":"O significado deste sinal é:","o":["Entroncamento transversal à esquerda.","Entroncamento colateral à esquerda.","Entrocamento em forma de y ou bifurcação.","Estrada convergente."],"c":2,"img":"img/q081.jpg","e":"O sinal de perigo com a estrada a dividir-se em dois ramos (forma de Y) indica um entroncamento em Y, ou bifurcação."},{"id":82,"q":"Sempre que o veículo esteja parado ou estacionado do lado esquerdo da faixa de rodagem...","o":["OS passageiros devem entrar e sair pelo lado direito do veículo.","OS passageiros devem entrar e sair pelo lado esquerdo do veículo.","OS passageiros não podem sair do veículo.","o condutor deve entrar e sair pelo lado esquerdo do veículo."],"c":1,"img":"img/q082.jpg","e":"Os passageiros devem sair para o lado da berma ou do passeio, longe do trânsito. Se o carro está parado do lado esquerdo, saem pelo lado esquerdo."},{"id":83,"q":"Que deve fazer perante um ferido que tenha uma forte hemorragia na perna?","o":["Por pomada na ferida.","Deve sempre fazer um torniquete na perna lesionada.","Cobrir a ferida e levantar-lhe a perna para reduzir a hemorragia."],"c":2,"img":"img/q083.jpg","e":"Perante uma hemorragia forte numa perna, deve cobrir e comprimir a ferida e elevar a perna, para diminuir a saída de sangue. O torniquete fica para último recurso, não é para usar sempre."},{"id":84,"q":"O que indica o sinal?","o":["Ponte estreita.","Passagem estreita.","Entroncamentos sucessivos."],"c":0,"img":"img/q084.jpg","e":"O sinal de perigo com a estrada a estreitar entre duas linhas laterais avisa uma ponte estreita."},{"id":85,"q":"O condutor deve ter em atenção que, se tem problemas de sono...","o":["Não se encontra em perfeitas condições para conduzir.","É aconselhável tomar bastantes substâncias estimulantes para ficar acordado.","Deve dormir mais horas para conduzir.","O seu estado não tem influência na condução."],"c":0,"img":"img/q085.jpg","e":"Quem tem problemas de sono não está em boas condições para conduzir, porque pode adormecer ou ter falhas de atenção. Estimulantes não resolvem o problema."},{"id":86,"q":"O que indica o sinal?","o":["Trânsito proibido a peões, animais e veículos automóveis.","Trânsito proibido a animais e veículos não automóveis.","Trânsito proibido a peões, animais e veículos não automóveis."],"c":2,"img":"img/q086.jpg","e":"O sinal proíbe a circulação de peões, animais e veículos não automóveis (como bicicletas e carroças). É usado, por exemplo, em vias rápidas."},{"id":87,"q":"Os acidentes devido ao sono acontecem...","o":["Somente quando o condutor fica a dormir profundamente.","Sempre de noite.","Também antes do condutor adormecer.","Quando o condutor é inexperiente."],"c":2,"img":"img/q087.jpg","e":"Antes de adormecer, o condutor já tem falhas de atenção e microssonos de poucos segundos. Por isso os acidentes por sono acontecem mesmo antes de ele adormecer por completo."},{"id":88,"q":"O condutor, pode utilizar aparelhos radiotelefónicos durante a marcha do veículo?","o":["Sim, já que não prejudica o exercício da condução com segurança.","Sim, mas apenas para mensagens de texto.","Apenas se for dotado de um auricular ou de microfone com sistema de alta voz, cuja utilização não implique um manuseamento continuado.","Não, é sempre proibido ao condutor utilizar aparelhos radiotelefónicos."],"c":2,"img":"img/q088.jpg","e":"Pode falar ao telefone a conduzir só com auricular ou sistema de alta voz, desde que não tenha de manusear continuamente o aparelho. Escrever mensagens é proibido."},{"id":89,"q":"A definição de inversão do sentido da marcha é:","o":["Manobra através da qual o condutor coloca o veículo em sentido oposto, na mesma direcção.","Manobra através da qual o condutor coloca o veículo no mesmo sentido.","Manobra através da qual o condutor coloca o veículo no mesmo sentido, em direcção oposta.","Manobra através da qual o condutor coloca o veículo no mesmo sentido e na mesma direcção."],"c":0,"img":"img/q089.jpg","e":"Inverter o sentido de marcha é virar o carro para seguir na mesma estrada (mesma direcção), mas no sentido oposto."},{"id":90,"q":"O que indica o sinal complementar de perigo?","o":["Baia direccional para a direita.","Baia indicadora de direcção à direita.","Baia direccional para a esquerda."],"c":1,"img":"img/q090.jpg","e":"Baia com setas brancas a apontar para a direita: é uma baia indicadora da direcção a seguir, neste caso à direita (usada em curvas e desvios)."},{"id":91,"q":"O sinal indica:","o":["Estacionamento limitado.","Estacionamento proibido.","Estacionamento condicionado."],"c":2,"img":"img/q091.jpg","e":"O sinal circular de fundo azul, rebordo vermelho e uma barra refere-se ao estacionamento. Segundo a resposta oficial do exame, aqui indica estacionamento condicionado: só é permitido nas condições indicadas."},{"id":92,"q":"Que veículos podem conduzir as pessoas que só possuam a carta de condução da categoria B?","o":["Todos.","Automóveis ligeiros.","Automóveis pesados de mercadorias ou de passageiros.","Motociclos com ou sem carro."],"c":1,"img":"img/q092.jpg","e":"A carta da categoria B permite conduzir automóveis ligeiros. Pesados e motociclos exigem outras categorias."},{"id":93,"q":"O que deve fazer o condutor para para prevenir os acidentes?","o":["Conduzir alcoolizado.","Ignorar os sinais de trânsito.","Praticar uma condução defensiva."],"c":2,"img":"img/q093.jpg","e":"A condução defensiva (prever os erros dos outros, manter distância, respeitar a sinalização) é a melhor forma de prevenir acidentes."},{"id":94,"q":"A carga mal acondicionada pode contribuir para:","o":["Reduzir a visibilidade do condutor.","Aumentar o equilíbrio do veículo.","Reduzir o tempo de reacção.","Aumentar a estabilidade facilitando a sua condução."],"c":0,"img":"img/q094.jpg","e":"A carga mal arrumada pode tapar os vidros e espelhos, reduzindo a visibilidade do condutor, e pode ainda deslocar-se e desequilibrar o veículo."},{"id":95,"q":"A entrada e saída de passageiros deve fazer-se:","o":["Pelo lado direito ou esquerdo indistintamente.","Pelo lado permitido para a paragem.","Sempre pelo lado esquerdo.","Sempre o condutor pela direita e os restantes ocupantes pela esquerda."],"c":1,"img":"img/q095.jpg","e":"Os passageiros entram e saem pelo lado em que o veículo pode parar (lado da berma ou passeio), para não ficarem expostos ao trânsito."},{"id":96,"q":"As baixas temperaturas que normalmente acompanham a existência de nevoeiro, que podem provocar?","o":["O embaciamento dos vidros e consequente aumento da visibilidade para o exterior.","Ser mais fácil limpar os vidros já que estes estão molhados.","O embaciamento dos vidros e consequente diminuição da visibilidade para o exterior."],"c":2,"img":"img/q096.jpg","e":"Com frio e nevoeiro, os vidros embaciam por dentro, o que diminui a visibilidade. Deve usar a ventilação e o desembaciador."},{"id":97,"q":"Os jovens, têm mais possibilidades de ter acidentes rodoviários?","o":["Sim, normalmente fazem uma avaliação incorrecta dos riscos.","Sim, devido à falta de reflexos.","Sim, a sua visão é mais reduzida.","Não."],"c":0,"img":"img/q097.jpg","e":"Os jovens têm mais acidentes sobretudo porque avaliam mal os riscos e sobrevalorizam a sua capacidade. Os reflexos e a visão costumam até ser bons."},{"id":98,"q":"O significado deste sinal é:","o":["Sinalização de itinerário (intersecção de nível);","Pré-sinalização de itinerário (intersecção de nível).","Sinalização de via interrompida.","Sinalização de itinerário obrigatório."],"c":1,"img":"img/q098.jpg","e":"Este sinal aparece antes do cruzamento para informar os destinos de cada direcção: é pré-sinalização de itinerário numa intersecção de nível."},{"id":99,"q":"O significado deste sinal é:","o":["Área reservada para motociclos.","Zona reservada para motociclos.","Estrada reservada para motociclos.","Troço reservado para motociclos."],"c":0,"img":"img/q099.jpg","e":"O sinal indica o início de uma área (zona delimitada) reservada a motociclos."},{"id":100,"q":"Sempre que saia de um caminho particular, o condutor deve:","o":["Ceder a passagem apenas aos veículos à motor.","Ceder a passagem a todos e quaisquer veículos.","Avançar porque tem prioridade."],"c":1,"img":"img/q100.jpg","e":"Quem sai de um caminho particular (garagem, quinta, parque) não tem prioridade e deve ceder a passagem a todos os veículos que circulam na via pública."},{"id":101,"q":"Quando carregado, a distância de paragem de um veículo em circulação:","o":["Aumenta, somente nas descidas.","Diminui, excepto nas descidas.","Aumenta.","Quando a carga está bem acondicionada não se altera."],"c":2,"img":"img/q101.jpg","e":"Um veículo carregado é mais pesado e tem mais inércia, por isso precisa de mais metros para parar."},{"id":102,"q":"Que deve fazer o condutor perante a marca rodoviária de cor branca?","o":["Manter-se na via de trânsito que ela delimita, só podendo ser pisada ou transposta para efectuar manobras.","Manter-se na via de trânsito que ela delimita, não podendo ser pisada ou transposta.","Manter-se na via de trânsito que ela delimita, devendo abrandar a marcha."],"c":0,"img":"img/q102.jpg","e":"A linha branca descontínua delimita as vias de trânsito. Deve manter-se dentro da sua via, mas pode pisá-la ou atravessá-la para fazer manobras (ultrapassar, mudar de via)."},{"id":103,"q":"O significado deste sinal é:","o":["Queda de pedras à esquerda.","Queda de pedras à direita.","Estrada com buracos na esquerda.","Estrada com buracos na direita."],"c":1,"img":"img/q103.jpg","e":"Sinal de perigo com pedras a cair do lado direito: avisa queda de pedras à direita."},{"id":104,"q":"O ordenamento do trânsito em todas as estradas, compete...","o":["aos Corpos Administrativos ou Conselhos Municipais.","à Policia Municipal.","ao INATTER.","à Policia de Trânsito."],"c":2,"img":"img/q104.jpg","e":"Em Moçambique, o ordenamento do trânsito nas estradas compete ao INATTER (Instituto Nacional dos Transportes Terrestres)."},{"id":105,"q":"Os condutores de veículos ou animais que pretendam mudar de direcção para à direita, devem:","o":["Aproximar-se com a devida antecedência da berma da via e efectuar a manobra de modo a dar a esquerda à parte central do cruzamento ou entroncamento.","Aproximar-se com a devida antecedência do eixo da via e efectuar a manobra de modo a dar a esquerda à parte central do cruzamento ou entroncamento.","Aproximar-se com a devida antecedência do eixo da via e efectuar a manobra de modo a dar a direita à parte central do cruzamento ou entroncamento.","Aproximar-se com a devida antecedência da berma da via e efectuar a manobra de modo a dar a direita à parte central do cruzamento ou entroncamento."],"c":1,"img":"img/q105.jpg","e":"Como se circula pela esquerda, virar à direita significa atravessar a faixa. Deve encostar-se com antecedência ao eixo da via e fazer a curva deixando o centro do cruzamento à sua esquerda."},{"id":106,"q":"Com nevoeiro (cacimba), a distância de segurança aplicável:","o":["É a mesma que em condições de boa visibilidade.","É a indicada pela sinalização vertical.","Não é a mesma que em condições de boa visibilidade.","É menor para permitir ver o carro que segue à sua frente."],"c":2,"img":"img/q106.jpg","e":"Com nevoeiro vê-se pior e o piso pode estar molhado. A distância de segurança não é a mesma de quando há boa visibilidade: deve ser maior."},{"id":107,"q":"Os sistemas de segurança activa de um veículo...","o":["ajudam o condutor a reduzir a possibilidade de ter um acidente.","minimizam as lesões em caso de acidente.","eliminam a possibilidade de sofrer lesões em caso da acidente."],"c":0,"img":"img/q107.jpg","e":"A segurança activa (travões, ABS, pneus, luzes, direcção) ajuda a evitar o acidente. A segurança passiva (cinto, airbag) reduz as lesões quando o acidente acontece."},{"id":108,"q":"Os condutores não podem:","o":["Iniciar ou retomar a marcha sem buzinar e adoptarem as precauções necessárias para evitar qualquer acidente.","Iniciar ou retomar a marcha sem ligar as luzes de presença e adoptarem as precauções necessárias para evitar qualquer acidente.","Iniciar ou retomar a marcha sem assinalar com a necessária antecedência a sua intenção e sem adoptarem as precauções necessárias para evitar qualquer acidente.","Iniciar ou retomar a marcha sem ligar as luzes de STOP e adoptarem as precauções necessárias para evitar qualquer acidente."],"c":2,"img":"img/q108.jpg","e":"Antes de arrancar ou retomar a marcha, o condutor deve assinalar com antecedência (pisca) e tomar as precauções para evitar acidentes. Buzinar ou ligar luzes não é o que a regra exige."},{"id":109,"q":"O que indica o sinal circular?","o":["Trânsito proibido para todos os veículos automóveis.","Proibição de ultrapassagem para automóveis ligeiros.","Proibição de ultrapassagem para motociclos simples."],"c":2,"img":"img/q109.jpg","e":"Sinal circular de proibição com um motociclo e um carro: proíbe a ultrapassagem por motociclos simples."},{"id":110,"q":"As ultrapassagens devem fazer-se...","o":["pela direita dos veículos ou animais.","pela esquerda dos veículos ou animais.","pela direita ou pela esquerda, se houver espaço suficiente na berma.","nas curvas de visibilidade reduzida."],"c":0,"img":"img/q110.jpg","e":"Em Moçambique circula-se pela esquerda, por isso a ultrapassagem faz-se pela direita do veículo ou animal que vai à frente."},{"id":111,"q":"Durante as ultrapassagens, a força do ar provocada pelos veículos pesados:","o":["Afecta em especial os veículos pesados.","Afecta igualmente ambos os veículos, sobretudo no início da manobra.","Afecta em especial os veículos ligeiros e veículos de 2 rodas.","Não tem influência para os outros condutores."],"c":2,"img":"img/q111.jpg","e":"A deslocação de ar de um pesado empurra e aspira os veículos mais leves. Os ligeiros e, sobretudo, as motas e bicicletas sentem mais esse efeito."},{"id":112,"q":"O que indica a marca rodoviária?","o":["Cedência de prioridade.","Aproximação de passagem de nível.","Faixa de sentido reversível."],"c":0,"img":"img/q112.jpg","e":"A marca rodoviária (linha descontínua com triângulo) indica cedência de prioridade: deve ceder a passagem a quem circula na via onde vai entrar."},{"id":113,"q":"Para não causar perigo e por em causa a segurança das pessoas e das coisas, os condutores devem...","o":["circular nos limites máximos de velocidade das estradas.","circular abaixo dos limites mínimos de velocidade.","regular a velocidade atendendo às características do veículo, às condições da via e ao estado do condutor.","ficar em ponto morto nas descidas muito inclinadas."],"c":2,"img":"img/q113.jpg","e":"A velocidade deve ser adaptada ao veículo, à via, ao tempo e ao estado do condutor. Ir sempre no limite máximo pode ser perigoso, e ir em ponto morto nas descidas também."},{"id":114,"q":"Se o condutor que segue à minha frente assinala a manobra de mudança de direcção para a direita, posso ultrapassar?","o":["Sim, pela direita.","Não.","Sim, pela esquerda, certificando-se que o pode fazer sem perigo de acidente.","Sim, pela direita ou pela esquerda, sempre que o veículo não esteja em movimento."],"c":2,"img":"img/q114.jpg","e":"Quando o veículo da frente assinala que vai virar à direita e se encosta ao eixo da via, pode ultrapassá-lo pela esquerda, desde que sem perigo."},{"id":115,"q":"O significado deste sinal é:","o":["Curva à direita e contracurva à direita.","Curva à direita e contracurva.","Curva à esquerda e contracurva.","Curva à esquerda e contracurva à direita"],"c":1,"img":"img/q115.jpg","e":"O sinal mostra uma curva que começa para a direita e logo a seguir outra para o lado contrário: curva à direita e contracurva."},{"id":116,"q":"O significado deste sinal é:","o":["Curva à direita.","Inclinação à direita.","Curva à esquerda.","Sentido obrigatório para a direita."],"c":0,"img":"img/q116.jpg","e":"O sinal de perigo com a estrada a dobrar para a direita avisa uma curva à direita."},{"id":117,"q":"A definição de parque de estacionamento é:","o":["Local exclusivamente destinado ao estacionamento de veículos.","Local exclusivamente destinado ao descanso dos condutores.","Local exclusivamente destinado às cargas e descargas dos veículos.","Local exclusivamente destinado a manutenção e reparação dos veículos."],"c":0,"img":"img/q117.jpg","e":"Parque de estacionamento é um local destinado exclusivamente ao estacionamento de veículos."},{"id":118,"q":"Onde é proibido inverter o sentido de marcha?","o":["Nas rotundas.","Nos cruzamentos ou entroncamentos de visibilidade reduzida.","Fora das localidades.","Só quando haja grande intensidade de tráfego."],"c":1,"img":"img/q118.jpg","e":"É proibido inverter a marcha em cruzamentos e entroncamentos de visibilidade reduzida, porque os outros condutores não vêem a manobra a tempo."},{"id":119,"q":"É necessário regular e ajustar o encosto de cabeça para a altura dos ocupantes?","o":["Não é necessário, porque é apenas um elemento de conforto.","Sim, mas só nos bancos da frente.","Sim, porque pode evitar lesões na zona do pescoço.","Não, se o veículo tiver cintos de segurança."],"c":2,"img":"img/q119.jpg","e":"O encosto de cabeça deve ficar à altura da cabeça. Mal regulado, não segura a cabeça numa colisão por trás e não evita lesões no pescoço (efeito chicote)."},{"id":120,"q":"É proibido estacionar...","o":["de noite, nas faixas de rodagem das localidades.","a 50 metros das passagens de nível.","em cima dos passeios.","no lado da faixa de rodagem em que esteja uma linha contínua de cor branca."],"c":2,"img":"img/q120.jpg","e":"O passeio é dos peões, por isso é proibido estacionar em cima dele (salvo sinalização que o permita)."},{"id":121,"q":"O agente de trânsito que aparece na fotografia, manda:","o":["Avançar o tráfego que venha da retaguarda.","Parar o tráfego que venha da esquerda.","Avançar o tráfego que venha da esquerda."],"c":2,"img":"img/q121.jpg","e":"O agente de perfil, com os braços estendidos, deixa passar o trânsito que se apresenta de lado. Na foto, quem vem da esquerda do agente pode avançar."},{"id":122,"q":"O significado deste sinal é:","o":["Via temporariamente interrompida;","Via temporariamente interrompida, mas pode seguir em frente;","Via definitivamente interrompida;","Via temporariamente interrompida, só durante a noite;"],"c":0,"img":"img/q122.jpg","e":"O sinal indica que a via está interrompida temporariamente (por obras ou outro motivo), por isso não pode seguir por ela."},{"id":123,"q":"O sinal luminoso com a seta verde indica:","o":["Acesso ou passagem interdito.","Acesso ou passagem autorizado.","Acesso ou passagem condicionado."],"c":1,"img":"img/q123.jpg","e":"No sinal luminoso de controlo de via, a seta verde indica que a passagem por essa via está autorizada."},{"id":124,"q":"Num veículo equipado com motor Diesel em aceleração, a libertação de muito fumo negro pelo tubo de escape, significa:","o":["Óptima qualidade do combustível.","Necessidade de regulação da bomba injectora.","Que o veículo está a queimar muito óleo.","Que o veículo acelera bem."],"c":1,"img":"img/q124.jpg","e":"Fumo negro num motor Diesel indica combustível mal queimado (excesso de gasóleo), normalmente por a bomba injectora estar desregulada."},{"id":125,"q":"O significado deste sinal é:","o":["Entroncamento agudo da esquerda.","Entroncamento convergente para a esquerda.","Entroncamento divergente da esquerda.","Entroncamento agudo da direita."],"c":0,"img":"img/q125.jpg","e":"O sinal mostra uma estrada que entra na sua via pela esquerda, num ângulo agudo: entroncamento agudo da esquerda."},{"id":126,"q":"O significado deste sinal é:","o":["Travessia de peões.","Travessia de idosos.","Travessia de crianças.","Passagem de peões."],"c":0,"img":"img/q126.jpg","e":"Este sinal de perigo avisa que há peões a atravessar a via com frequência, mesmo sem passadeira: travessia de peões."},{"id":127,"q":"Qual dos veículos tem prioridade de passagem nesta situação?","o":["O veículo vermelho.","O veículo amarelo.","O primeiro que chegar ao cruzamento."],"c":1,"img":"img/q127.jpg","e":"Na situação da imagem, o veículo amarelo tem prioridade (pela regra da prioridade ou pela sinalização presente). O vermelho deve ceder-lhe a passagem."},{"id":128,"q":"Que veículo deve retroceder para dar passagem ao outro, numa passagen estreita sem sinalização onde não seja possível efectuar o cruzamento?","o":["O veículo mais pesado.","O veículo com maior largura.","O veículo que está mais próximo do local em que o cruzamento seja possível.","O veículo que desce se for numa via de inclinação acentuada."],"c":2,"img":"img/q128.jpg","e":"Numa passagem estreita sem sinalização, recua o veículo que estiver mais perto do local onde é possível os dois se cruzarem, porque recua menos."},{"id":129,"q":"Quando os peões transitem na faixa de rodagem, devem fazê-lo...","o":["a par, quando transitem desde o anoitecer ao amanhecer.","numa única fila, sempre que as condições de visibilidade ou a intensidade do trânsito o aconselhem.","pela esquerda da faixa de rodagem, em relação ao seu sentido de marcha.","a par, quando transitem em condições de visibilidade insuficiente."],"c":1,"img":"img/q129.jpg","e":"Quando os peões andam na faixa de rodagem, devem ir em fila única sempre que a visibilidade ou o trânsito o aconselhem, para ocuparem menos espaço."},{"id":130,"q":"Os condutores com pouco tempo de condução (inexperientes):","o":["Têm capacidades menos eficientes na recolha de informações.","Têm capacidades mais eficientes na recolha de informações.","Têm capacidades mais acertadas na recolha de informações.","As capacidades na recolha da informação não tem relação com a experiência, sim com a visão."],"c":0,"img":"img/q130.jpg","e":"Os condutores inexperientes ainda não sabem bem para onde olhar nem o que é importante, por isso recolhem a informação de forma menos eficiente."},{"id":131,"q":"Para praticar uma condução defensiva a antecipação é um comportamento importante.","o":["Errado.","Só nas passagens para peões.","Certo."],"c":2,"img":"img/q131.jpg","e":"Certo. A condução defensiva baseia-se em antecipar: prever o que os outros podem fazer e preparar-se com tempo."},{"id":132,"q":"Os automóveis ligeiros de passageiros e mistos sem reboque, fora das localidades, não devem exceder a velocidade instantânea de:","o":["80 km/h.","120 km/h.","100 km/h.","140 km/h."],"c":1,"img":"img/q132.jpg","e":"Fora das localidades, os ligeiros de passageiros e mistos sem reboque podem andar até 120 km/h."},{"id":133,"q":"A Condução Defensiva deve ser mais “pró-activa”, isto significa que:","o":["Deve adivinhar as situações de perigo e concentrar-se em aproximar-se o mais possível da berma para se proteger.","Deve estar atendo aos ruídos estranhos dos veículos no trânsito e sinalizar.","Deve prever as situações antes de acontecerem e mesmo que não aconteçam prever a probabilidade de que aconteçam.","Deve ser mais rápida e activa para sair rapidamente das zonas de perigo."],"c":2,"img":"img/q133.jpg","e":"Ser pró-activo é prever as situações de perigo antes de acontecerem, e até considerar a probabilidade de acontecerem, para agir a tempo."},{"id":134,"q":"O que indica o sinal?","o":["Paragem obrigatória.","Paragem obrigatória em três vias.","Paragem obrigatória a três metros."],"c":1,"img":"img/q134.jpg","e":"O sinal STOP com a placa adicional indica paragem obrigatória num cruzamento de três vias."},{"id":135,"q":"Nos dias quentes, é recomendável...","o":["efectuar mais descansos durante uma viagem, porque a fadiga e o sono aparecem mais facilmente.","fazer menos descansos durante a viagem, para chegar ao destino o mais rapidamente possível.","evitar conduzir com o ar condicionado ligado.","evitar tomar bebidas como água ou sumos naturais."],"c":0,"img":"img/q135.jpg","e":"O calor cansa e dá sono mais depressa. Em dias quentes deve fazer mais pausas e beber água."},{"id":136,"q":"Que comunica o condutor aos outros utentes da via?","o":["Que vai reduzir a velocidade.","Que vai voltar para o lado esquerdo do volante.","Que vai voltar para o lado direito do volante."],"c":0,"img":"img/q136.jpg","e":"O braço estendido para fora, a mexer para cima e para baixo, é o sinal manual de que o condutor vai abrandar."},{"id":137,"q":"O que indica o sinal?","o":["Pista obrigatória para veículos de tracção manual.","Pista obrigatória para peões e velocípedes.","Pista obrigatória para peões.","Trânsito proibido a velocípedes e peões."],"c":1,"img":"img/q137.jpg","e":"Sinal azul circular com peão e bicicleta: pista obrigatória para peões e velocípedes."},{"id":138,"q":"O significado deste sinal é:","o":["Fim de duas vias.","Fim de via à esquerda.","Entroncamento agudo da direita.","Fim de via à direita."],"c":2,"img":"img/q138.jpg","e":"O sinal mostra uma via a entrar pela direita num ângulo agudo: entroncamento agudo da direita."},{"id":139,"q":"A condução sob influência do álcool provoca no condutor:","o":["A diminuição do tempo de reacção.","O aumento do tempo de reacção.","Não afecta o processo de condução.","O aumento dos reflexos."],"c":1,"img":"img/q139.jpg","e":"O álcool torna o cérebro mais lento, por isso o tempo de reacção aumenta e os reflexos pioram."},{"id":140,"q":"Os condutores não podem exceder as seguintes velocidades instantâneas (em quilómetros/hora):","o":["Automóveis pesados de passageiros dentro das localidades 50, fora das localidades 100.","Automóveis pesados de passageiros dentro das localidades 60, fora das localidades 100.","Automóveis pesados de passageiros dentro das localidades 60, fora das localidades 120.","Automóveis pesados de passageiros dentro das localidades 50, fora das localidades 120."],"c":1,"img":"img/q140.jpg","e":"Os pesados de passageiros podem andar até 60 km/h dentro das localidades e até 100 km/h fora delas."},{"id":141,"q":"A distância de segurança, se o condutor que transita à minha frente diminuir a velocidade:","o":["Aumenta.","Diminui.","Não se altera."],"c":1,"img":"img/q141.jpg","e":"Se o carro da frente abranda e eu mantenho a velocidade, aproximo-me dele. A distância de segurança diminui, por isso também devo abrandar."},{"id":142,"q":"O condutor determina qual é a resposta motora a executar, em que processo da tarefa da condução?","o":["Decisão.","Antecipação.","Previsão.","Recolha"],"c":0,"img":"img/q142.jpg","e":"A tarefa da condução tem fases: recolher a informação, prever, decidir e agir. É na decisão que o condutor escolhe que movimento vai fazer."},{"id":143,"q":"O vento afecta a estabilidade do veículo:","o":["Particularmente quando é muito forte em túneis.","Particularmente em veículos de caixa aberta.","Particularmente quando é muito forte e sopra lateralmente.","Não."],"c":2,"img":"img/q143.jpg","e":"O vento forte de lado empurra o veículo e pode desviá-lo da trajectória, sobretudo ao sair de túneis e pontes ou ao cruzar com pesados."},{"id":144,"q":"Que veículos consideram-se prioritários?","o":["As ambulâncias que transportam feridos.","As comitivas governamentais.","Os que transitam em missão urgente de socorro e comitivas governamentais, assinalando adequadamente a sua marcha."],"c":2,"img":"img/q144.jpg","e":"São prioritários os veículos em missão urgente de socorro (ambulâncias, bombeiros, polícia) e as comitivas governamentais, desde que assinalem a marcha com sirene e luzes."},{"id":145,"q":"O que indica o sinal?","o":["Paragem obrigatória.","Trânsito proibido a veículos com comprimento superior a 60 metros.","Paragem obrigatória a 60 metros."],"c":2,"img":"img/q145.jpg","e":"O sinal com STOP e a placa '60 m' avisa que a paragem obrigatória está a 60 metros."},{"id":146,"q":"Parar ou estacionar, é proibido:","o":["A menos de 3 m das passagens assinaladas para a travessia de peões e velocípedes.","A menos de 10 m das passagens assinaladas para a travessia de peões e velocípedes.","A menos de 15 m das passagens assinaladas para a travessia de peões e velocípedes.","A menos de 5 m das passagens assinaladas para a travessia de peões e velocípedes."],"c":3,"img":"img/q146.jpg","e":"É proibido parar ou estacionar a menos de 5 metros das passagens de peões e velocípedes, para não tapar a visão de quem atravessa."},{"id":147,"q":"A distância percorrida desde que o condutor identifica um perigo até que o veículo pare completamente...","o":["depende apenas do estado dos travões.","depende apenas do estado do condutor.","é maior quanto maior for a velocidade.","só varia se o veículo ou a via estão em mau estado."],"c":2,"img":"img/q147.jpg","e":"A distância de paragem é a soma do que se percorre enquanto se reage com o que se percorre a travar. Quanto maior a velocidade, maiores são as duas."},{"id":148,"q":"O significado deste sinal é:","o":["Terreno com pedras à esquerda.","Terreno falso à esquerda.","Zona de passagem pela direita.","Zona de passagem pela esquerda."],"c":1,"img":"img/q148.jpg","e":"O sinal avisa que a berma ou o terreno do lado esquerdo é instável (terreno falso) e pode ceder com o peso do veículo."},{"id":149,"q":"Nas estradas nacionais, a suspensão do trânsito deve ser solicitada:","o":["À ANE e, nas estradas locais, aos conselhos municipais.","Ao INATTER e nas estradas locais, aos conselhos municipais.","À polícia de segurança pública e nas estradas locais, aos conselhos municipais.","Ao Ministério dos transportes e nas estradas locais, aos conselhos municipais."],"c":0,"img":"img/q149.jpg","e":"Nas estradas nacionais, a suspensão do trânsito pede-se à ANE (Administração Nacional de Estradas). Nas estradas locais, aos conselhos municipais."},{"id":150,"q":"Como pode ser definido o stress?","o":["Acalmia mental diante de pressões ou exigências que ultrapassem os limites das suas próprias capacidades.","Indiferença perante pressões ou exigências que ultrapassem os limites das suas próprias capacidades.","Tensão mental diante de pressões ou exigências que ultrapassem os limites das suas próprias capacidades."],"c":2,"img":"img/q150.jpg","e":"Stress é a tensão mental que surge quando as pressões ou exigências ultrapassam aquilo que a pessoa consegue gerir."},{"id":151,"q":"O significado destes sinais é:","o":["Área reservada para táxis; Pista reservada para velocípedes do lado esquerdo; Área reservada para veículos de deficientes.","Área reservada para táxis; Pista reservada para velocípedes do lado direito; Área reservada para veículos de deficientes.","Área reservada para táxis; Pista reservada para velocípedes do lado esquerdo; Pista reservada para veículos de deficientes.","Área reservada para transporte coletivo; Pista reservada para velocípedes do lado esquerdo; Área reservada para veículos de deficientes."],"c":0,"img":"img/q151.jpg","e":"Os três sinais indicam, por ordem: área reservada a táxis, pista para velocípedes do lado esquerdo e área reservada a veículos de pessoas com deficiência."},{"id":152,"q":"A distância de segurança entre veículos em marcha depende:","o":["Apenas da pressa do condutor.","De que circulem em autoestrada, podendo ser mais pequena neste caso.","Sempre da velocidade.","Da capacidade de travagem do veículo."],"c":2,"img":"img/q152.jpg","e":"A distância de segurança depende sempre da velocidade: quanto mais depressa, mais espaço é preciso para parar sem bater."},{"id":153,"q":"A definição de cruzamento é:","o":["Zona de intersecção de vias privadas ao mesmo nível.","Zona de intersecção de vias privadas ao nível superior.","Zona de intersecção de vias públicas ao mesmo nível.","Zona de intersecção de vias privadas ao nível inferior."],"c":2,"img":"img/q153.jpg","e":"Um cruzamento é a zona onde duas vias públicas se cruzam ao mesmo nível."},{"id":154,"q":"Quem tem prioridade de passagem nesta intersecção?","o":["Os condutores que se apresentem pela esquerda.","Todos os condutores que circulem pela via transversal.","Os condutores que circulem pela via de maior largura.","Os condutores que se apresentem pela direita."],"c":3,"img":"img/q154.jpg","e":"Num cruzamento sem sinalização, a regra geral é ceder a passagem a quem se apresenta pela direita."},{"id":155,"q":"É perigoso utilizar o telefone móvel durante a condução?","o":["Não, já que não afecta a condução.","Sim, porque reduz a atenção necessária para conduzir com segurança.","Não, quando a conversa não durar muito tempo.","Sim, mas só quando se utilizar um aparelho \"mãos livres\"."],"c":1,"img":"img/q155.jpg","e":"Falar ao telemóvel tira a atenção da estrada, mesmo com sistema de mãos livres. O condutor vê menos e reage mais tarde."},{"id":156,"q":"Um condutor que expressa o descontentamento através de gestos ou palavras agressivas:","o":["Manifesta agressividade e falta de civismo.","Está apenas, e bem, a demonstrar o seu descontentamento com o comportamento dos outros.","Está a contribuir para mais e melhor cidadania no transito.","Está a exercer um direito que lhe assiste perante a ignorância dos outros condutores."],"c":0,"img":"img/q156.jpg","e":"Gestos ou palavras agressivas mostram falta de civismo e aumentam a tensão na estrada, o que pode provocar conflitos e acidentes."},{"id":157,"q":"Quando existe cruzamento de veículos?","o":["Os condutores de dois veículos que transitem na mesma faixa de rodagem e no mesmo sentido, o que vai à frente realize uma ultrapassagem.","Os condutores de dois veículos que transitem na mesma via e no mesmo sentido passem um pelo outro.","Os condutores de dois veículos que transitem na mesma estrada e no mesmo sentido passem um pelo outro.","Os condutores de dois veículos, que transitem na mesma via e em sentidos opostos, passem um pelo outro em simultâneo;"],"c":3,"img":"img/q157.jpg","e":"Cruzamento de veículos é quando dois veículos na mesma via, em sentidos opostos, passam um pelo outro."},{"id":158,"q":"Quais são os efeitos efeitos mais comuns da fadiga ao volante?","o":["A dificuldade em manter o veículo, dentro dos limites da faixa de rodagem.","Sentir fome e sede o que provoca a necessidade de se deslocar com maior velocidade para chegar mais rápido ao seu destino.","Sentir-se enérgico podendo controlar melhor o veículo."],"c":0,"img":"img/q158.jpg","e":"Com fadiga, o condutor perde a concentração e tem dificuldade em manter o carro dentro da sua faixa, chegando a invadir a berma ou a faixa contrária."},{"id":159,"q":"A ingestão de drogas:","o":["Diminui as capacidades do condutor, alterando os reflexos e a coordenação de movimentos.","Aumenta as capacidades do condutor, melhorando os reflexos e a coordenação de movimentos.","Afecta as capacidades do condutor, melhorando os reflexos e a coordenação de movimentos.","Em determinadas condições ajudam o condutor a estar mais atento."],"c":0,"img":"img/q159.jpg","e":"As drogas alteram a percepção, os reflexos e a coordenação. O condutor fica menos capaz e mais perigoso."},{"id":160,"q":"O que é a ergonomia de um veículo?","o":["É a capacidade de adaptação do equipamento às particularidades de cada ser humano.","É a capacidade de um condutor economizar no combustível.","É a capacidade de um veículo economizar no combustível."],"c":0,"img":"img/q160.jpg","e":"Ergonomia é adaptar o equipamento à pessoa: banco, volante, espelhos e comandos ajustados ao condutor, para conduzir confortável e seguro."},{"id":161,"q":"O significado deste sinal é:","o":["Zona onde só podem passar três carros de cada vez.","Congestionamento de tráfego.","Zona de estacionamento em fila.","Zona de paragem em fila."],"c":1,"img":"img/q161.jpg","e":"O sinal de perigo com uma fila de carros avisa congestionamento de tráfego (filas) mais à frente."},{"id":162,"q":"A definição de tara é:","o":["Peso do veículo com carga.","Peso do veículo em vazio.","Peso da carga que o veículo transporta.","Peso do veículo mais o condutor."],"c":1,"img":"img/q162.jpg","e":"Tara é o peso do veículo vazio, sem carga e sem passageiros."},{"id":163,"q":"O significado deste sinal é:","o":["Passagem estreita.","Só veículos pesados de passageiros.","Um veículo de cada vez.","Só veículos pesados de mercadorias."],"c":2,"img":"img/q163.jpg","e":"O sinal indica uma passagem por onde só pode passar um veículo de cada vez."},{"id":164,"q":"As luzes de travagem dos automóveis tem a cor:","o":["Branca ou amarela.","Amarela ou alaranjada.","Vermelha."],"c":2,"img":"img/q164.jpg","e":"As luzes de travagem (stop) são sempre vermelhas, para avisar quem vem atrás de que o veículo está a travar."},{"id":165,"q":"Como é feito o processo de eliminação do álcool no organismo?","o":["Pela urina e pela transpiração.","Pelo ar expirado, pela urina e quantidade de água ingerida.","Pelo fígado, pelo ar expirado, pela urina e pela transpiração.","Pela quantidade de café e água que tome depois de beber."],"c":2,"img":"img/q165.jpg","e":"O álcool é eliminado sobretudo pelo fígado (a maior parte) e uma pequena parte pela respiração, pela urina e pelo suor. Café e água não aceleram a eliminação."},{"id":166,"q":"Nos veículos de mercadorias, a carga deve ser disposta de modo a que:","o":["O principal peso fique sobre o eixo da retaguarda.","Seja assegurado o equilíbrio do veículo, parado ou em movimento.","Fique livre o maior espaço possível à retaguarda da caixa de carga."],"c":1,"img":"img/q166.jpg","e":"A carga deve ser distribuída de modo a manter o veículo equilibrado, parado ou em movimento, para não tombar nem perder estabilidade."},{"id":167,"q
