ravessar a via e também toda a sinalização envolvente."],"c":1,"img":"img/q289.jpg"},{"id":290,"q":"Como é punida a colocação de obstáculos que possam impedir ou embaraçar o trânsito e comprometer a segurança e comodidade dos utentes da via?","o":["Multa de 1.000,00 Mt.","Multa de 500,00 Mt.","Multa de 2,000,00 Mt.","Multa de 3.000,00 Mt."],"c":0,"img":"img/q290.jpg"},{"id":291,"q":"Perante um obstáculo imprevisto que o obriga a reduzir subitamente a velocidade, o condutor deve:","o":["Sinalizar a situação utilizando os máximos e os médios alternadamente.","Ligar as luzes de perigo para avisar os outros utentes da via.","Ligar as luzes de presença para avisar os outros utentes da via."],"c":1,"img":"img/q291.jpg"},{"id":292,"q":"Considera-se “condução defensiva”:","o":["Não ultrapassar os 30Km em zona urbana.","Ajustar a velocidade e a trajectória de forma a evitar acidentes.","Não efectuar manobras que o possam colocar em perigo, independentemente dos outros condutores.","Circular sempre a 40 Km por hora para evitar ser surpreendido por algum perigo."],"c":1,"img":"img/q292.jpg"},{"id":293,"q":"Que entende-se por liberdade?","o":["O poder que o Homem tem de dominar a ciência e a técnica.","A condução de veículos automóveis por longos períodos de tempo.","O poder que o Homem tem de agir, de praticar uma acção sem qualquer pressão ou constrangimento.","A faculdade de num cruzamento não sinalizado, avançar sem observar a regra de prioridade."],"c":2,"img":"img/q293.jpg"},{"id":294,"q":"Muitas tarefas que são necessárias à condução, exigem que o condutor retire os olhos da estrada:","o":["Errado.","","Certo.",""],"c":2,"img":"img/q294.jpg"},{"id":295,"q":"Uma das partes importantes para praticar uma condução defensiva é:","o":["A capacidade mental de prever os acontecimentos perante um estímulo visual.","A capacidade de dominar a trajectória do veículo em condições adversas.","A capacidade de acelerar dentro dos limites impostos pela sinalização.","A capacidade de efectuar travagens sempre que necessário."],"c":0,"img":"img/q295.jpg"},{"id":296,"q":"O significado deste sinal é:","o":["Travessia de peões.","Passagem de peões.","Passagem de idosos.","Passagem de peões a 50 metros."],"c":1,"img":"img/q296.jpg"},{"id":297,"q":"A força centrípeta e centrífuga:","o":["São forças que actuam no mesmo sentido e se acumulam uma à outra.","Só depende do raio da trajectória não tendo a velocidade nenhuma influência.","São forças que actuam em sentido contrário uma em relação à outra.","São forças que só ocorrem quando o veículo vai em linha recta."],"c":2,"img":"img/q297.jpg"},{"id":298,"q":"Quem exceder em mais de 30 Km/h de velocidade (automóveis ligeiros e motociclos) os limites, fora das localidades é punido:","o":["Com multa de 2.000,00 Mt e contravenção leve.","Com multa de 1.000,00 Mt e contravenção média.","Com multa de 1.000,00 Mt e contravenção leve.","Com multa de 1.000,00 Mt e contravenção grave."],"c":2,"img":"img/q298.jpg"},{"id":299,"q":"Como pode definir derrapagem?","o":["Quando o veículo segue uma trajetória diferente da das rodas e estas em velocidades diferentes.","Quando nas curvas o veículo segue a mesma trajectória das rodas e estas em velocidade diferentes.","Sempre que o carro efectua uma curva."],"c":0,"img":"img/q299.jpg"},{"id":300,"q":"O que indica o sinal de interesse turístico?","o":["Posto de socorro.","Hospital.","Hospital com emergência médica."],"c":1,"img":"img/q300.jpg"},{"id":301,"q":"O que indica o sinal?","o":["Passagem de peões.","Pista obrigatória para peões.","Passagem desnivelada para peões com rampas."],"c":2,"img":"img/q301.jpg"},{"id":302,"q":"Dentro das localidades, é proibido parar ou estacionar?","o":["A menos de 50 metros dos cruzamentos ou entroncamentos.","A menos de 25 metros para um e outro lado dos cruzamentos ou entroncamentos.","A menos de 5 metros antes das passagens assinaladas para a travessia de peões e velocípedes.","Na faixa de rodagem, em qualquer caso."],"c":2,"img":"img/q302.jpg"},{"id":303,"q":"O que influencia a distância de reacção?","o":["Tempo de reacção e velocidade.","Estado do veículo e condições ambientais.","Velocidade e estado da via.","Condições do condutor e distância de travagem."],"c":0,"img":"img/q303.jpg"},{"id":304,"q":"O significado destes sinais é:","o":["Saída com uma via de rodagem.","Saída com uma estrada de um sentido.","Saída com uma faixa de rodagem.","Entrada com uma faixa de rodagem."],"c":2,"img":"img/q304.jpg"},{"id":305,"q":"Sempre que uma autoridade policial ou seus agentes, lhes façam sinal para Isso, os condutores de veículos ou animais são obrigados a parar?","o":["Sim, desde que estejam armados.","Sim, desde que estejam devidamente uniformizados e identificados.","Sim, sempre que exibam o sinal de STOP.","Não, nunca."],"c":1,"img":"img/q305.jpg"},{"id":306,"q":"O socorrista, na avaliação do grau de consciência deve:","o":["Ver os movimentos do tórax e do abdómen.","Abanar levemente a vitima ao nível dos ombros e falar com ela, questionando se está a ouvir, está a sentir-se bem, onde está, como se chama, que dia é hoje...","Sentir o ar expirado, encostando a sua face ao nariz e boca da vitima."],"c":1,"img":"img/q306.jpg"},{"id":307,"q":"O espaço percorrido pelo veículo durante o tempo de reacção do condutor não é sempre o mesmo e depende:","o":["Só do tempo da reacção do condutor e não tem influência a velocidade do veículo.","Do tempo da reacção e da velocidade do veículo.","Só da velocidade do veículo e não tem influência o tempo de reacção do condutor.","Principalmente de factores externos ao condutor."],"c":1,"img":"img/q307.jpg"},{"id":308,"q":"Durante a noite, o condutor deve circular com:","o":["Sempre com os médios ligados, utilizando os mínimos no cruzamento com outros veículos e os máximos quando não houver trânsito.","Sempre com os máximos ligados, utilizando os mínimos no cruzamento com outros veículos.","Os médios ligados e utilizar os máximos, quando não existir outro trânsito a circular à sua frente ou em sentido contrário.","É indiferente as luzes usadas desde que consiga ver bem a estrada."],"c":2,"img":"img/q308.jpg"},{"id":309,"q":"O estado emocional do condutor, é um factor de ordem interna, que influência:","o":["O tempo de reacção e a distância de travagem.","Apenas a distância de travagem.","Apenas a distância de segurança."],"c":0,"img":"img/q309.jpg"},{"id":310,"q":"Qual a antecedência mínima que a entidade que ordenar a suspensão do trânsito nas estradas nacionais, deve anunciá-la ao público?","o":["Uma semana.","Quinze dias.","Três dias.","Um dia."],"c":2,"img":"img/q310.jpg"},{"id":311,"q":"A condução sob influência do álcool:","o":["Aumenta o risco de acidente.","Diminui o risco de acidente.","Em nada interfere com a segurança rodoviária.","Pode melhorar o estado do condutor devido à melhora da sua disposição."],"c":0,"img":"img/q311.jpg"},{"id":312,"q":"Se o condutor sofre de uma doença, o que deve fazer para reduzir o risco de ter um acidente?","o":["Interromper a medicação que estiver a tomar, se tem que conduzir.","Deixar de conduzir em todos os casos.","Conhecer os efeitos secundários dos medicamentos.","Ignorar os sintomas para evitar distracções."],"c":2,"img":"img/q312.jpg"},{"id":313,"q":"A razão pela qual não se deve retirar ou movimentar do interior dos veículos, as vítimas de acidentes é:","o":["Para não contaminar o local do acidente.","Para não passar doenças a quem socorre.","Para serem evitadas lesões crânio encefálicas, lesões da coluna cervical ou outras em órgãos internos OU Ossos fracturados."],"c":2,"img":"img/q313.jpg"},{"id":314,"q":"Com relação aos acidentados, qual a ordem pela qual devem ser postos em prática os três princípios de actuação?","o":["Socorrer, Alertar e Prevenir.","Alertar, Socorrer e Prevenir.","Prevenir, Alertar e Socorrer."],"c":2,"img":"img/q314.jpg"},{"id":315,"q":"Quem não teve uma boa noite de descanso:","o":["Deve tomar mais cafés durante o dia enquanto conduz.","Deve beber muita água durante o dia enquanto conduz.","Não afecta a sua capacidade de condução.","Mais facilmente se torna vítima de estados de fadiga."],"c":3,"img":"img/q315.jpg"},{"id":316,"q":"O estado de alerta do condutor, é influenciado pela fadiga, afectando a forma como:","o":["O veículo se comporta no ambiente rodoviário.","O condutor realiza a manobra de ultrapassagem.","O condutor recolhe as informações relevantes do ambiente rodoviário."],"c":2,"img":"img/q316.jpg"},{"id":317,"q":"A definição de pista especial é:","o":["Via privada especialmente destinada, de acordo com sinalização, ao trânsito de peões, de animais ou de certa espécie de veículos.","Via privada especialmente destinada, de acordo com sinalização, ao trânsito de veículos automóveis.","Via pública especialmente destinada ao trânsito de veículos de polícia.","Via pública especialmente destinada, de acordo com sinalização, ao trânsito de peões, de animais ou de certa espécie de veículos."],"c":3,"img":"img/q317.jpg"},{"id":318,"q":"Em caso de nevoeiro (cacimba) os 4 piscas ou luzes de emergência, só devem ser utilizados:","o":["Se o veículo estiver imobilizado, a circular a velocidades muito baixas ou quando fizer uma travagem forte e repentina.","Quando o veículo circular a uma velocidade moderada.","Sempre que mudar de direcção ou iniciar uma ultrapassagem.","Devem ser usadas sempre."],"c":0,"img":"img/q318.jpg"},{"id":319,"q":"Perante a luz verde, não deve avançar:","o":["Quando no passeio existam peões que pretendam iniciar a travessia da faixa de rodagem.","Quando pela intensidade de trânsito, seja previsível a imobilização no centro da intersecção.","Quando um agente regulador de trânsito se encontre nas proximidades."],"c":1,"img":"img/q319.jpg"},{"id":320,"q":"O planeamento da velocidade e da trajectória do veículo assenta:","o":["Nas motivações e necessidade do condutor sem influência da informação que ele recebe do exterior.","Na informação que ele recebe do exterior.","Nas motivações e necessidades do condutor e também na informação que ele recebe do exterior."],"c":2,"img":"img/q320.jpg"},{"id":321,"q":"A definição de plataforma é:","o":["Parte das arestas externas das valetas laterais da estrada.","Parte das arestas internas das valetas laterais da estrada.","Parte das valetas laterais da estrada.","O conjunto de estrada e bermas."],"c":1,"img":"img/q321.jpg"},{"id":322,"q":"O que indica uma curta distância existente entre os veículos que circulam à minha frente?","o":["Que devo moderar a velocidade.","Que circulo mais rápido do que eles.","Que vou entrar numa localidade.","Que devo ultrapassar para não estar em perigo."],"c":0,"img":"img/q322.jpg"},{"id":323,"q":"O vento afecta a estabilidade do veículo:","o":["Especialmente em zonas urbanas com muitos edifícios altos.","Especialmente em zonas abertas de planície, zonas marítimas costeiras ou de montanha.","Especialmente em zonas de parques de estacionamento fechados.","Não."],"c":1,"img":"img/q323.jpg"},{"id":324,"q":"Os veículos possuem, para combater a escuridão ou falta de iluminação na condução nocturna:","o":["Buzinas.","Luzes de emergência.","Luzes, sinalizadores e reflectores."],"c":2,"img":"img/q324.jpg"},{"id":325,"q":"É permitido levar um bebé nos braços quando o veículo está em circulação?","o":["Não, deve sempre usar um dispositivo adequado ao tamanho e ao peso do bebé.","Sim, se a viagem é curta.","Sim, sempre que a velocidade seja muito reduzida.","Sim, mas apenas nos assentos traseiros."],"c":0,"img":"img/q325.jpg"},{"id":326,"q":"Devido à ingestão de bebidas alcoólicas, a alteração do campo visual de um condutor, manifesta-se por:","o":["Aumento da visão lateral.","Aumento da visão periférica.","Redução da visão lateral.","Aumento da visão em profundidade."],"c":2,"img":"img/q326.jpg"},{"id":327,"q":"É proibido parar ou estacionar, fora das localidades:","o":["A menos de 30 m dos cruzamentos, entroncamentos, curvas ou lombas de visibilidade reduzida;","A menos de 50 m dos cruzamentos, entroncamentos, curvas ou lombas de visibilidade reduzida.","A menos de 10 m dos cruzamentos, entroncamentos, curvas ou lombas de visibilidade reduzida;","A menos de 20 m dos cruzamentos, entroncamentos, curvas ou lombas de visibilidade reduzida;"],"c":1,"img":"img/q327.jpg"},{"id":328,"q":"Os estados de fadiga podem tornar as pessoas mais:","o":["Pacientes, aumentando-lhes a capacidade para se concentrarem e para tomarem decisões.","Irritadiças, diminuindo-lhes a capacidade para se concentrarem e para tomarem decisões.","Amáveis, aumentando-lhes a capacidade para se concentrarem e para tomarem decisões.","Atentas, dado que para combater a fadiga têm tendência a aumentar os níveis de atenção."],"c":1,"img":"img/q328.jpg"},{"id":329,"q":"A tarefa de condução, pode ser muito afectada pela fadiga porque:","o":["Contribui para o aumento das capacidades perceptivas, intelectuais e também motoras.","Contribui para despertar as capacidades cognitivas e também motoras.","Contribui para a diminuição das capacidades perceptivas, cognitivas e também motoras.","Um condutor fatigado vê diminuido o seu tempo de reacção."],"c":2,"img":"img/q329.jpg"},{"id":330,"q":"A distância de segurança deve ser sempre a que me permita imobilizar o veículo sem perigo de acidente.","o":["Errado.","A distância de segurança só deve depender da capacidade de travagem do veículo.","Certo."],"c":2,"img":"img/q330.jpg"},{"id":331,"q":"Entende-se por prioridade de passagem:","o":["A obrigação que o condutor tem de imobilizar o veículo num cruzamento com sinal de paragem obrigatória.","O direito que o condutor tem de passar em primeiro lugar.","A movimentação de veículos e animais nas vias de comunicação rodoviária."],"c":1,"img":"img/q331.jpg"},{"id":332,"q":"Que deve fazer ao aproximar-se desta intersecção?","o":["Demonstrar prudência especial, moderando a velocidade e ceder a passagem aos veículos que tenham prioridade.","Ceder a passagem aos veículos que se apresentem pela via transversal.","Apenas ceder a passagem aos peões que tenham prioridade.","Ceder a passagem aos veículos que se apresentem pela esquerda."],"c":0,"img":"img/q332.jpg"},{"id":333,"q":"Nenhum condutor deve tomar a direita dos veículos ou animais:","o":["Que pretenda ultrapassar sem avisar da sua intenção aos respectivos condutores.","Sem fazer sinais de luzes durante o dia.","Sem fazer sinais de luzes durante a noite.","Sem buzinar para avisar da sua intenção."],"c":0,"img":"img/q333.jpg"},{"id":334,"q":"O condutor está sujeito ao aparecimento de fadiga, quando circula com trânsito intenso?","o":["Está porque é uma situação de transito monótona o que provoca fadiga.","Não está porque circula a velocidade reduzida.","Não está porque nesta situação pode descansar devido à pouca velocidade do trânsito.","Está e para evitar a fadiga deve beber café e bebidas estimulantes."],"c":0,"img":"img/q334.jpg"},{"id":335,"q":"No caso de passar por um acidente, é obrigado a parar para dar assistência?","o":["Não, mas não dar o alerta pode incorrer no crime de omissão de auxílio.","Sim, porque se não der o alerta pode incorrer no crime de omissão de auxílio.","Sim sempre."],"c":0,"img":"img/q335.jpg"},{"id":336,"q":"O que provoca no condutor o aparecimento da fadiga?","o":["O aumento do seu tempo de reacção.","A diminuição do seu tempo de reacção.","A fadiga não influencia a capacidade do condutor."],"c":0,"img":"img/q336.jpg"},{"id":337,"q":"O que provoca num condutor, a elevada ingestão de bebidas alcoólicas","o":["A redução da distância de paragem.","O aumento da capacidade de atenção e concentração.","A redução da capacidade de reacção.","O aumento das capacidades de avaliação das distâncias."],"c":2,"img":"img/q337.jpg"},{"id":338,"q":"A distância mínima a guardar em relação ao veículo que transita à minha frente:","o":["Não deve ser inferior a 30 metros.","Deve ser aquela que me permita, se necessário, imobilizar o veículo em segurança.","Não deve ser superior à distância de paragem.","Deve ser aquela que me permita ver as rodas traseiras do veículo que vai à minha frente."],"c":1,"img":"img/q338.jpg"},{"id":339,"q":"Mudança de direcção é uma manobra em que:","o":["Um condutor toma outra via que se intersecta com aquela em que vinha circulando.","Um condutor toma outra via que é paralela aquela em que vinha circulando.","Um condutor toma outra faixa de sentido contrário aquela em que vinha circulando.","Um condutor faz inversão de sentido de marcha."],"c":0,"img":"img/q339.jpg"},{"id":340,"q":"Os veículos que, em razão do serviço a que se destinam, devam parar na via pública ou deslocar-se em marcha lenta devem:","o":["Utilizar o triângulo de pré-sinalização e a luz de presença.","Utilizar as luzes de máximos.","Utilizar avisadores luminosos especiais, em que as características e condições de utilização são fixadas em regulamento.","Utilizar as luzes de médios em alternância com as luzes de presença como fixado em regulamento;"],"c":2,"img":"img/q340.jpg"},{"id":341,"q":"A condução de um veículo implica uma estratégia por parte do seu condutor, que inclui:","o":["A definição de vários trajectos e do tempo de viagem.","A definição de uma trajectória e de uma velocidade.","A definição dos tempos de descanso durante o trajecto."],"c":1,"img":"img/q341.jpg"},{"id":342,"q":"O significado deste sinal é:","o":["Parque de estacionamento para todos os automóveis.","Parque de estacionamento para automóveis pesados.","Parque de estacionamento para automóveis ligeiros.","Zona de paragem para automóveis ligeiros."],"c":2,"img":"img/q342.jpg"},{"id":343,"q":"Se um indivíduo atingir uma TAS de 1,2 g/l às 0 horas, só por volta das:","o":["12 horas do dia seguinte é que terá eliminado completamente o álcool no seu sangue.","8 horas do dia seguinte é que terá eliminado completamente o álcool no seu sangue.","22 horas do dia seguinte é que terá eliminado completamente o álcool no seu sangue.","4 horas do dia seguinte é que terá eliminado completamente o álcool no seu sangue, se dormir bem."],"c":0,"img":"img/q343.jpg"},{"id":344,"q":"Quando se circula numa zona com grande intensidade de vento, além de reduzir a velocidade, qual deve ser o comportamento a adoptar:","o":["Segurar o volante com especial suavidade por forma a não contrariar as oscilações do veículo.","Segurar o volante com maior firmeza.","Rodar ligeiramente o volante para o lado contrário à direcção do vento.","Acelerar para passar mais rapidamente pela zona onde o vento sopra forte."],"c":1,"img":"img/q344.jpg"},{"id":345,"q":"O sistema nervoso central é afectado por alguns medicamentos.","o":["Só se não forem receitados por um médico.","Depende do sexo e do peso.","Certo.","Os medicamentos não afectam o sistema nervoso central"],"c":2,"img":"img/q345.jpg"},{"id":346,"q":"Como deve ser feita a entrada e saída de passageiros?","o":["Pelo lado direito, se a paragem do veículo for permitida desse lado.","Sempre pelo lado direito.","Sempre pelo lado esquerdo."],"c":0,"img":"img/q346.jpg"},{"id":347,"q":"Em caso de nevoeiro (cacimba) forte:","o":["Deve pensar em parar em local seguro e aguardar que o nevoeiro levante.","Deve pensar em seguir viagem o mais depressa possível para sair da zona de nevoeiro rapidamente.","Deve pensar em seguir viagem buzinando constantemente para assinalar a sua presença.","Deve ligar as luzes de estrada e as luzes de emergência para ser mais facilmente visto pelos outros condutores."],"c":0,"img":"img/q347.jpg"},{"id":348,"q":"Circular com o braço fora do veículo:","o":["É uma contravenção punida com a multa de 500,00 Mt.","É uma contravenção punida com a multa de 1.000,00 Mt.","É uma contravenção punida com a multa de 2.000,00 Mt.","É uma contravenção punida com a multa de 3.000,00 Mt."],"c":1,"img":"img/q348.jpg"},{"id":349,"q":"É livre o trânsito rodoviário nas vias de domínio público do Estado e nas vias de domínio privado quando abertas ao trânsito público?","o":["Sim, mas as pessoas devem abster-se de actos que impeçam ou embaracem o trânsito ou comprometam a segurança ou a comodidade dos utentes das vias.","Não, mas as pessoas podem praticar actos que impeçam ou embaracem o trânsito e comprometam a segurança ou a comodidade dos utentes das vias.","Sim, mas as pessoas podem praticar actos que impeçam ou embaracem o trânsito e comprometam a segurança ou a comodidade dos utentes das vias.","Sim, desde que não comprometam a segurança."],"c":0,"img":"img/q349.jpg"},{"id":350,"q":"A distância de reacção é:","o":["A distância percorrida pelo veículo desde que o condutor acciona o travão até parar.","A distância percorrida pelo veículo desde que o condutor vê o perigo até reagir.","A distância percorrida pelo veículo desde que o condutor vê o perigo até parar.","A distância percorrida pelo veículo até que o condutor vê o perigo."],"c":1,"img":"img/q350.jpg"},{"id":351,"q":"Em condições de frio, neve e gelo:","o":["Verifica-se um aumento da aderência e da capacidade de tracção do veículo.","Só em caso de neve e frio é que se verifica uma diminuição da aderência e da capacidade de tracção do veículo.","Verifica-se uma diminuição da aderência e da capacidade de tracção do veículo."],"c":2,"img":"img/q351.jpg"},{"id":352,"q":"Para a realização da tarefa de condução, o sentido da visão é importante porque:","o":["Porque possibilita que se conduza com maior velocidade.","Porque possibilita identificar os gestos da polícia.","Possibilita identificar as formas, as cores e os movimentos de todos os elementos presentes no ambiente rodoviário.","O sentido da visão não é importante para a condução, porque são as mãos e os pés que realizam a tarefa da condução."],"c":2,"img":"img/q352.jpg"},{"id":353,"q":"O frio excessivo, a chuva e o calor:","o":["Apenas o frio e a chuva aumentam a fadiga na condução.","Aumentam a fadiga na condução.","Apenas a chuva e o calor aumentam a fadiga na condução.","Não aumentam a fadiga na condução."],"c":1,"img":"img/q353.jpg"},{"id":354,"q":"Se o veículo entrar em aquaplanagem (hidroplanagem) deve:","o":["Manter a calma e ser suave com os controlos, travar e girar o volante suavemente.","Manter a calma e ser suave com os controlos, acelerar e girar o volante suavemente.","Manter a calma e ser suave com os controlos, não travar nem acelerar ou girar o volante.","Travar forte segurando bem o volante para que a trajectória do veículo não se altere."],"c":2,"img":"img/q354.jpg"},{"id":355,"q":"Para a execução de manobras, qual dos seguintes lhe parece mais importante?","o":["Dedicação, atenção e uma atitude adequada.","Empenho, atitude adequada e atenção.","Treino, experiência e uma atitude adequada.","Coragem, dedicação e determinação."],"c":2,"img":"img/q355.jpg"},{"id":356,"q":"A condução defensiva manifesta-se por:","o":["O condutor ser sempre o primeiro a avançar em todas as intersecções.","O condutor ceder os seus direitos em benefício da segurança rodoviária.","O condutor ter em conta apenas os seus direitos e nunca os seus deveres.","O condutor ceder sempre a passagem aos condutores que se apresentem numa intersecção."],"c":1,"img":"img/q356.jpg"},{"id":357,"q":"Como devo actuar perante a diminuição da aderência, que provoca o aumento da distância de travagem?","o":["Aumentar a velocidade.","Diminuir a velocidade.","A diminuição da aderência diminui a distância de travagem.","Manter a velocidade."],"c":1,"img":"img/q357.jpg"},{"id":358,"q":"Entende-se por cruzamento de veículos:","o":["Quando na mesma via, se encontram dois veículos transitando no mesmo sentido.","Quando os condutores de dois veículos que transitam na mesma via e em sentidos opostos, passam um pelo outro em simultâneo.","Quando dois veículos, circulando na mesma fila, o que se encontra atrás passa para diante do outro."],"c":1,"img":"img/q358.jpg"},{"id":359,"q":"Entende-se por automóvel ligeiro:","o":["O automóvel cuja lotação não excede os 8 lugares.","Todos os automóveis até ao peso de 4500 kg.","O automóvel com PB até 3500 kg e com lotação não superior a 9 lugares, incluindo o condutor."],"c":2,"img":"img/q359.jpg"},{"id":360,"q":"Quando um veículo acelera a direito (longitudinalmente):","o":["O peso é em parte transferido para o eixo traseiro, devido à inércia.","O peso é em parte transferido para o eixo dianteiro, devido à inércia.","O peso é em parte transferido para o eixo traseiro, devido à força centrífuga.","O peso não é transferido nem para a frente nem para trás devido à suspensão do veículo."],"c":0,"img":"img/q360.jpg"},{"id":361,"q":"Quem exceder de 30 Km/h a 60 Km/h de velocidade (automóveis ligeiros e motociclos) os limites, fora das localidades é punido:","o":["Com multa de 3.000,00 Mt e contravenção média.","Com multa de 2.000,00 Mt e contravenção leve.","Com multa de 2.000,00 Mt e contravenção média.","Com multa de 2.000,00 Mt e contravenção grave."],"c":2,"img":"img/q361.jpg"},{"id":362,"q":"O que deve ser ajustado antes de iniciar a marcha?","o":["De forma folgada o cinto de segurança.","A distância do assento aos pedais, a inclinação das costas do banco e o encosto de cabeça.","O encosto de cabeça e o cinto de segurança."],"c":1,"img":"img/q362.jpg"},{"id":363,"q":"A paragem e o estacionamento devem fazer-se, dentro das localidades,","o":["Nos locais especialmente destinados para esse efeito e pela forma indicada ou na faixa de rodagem, o mais longe possível do respectivo limite esquerdo, paralelamente a este e no mesmo sentido de marcha.","Nos locais especialmente destinados para esse efeito e pela forma indicada ou na faixa de rodagem, o mais próximo possível do limite esquerdo, paralelamente a este e no mesmo sentido de marcha.","Nos locais especialmente destinados para esse efeito e pela forma indicada ou na faixa de rodagem, o mais perto possível do eixo da via, paralelamente a este e no sentido de marcha.","Nos locais especialmente destinados para esse efeito e pela forma indicada ou na faixa de rodagem, o mais próximo possível do limite esquerdo, paralelamente a este e no sentido contrário ao da marcha."],"c":1,"img":"img/q363.jpg"},{"id":364,"q":"Excepto o disposto em regulamentos locais e em caso de manifesta necessidade:","o":["Pode utilizar-se o lado direito da faixa de rodagem para estacionar.","Pode utilizar-se o lado direito da faixa de rodagem para a manobra de marcha atrás.","Pode utilizar-se o lado direito da faixa de rodagem para ultrapassar ou mudar de direcção.","Pode utilizar-se o lado direito da faixa de rodagem para conduzir a grande velocidade."],"c":2,"img":"img/q364.jpg"},{"id":365,"q":"O desempenho da condução é afectado de forma negativa pela agressividade?","o":["Errado.","Certo, mas só em condução urbana.","Certo."],"c":2,"img":"img/q365.jpg"},{"id":366,"q":"A ingestão de pequenas quantidades de bebidas alcoólicas, pode prejudicar a capacidade de condução?","o":["Não, pequenas quantidades são completamente inofensivas.","Sim, pois podem levar à sobrevalorização da capacidade de condução.","Não, se forem ingeridas durante a refeição e com água.","Sim, mas só em condutores pouco habituados a beber."],"c":1,"img":"img/q366.jpg"},{"id":367,"q":"Conduzir em condições atmosféricas adversas:","o":["Afecta a distância de travagem.","Afecta a taxa de alcoolemia.","Reduz a fadiga."],"c":0,"img":"img/q367.jpg"},{"id":368,"q":"A definição de paragem é:","o":["Imobilização de um veículo pelo tempo estritamente necessário para a entrada ou saída de passageiros ou para breves operações de carga ou descarga, desde que o condutor esteja pronto a retomar a marcha.","Imobilização de um veículo pelo tempo estritamente necessário para a entrada ou saída de passageiros ou para breves operações de carga ou descarga.","Estacionamento de um veículo pelo tempo estritamente necessário para a entrada ou saída de passageiros ou para breves operações de carga ou descarga.","Estacionamento de um veículo pelo tempo estritamente necessário para a entrada ou saída de passageiros ou para breves operações de carga ou descarga, desde que o condutor esteja pronto a retomar a marcha."],"c":0,"img":"img/q368.jpg"},{"id":369,"q":"A postura e o posicionamento correctos do condutor, devem:","o":["Proporcionar o alcance aos comandos do rádio e GPS.","Proporcionar o alcance a todos os comandos e controlos, sem que o condutor tenha de se movimentar ou afastar do assento.","Proporcionar o uso folgado do cinto de segurança."],"c":1,"img":"img/q369.jpg"},{"id":370,"q":"Os condutores devem, nos cruzamentos, entroncamentos e rotundas","o":["Ceder passagem aos veículos que se desloquem sobre carris.","Ceder passagem a todos os veículos.","Ceder passagem a todos os veículos que se apresentem pela esquerda.","Ceder passagem a todos os velocípedes."],"c":0,"img":"img/q370.jpg"},{"id":371,"q":"Só é permitido fazer marcha atrás:","o":["Como manobra auxiliar ou de recurso e deve efectuar-se o mais possível à direita, em local de boa visibilidade e onde não prejudique o trânsito.","Como manobra auxiliar ou de recurso e deve efectuar-se o mais possível à esquerda, em local de boa visibilidade e onde não prejudique o trânsito.","Como manobra auxiliar ou de recurso e deve efectuar-se o mais possível junto ao eixo da via, em local de boa visibilidade e onde não prejudique o trânsito.","Como manobra auxiliar ou de recurso e deve efectuar-se o mais possível à esquerda, em local de fraca visibilidade e onde não prejudique o trânsito."],"c":1,"img":"img/q371.jpg"},{"id":372,"q":"Porque lado o trânsito de veículos ou de animais é feito:","o":["Pela direita das faixas de rodagem e o mais próximo possível das bermas ou passeios mas a uma distância destes que permita evitar qualquer acidente.","Pela esquerda das faixas de rodagem e o mais longe possível das bermas ou passeios mas a uma distância destes que permita evitar qualquer acidente.","Pela esquerda das faixas de rodagem e o mais próximo possível das bermas ou passeios mas a uma distância destes que permita evitar qualquer acidente.","Pela direita das faixas de rodagem e o mais próximo possível das bermas ou passeios mas a uma distância destes que não permita evitar qualquer acidente."],"c":2,"img":"img/q372.jpg"},{"id":373,"q":"Este sinal significa:","o":["Raquetas e bandeirola de sinalização.","Proibido passar.","Obrigatório parar.","Homens na via a trabalhar."],"c":0,"img":"img/q373.jpg"},{"id":374,"q":"O que deve fazer se perceber que o seu veículo vai ser ultrapassado nesta situação?","o":["Afastar-se o mais possível para a esquerda e não aumentar a velocidade, enquanto não for ultrapassado.","Não mudar a sua posição na faixa de rodagem.","Facilitar a ultrapassagem desviando-se para a direita e não aumentando a velocidade.","Impedir que seja realizada a manobra, aumentando a velocidade."],"c":0,"img":"img/q374.jpg"},{"id":375,"q":"Quem exceder até 20 Km/h de velocidade (automóveis ligeiros e motociclos) os limites, dentro das localidades é punido:","o":["Com multa de 2.000,00 Mt e contravenção leve.","Com multa de 1.000,00 Mt e contravenção leve.","Com multa de 1.000,00 Mt e contravenção média.","Com multa de 2.000,00 Mt e contravenção grave."],"c":1,"img":"img/q375.jpg"},{"id":376,"q":"A definição de entroncamento é:","o":["Zona triangular de via pública.","Zona de junção ou bifurcação de vias públicas.","Zona de confluência de trânsito de via pública.","Zona de ultrapassagem proibida."],"c":1,"img":"img/q376.jpg"},{"id":377,"q":"Posso circular pela parte direita da faixa de rodagem numa via urbana com duplo sentido e uma faixa para cada sentido?","o":["Sim, na aproximação a um cruzamento em que pretenda mudar de direcção à direita.","Sim, em via urbana posso circular pela via da esquerda ou a da direita.","Sim, para ultrapassar.","Não."],"c":2,"img":"img/q377.jpg"},{"id":378,"q":"O significado destes sinais é:","o":["A - Parque de descanso; B - Parque de estacionamento para veículos do corpo diplomático.","A - Parque de estacionamento; B - Parque de estacionamento para veículos do corpo diplomático.","A - Parque de estacionamento; B - Parque de estacionamento para veículos do governo.","A - Parque de estacionamento; B - Parque de estacionamento para veículos do ministério."],"c":1,"img":"img/q378.jpg"},{"id":379,"q":"Como medida de prevenção, quando o piso da via está molhado, deve:","o":["Parar.","Reduzir a velocidade.","Aumentar um pouco a velocidade para que a distância de paragem diminua.","Reduzir a distância de segurança."],"c":1,"img":"img/q379.jpg"},{"id":380,"q":"O que indica o sinal circular com fundo azul?","o":["Via obrigatória para veículos de construção.","Via obrigatória para autocarros de excursão.","Via obrigatória para circulação de veículos de dimensões anormais."],"c":2,"img":"img/q380.jpg"},{"id":381,"q":"O que se entende por sanção?","o":["A repetição de valores positivos.","A repetição de valores negativos.","O prémio ou castigo anexo às acções humanas."],"c":2,"img":"img/q381.jpg"},{"id":382,"q":"O significado deste sinal é:","o":["Queda de pedras à direita.","Queda de pedras à esquerda.","Estrada com buracos na esquerda.","Estrada com buracos na direita."],"c":1,"img":"img/q382.jpg"},{"id":383,"q":"O significado deste sinal é:","o":["Prioridade para quem circula à esquerda.","Prioridade para quem circula à direita.","Trânsito nos dois sentidos.","Prioridade temporária para quem circula à direita."],"c":2,"img":"img/q383.jpg"},{"id":384,"q":"Um pára-brisas sujo, à noite e com chuva, pode:","o":["Aumentar a capacidade de ver as alternativas de acção e aumentar o tempo de análise necessário à tomada de decisão.","Diminuir o tempo de reacção.","Diminuir a capacidade de ver as alternativas de acção e aumentar o tempo de análise necessário à tomada de decisão."],"c":2,"img":"img/q384.jpg"},{"id":385,"q":"Os condutores não podem exceder as seguintes velocidades instantâneas (em quilómetros/hora):","o":["Motociclos com carro, dentro das localidades 40, fora das localidades 70.","Motociclos com carro, dentro das localidades 50, fora das localidades 70.","Motociclos com carro, dentro das localidades 50, fora das localidades 80.","Motociclos com carro, dentro das localidades 60, fora das localidades 90."],"c":1,"img":"img/q385.jpg"},{"id":386,"q":"O significado deste sinal é:","o":["Trabalhos na estrada.","Obras adjudicadas.","Obras incompletas.","Prudência porque o parque está em obras."],"c":0,"img":"img/q386.jpg"},{"id":387,"q":"As luzes devem ser usadas, durante o nevoeiro (cacimba) :","o":["De dia ou de noite.","Só durante a noite.","Durante o dia, se o nevoeiro for muito denso.","De dia e de noite, principalmente as luzes de estrada."],"c":0,"img":"img/q387.jpg"},{"id":388,"q":"O que deve fazer quando um velocípede segue no mesmo sentido de trânsito?","o":["Utilizar os sinais sonoros.","Ultrapassá-lo a grande velocidade.","Ter em atenção a instabilidade desse veículo."],"c":2,"img":"img/q388.jpg"},{"id":389,"q":"O que indica o sinal?","o":["Trânsito proibido a veículos de peso total superior a 2 toneladas.","Trânsito proibido a veículos de peso por eixo superior a 2 toneladas.","Trânsito proibido a veículos de peso por eixo inferior a 2 toneladas."],"c":1,"img":"img/q389.jpg"},{"id":390,"q":"O agente regulador de trânsito, manda:","o":["Parar o tráfego que venha da retaguarda e da frente.","Avançar o tráfego da esquerda.","Parar o tráfego que venha da retaguarda."],"c":2,"img":"img/q390.jpg"},{"id":391,"q":"Dentro das localidades os sinais sonoros, só podem ser usados:","o":["Em caso de manifesta necessidade, podendo ser proibidos nas zonas em que o ordenamento do trânsito seja assegurado por agentes da autoridade ou por instrumentos de sinalização vertical.","Em caso de manifesta necessidade, podendo ser autorizados nas zonas em que o ordenamento do trânsito seja assegurado por sinalização vertical.","Em caso de manifesta necessidade, podendo ser autorizados nas zonas em que o ordenamento do trânsito seja assegurado por sinalização horizontal.","Sempre durante a noite;"],"c":0,"img":"img/q391.jpg"},{"id":392,"q":"A definição de localidade é:","o":["Zona com edificações cujos limites não são sinalizados.","Zona com edificações cujos limites são devidamente sinalizados.","Zona urbana cujos limites não são sinalizados.","Zona regional cujos limites são sinalizados com sinalização luminosa."],"c":1,"img":"img/q392.jpg"},{"id":393,"q":"Como se mede a quantidade de álcool ingerido?","o":["Pela proporção entre a quantidade de álcool ingerido num determinado espaço de tempo.","Pela proporção entre a quantidade de álcool existente num determinado volume de sangue.","Pela proporção entre a quantidade de álcool ingerido em duas horas."],"c":1,"img":"img/q393.jpg"},{"id":394,"q":"A distância de reacção é influenciada por:","o":["Velocidade e tempo de reacção","Distância de travagem e tempo de reacção.","Tempo de reacção e estado da via.","Apenas por factores externos ao condutor."],"c":0,"img":"img/q394.jpg"},{"id":395,"q":"A direcção assistida permite:","o":["Aumentar o ângulo de viragem.","Diminuir o esforço do condutor no volante.","Diminuir a desmultiplicação no volante.","Efectuar as curvas de uma forma mais rápida."],"c":1,"img":"img/q395.jpg"},{"id":396,"q":"Nas descidas de inclinação acentuada:","o":["Os automóveis ligeiros não podem transitar sem utilizarem o motor como auxiliar do travão","Todos os automóveis não podem transitar sem utilizarem o motor como auxiliar do travão","Os automóveis pesados não podem transitar sem utilizarem o motor como auxiliar do travão","Só os automóveis pesados de passageiros não podem transitar sem utilizarem o motor como auxiliar do travão"],"c":2,"img":"img/q396.jpg"},{"id":397,"q":"Se passar por um acidente ou por vítimas de doença súbita, deve:","o":["Ligar de imediato para o hospital.","Iniciar de imediato as ações de primeiro socorro mesmo que não domine os procedimentos.","Iniciar de imediato as ações para evitar que a situação de emergência se agrave, incluindo proceder à segurança do local, das vítimas e dos que prestam socorro."],"c":2,"img":"img/q397.jpg"},{"id":398,"q":"Quem exceder de 40 Km/h até 60 Km/h de velocidade (automóveis ligeiros e motociclos) os limites, dentro das localidades é punido:","o":["Com multa de 4.000,00 Mt e contravenção grave.","Com multa de 6.000,00 Mt e contravenção grave.","Com multa de 4.000,00 Mt e contravenção média.","Com multa de 2.000,00 Mt e contravenção grave."],"c":0,"img":"img/q398.jpg"},{"id":399,"q":"A distância de travagem depende principalmente de que factores?","o":["Estado psicofísico do condutor e velocidade do veículo.","Tipo e estado da via, estado e velocidade do veículo.","Estado do veículo, tipo de via e visibilidade.","Só depende do estado físico e psiquico do condutor."],"c":1,"img":"img/q399.jpg"},{"id":400,"q":"Numa paragem ou estacionamento irregular:","o":["A contravenção é punida com a multa de 1000,00 Mt.","A contravenção é punida com a multa de 500,00 Mt.","A contravenção é punida com a multa de 2000,00 Mt.","A contravenção é punida com a multa de 3000,00 Mt."],"c":1,"img":"img/q400.jpg"},{"id":401,"q":"Qual das seguintes é uma afirmação falsa:","o":["O sistema de circulação rodoviária é um conjunto de elementos interligados e dependentes.","O homem é o elemento mais importante do sistema rodoviário.","O acidente resulta sempre da falha de vários elementos do sistema rodoviário.","A probabilidade de acidente aumenta quando há uma alteração na interacção entre os vários elementos do sistema rodoviário."],"c":2,"img":"img/q401.jpg"},{"id":402,"q":"Em caso de nevoeiro (cacimba), o que devemos ter presente, ao considerar a distância de segurança?","o":["Que basta manter uma distância pequena independentemente da velocidade.","Que essa distância depende unicamente do tipo de veículo que vai à nossa frente.","Que há zonas mais densas onde a visibilidade repentinamente se reduz.","Que como a velocidade praticada pelos veículos é menor devemos seguir mais perto possível do veículo da frente."],"c":2,"img":"img/q402.jpg"},{"id":403,"q":"O condutor está sujeito ao aparecimento de fadiga, quando circula com trânsito intenso?","o":["Está porque é uma situação de transito monótona o que provoca fadiga.","Não está porque circula a velocidade reduzida.","Não está porque nesta situação pode descansar devido à pouca velocidade do trânsito."],"c":0,"img":"img/q403.jpg"},{"id":404,"q":"Parar ou estacionar, é proibido:","o":["A menos de 3 m para a frente e 15 m para um e outro lado dos sinais indicativos da paragem dos veículos de transporte colectivo de passageiros, consoante circulem ou não sobre carris.","A menos de 5 m para a frente e 15 m para um e outro lado dos sinais indicativos da paragem dos veículos de transporte colectivo de passageiros, consoante circulem ou não sobre carris.","A menos de 3 m para a frente e 10 m para um e outro lado dos sinais indicativos da paragem dos veículos de transporte colectivo de passageiros, consoante circulem ou não sobre carris.","A menos de 1 m para a frente e 10 m para um e outro lado dos sinais indicativos da paragem dos veículos de transporte colectivo de passageiros, consoante circulem ou não sobre carris."],"c":0,"img":"img/q404.jpg"},{"id":405,"q":"Todo o condutor de veículos ou de animais é obrigado:","o":["Sempre que não haja obstáculo que o impeça, a facilitar imediatamente a ultrapassagem desviando-se o mais possível para a direita e não aumentar a sua velocidade enquanto não for ultrapassado.","Sempre que não haja obstáculo que o impeça, a facilitar imediatamente a ultrapassagem desviando-se o mais possível para a esquerda e aumentar a sua velocidade enquanto não for ultrapassado.","Sempre que não haja obstáculo que o impeça, a facilitar imediatamente a ultrapassagem desviando-se o mais possível para a esquerda e não aumentar a sua velocidade enquanto não for ultrapassado.","Sempre que não haja obstáculo que o impeça, a facilitar imediatamente a ultrapassagem desviando-se o mais possível para o eixo da via e não aumentar a sua velocidade enquanto não for ultrapassado."],"c":2,"img":"img/q405.jpg"},{"id":406,"q":"A expressão “TRAVAR COM O MOTOR” significa:","o":["Desligar o motor, mantendo uma mudança engrenada.","Utilizar o motor de arranque para auxiliar a travagem.","Engrenar uma mudança de maior força em andamento e não acelerar.","Engrenar uma mudança de menor força em andamento e não acelerar."],"c":2,"img":"img/q406.jpg"},{"id":407,"q":"Por causa do sono e mesmo sem ter ficado a dormir, pode ter um acidente?","o":["Não.","Sim, mas só durante noite.","Sim, os primeiros sintomas de sonolência já afectam a condução.","Não, se o condutor for experiente e saiba conduzir mesmo com sono."],"c":2,"img":"img/q407.jpg"},{"id":408,"q":"Os condutores de veículos prioritários:","o":["Podem, se necessário, não observar as regras e os sinais de trânsito, com a excepção dos sinais dos agentes reguladores de trânsito.","Não podem nunca deixar de observar as regras e os sinais de trânsito.","Podem, se necessário, não observar os sinais dos agentes reguladores de trânsito."],"c":0,"img":"img/q408.jpg"},{"id":409,"q":"Ao aproximar-se de qualquer tipo de intersecção, o condutor do veículo deve:","o":["Demonstrar prudência especial, circulando em velocidade moderada para que possa deter o seu veículo com segurança, para dar passagem ao peão e a veículos que tenham o direito de preferência.","Demonstrar prudência especial, circulando em alta velocidade de forma que possa passar o mais rapidamente possível.","Demonstrar prudência especial, circulando à velocidade de 30Km/h, para que possa travar o seu veículo para dar passagem a animais que transitem na via.","Demonstrar prudência especial, circulando à velocidade de 20Km/h, para que possa travar o seu veículo para dar passagem a animais que transitem na via."],"c":0,"img":"img/q409.jpg"},{"id":410,"q":"Assinale a afirmação incorrecta:","o":["A fadiga, a ingestão de bebidas alcoólicas, a velocidade, as condições atmosféricas e o estado emocional do condutor podem influenciar o seu tempo de reacção.","O tempo de reacção é o tempo entre o momento em que o condutor avista um ol de água e o veículo deslizar, é aconselhável pressionar o travão até que a aderência das rodas seja retomada.","O “aquaplanning” pode ser agravado pelo mau estado dos pneumáticos e pela circulação com velocidade excessiva.","A água acumulada no solo pode reduzir a eficácia do funcionamento dos travões.","O “aquaplanning” pode ser agravado pelo mau estado da suspensão do veículo."],"c":0,"img":"img/q415.jpg"},{"id":416,"q":"Os condutores devem, para permitir a circulação de um veículo prioritário ou da polícia, assinalando devidamente a marcha, que transite numa via congestionada:","o":["Deixar livre uma passagem do lado esquerdo da parte da faixa de rodagem afecta ao seu sentido de circulação, chegando-se o mais possível para a direita e ppdendo, se necessário, utilizar as bermas, excepto se for numa autoestrada.","Deixar livre uma passagem do lado direito da parte da faixa de rodagem afecta ao seu sentido de circulação, chegando-se o mais possível para a esquerda e podendo, se necessário, utilizar as bermas, excepto se for numa autoestrada.","Deixar livre uma passagem do lado esquerdo da parte da faixa de rodagem afecta ao seu sentido de circulação, chegando-se o mais possível para a direita e ppdendo, se necessário, utilizar as bermas, sobretudo se for numa autoestrada."],"c":1,"img":"img/q416.jpg"},{"id":417,"q":"O tomar bebidas alcoólicas:","o":["Reduz a descoordenação motora e a capacidade de avaliação das distâncias.","Aumenta a descoordenação motora e afecta a capacidade de avaliação das distâncias.","Aumenta a descoordenação motora e reduz o risco de acidente.","Em pequenas quantidades não afecta o acto da condução"],"c":1,"img":"img/q417.jpg"},{"id":418,"q":"Se perceber o principio de um incêndio:","o":["Actue de imediato, desligando as luzes do veículo e utilizando um extintor.","Actue de imediato, desligando o ar condicionado do veículo e utilizando um extintor.","Actue de imediato, desligando o motor do veículo e utilizando um extintor."],"c":2,"img": "n":26,"q":[322,323,324,325,326,327,328,329,330,85,331,332,78,165,106,333,334,234,335,336,204,337,233,31,338,339,340,319,81,341,342]},{"n":27,"q":[133,46,343,344,130,54,43,345,297,346]},{"n":28,"q":[347,348,349,350,271,351,106,80,352,353,285,314,48,354,89,63,355,323,356,357,358,359]},{"n":29,"q":[360,361,292,105,362,363,364,365,366,367,271,149,368,174,96,369,303,346,370,371,372,373,374,375,376,344,354]},{"n":30,"q":[393,385,394,395,316,396,397,350,298,398,246,399,400,361,199,401,315,402,403,107,307,404,405,406,114,356,407,322,319,280,408,130,409,410,411,412,413]},{"n":31,"q":[414,287,195,253,415,416,408,165,370,417,418,419,357,190,341,420,421,409,392,422,361,348,343,8,174,423,424,425,339,426,427,169,335,234,251,428,334,405,429,264]}]};
const Q = DATA.questions;
const LETTERS = ['A','B','C','D','E'];
const store = {
  get(k, d) { try { const v = localStorage.getItem('inatter:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('inatter:' + k, JSON.stringify(v)); } catch (e) {} }
};
// per-question history: {id: {r: rightCount, w: wrongCount, last: 0|1}}
let hist = store.get('hist', {});
let best = store.get('best', {});
const app = document.getElementById('app');
let S = null; // current session

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function wrongIds() { return Object.keys(hist).filter(id => hist[id].last === 0).map(Number); }
function seenCount() { return Object.keys(hist).length; }

function home() {
  S = null;
  const wr = wrongIds();
  const mastered = Object.values(hist).filter(h => h.last === 1).length;
  app.innerHTML = `
    <header class="plate">
      <h1>Treino INATTER</h1>
      <p>Exames teóricos de condução com as respostas oficiais. Responde e vê logo se acertaste.</p>
    </header>
    <div class="stats">
      <div class="stat"><b>${Q.length}</b><span>perguntas diferentes</span></div>
      <div class="stat"><b>${mastered}</b><span>já acertadas</span></div>
      <div class="stat"><b>${wr.length}</b><span>por rever</span></div>
    </div>
    <div class="section-h">Treinar</div>
    <div class="modes">
      <button class="mode" id="m-sim"><strong>Simulação de exame</strong><span>25 perguntas ao acaso de todos os exames</span></button>
      <button class="mode" id="m-all"><strong>Todas as perguntas</strong><span>As ${Q.length} perguntas, em ordem aleatória</span></button>
      <button class="mode" id="m-wrong" ${wr.length ? '' : 'disabled'}><strong>Rever as que errei</strong><span>${wr.length ? wr.length + ' perguntas que falhaste da última vez' : 'Ainda não falhaste nenhuma'}</span></button>
      <button class="mode" id="m-new" ${seenCount() < Q.length ? '' : 'disabled'}><strong>Perguntas novas</strong><span>${Q.length - seenCount()} que ainda não respondeste</span></button>
    </div>
    <div class="section-h">Exames</div>
    <div class="exams">
      ${DATA.exams.map(e => {
        const b = best[e.n];
        const cls = b == null ? '' : (b / e.q.length >= 0.8 ? 'done-ok' : 'done-bad');
        return `<button class="exam ${cls}" data-exam="${e.n}"><strong>Exame ${e.n}</strong><small>${b == null ? e.q.length + ' perguntas' : 'melhor: ' + b + '/' + e.q.length}</small></button>`;
      }).join('')}
    </div>
    <p class="note" style="margin-top:22px">O teu progresso fica guardado neste navegador.
      <button class="danger" id="reset">Apagar progresso</button></p>
  `;
  document.getElementById('m-sim').onclick = () => start('Simulação', shuffle(Q.map(q => q.id)).slice(0, 25));
  document.getElementById('m-all').onclick = () => start('Todas as perguntas', shuffle(Q.map(q => q.id)));
  document.getElementById('m-wrong').onclick = () => start('Rever erros', shuffle(wrongIds()));
  document.getElementById('m-new').onclick = () => start('Perguntas novas', shuffle(Q.map(q => q.id).filter(id => !hist[id])));
  app.querySelectorAll('[data-exam]').forEach(b => b.onclick = () => {
    const e = DATA.exams.find(x => x.n == b.dataset.exam);
    start('Exame ' + e.n, e.q.slice(), e.n);
  });
  const r = document.getElementById('reset');
  r.onclick = () => {
    if (r.dataset.confirm) { hist = {}; best = {}; store.set('hist', hist); store.set('best', best); home(); }
    else { r.dataset.confirm = 1; r.textContent = 'Tens a certeza? Toca outra vez para apagar'; }
  };
  window.scrollTo(0, 0);
}

function start(title, ids, examN) {
  if (!ids.length) return;
  S = { title, ids, examN, i: 0, answers: [] };
  showQ();
}

function showQ() {
  const q = Q[S.ids[S.i]];
  const n = S.ids.length;
  app.innerHTML = `
    <div class="topbar">
      <button class="back" id="back">← Sair</button>
      <div class="title">${esc(S.title)}</div>
      <div class="counter">${S.i + 1} / ${n}</div>
    </div>
    <div class="bar"><i style="width:${(S.i / n) * 100}%"></i></div>
    <article class="card">
      ${q.img ? `<div class="pic"><img src="${q.img}" alt="Imagem da pergunta"></div>` : ''}
      <div class="qtext">${esc(q.q)}</div>
    </article>
    <div class="opts">
      ${q.o.map((t, k) => `<button class="opt" data-k="${k}"><span class="l">${LETTERS[k]}</span><span class="t">${esc(t)}</span></button>`).join('')}
    </div>
    <div id="fb"></div>
  `;
  document.getElementById('back').onclick = () => S.answers.length ? finish() : home();
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  window.scrollTo(0, 0);
}

function answer(k) {
  const q = Q[S.ids[S.i]];
  const ok = k === q.c;
  S.answers.push({ id: q.id, k, ok });
  const h = hist[q.id] || { r: 0, w: 0 };
  ok ? h.r++ : h.w++; h.last = ok ? 1 : 0; hist[q.id] = h; store.set('hist', hist);
  app.querySelectorAll('.opt').forEach(b => {
    const bk = +b.dataset.k; b.disabled = true;
    if (bk === q.c) b.classList.add('right');
    else if (bk === k) b.classList.add('wrong');
  });
  const last = S.i === S.ids.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="feedback ${ok ? 'ok' : 'bad'}">
      ${ok ? 'Certo!' : 'Errado. A resposta certa é a ' + LETTERS[q.c] + ':'}
      ${ok ? '' : `<span class="ans">${esc(q.o[q.c])}</span>`}
    </div>
    <div class="actions"><button class="primary" id="next">${last ? 'Ver resultado' : 'Próxima pergunta →'}</button></div>
  `;
  const nx = document.getElementById('next');
  nx.onclick = () => { if (last) finish(); else { S.i++; showQ(); } };
  nx.focus({ preventScroll: true });
  nx.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function finish() {
  const right = S.answers.filter(a => a.ok).length;
  const total = S.answers.length;
  const full = total === S.ids.length;
  if (S.examN != null && full) {
    if (best[S.examN] == null || right > best[S.examN]) { best[S.examN] = right; store.set('best', best); }
  }
  const wrong = S.answers.filter(a => !a.ok);
  const pct = total ? Math.round(right / total * 100) : 0;
  app.innerHTML = `
    <div class="topbar"><button class="back" id="back">← Início</button><div class="title">${esc(S.title)}</div></div>
    <section class="result">
      <div class="score">${right}<small> / ${total}</small></div>
      <div>${pct}% certas${full ? '' : ' (paraste a meio)'}</div>
    </section>
    <div class="actions">
      ${wrong.length ? '<button class="primary" id="again-wrong">Repetir só as ' + wrong.length + ' erradas</button>' : ''}
      <button class="secondary" id="again">Repetir tudo</button>
    </div>
    ${wrong.length ? '<div class="section-h">As que erraste</div>' : '<p style="text-align:center">Sem erros. Muito bem!</p>'}
    <div class="review">
      ${wrong.map(a => { const q = Q[a.id]; return `
        <div class="rev">
          ${q.img ? `<img src="${q.img}" alt="">` : ''}
          <div class="q">${esc(q.q)}</div>
          <div class="you">Respondeste ${LETTERS[a.k]}: ${esc(q.o[a.k])}</div>
          <div class="ok">Certa ${LETTERS[q.c]}: ${esc(q.o[q.c])}</div>
        </div>`; }).join('')}
    </div>
  `;
  const ids = S.ids, title = S.title, ex = S.examN;
  document.getElementById('back').onclick = home;
  document.getElementById('again').onclick = () => start(title, ex != null ? ids.slice() : shuffle(ids), ex);
  const aw = document.getElementById('again-wrong');
  if (aw) aw.onclick = () => start(title + ' · erradas', shuffle(wrong.map(a => a.id)));
  window.scrollTo(0, 0);
}

home();
</script>
</body></html>
